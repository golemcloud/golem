# List of top-level tasks intended for use:
#
# - `cargo make dev-flow` or just `cargo make`: runs a full development flow, including fixing format and clippy, building and running tests and generating OpenAPI specs
# - `cargo make wit`: syncs the per-crate wit/deps copies from the canonical top-level wit/deps
# - `cargo make check-wit`: re-syncs the per-crate wit/deps and fails if the committed copies are out of date
# - `cargo make build`: builds everything in debug mode
# - `cargo make build-release`: builds everything in release mode. customizable with PLATFORM_OVERRIDE env variable for docker builds
# - `cargo make clean`: cleans all test components, the main workspace, and every SDK
# - `cargo make check`: runs rustfmt and clippy checks without applying any fix
# - `cargo make fix`: runs rustfmt and clippy checks and applies fixes
# - `cargo make unit-tests`: runs unit tests only
# - `cargo make worker-executor-tests`: runs worker executor tests only
# - `cargo make worker-executor-tests-ignite-service`: runs ignite service tests only (requires GOLEM_IGNITE_URL)
# - `cargo make integration-tests`: runs integration tests only
# - `cargo make sharding-tests-debug`: runs sharding integration tests with file logging enabled, also accepts test name filter arguments
# - `cargo make test`: runs all unit tests, worker executor tests and integration tests
# - `cargo make check-openapi`: generates openapi spec from the code and checks if it is the same as the one in the openapi directory (for CI). Also runs `check-docs-openapi`.
# - `cargo make generate-openapi`: generates openapi spec from the code, saves it to the openapi directory, and regenerates docs/src/content/next/rest-api/ MDX from the new spec
# - `cargo make generate-docs-openapi`: regenerates only docs/src/content/next/rest-api/ MDX from the current in-tree openapi/golem-service.yaml (no service rebuild)
# - `cargo make check-docs-openapi`: regenerates the docs/src/content/next/rest-api/ MDX in place and fails if the checked-in version is stale (for CI)
# - `cargo make generate-docs-skills`: regenerates docs/src/content/next/how-to-guides/ MDX from golem-skills/skills/
# - `cargo make check-docs-skills`: regenerates the docs/src/content/next/how-to-guides/ MDX in place and fails if the checked-in version is stale (for CI)
# - `cargo make check-diff-model-fingerprint`: verifies golem-common diff model fingerprint against goldenfile
# - `cargo make update-diff-model-fingerprint`: updates golem-common diff model fingerprint goldenfile
# - `cargo make publish`: publishes packages to crates.io
# - `cargo make run`: runs all services locally, requires redis, lnav and nginx
# - `cargo make run-with-login-enabled`: runs all services locally with login enabled, requires redis, lnav and nginx. Also requires oauth2 configuration to be provided.
# - `cargo make check-configs`: generates configs from code deafults and checks if it is up-to-date
# - `cargo make generate-configs`: generates configs from code defaults
# - `cargo make check-unused-deps`: detects unused Cargo dependencies using cargo-udeps (requires nightly)
# - `cargo make elastic-up`: starts elastic, kibana, filebeat (in detached mode) and loads logs into elastic
# - `cargo make elastic-stop`: stops the elastic env
# - `cargo make elastic-down`: stops and removes the elastic env, including all stored data

[config]
default_to_workspace = false # by default, we run cargo commands on top level instead of per member
skip_core_tasks = true       # we are not using the predefined cargo-make flows, instead redefine here for more clarity

[env]
JUNIT_OPTS = ""
WORKER_TEST_THREAD_OPTS = ""
CLI_TEST_THREADS = "2"
AWS_EC2_METADATA_DISABLED = "true"
PROFILE = "dev"

[env.ci]
CARGO_INCREMENTAL = "false"
#CARGO_PROFILE_dev_STRIP = "debuginfo"
#CARGO_PROFILE_test_STRIP = "debuginfo"
JUNIT_OPTS = "--format ctrf --logfile target/ctrf.json"
WORKER_TEST_THREAD_OPTS = ""
CLI_TEST_THREADS = "4"
PROFILE = "dev-ci"
CI = "true"
# CARGO_LOG="cargo::core::compiler::fingerprint=trace"

[tasks.default]
description = "This is the task that gets executed by 'cargo make' when no task is specified"
run_task = "dev-flow"

[tasks.dev]
description = "Alias to the dev-flow task"
alias = "dev-flow"

[tasks.dev-flow]
description = "Runs a full development flow, including fixing format and clippy, building and running tests"
dependencies = [
    "wit",
    "fix",
    "check",
    "build",
    # "test"
]

# WIT DEPENDENCIES
#
# Sync the per-crate wit/deps copies from the canonical top-level wit/deps with the
# dir-mirror tool (dev-tools/dir-mirror) rather than cp: it preserves the mtime of
# unchanged files, so cargo (which tracks these .wit files via rerun-if-changed from
# bindgen!) doesn't rebuild the workspace on every run. The <source> <target> pairs
# below replace the old cp/glob_cp lines one-for-one. golem-common/cli take a per-subdir
# subset of the deps, so removing a dep means also removing its pair here.
[tasks.wit]
description = "Syncs the per-crate WIT dependency copies from the canonical wit/deps"
run_task = [
    { name = [
        "wit-golem-common",
        "wit-golem-cli",
        "wit-sdks",
    ] },
]

[tasks.wit-golem-common]
private = true
command = "cargo"
args = [
    "run", "--quiet", "--manifest-path", "dev-tools/Cargo.toml", "-p", "dir-mirror", "--",
    "--src", "wit/deps/clocks", "--dst", "golem-common/wit/deps/clocks",
    "--src", "wit/deps/golem-1.x", "--dst", "golem-common/wit/deps/golem-1.x",
    "--src", "wit/deps/golem-core-v2", "--dst", "golem-common/wit/deps/golem-core-v2",
    "--src", "wit/deps/golem-agent", "--dst", "golem-common/wit/deps/golem-agent",
    "--src", "wit/deps/golem-secrets", "--dst", "golem-common/wit/deps/golem-secrets",
    "--src", "wit/deps/golem-tool", "--dst", "golem-common/wit/deps/golem-tool",
]

[tasks.wit-sdks]
private = true
command = "cargo"
args = [
    "run", "--quiet", "--manifest-path", "dev-tools/Cargo.toml", "-p", "dir-mirror", "--",
    "--src", "wit/deps", "--dst", "sdks/rust/golem-rust/wit/deps",
    "--src", "wit/deps", "--dst", "sdks/ts/wit/deps",
    "--src", "wit/deps", "--dst", "sdks/effect/wit/deps",
    "--src", "wit/deps", "--dst", "sdks/scala/wit/deps",
    "--src", "wit/deps", "--dst", "sdks/moonbit/golem_sdk/wit/deps",
]

[tasks.wit-golem-cli]
private = true
command = "cargo"
args = [
    "run", "--quiet", "--manifest-path", "dev-tools/Cargo.toml", "-p", "dir-mirror", "--",
    "--src", "wit/deps/clocks", "--dst", "cli/golem-cli/wit/deps/clocks",
    "--src", "wit/deps/golem-1.x", "--dst", "cli/golem-cli/wit/deps/golem-1.x",
    "--src", "wit/deps/golem-core-v2", "--dst", "cli/golem-cli/wit/deps/golem-core-v2",
    "--src", "wit/deps/golem-agent", "--dst", "cli/golem-cli/wit/deps/golem-agent",
    "--src", "wit/deps/logging", "--dst", "cli/golem-cli/wit/deps/logging",
]

[tasks.diff-wit]
private = true
script_runner = "@duckscript"
script = '''
status = exec git status --porcelain -- golem-common/wit/deps cli/golem-cli/wit/deps sdks/rust/golem-rust/wit/deps sdks/ts/wit/deps sdks/effect/wit/deps sdks/scala/wit/deps sdks/moonbit/golem_sdk/wit/deps
ok = eq ${status.code} 0
if not ${ok}
    echo "git status failed (exit ${status.code}):"
    echo ${status.stderr}
    trigger_error "git status failed while checking wit/deps"
end
changes = trim ${status.stdout}
empty = is_empty ${changes}
if not ${empty}
    echo "Per-crate wit/deps copies are out of sync with the canonical wit/deps:"
    echo ${changes}
    echo "Run 'cargo make wit' and commit the result."
    trigger_error "wit/deps copies are out of sync"
end
'''

[tasks.check-wit]
description = "Re-syncs wit/deps and fails if the committed per-crate copies are out of date"
run_task = [{ name = ["wit", "diff-wit"] }]

# BUILD

[tasks.build]
dependencies = ["wit"]
description = "Builds everything in debug mode"
command = "cargo"
args = ["build", "--workspace", "--all-targets"]

[tasks.build-all-bins-including-tests]
dependencies = ["wit"]
description = "Builds all executables in debug mode, including the single-executable golem and all tests"
# A single cargo invocation is used on purpose: `cargo build` followed by `cargo test --no-run`
# resolves features twice (dev-dependencies enable e.g. `golem-common/proptest` only in the second
# pass), which recompiles every workspace crate. Building bins and tests together resolves once.
command = "cargo"
args = ["build", "--workspace", "--bins", "--tests", "--profile", "${PROFILE}"]

[tasks.build-bins]
dependencies = ["wit"]
description = "Builds all executables in debug mode"
command = "cargo"
args = [
    "build",
    "--workspace",
    "--bins",
    "--exclude",
    "integration-tests",
    "--exclude",
    "golem",
]

[tasks.build-bins-all]
dependencies = ["wit"]
description = "Builds all executables in debug mode, including the single-executable golem"
command = "cargo"
args = ["build", "--workspace", "--bins", "--exclude", "integration-tests"]

[tasks.build-bins-all-non-ci]
private = true
condition = { env_not_set = ["CI"] }
run_task = [{ name = ["build-bins-all"] }]

[tasks.build-cli-test-bins]
dependencies = ["wit"]
description = "Builds the golem and golem-cli binaries used by CLI integration tests"
script_runner = "@duckscript"
script = '''
profile = get_env GOLEM_CLI_TEST_BIN_PROFILE
profile_empty = is_empty ${profile}
if ${profile_empty}
    profile = set debug
end

debug_profile = eq ${profile} debug
dev_ci_profile = eq ${profile} dev-ci
dev_release_profile = eq ${profile} dev-release
dev_release_ci_profile = eq ${profile} dev-release-ci

if ${debug_profile}
    exec --fail-on-error cargo build -p golem-cli --bin golem-cli
    exec --fail-on-error cargo build -p golem --bin golem
elseif ${dev_ci_profile}
    exec --fail-on-error cargo build --profile dev-ci -p golem-cli --bin golem-cli
    exec --fail-on-error cargo build --profile dev-ci -p golem --bin golem
elseif ${dev_release_profile}
    set_env GOLEM_BUILD_SKIP_SHADOW 1
    exec --fail-on-error cargo build --profile dev-release -p golem-cli --bin golem-cli
    exec --fail-on-error cargo build --profile dev-release -p golem --bin golem
elseif ${dev_release_ci_profile}
    set_env GOLEM_BUILD_SKIP_SHADOW 1
    exec --fail-on-error cargo build --profile dev-release-ci -p golem-cli --bin golem-cli
    exec --fail-on-error cargo build --profile dev-release-ci -p golem --bin golem
else
    echo "Unsupported GOLEM_CLI_TEST_BIN_PROFILE=${profile}. Expected 'debug', 'dev-ci', 'dev-release', or 'dev-release-ci'."
    trigger_error unsupported-cli-test-bin-profile
end
'''

[tasks.build-cli-test-bins-non-ci]
private = true
condition = { env_not_set = ["CI"] }
run_task = [{ name = ["build-cli-test-bins"] }]

[tasks.build-bins-non-ci]
private = true
condition = { env_not_set = ["CI"] }
run_task = [{ name = ["build-bins"] }]

[tasks.build-worker-service]
dependencies = ["wit"]
description = "Builds the worker-service"
command = "cargo"
args = ["build", "-p", "golem-worker-service"]

[tasks.build-worker-service-non-ci]
private = true
condition = { env_not_set = ["CI"] }
run_task = [{ name = ["build-worker-service"] }]

[tasks.build-registry-service]
description = "Builds registry service"
command = "cargo"
args = ["build", "-p", "golem-registry-service"]

[tasks.build-registry-service-non-ci]
private = true
condition = { env_not_set = ["CI"] }
run_task = [{ name = ["build-registry-service"] }]

[tasks.build-shard-manager-kubernetes]
private = true
dependencies = ["build-bins-non-ci"]
command = "cargo"
args = ["build", "-p", "golem-shard-manager", "--features", "kubernetes"]

[tasks.build-release-full]
dependencies = [
    "wit",
    "set-version",
]
command = "cargo"
args = [
    "build",
    "--workspace",
    "--release",
    "--exclude",
    "integration-tests",
    "--features",
    "golem-shard-manager/kubernetes",
]

[tasks.build-release]
description = """This is the top-level task that builds everything in release mode. PLATFORM_OVERRIDE env variable can be used
to build for other target than the current one, can be linux/amd64 or linux/arm64. This is used for cross-compiling
for docker images."""
dependencies = [
    "wit",
    "set-version",
    "build-release-default",
    "build-release-override-linux-amd64",
    "build-release-override-linux-arm64",
]

# There are three variants of build-release, and only one of them will run based on the value of
# the PLATFORM_OVERRIDE environment variable

[tasks.build-release-default]
description = "Build the project in release mode"
condition = { env_not_set = ["PLATFORM_OVERRIDE"] }
command = "cargo"
args = [
    "build",
    "--workspace",
    "--release",
    "--exclude",
    "integration-tests",
    "--exclude",
    "golem",
    "--features",
    "golem-shard-manager/kubernetes",
]

[tasks.build-release-override-linux-amd64]
description = "Build the project in release mode with target platform override to linux/amd64"
condition = { env = { "PLATFORM_OVERRIDE" = "linux/amd64" } }
command = "cargo"
args = [
    "build",
    "--workspace",
    "--release",
    "--target",
    "x86_64-unknown-linux-gnu",
    "--exclude",
    "integration-tests",
    "--exclude",
    "golem",
    "--features",
    "golem-shard-manager/kubernetes",
]

[tasks.build-release-override-linux-arm64]
description = "Build the project in release mode with target platform override to linux/arm64"
condition = { env = { "PLATFORM_OVERRIDE" = "linux/arm64" } }
install_crate = "cross"
command = "cross"
args = [
    "build",
    "--workspace",
    "--release",
    "--target",
    "aarch64-unknown-linux-gnu",
    "--exclude",
    "integration-tests",
    "--exclude",
    "golem",
    "--features",
    "golem-shard-manager/kubernetes",
]

[tasks.build-sdk-ts]
description = "Builds the TypeScript SDK if dist or agent_guest.wasm doesn't exist"
cwd = "./sdks/ts"
script_runner = "@duckscript"
env = { NPX_BIN = "npx" }
script = '''
dist_exists = is_path_exists packages/golem-ts-sdk/dist
agent_wasm_exists = is_path_exists packages/golem-ts-sdk/wasm/agent_guest.wasm

build_required = set true
if ${dist_exists}
    if ${agent_wasm_exists}
        build_required = set false
    end
end

if ${build_required}
    exec --fail-on-error %{NPX_BIN} pnpm clean
    exec --fail-on-error %{NPX_BIN} pnpm install
    exec --fail-on-error %{NPX_BIN} pnpm run build
    exec --fail-on-error %{NPX_BIN} pnpm run build-agent-template
else
    echo "TypeScript SDK already built, skipping"
end
'''

[tasks.build-sdk-ts.windows]
env = { NPX_BIN = "npx.cmd" }

[tasks.build-sdk-effect]
description = "Builds every Effect SDK bundle and template artifact when outputs are missing or stale"
cwd = "./sdks/effect"
script_runner = "@duckscript"
env = { NPM_BIN = "npm" }
script = '''
fresh = exec %{NPM_BIN} run check:artifacts
fresh_ok = eq ${fresh.code} 0
if not ${fresh_ok}
    echo "Effect SDK artifacts are stale; rebuilding"
    exec --fail-on-error %{NPM_BIN} ci
    exec --fail-on-error %{NPM_BIN} run build
    exec --fail-on-error %{NPM_BIN} run build-agent-template
    exec --fail-on-error %{NPM_BIN} run check:artifacts
else
    echo "Effect SDK artifacts are fresh, skipping"
end
'''

[tasks.build-sdk-effect.windows]
env = { NPM_BIN = "npm.cmd" }

[tasks.clean-sdk-effect]
description = "Cleans generated Effect SDK bundles, wrappers, declarations, and WASM artifacts"
cwd = "./sdks/effect"
command = "node"
args = ["./scripts/clean.mjs"]

[tasks.clean-sdk-ts]
description = "Cleans the TypeScript SDK"
cwd = "./sdks/ts"
script_runner = "@duckscript"
env = { NPX_BIN = "npx" }
script = '''
exec --fail-on-error %{NPX_BIN} pnpm clean
'''

[tasks.clean-sdk-ts.windows]
env = { NPX_BIN = "npx.cmd" }

[tasks.clean-sdk-rust]
description = "Cleans the Rust SDK"
command = "cargo"
args = ["clean", "--manifest-path", "sdks/rust/Cargo.toml"]

[tasks.build-sdk-scala]
description = "Publishes the Scala SDK to local Ivy/Maven cache as 0.0.0-SNAPSHOT"
dependencies = ["wit-sdks"]
cwd = "./sdks/scala"
script = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -f target/.local-publish-marker ]; then
    echo "Scala SDK already published locally, skipping (delete sdks/scala/target/.local-publish-marker to force)"
else
    ./scripts/generate-agent-guest-wasm.sh
    sbt 'set every version := "0.0.0-SNAPSHOT"' \
        '+modelJVM/publishLocal' \
        '+modelJS/publishLocal' \
        '+macros/publishLocal' \
        'core/publishLocal' \
        '+codegen/publishLocal' \
        '++2.12.21' \
        'sbtPlugin/publishLocal'
    mkdir -p target
    touch target/.local-publish-marker
fi
'''

[tasks.clean-sdk-scala]
description = "Cleans the Scala SDK"
cwd = "./sdks/scala"
script_runner = "@duckscript"
script = '''
exec --fail-on-error sbt clean
marker_exists = is_path_exists target/.local-publish-marker
if ${marker_exists}
    rm target/.local-publish-marker
end
'''

[tasks.check-sdk-scala-capability-fixtures]
description = "Links and checks all Scala capability-sensitive export fixtures"
cwd = "./sdks/scala"
script_runner = "@duckscript"
script = '''
exec --fail-on-error sbt -batch "++3.8.2; emptyAutoRegisterFixture/fullLinkJS; toolExportsFixture/fullLinkJS; agentExportsFixture/fullLinkJS; middlewareGuestLinkFixture/fullLinkJS; mixedExportsFixture/fullLinkJS; clientExportsFixture/fullLinkJS"
exec --fail-on-error node test-capability-exports/check.mjs empty test-empty-auto-register/target/scala-3.8.2/golem-scala-empty-auto-register-fixture-opt/main.js
exec --fail-on-error node test-capability-exports/check.mjs tool test-capability-exports/toolExportsFixture/target/scala-3.8.2/toolexportsfixture-opt/main.js
exec --fail-on-error node test-capability-exports/check.mjs agent test-capability-exports/agentExportsFixture/target/scala-3.8.2/agentexportsfixture-opt/main.js
exec --fail-on-error node test-middleware-guest-link/check.mjs test-middleware-guest-link/target/scala-3.8.2/golem-scala-middleware-guest-link-fixture-opt/main.js
exec --fail-on-error node test-capability-exports/check.mjs mixed test-capability-exports/mixedExportsFixture/target/scala-3.8.2/mixedexportsfixture-opt/main.js
exec --fail-on-error node test-capability-exports/check-client.mjs test-capability-exports/toolExportsFixture/target/scala-3.8.2/toolexportsfixture-opt/main.js test-capability-exports/clientExportsFixture/target/scala-3.8.2/clientexportsfixture-opt/main.js
'''

[tasks.clean-sdk-moonbit]
description = "Cleans the MoonBit SDK workspace"
cwd = "./sdks/moonbit"
script_runner = "@duckscript"
script = '''
exec --fail-on-error moon clean
'''

## ** CHECK **

[tasks.check]
description = "Runs rustfmt and clippy checks without applying any fix"
dependencies = [
    "wit",
    "check-clippy",
    "check-rustfmt",
    "check-clippy-dev-tools",
    "check-rustfmt-dev-tools",
]

[tasks.check-rustfmt]
description = "Runs rustfmt checks without applying any fix"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.check-clippy]
description = "Runs clippy checks without applying any fix"
install_crate = "clippy"
command = "cargo"
args = ["clippy", "--all-targets", "--", "--no-deps", "-Dwarnings"]

# The dev-tools workspace is separate, so it needs its own fmt/clippy invocations.
[tasks.check-rustfmt-dev-tools]
description = "Runs rustfmt checks on the dev-tools workspace without applying any fix"
command = "cargo"
args = ["fmt", "--manifest-path", "dev-tools/Cargo.toml", "--all", "--", "--check"]

[tasks.check-clippy-dev-tools]
description = "Runs clippy checks on the dev-tools workspace without applying any fix"
command = "cargo"
args = [
    "clippy",
    "--manifest-path",
    "dev-tools/Cargo.toml",
    "--all-targets",
    "--",
    "--no-deps",
    "-Dwarnings",
]

## ** FIX **

[tasks.fix]
description = "Runs rustfmt and clippy checks and applies fixes"
#dependencies = ["wit", "fix-clippy", "fix-rustfmt"]
dependencies = [
    "fix-clippy",
    "fix-rustfmt",
    "fix-clippy-dev-tools",
    "fix-rustfmt-dev-tools",
]

[tasks.fix-rustfmt]
description = "Runs rustfmt checks and applies fixes"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fix-clippy]
description = "Runs clippy checks and applies fixes"
install_crate = "clippy"
command = "cargo"
args = [
    "clippy",
    "--all-targets",
    "--fix",
    "--allow-dirty",
    "--allow-staged",
    "--",
    "--no-deps",
    "-Dwarnings",
]

[tasks.fix-rustfmt-dev-tools]
description = "Runs rustfmt on the dev-tools workspace and applies fixes"
command = "cargo"
args = ["fmt", "--manifest-path", "dev-tools/Cargo.toml", "--all"]

[tasks.fix-clippy-dev-tools]
description = "Runs clippy on the dev-tools workspace and applies fixes"
command = "cargo"
args = [
    "clippy",
    "--manifest-path",
    "dev-tools/Cargo.toml",
    "--all-targets",
    "--fix",
    "--allow-dirty",
    "--allow-staged",
    "--",
    "--no-deps",
    "-Dwarnings",
]

## ** TEST **

[tasks.test]
description = "Runs all unit tests, worker executor tests and integration tests"
dependencies = [
    "unit-tests",
    "worker-executor-tests",
    "integration-tests",
]

[tasks.unit-tests]
dependencies = ["wit"]
description = "Runs unit tests only"
script = '''
cargo-test-r run --workspace --exclude golem-schema-derive --lib -- --nocapture --report-time $JUNIT_OPTS
'''

[tasks.dev-tools-tests]
description = "Runs the dev-tools workspace unit tests"
command = "cargo"
args = ["test", "--manifest-path", "dev-tools/Cargo.toml", "--lib"]

[tasks.worker-executor-tests]
dependencies = ["wit", "fetch-builtin-artifacts"]
description = "Runs worker executor tests only"
env = { "WASMTIME_BACKTRACE_DETAILS" = "1", "RUST_BACKTRACE" = "1", "RUST_LOG" = "info" }
command = "cargo"
args = [
    "test",
    "--package",
    "golem-worker-executor",
    "--test",
    "*",
    "--",
    "--nocapture",
]

[tasks.worker-executor-tests-misc]
dependencies = ["wit", "fetch-builtin-artifacts"]
description = "Runs untagged, sequential storage, oplog blob archive, and service-specific worker-executor tests"
env = { "RUST_BACKTRACE" = "1", "WASMTIME_BACKTRACE_DETAILS" = "1", "RUST_LOG" = "info", "RUST_TEST_TIME_INTEGRATION" = "5000,30000" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo-test-r run --package golem-common --test agent_extraction -- --report-time --nocapture %{JUNIT_OPTS}
exec --fail-on-error cargo-test-r run --package golem-worker-executor --test integration ":tag:" -- --report-time --nocapture %{JUNIT_OPTS}
