## ** CHECK-OPENAPI **

[tasks.check-openapi]
description = "Generates openapi spec from the code and checks if it is the same as the ones in the openapi directory; also checks docs MDX drift"
dependencies = ["merge-openapi", "diff-openapi", "check-docs-openapi"]

[tasks.diff-openapi]
description = "Checks if the generated openapi spec is the same as the one in the openapi directory"
dependencies = ["merge-openapi"]
script = '''
  if diff openapi/golem-service.yaml target/golem-service.yaml  >/dev/null 2>&1
    then
      echo "Latest Golem OpenAPI spec version detected."
    else
      echo "openapi/golem-service.yaml is not the same as produced by golem-service-yaml." 1>&2
      echo "Run cargo make generate-openapi to generate new spec." 1>&2
      echo ""
      diff openapi/golem-service.yaml target/golem-service.yaml
      exit 1
  fi
  if diff openapi/golem-registry-service.yaml target/golem-registry-service.yaml  >/dev/null 2>&1
    then
      echo "Latest Golem Registry Service OpenAPI spec version detected."
    else
      echo "openapi/golem-registry-service.yaml is not the same as produced by golem-registry-service." 1>&2
      echo "Run cargo make generate-openapi to generate new spec." 1>&2
      exit 1
  fi
  if diff openapi/golem-worker-service.yaml target/golem-worker-service.yaml  >/dev/null 2>&1
    then
      echo "Latest Golem Worker Service OpenAPI spec version detected."
    else
      echo "openapi/golem-worker-service.yaml is not the same as produced by golem-worker-service." 1>&2
      echo "Run cargo make generate-openapi to generate new spec." 1>&2
      exit 1
  fi
'''

## ** GENERATE-OPENAPI **

[tasks.generate-openapi]
dependencies = ["merge-openapi", "store-openapi", "generate-docs-openapi"]
description = "Generates openapi spec from the code, saves it to the openapi directory, and regenerates the REST API docs MDX from the new spec"

[tasks.generate-registry-service-openapi]
description = "Generates openapi spec for registry service"
dependencies = ["build-registry-service-non-ci"]
script = '''
target_dir=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
mkdir -pv ./target/data
"$target_dir/debug/golem-registry-service" --dump-openapi-yaml > ./target/golem-registry-service.yaml
'''

[tasks.generate-worker-service-openapi]
description = "Generates openapi spec for worker service"
dependencies = ["build-worker-service-non-ci"]
script = '''
target_dir=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
mkdir -pv ./target/data
"$target_dir/debug/golem-worker-service" --dump-openapi-yaml > ./target/golem-worker-service.yaml
'''

[tasks.merge-openapi]
dependencies = [
    "generate-registry-service-openapi",
    "generate-worker-service-openapi"
]
command = "cargo"
args = [
    "run",
    "-p",
    "golem-openapi-client-generator",
    "--",
    "merge",
    "--spec-yaml",
    "./target/golem-registry-service.yaml",
    "--spec-yaml",
    "./target/golem-worker-service.yaml",
    "--output-yaml",
    "./target/golem-service.yaml",
]

[tasks.store-openapi]
description = "Stores the generated openapi spec in the openapi directory"
dependencies = ["merge-openapi"]
script = [
    "cp -v ./target/golem-service.yaml ./openapi/golem-service.yaml",
    "cp -v ./target/golem-registry-service.yaml ./openapi/",
    "cp -v ./target/golem-worker-service.yaml ./openapi/",
]

## ** DOCS-SYNC **
##
## Regenerates and drift-checks the user-facing learn.golem.cloud docs
## (docs/src/content/next/rest-api/, docs/src/content/next/how-to-guides/) from
## the in-tree sources of truth (openapi/golem-service.yaml, golem-skills/skills/).
## The in-tree sources always describe the unreleased `next` version; older
## versions under docs/src/content/<vX.Y>/ are frozen snapshots only updated
## by hand for backports.
## Requires `bun` to be installed (https://bun.sh).

[tasks.docs-bun-install]
description = "Installs docs/ dependencies with bun (no-op if up to date)"
cwd = "./docs"
command = "bun"
args = ["install", "--frozen-lockfile"]

[tasks.generate-docs-openapi]
description = "Regenerates docs/src/content/next/rest-api/ MDX from the in-tree openapi/golem-service.yaml"
dependencies = ["docs-bun-install"]
cwd = "./docs"
command = "bun"
args = ["run", "generate-local"]

[tasks.check-docs-openapi]
description = "Fails if docs/src/content/next/rest-api/ is stale vs. the in-tree openapi/golem-service.yaml"
dependencies = ["generate-docs-openapi"]
script = '''
  if git diff --quiet -- docs/src/content/next/rest-api/
    then
      echo "docs/src/content/next/rest-api/ is up to date with openapi/golem-service.yaml."
    else
      echo "docs/src/content/next/rest-api/ is out of date with openapi/golem-service.yaml." 1>&2
      echo "Run 'cargo make generate-openapi' (or 'cargo make generate-docs-openapi' if the YAML is already current) and commit the result." 1>&2
      echo "" 1>&2
      git --no-pager diff -- docs/src/content/next/rest-api/ 1>&2
      exit 1
  fi
'''

[tasks.generate-docs-skills]
description = "Regenerates docs/src/content/next/how-to-guides/ MDX from golem-skills/skills/"
dependencies = ["docs-bun-install"]
cwd = "./docs"
script = '''
  bun run update-skills-local
  bun run fix
'''

[tasks.check-docs-skills]
description = "Fails if docs/src/content/next/how-to-guides/ is stale vs. golem-skills/skills/"
dependencies = ["generate-docs-skills"]
script = '''
  if git diff --quiet -- docs/src/content/next/how-to-guides/ docs/src/content/next/how-to-guides.mdx
    then
      echo "docs/src/content/next/how-to-guides/ is up to date with golem-skills/skills/."
    else
      echo "docs/src/content/next/how-to-guides/ is out of date with golem-skills/skills/." 1>&2
      echo "Run 'cargo make generate-docs-skills' and commit the result." 1>&2
      echo "" 1>&2
      git --no-pager diff -- docs/src/content/next/how-to-guides/ docs/src/content/next/how-to-guides.mdx 1>&2
      exit 1
  fi
'''

[tasks.generate-reflection-conformance]
description = "Embeds the reflection conformance corpus in Scala and MoonBit test sources"
script_runner = "@duckscript"
script = '''
exec --fail-on-error node scripts/sync-reflection-conformance.mjs
'''

[tasks.check-reflection-conformance]
description = "Fails if Scala or MoonBit reflection conformance embeds are stale"
script_runner = "@duckscript"
script = '''
exec --fail-on-error node scripts/sync-reflection-conformance.mjs --check
'''

## ** PUBLISH **
[tasks.publish]
description = "Publishes packages to crates.io"
dependencies = [
    "set-version",
]

[tasks.set-version]
description = "Sets the version in all Cargo.toml files to the value of the VERSION environment variable"
condition = { env_set = ["VERSION"] }
script = '''
grep -rl --include 'Cargo.toml' '0\.0\.0' | xargs sed -i "s/0\.0\.0/${VERSION}/g"
'''

[tasks.set-version.mac]
condition = { env_set = ["VERSION"] }
script = '''
grep -rl --include '.*Cargo\.toml' '0\.0\.0' | xargs sed -i "" "s/0\.0\.0/${VERSION}/g"
'''

[tasks.set-version.windows]
script_runner = "powershell"
script_extension = "ps1"
condition = { env_set = ["VERSION"] }
script = '''
$cargoFiles = Get-ChildItem . Cargo.toml -rec
foreach ($file in $cargoFiles)
{
    (Get-Content $file.PSPath) |
    Foreach-Object { $_ -replace "0.0.0", $Env:VERSION } |
    Set-Content $file.PSPath
}
'''

