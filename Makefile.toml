script_runner = "@duckscript"
script = '''
# Resolve the cargo target directory robustly so this works even when the target
# dir is redirected (e.g. via CARGO_TARGET_DIR, cargo config, or a cargo wrapper).
# cargo-make computes CARGO_MAKE_CRATE_TARGET_DIRECTORY for us cross-platform.
golem = set "${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/golem"
cd plugins/otlp-exporter
exec --fail-on-error ${golem} build -P release --force-build --yes
exec --fail-on-error ${golem} exec -P release copy
cd ../..
