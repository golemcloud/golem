# Cloud chaos suite — the authoritative operational switchboard.
#
# This file, not the code, decides what a chaos run does. The workflow reads it
# with yq, skips every entry whose `enabled` is false, and narrows further to the
# subset named in its `scenarios` input. A scenario cannot be enabled here
# without an implementation behind it, nor implemented without a switch here:
# `suite_yaml_and_scenario_registry_are_in_sync` in
# integration-tests/src/chaos/mod.rs fails the build if the two drift.
#
# Per-scenario invocation shape (the workflow fills in the cloud flags and the
# signal directory):
#
#   benchmarks chaos \
#     --action scenario \
#     --scenario s12 \
#     --suite golem-oss/integration-tests/chaos_suites/cloud-chaos.yaml \
#     --prep-manifest prep-manifest.json \
#     --signal-dir signal-dir \
#     --save-to-json result-S12.json \
#     --save-history-to-json history-S12.json \
#     cloud --api-url ... --apps-base-domain ... --admin-account-token ...
#
# The driver never injects the fault itself: it announces baseline readiness into
# the signal directory and waits to be told the fault is active. The `fault`
# block below is what the *workflow* is expected to apply; the driver only
# records it so the result says what the run was configured to provoke.

name: cloud-chaos

scenarios:
  # S12 — the first complete end-to-end chaos path (GOL-363). Kills the
  # shard-manager pod under a mixed durable/ephemeral/scheduled/promise workload
  # and reports what the platform did about it.
  - code: S12
    name: shard-manager-pod-restart
    enabled: true

    fault:
      kind: pod-kill
      target: shard-manager
      # `one` plus the namespace and opt-in label selectors in the PodChaos
      # manifest are what bound the blast radius.
      mode: one
      durationSecs: 60

    phases:
      # Long enough for cold starts, component loading and route warm-up to
      # settle, so recovery is measured against a warm steady state rather than
      # against start-up.
      baselineSecs: 300
      # Covers the kill, the reschedule and the shard-manager coming back.
      faultSecs: 120
      # Time for in-flight and scheduled work to drain before read-back. Read-back
      # compares durable state against submitted operations, so it must not run
      # while operations are still landing.
      recoverySecs: 300

    workload:
      # Agent counts are pool sizes, not rates: each stream round-robins its
      # operations across its pool. `ratePerSec` alone decides volume.
      #
      # For the two streams that are read back, the pool size is also the
      # resolution of the duplicate detector — a duplicate localises to one
      # agent out of N, so 200 durable agents means a finding points at one
      # agent and the handful of suspect keys on it rather than a haystack.
      durableAgents: 200
      ephemeralAgents: 50
      scheduledAgents: 50
      promiseAgents: 50
      # Split evenly across the four streams, so 25 ops/s each.
      #
      # Sized against what the same two-executor topology already absorbs in
      # cloud-perf: latency-small drives 5000 concurrent workers and sleep holds
      # 2000 resident. ~350 agents at 100 ops/s is comfortably below that, so
      # this still measures recovery from a restart rather than behaviour at
      # saturation — the two are different experiments and mixing them makes
      # neither readable.
      #
      # It has to be this high to measure anything, though. Duplicate execution
      # is only detectable for operations in flight when the shard-manager dies,
      # so the fault window needs real work spanning it: ~6000 operations here
      # versus ~600 at 10 ops/s. A run that reports "consistent" after barely
      # touching the path would say almost nothing.
      ratePerSec: 100

    retryPolicy:
      # Load-bearing for correctness, not just for load. One retry, transport
      # errors only, under the same idempotency key: that is what lets a retry
      # expose duplicate execution. Retrying everything, or minting a fresh key
      # per attempt, would make every run look clean.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    # Bounded so a signal that never arrives aborts with partial artifacts
    # instead of holding the golem-dev maintenance window open.
    signalTimeoutSecs: 1800

  # S8 — executor pod kill with HTTP invocations in flight (GOL-366). Unlike
  # S12, the driver chooses *which* pod dies: it pins a set of agents to one
  # executor by shard ownership, verifies the ownership still holds immediately
  # before injection, and names that pod in `baseline-ready.json`. The workflow
  # resolves the address to a pod and aims the PodChaos at it by name.
  - code: S8
    name: http-in-flight-executor-crash
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # Still `one` pod, but not an arbitrary one: the workflow narrows the
      # selector to the pod the driver named. `one` remains as the belt-and-
      # braces bound in case that narrowing ever matches more than expected.
      mode: one
      durationSecs: 60

    phases:
      # Shorter than S12's: there is no rate to warm up to, only residency of a
      # fixed set of agents, and the workload holds a constant 50 operations in
      # flight from the first second.
      baselineSecs: 180
      faultSecs: 120
      # Long enough for shard reassignment plus several whole operations, so
      # every key gets a chance to reach a result before the account is taken.
      recoverySecs: 300

    pinned:
      # 50 agents, so 50 operations in flight at every instant. Agent count and
      # concurrency are the same number here by construction: each agent holds
      # exactly one operation at a time, which is what makes "how many were in
      # flight when the pod died" a known constant rather than a sample.
      agents: 50
      # Each operation sleeps this long server-side before incrementing. It has
      # to comfortably exceed the workflow's inject-and-verify path — signal
      # poll (5s) + `kubectl apply` + waiting for `AllInjected` — or the kill
      # would land between operations and the scenario would measure nothing.
      operationMillis: 30000
      # Ownership is a hash, so a given executor owns roughly its share of any
      # candidate pool. Scanning 8x the needed count leaves room for an uneven
      # split on a two-executor topology without an unbounded search.
      candidatePoolMultiplier: 8

    retryPolicy:
      # Identical to S12's and load-bearing for the same reason, but here it
      # feeds an exact per-key check rather than aggregate arithmetic: the one
      # permitted retry goes out under the original key, so a second execution
      # shows up as two distinct successful counter values on one key.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S1 — shard-manager / executor network partition (GOL-364). Nothing crashes
  # and nothing restarts: only the link between the shard-manager and half the
  # executors is cut, so both sides keep serving while each believes its own
  # view is current. The question is what they agree on once they can talk
  # again, and the answer has to be "no shard has two owners".
  #
  # This is the first scenario whose fault is NOT a PodChaos. NetworkChaos is a
  # separate grant in the bench runner's Kubernetes Role — see the S1 runbook.
  - code: S1
    name: shard-manager-executor-partition
    enabled: true

    fault:
      kind: network-partition
      target: shard-manager
      # Selected by label, not by name: unlike S8 the claim is about *any*
      # partition healing cleanly, so which executors land on the far side
      # carries no information the run depends on.
      mode: all
      # How many executors to cut off. Half of the two-executor topology, which
      # is what makes this a partition rather than a shard-manager outage: the
      # executors that stay connected keep getting told the truth, and the
      # disagreement between the two groups is the whole experiment.
      targetCount: 1
      # Must equal phases.faultSecs; see the note on S16. The joiner partition
      # this scenario applies mid-fault is already sized from faultSecs, so a
      # shorter value here also made the two partitions lapse at different
      # times.
      durationSecs: 180

    phases:
      baselineSecs: 300
      # Long enough for the shard-manager to notice the cut-off executors miss
      # their health checks and start reassigning their shards. Reassigning is
      # what creates the opportunity for overlap: the partitioned executor has
      # not been told to stop serving them.
      faultSecs: 180
      # Covers the ownership settle window below plus time for in-flight and
      # scheduled work to drain before read-back.
      recoverySecs: 420

    # Second traffic generator: the executor scale schedule.
    #
    # The quota stream above covers executor → shard-manager. This covers the
    # other direction — removing an executor forces a revoke and reassign,
    # adding one back forces a register and rebalance, and all of those are
    # shard-manager → executor calls the partition can block.
    #
    # Down and back up, not up and down. An executor requests 13Gi against
    # 16 GiB nodes, so exactly one fits per node, and the worker-exec nodegroup
    # is pinned at two with no autoscaler: a third replica would sit Pending for
    # the whole run and generate no traffic at all. Scaling down to one and back
    # exercises the same code paths within the capacity that exists.
    #
    # This schedule depends on an interim cluster setting. Until 2026-08-18 it
    # could not pass: a scale-up under load strands shards, because the executor
    # commits a revoke and only then drains its workers, the shard-manager times
    # out and puts the shards back in its routing table, and nothing reconciles
    # the two. One run left 460 of 1024 shards unserved for 43 minutes.
    #
    # golem-dev now runs GOLEM__WORKER_EXECUTORS__REVOKE_SHARDS_TIMEOUT=60s
    # (was 5s), matching the assign leg. That is a mitigation, not a fix — the
    # drain is unbounded, so a large enough working set still outruns any
    # timeout. Keeping this schedule here is deliberate: it is what tells us
    # whether the mitigation holds, and it is expected to fail again if the
    # setting is reverted or the workload grows. The design fix is tracked on
    # the "Replace Shard Manager" project.
    scaleDuringFault:
      steps:
        # A quarter in, so the partition is established first.
        - afterFraction: 0.25
          toReplicas: 1
        # Two thirds in, leaving the rest of the window plus the settle window
        # for the restored executor to register and be rebalanced onto.
        - afterFraction: 0.65
          toReplicas: 2

    ownership:
      # The load-bearing number of this scenario. After the partition heals the
      # cluster rebalances, and during a rebalance transient disagreement is
      # normal — sampling too early would measure that instead of the state the
      # cluster settled into. Comfortably longer than one shard-manager health
      # check cycle plus a re-registration round trip.
      settleSecs: 120

    workload:
      # The mixed workload S12 runs, plus the stream that makes this scenario
      # mean anything.
      #
      # `quotaAgents` is the load-bearing one. Every other stream goes client →
      # worker-service → executor and never touches the shard-manager, so a
      # shard-manager partition is invisible to it — the first three S1 runs
      # measured exactly zero degradation for that reason. A quota agent holds a
      # token for its lifetime, which keeps the executor renewing a lease
      # against the shard-manager every 10s against a 60s expiry, and that is
      # the traffic the partition cuts.
      durableAgents: 200
      ephemeralAgents: 50
      scheduledAgents: 50
      promiseAgents: 50
      quotaAgents: 50
      ratePerSec: 100

    retryPolicy:
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S5 — executor pod kill during an automatic component update (GOL-365).
  #
  # Agents run on the counters component, the scenario updates that component to
  # a second build, asks every durable agent to move to it, and kills an
  # executor while those updates are in flight. Every affected agent has to come
  # back on the new build with its state intact.
  #
  # The update target is `agent-counters-v2`, which is `agent-counters` with
  # `Counter::component_version` returning 2 instead of 1 and nothing else
  # changed. If the builds behaved differently, a state mismatch after the kill
  # would be ambiguous between "the restart lost it" and "the builds disagree" —
  # and telling those apart is the whole job.
  - code: S5
    name: executor-restart-during-update
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # `one` plus the namespace and opt-in label selectors in podchaos-s5.yaml
      # are what bound the blast radius. Unlike S8 the driver does not name the
      # pod: agents are mid-update across both executors, so either one
      # interrupts updates in flight and which one carries no information.
      mode: one
      durationSecs: 60

    phases:
      # Long enough for cold starts and route warm-up to settle, so the update
      # is applied to a population that is running rather than still arriving.
      baselineSecs: 300
      # Covers the kill, the reschedule, and the updates finishing on both the
      # surviving executor and the replacement.
      faultSecs: 120
      # Updates continue after the kill and agents have to converge before
      # read-back compares their state.
      recoverySecs: 300

    workload:
      # Durable agents are the population being updated, so the pool is large:
      # a divergence localises to one agent out of 200 rather than a haystack.
      durableAgents: 200
      # Ephemeral agents are not updated — they exist to show whether
      # acceptance degraded during the kill, separately from the update.
      ephemeralAgents: 50
      # Scheduled agents keep durable state that the update does not touch, so
      # they are the control: their read-back should be unaffected.
      scheduledAgents: 50
      promiseAgents: 0
      # No quota stream. S5 has nothing to do with the shard-manager link, and
      # a lease that cannot be renewed would add a second failure mode to a
      # scenario that already has one.
      quotaAgents: 0
      ratePerSec: 100

    retryPolicy:
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S10 — executor pod kill while scheduled actions are pending (GOL-378).
  #
  # The only scenario whose workload the driver is not holding a connection to.
  # Every target registers an action ten seconds ahead, over and over, so a few
  # hundred actions are always accepted and not yet run. Killing the executor
  # that owns their shards asks whether the platform still runs each of them,
  # exactly once, after the shards move.
  #
  # Like S8 the driver names the pod: it picks the executor owning the largest
  # share of targets and reports its address in `baseline-ready.json`. Unlike
  # S8, the targets on the *other* executor keep registering too — they are the
  # control group, and the report splits the two.
  - code: S10
    name: executor-crash-during-scheduled-fire
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # The workflow narrows the selector to the pod the driver named; `one`
      # stays as the belt-and-braces bound, exactly as in S8.
      mode: one
      durationSecs: 60

    phases:
      # Eighteen leads' worth of registrations, so the baseline measures a
      # cluster that has been firing scheduled actions steadily rather than one
      # that has just started.
      baselineSecs: 180
      # Covers the kill, the reschedule, and the shard reassignment that has to
      # happen before anything claims the dead executor's due actions.
      faultSecs: 120
      # Registrations continue throughout. Long enough that the actions
      # registered during the fault also fall due, fire and are accounted for
      # inside the run rather than after it.
      recoverySecs: 300

    scheduled:
      # 100 targets, each with its own emitter. Also the resolution of the
      # report: a lost action localises to one target out of a hundred.
      targets: 100
      # 50 registrations a second overall, which is half what the mixed workload
      # offers. The scheduled path is the whole experiment here rather than one
      # stream of four, so the rate is set by what keeps the pending population
      # large rather than by a share of a budget.
      intervalMillis: 2000
      # 500 actions accepted and not yet run at any instant. It also has to
      # comfortably exceed the workflow's inject-and-verify path — signal poll
      # (5s) plus `kubectl apply` plus waiting for `AllInjected` — or everything
      # registered before the kill would already have fired by the time the pod
      # died.
      leadSecs: 10
      # What recovering a pending action may cost, and the number the fire-delay
      # percentiles are reported against. Derived rather than picked: the
      # executor's scheduler holds a 30s lease and refreshes every 2s, and a
      # shard reassignment has to complete before the surviving executor claims
      # anything at all. 60s covers both without being so generous that a
      # regression would sit inside it.
      #
      # Recorded, not asserted. A p99 past it is an attention line and a number
      # in the result, because how much a reassignment may cost is a judgement.
      leaseBudgetSecs: 60

    retryPolicy:
      # Identical to the others and load-bearing for the same reason, with one
      # extra consequence here: the retry goes out under the original key, and
      # that key is what the scheduled action carries back to the target. So a
      # retried registration that registered twice shows up as one token firing
      # twice, not as an arithmetic argument about totals.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S11 — executor pod kill while agents are suspended on promises (GOL-377).
  #
  # The only scenario whose agents are asleep when the fault lands. Each waiter
  # creates a promise, parks inside an invocation awaiting it, and is resolved
  # from outside a few seconds later. Killing the executor that owns them asks
  # whether a completion the platform accepted still reaches the agent it was
  # meant to wake, exactly once, after the shards move.
  #
  # Like S10 the driver names the pod and keeps driving the waiters on the other
  # executor as a control group. Unlike every other scenario, its agents live in
  # the promise component rather than the counters one.
  - code: S11
    name: executor-crash-during-promise-completion
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # The workflow narrows the selector to the pod the driver named; `one`
      # stays as the belt-and-braces bound, exactly as in S8 and S10.
      mode: one
      durationSecs: 60

    phases:
      # Long enough for cold starts and route warm-up to settle, so the kill
      # lands on a population that has been cycling steadily rather than one
      # still arriving.
      baselineSecs: 180
      # Covers the kill, the reschedule, and the shard reassignment that has to
      # happen before anything can resume a waiter the dead executor owned.
      faultSecs: 120
      # Rounds continue throughout. Long enough that waiters disturbed by the
      # kill get several whole rounds afterwards, so a waiter that recovered
      # late is distinguishable from one that never did.
      recoverySecs: 300

    promise:
      # 200 waiters, each parked on at most one promise, so 200 agents are
      # suspended at any instant. Also the resolution of the report: a lost
      # wakeup localises to one waiter out of two hundred.
      waiters: 200
      # 5s parked before the completion goes out, so ~40 completions a second
      # across the pool. It has to comfortably exceed the workflow's
      # inject-and-verify path — signal poll (5s) plus `kubectl apply` plus
      # waiting for `AllInjected` — or every promise armed before the kill would
      # already have been completed by the time the pod died.
      dwellMillis: 5000
      # What resuming a suspended waiter may cost, and the number the wakeup
      # delay percentiles are reported against. Derived rather than picked: a
      # shard reassignment has to complete before anything owns the waiter, and
      # then the worker has to be recovered and its oplog replayed to the point
      # it was parked at. 60s covers both without being so generous that a
      # regression would sit inside it.
      #
      # Recorded, not asserted. A p99 past it is an attention line and a number
      # in the result, because how much a reassignment may cost is a judgement.
      wakeupBudgetSecs: 60

    retryPolicy:
      # Identical to the others. One extra consequence here, spelled out in
      # integration-tests/src/chaos/waiters.rs: a completion retry can repair a
      # wakeup that was lost, but only for a completion that had *not* already
      # been accepted — so the question this scenario asks, about completions the
      # platform confirmed, is untouched by it.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S13 — rolling executor restarts under load (GOL-367).
  #
  # One executor killed every 60 seconds for five minutes while the mixed
  # workload runs. Nothing is partitioned and nothing is updated: the question
  # is only whether five rebalances in a row compose the way one does.
  #
  # The cadence is deliberately close to how long a rebalance takes. Spacing the
  # kills far enough apart to guarantee quiet between them would turn S13 into
  # S8 five times over, which tests nothing new.
  - code: S13
    name: rolling-executor-restarts
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      mode: one
      # Each individual kill. The schedule below is what makes this rolling.
      durationSecs: 30

    rollingRestarts:
      # Five kills, 60s apart, is the five-minute window from the spec. The
      # workflow performs them and records each one in executor-restarts.json;
      # the driver reads that back rather than inferring restarts from the
      # routing table, which cannot distinguish a kill from a rebalance.
      intervalSecs: 60
      count: 5

    phases:
      baselineSecs: 300
      # Long enough to cover five kills 60s apart plus the last reschedule.
      faultSecs: 360
      # Cumulative damage is the thing S13 looks for, so the cluster gets a
      # generous window to converge before read-back decides whether it did.
      recoverySecs: 420

    workload:
      durableAgents: 200
      ephemeralAgents: 50
      scheduledAgents: 50
      promiseAgents: 50
      # Quota agents are here because executor churn is exactly what starves
      # them. An executor that has just started holds no allocation, and the
      # shard-manager cannot give it one while an existing executor is sitting
      # on the pool: it divides by the executors that already hold leases, so
      # whoever asked first holds everything until its own lease renews. That
      # renewal is up to 40s away (60s lease, 20s threshold).
      #
      # S13 restarts an executor every 60s. So it puts a fresh, zero-allocation
      # executor next to a lease-holding one, five times in a row, which is the
      # sharpest test of that behaviour the suite can run. Agents starved this
      # way do not fail: they wait with no error and no estimate, so without
      # this stream the run would look clean.
      quotaAgents: 50
      # The project caps this at 25% of measured per-pod capacity so the run
      # measures recovery rather than saturation. Restarting an executor
      # removes half the capacity for as long as the reschedule takes, so a
      # rate that is comfortable at two executors has to stay survivable at one.
      ratePerSec: 100

    retryPolicy:
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S3 — executor / worker-service network partition (GOL-370).
  #
  # The only fault in the suite the platform never learns about. S1 cuts the
  # shard-manager off from an executor and the cluster reacts: health checks are
  # missed and the shards move. S3 cuts the link worker-service uses, leaves the
  # shard-manager link alone, and so the executor keeps its shards and stays in
  # the routing table. worker-service is told, correctly, that this pod owns
  # those agents, and keeps trying to reach a pod it cannot reach. There is no
  # route around it, because as far as the platform is concerned nothing is
  # wrong.
  #
  # Like S8, S10 and S11 the driver names the pod rather than letting Chaos Mesh
  # pick one, and keeps driving the agents on the other executor as the control
  # group. That control group is where the interesting finding would be: a
  # partition it is not part of should cost it nothing.
  - code: S3
    name: executor-worker-service-partition
    enabled: true

    fault:
      kind: network-partition
      target: worker-executor
      # The workflow narrows the selector to the pod the driver named; `one`
      # stays as the belt-and-braces bound, exactly as in S8, S10 and S11.
      #
      # Only the executor side is pinned. The other side of the cut is every
      # worker-service replica, selected by label — a partition from two of the
      # three would leave the agents reachable through the third and the run
      # would measure nothing.
      mode: one
      durationSecs: 180

    phases:
      # Long enough for cold starts and route warm-up to settle, so the cut
      # lands on a population that has been cycling steadily.
      baselineSecs: 300
      # Has to comfortably exceed the caller's 120s attempt timeout, or no
      # operation would ever reach the timeout inside the window and the
      # pending-then-timeout behaviour the scenario exists to show would fall
      # outside it. 180s leaves room for the first attempt to time out, the
      # one permitted retry to go out, and that retry to still be waiting when
      # the link comes back.
      faultSecs: 180
      # Every isolated agent has to get several whole operations after the heal,
      # so one that recovered slowly is distinguishable from one that never did.
      recoverySecs: 420

    isolation:
      # 200 agents, split by shard ownership across the two executors, so ~100
      # end up isolated and ~100 are the control group. Also the resolution of
      # the report: a lost agent localises to one out of two hundred.
      agents: 200
      # One operation per agent per second, so ~200 ops/s offered while
      # everything is reachable. Higher than the other scenarios' 100/s because
      # half of it stops the moment the fault lands: the number that has to be
      # large is the *control* group's, since a collateral-damage finding is a
      # percentage change in its throughput and a small sample cannot show one.
      intervalMillis: 1000
      # The most of its baseline the isolated group may keep for the partition
      # to count as observed. Not zero: an operation submitted late in the fault
      # window can still be waiting when the link returns, and then confirms.
      # At this cadence that is a handful against a baseline of hundreds, so
      # anything near 25% means the cut did not take hold.
      isolatedCeilingPercent: 25
      # The least of its baseline the control group must keep. Below this,
      # serving an unreachable executor cost the agents that had nothing to do
      # with it — the sharpest finding this scenario can produce.
      #
      # 75% rather than 95%: worker-service invalidates one process-wide routing
      # table entry on every failed call, so some shared cost is expected by
      # construction. `invalidation_min_delay` bounds it to twice a second,
      # which should keep it far above this line.
      controlFloorPercent: 75
      # What being served again may cost an isolated agent once the link is
      # back. Recorded, not asserted: nothing has to be recovered here — no
      # shard moves and no worker restarts — so this is really a measure of how
      # long worker-service's own retry loop takes to notice, and how long that
      # may be is a judgement.
      recoveryBudgetSecs: 60

    retryPolicy:
      # Identical to the others and load-bearing for the same reason, with one
      # consequence specific to S3: the retry is what turns a single 120s stall
      # into a second attempt under the same key. If the link heals in between,
      # that retry succeeds against work the first attempt may already have
      # started — which is exactly the case the exactly-once probe is here to
      # rule on.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S7 — executor pod kill during agent state revert (GOL-371).
  #
  # The only scenario that disturbs work the platform is trying to *undo*. Each
  # agent builds its counter up with a run of increments and then asks for some
  # of them back, over and over, while an executor is killed underneath.
  #
  # It is also the only read-back in the suite with no band of doubt in it. The
  # last increment of a round returns the counter's value, so the driver knows
  # exactly what the agent was worth before the revert and exactly how many
  # invocations it asked to take back. Afterwards there are two legal values and
  # nothing between them, which is why S7's findings fail the run outright.
  #
  # Like S8, S10, S11 and S3 the driver names the pod and keeps driving the
  # agents on the other executor as a control group.
  - code: S7
    name: executor-crash-during-revert
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # The workflow narrows the selector to the pod the driver named; `one`
      # stays as the belt-and-braces bound, as in every other pinned scenario.
      mode: one
      durationSecs: 60

    phases:
      # Long enough for cold starts to settle, so the kill lands on a population
      # that has been cycling rounds steadily rather than one still arriving.
      baselineSecs: 180
      # Covers the kill, the reschedule, and the shard reassignment that has to
      # happen before anything can revert an agent the dead executor owned.
      faultSecs: 120
      # Rounds continue throughout. Long enough that every agent runs several
      # whole rounds after the kill, so a round disturbed by it is followed by
      # ones that were not.
      recoverySecs: 300

    revert:
      # 200 agents, split by shard ownership across the two executors. Also the
      # resolution of the report: a torn revert localises to one agent out of
      # two hundred.
      agents: 200
      # Four increments then a revert of two, so a completed round is worth +2.
      #
      # `revertInvocations` must not exceed `incrementsPerRound`: a revert that
      # reached further back would land in the region an earlier revert already
      # deleted, and the platform refuses that outright — every round would fail
      # and the run would measure nothing. The driver checks this before
      # starting rather than discovering it per round.
      incrementsPerRound: 4
      revertInvocations: 2
      # Between rounds. With five operations per round this keeps roughly one
      # agent in six mid-round at any instant, which is the population a kill
      # has something to land in. It also has to leave the round long enough
      # that the workflow's inject-and-verify path — signal poll (5s) plus
      # `kubectl apply` plus waiting for `AllInjected` — does not fall entirely
      # between two rounds.
      intervalMillis: 500
      # What recovering a reverted agent may cost. Recorded, not asserted: the
      # floor is a shard reassignment plus the worker recovery that replays the
      # oplog up to the revert, and how much more than that is acceptable is a
      # judgement.
      recoveryBudgetSecs: 60

    retryPolicy:
      # Applies to the increments only. **The revert is never retried**, and
      # that exception is load-bearing rather than an oversight: a revert has no
      # idempotency key and is not idempotent — asking twice for "the last two
      # invocations" takes back four. A retried revert that had actually landed
      # would look exactly like the platform tearing a truncation, which is the
      # finding this scenario exists to make. See `chaos/reverts.rs`.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S6 — executor pod kill during agent deletion (GOL-372).
  #
  # S7 asks the platform to forget some of an agent's work. S6 asks it to forget
  # the agent, and kills the executor while it is doing so.
  #
  # The same two-value oracle, one step further: invoking a deleted id creates a
  # *new* agent, so when a slot is used again it must report either 1 (the
  # deletion took) or its old value plus one (it did not). Neither is a defect
  # alone — a lost response leaves the question open — but "the platform
  # confirmed the deletion and the agent is still worth what it was" is the
  # resurrection this scenario is named for, and it fails the run.
  #
  # Worth knowing before reading a result: the happy path is already defended.
  # `Worker::start_deleting` stops the background status flush and checkpointer
  # first, specifically so neither can resurrect the cached status after the
  # durable removal. The question is whether that defence survives the pod dying
  # between the mark and the removal.
  - code: S6
    name: executor-crash-during-deletion
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # The workflow narrows the selector to the pod the driver named; `one`
      # stays as the belt-and-braces bound, as in every other pinned scenario.
      mode: one
      durationSecs: 60

    phases:
      baselineSecs: 180
      faultSecs: 120
      # Rounds continue throughout, so every slot is reused several times after
      # the kill and a round it disturbed is followed by ones it did not.
      recoverySecs: 300

    delete:
      # 200 slots, split by shard ownership. Also the resolution of the report:
      # a resurrection localises to one slot out of two hundred.
      agents: 200
      # Three increments before each delete, so an agent is worth 3 when it
      # goes. More than one is load-bearing rather than arbitrary: with a single
      # increment a fresh agent and a resurrected one both read 1 and the oracle
      # cannot tell them apart. The driver refuses to start below 2.
      incrementsPerRound: 3
      # Between rounds. A round is four operations, so this keeps the delete a
      # meaningful share of each slot's cycle and gives the kill something to
      # land in.
      intervalMillis: 500
      # What recovering a slot may cost once its executor is back. Recorded, not
      # asserted.
      recoveryBudgetSecs: 60

    retryPolicy:
      # Applies to the increments only. **The delete is never retried**, for a
      # reason specific to this scenario: `delete_worker_internal` starts with a
      # metadata lookup and returns `worker_not_found` when there is nothing
      # there, so deleting twice does not succeed twice. A delete whose response
      # was lost but which landed would come back on retry as a refusal, and the
      # run would record "refused, and gone anyway" — one of the violations this
      # scenario exists to detect. See `chaos/deletions.rs`.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S9 — executor pod kill during a component rollback (GOL-369).
  #
  # S5 moves agents forward onto a new build and kills an executor while that is
  # happening. S9 moves them forward, waits for that to land, and then moves them
  # back — killing an executor during the return leg.
  #
  # The return leg is the one that matters operationally. A rollback is what you
  # reach for when the new build is already going wrong, so a rollback happening
  # under a dying executor is the situation you would actually be in.
  #
  # The rollback is a redeploy: `agent-counters` is uploaded again as a new
  # revision and every agent is asked to move to it. `Counter::component_version`
  # is compiled into each build, so an agent that has genuinely returned reports
  # 1 from the code that is running rather than from metadata about what the
  # platform believes.
  - code: S9
    name: executor-crash-during-rollback
    enabled: true

    fault:
      kind: pod-kill
      target: worker-executor
      # `one` plus the namespace and opt-in label selectors in podchaos-s9.yaml
      # bound the blast radius. Unlike S8 the driver does not name the pod:
      # agents are mid-rollback across both executors, so either one interrupts
      # returns in flight and which one carries no information.
      mode: one
      durationSecs: 60

    phases:
      # Long enough for cold starts and route warm-up to settle, so the roll
      # forward is applied to a population that is running rather than arriving.
      baselineSecs: 300
      # Has to cover the kill, the reschedule, and the rollback finishing on
      # both the surviving executor and the replacement.
      faultSecs: 120
      # Returns continue after the kill and agents have to converge before the
      # census decides which build they are on.
      recoverySecs: 300

    workload:
      # Durable agents are the population being rolled back, so the pool is
      # large: a stuck agent localises to one out of 200.
      durableAgents: 200
      # Not rolled back — they exist to show whether acceptance degraded during
      # the kill, separately from the rollback.
      ephemeralAgents: 50
      # Durable state the rollback does not touch, so they are the control:
      # their read-back should be unaffected.
      scheduledAgents: 50
      promiseAgents: 0
      # No quota stream, for the same reason as S5: a lease that cannot be
      # renewed would add a second failure mode to a scenario that has one.
      quotaAgents: 0
      ratePerSec: 100

    rollback:
      # How long to let the roll-forward land before measuring it. Too short and
      # the census reads a population still in transit, and the gate below
      # refuses a rollback that would have been fine.
      settleSecs: 90
      # The share of agents that must actually report the new build before the
      # rollback is attempted at all. Below it the driver stops: rolling agents
      # back to a build they never left would pass every check and prove
      # nothing, which is the worst artifact this suite can produce.
      rolledForwardFloorPercent: 90
      # Retries for the rollback *control plane*, counted apart from the
      # workload's own. Different question: a request refused because its
      # agent's executor just died says nothing about correctness, but an agent
      # nobody successfully asked to come back explains a stale agent later
      # without excusing one.
      controlRetries: 2
      controlRetryDelaySecs: 5
      # How far into the rollback to ask for the kill. As in S5 this is when the
      # driver *asks*; applying the PodChaos and confirming it takes a few
      # seconds more, and the result records both so how far in it landed is
      # readable rather than assumed.
      killDelaySecs: 2

    retryPolicy:
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S16 — key-value PostgreSQL outage recovery (GOL-379).
  #
  # The first fault in the suite aimed at something the platform depends on
  # rather than at the platform itself. The executors keep running, keep their
  # shards and keep answering the shard-manager. What they lose is the Aurora
  # cluster underneath them, which on golem-dev carries promises, the
  # running-workers set, user key-value data and the scheduler's own schema.
  #
  # The oplog is on a different cluster and the worker-status hot cache is in
  # Redis, and neither is touched. That is the interesting part: the platform
  # keeps the ability to record what it did and loses the ability to know what
  # it is doing.
  #
  # There is no control group of executors, because all three share the cluster.
  # The control is the baseline window, and the first thing the report has to
  # establish is that throughput collapsed at all — a partition that silently
  # failed to take hold would otherwise produce a clean-looking account of an
  # undisturbed cluster.
  - code: S16
    name: keyvalue-postgres-outage
    enabled: true

    fault:
      kind: network-partition
      target: worker-executor
      # Every executor, unlike every other partition in this suite. A storage
      # outage that only some executors could see would be a routing fault
      # wearing a database's clothes, and S3 already covers that shape.
      mode: all
      # Must equal phases.faultSecs. Chaos Mesh recovers a NetworkChaos on its
      # own `duration`, while the workflow holds the phase for faultSecs and
      # only then deletes the object. Setting this lower lifts the partition
      # early and leaves the tail of the fault phase measuring a healed
      # cluster, which is how the first S16 run came to report 16.87% of
      # baseline throughput during a total outage.
      durationSecs: 60

    phases:
      # Long enough for cold starts, component loading and route warm-up to
      # settle, and for the scheduler to be firing steadily, so the cut lands on
      # a cluster in steady state.
      baselineSecs: 300
      # Sized to the outage this scenario models rather than to the caller's
      # timeout: the worst case an AWS storage failover imposes, which is an
      # Aurora reader promotion of about a minute and an ElastiCache Multi-AZ
      # promotion of about thirty seconds. The key-value retry budget is built
      # to cover exactly that, so an outage of this length is one the platform
      # is expected to absorb without losing an executor.
      #
      # Deliberately shorter than S3's 180s, and not for the reason S3 gives.
      # S3 needs the caller's 120s attempt timeout to fire inside the window
      # because pending-then-timeout is the behaviour it exists to show. Here
      # the opposite is the claim: invocations issued during the cut should
      # still be waiting when the link returns and then complete. Throughput is
      # attributed by completion, so the fault window still reads as a collapse
      # and the recovery window as the catch-up, which is what says the
      # partition took hold.
      #
      # Do not raise this past the retry budget without meaning to. The budget
      # is 15 attempts, ~93s of capped backoff plus a 5s pool acquire apiece
      # against a blackholed endpoint, so roughly 168s. Beyond that the
      # recovery-index write in `status_flusher` exhausts and panics by design,
      # and the scenario stops measuring absorption and starts measuring the
      # crash it is supposed to have removed.
      faultSecs: 60
      # Every stream has to get several whole operations after the heal, so a
      # stream that recovered slowly is distinguishable from one that never
      # did. Scheduled actions registered during the outage also have to fall
      # due and fire inside the run rather than after it.
      recoverySecs: 420

    workload:
      # The population read back agent by agent, so a lost increment localises
      # to one agent out of 200.
      durableAgents: 200
      # No durable state of their own, but they still need the running-workers
      # set to start, so they say whether acceptance degraded separately from
      # whether state survived.
      ephemeralAgents: 50
      # Zero on purpose. The scheduled stream is driven by the `scheduled` block
      # below instead, because only its registrations carry a token into the
      # target's fire log and scheduler lag cannot be measured without one.
      # Setting both is refused at load time.
      scheduledAgents: 0
      # Promises live in the cluster being taken away, so this stream is
      # directly on the fault path rather than incidental to it.
      promiseAgents: 50
      # No quota stream: a lease renewal failing would add a shard-manager
      # failure mode to a scenario that is about storage.
      quotaAgents: 0
      ratePerSec: 100

    scheduled:
      # 100 targets, each with its own emitter, same as S10. Also the resolution
      # of the report: a lost action localises to one target out of a hundred.
      targets: 100
      intervalMillis: 2000
      # 500 actions accepted and not yet run at any instant, so the outage
      # begins with a large population of work the platform has promised to do
      # and cannot currently read.
      leadSecs: 10
      # What recovering a pending action may cost. Larger than S10's 60s and
      # deliberately so: there is no shard reassignment here, but the scheduler
      # cannot claim or acknowledge anything for the whole 180s outage, so the
      # floor is the outage itself. 240s covers the outage plus a lease TTL and
      # some catch-up without being so generous that a regression hides inside
      # it.
      #
      # Recorded, not asserted, like every other budget in the suite.
      leaseBudgetSecs: 240

    storage:
      # The Aurora writer endpoint the workflow names in the NetworkChaos
      # manifest's `externalTargets`. Recorded here so the archived result says
      # which storage the run was about; the driver never resolves or contacts
      # it.
      endpoint: golem-postgres-dev-keyvalue.cluster-cgfyoqmjq7tc.us-east-1.rds.amazonaws.com
      # The least of the fault window every stream must answer nothing at all
      # for, as a share of that window, for the outage to count as observed.
      #
      # This was a ceiling on during-fault throughput as a share of baseline.
      # That number is still reported, but it cannot be the verdict: it is a
      # rate averaged over the whole window, while an absorbed outage does all
      # its serving in the few seconds at the window's edges. The same handful
      # of edge confirmations reads as ~8% of a 180s window and ~26% of a 60s
      # one, so the threshold tracked the window length rather than the
      # platform, and shortening this window to 60s duly tripped it on a
      # partition that had plainly landed (run 33099228775: quiet 58.0s of
      # 62.3s on every stream, yet 25.79% against a 15% ceiling).
      #
      # Quiet time is measured against the window's own edges, so it means the
      # same thing whatever the window is. 50% is far from both outcomes it has
      # to tell apart: a landed outage is quiet for over 90% of the window, an
      # undisturbed cluster for a few percent.
      outageQuietFloorPercent: 50
      # What serving again may cost once the cluster is reachable. Recorded, not
      # asserted: this is really a measure of how long sqlx's pool takes to
      # notice, plus whatever recovery scan the executors run, and how long that
      # may be is a judgement.
      recoveryBudgetSecs: 120

    retryPolicy:
      # Identical to the others and load-bearing for the same reason, with one
      # consequence specific to S16: the retry is what turns a single stalled
      # attempt into a second one under the same key. If the database comes back
      # in between, that retry lands against work the first attempt may already
      # have half-done, which is exactly what the exactly-once probe is here to
      # rule on.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S22 — the long-outage companion to S16 (GOL-499). Same cut, same driver,
  # held past the point where the platform can absorb it.
  #
  # S16 asks whether golem rides out a storage failover. This asks what happens
  # when the storage does not come back in time. The key-value retry budget is
  # 15 attempts, roughly 93s of capped backoff plus a 5s pool acquire apiece
  # against a blackholed endpoint, so about 168s. Past that the recovery-index
  # write in `status_flusher` panics on purpose, on the grounds that an executor
  # which cannot maintain its own running-workers index should be replaced
  # rather than left running with agents it can no longer account for.
  #
  # So executor restarts are the *expected* outcome here, not a defect, and
  # nothing in this entry treats them as one. What the run has to establish is
  # that the exit is the intended one and that nothing is lost across it: the
  # scheduled-fire account and the exactly-once account are the same assertions
  # S16 makes, and they are the ones that fail the build.
  - code: S22
    name: keyvalue-postgres-outage-past-budget
    enabled: true

    fault:
      kind: network-partition
      target: worker-executor
      # Every executor, as in S16. A budget exhausted on only some of them would
      # leave the survivors serving and make the replay cost unreadable.
      mode: all
      # Must equal phases.faultSecs; see the note on S16.
      durationSecs: 300

    phases:
      # Same as S16: long enough for cold starts, component loading and route
      # warm-up to settle, and for the scheduler to be firing steadily.
      baselineSecs: 300
      # Comfortably past the ~168s budget rather than just over it. A window
      # that only just exceeds the budget would make the run's outcome depend
      # on which second an operation happened to start in, so a rerun could
      # come back with restarts or without them for no reason worth reporting.
      # At 300s every tracked transition in the window exhausts.
      faultSecs: 300
      # Longer than S16's 420s, and for a reason S16 does not have: the
      # executors are replaced here, so recovery is not just a pool noticing
      # its database came back. It is pods rescheduling, rejoining the routing
      # table, and every agent that was on them replaying from oplog or
      # snapshot. Scheduled actions registered during the outage also have to
      # fall due and fire inside the run rather than after it.
      recoverySecs: 600

    workload:
      # Identical to S16 on purpose. The two runs are meant to be read side by
      # side, and a different population would make the difference between them
      # a question about the workload rather than about the outage length.
      durableAgents: 200
      ephemeralAgents: 50
      scheduledAgents: 0
      promiseAgents: 50
      quotaAgents: 0
      ratePerSec: 100

    scheduled:
      targets: 100
      intervalMillis: 2000
      leadSecs: 10
      # Wider than S16's 240s. The lease has to outlast the outage plus the
      # replay behind it, or actions would be judged late for the recovery this
      # scenario exists to measure.
      leaseBudgetSecs: 480

    storage:
      endpoint: golem-postgres-dev-keyvalue.cluster-cgfyoqmjq7tc.us-east-1.rds.amazonaws.com
      # Same floor as S16, and it should be met even more comfortably: an
      # outage this long leaves the streams silent for nearly the whole window.
      outageQuietFloorPercent: 50
      # Recorded, not asserted, as everywhere else — but read differently here.
      # In S16 this measures a connection pool noticing. Here it measures a
      # cluster rebuilding itself, and it is the number that says whether the
      # deliberate crash is an acceptable trade.
      recoveryBudgetSecs: 300

    retryPolicy:
      # Identical to S16's, for the same reason.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # S14 — the oplog half of the storage matrix (GOL-376). Same driver as S16 and
  # S22, same cut, aimed at the other Aurora cluster.
  #
  # S16 takes away the cluster that says what the platform is doing: promises,
  # the running-workers set, user key-value data and the scheduler's schema. S14
  # takes away the one that says what it did. The oplog is the only thing on the
  # indexed cluster, so under this cut promises still resolve, the scheduler
  # still claims and acknowledges on time, and the running-workers set is still
  # writable — and nothing durable can be committed. The two scenarios are
  # near-mirror images and are meant to be read side by side.
  #
  # The retry budget is not the interesting quantity here the way it is in S16
  # and S22. golem-dev gives indexed storage 200 attempts with a 10s cap, which
  # is over half an hour of stalling, so this window cannot exhaust it. What is
  # worth watching instead is the error classification: `retry_storage_op`
  # panics immediately on any indexed-storage error it was not handed as
  # transient, and transient means `PoolTimedOut` or `Io` and nothing else. An
  # executor lost during this run is a misclassification finding, not an
  # exhaustion one.
  - code: S14
    name: indexed-oplog-postgres-outage
    enabled: true

    fault:
      kind: network-partition
      target: worker-executor
      # Every executor, as in S16 and for the same reason: a storage outage only
      # some executors could see would be a routing fault wearing a database's
      # clothes.
      mode: all
      # Must equal phases.faultSecs; see the note on S16.
      durationSecs: 60

    phases:
      # Same as S16, so the two are comparable: long enough for cold starts,
      # component loading and route warm-up to settle, and for the scheduler to
      # be firing steadily.
      baselineSecs: 300
      # The same worst-case Aurora writer promotion S16 is sized to, about a
      # minute. GOL-376 was written with 30s, before that number had been
      # worked out; 60s is the failover this is supposed to model and matching
      # S16 is what makes the two results readable against each other.
      faultSecs: 60
      # As S16: every stream needs several whole operations after the heal, and
      # scheduled actions registered during the outage have to fall due and fire
      # inside the run.
      recoverySecs: 420

    workload:
      # Identical to S16, deliberately. The comparison between the two runs is
      # the point, and a different population would turn the difference into a
      # question about the workload.
      durableAgents: 200
      ephemeralAgents: 50
      # Zero for the same reason as S16: the scheduled stream comes from the
      # block below, because only its registrations carry a token into the
      # target's fire log. Setting both is refused at load time.
      scheduledAgents: 0
      # Promises live on the cluster this cut leaves alone, so unlike in S16
      # this stream is not directly on the fault path. It still degrades,
      # because completing a promise wakes an agent that then cannot commit,
      # and that gap between "the promise was written" and "the agent got
      # anywhere" is worth having on the record.
      promiseAgents: 50
      quotaAgents: 0
      ratePerSec: 100

    scheduled:
      targets: 100
      intervalMillis: 2000
      leadSecs: 10
      # Same as S16's, and it should be met with room to spare. The scheduler is
      # outside this cut, so claims and acknowledgements keep their timing and
      # the delay reduces to how long the fired invocation could not commit.
      # That makes S14 the cleanest read of scheduler lag in the suite: in S16
      # and S22 the scheduler is inside the outage and the two costs cannot be
      # separated.
      leaseBudgetSecs: 240

    storage:
      # The indexed writer endpoint, not the key-value one. This is the only
      # field that differs materially from S16.
      endpoint: golem-postgres-dev-indexed.cluster-cgfyoqmjq7tc.us-east-1.rds.amazonaws.com
      # Same floor and same reasoning as S16.
      outageQuietFloorPercent: 50
      # Recorded, not asserted. Expected to be small: nothing is replaced here,
      # so this is a connection pool noticing its database is back plus whatever
      # the stalled commits still have to do.
      recoveryBudgetSecs: 120

    retryPolicy:
      # Identical to S16's, for the same reason.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800

  # ---------------------------------------------------------------------------
  # S18 — Redis outage (GOL-384)
  #
  # The fourth scenario on the storage driver and the first that does not cut a
  # database. golem-dev runs the key-value layer as `NamespaceRouted`: the
  # `Worker`, `AgentStatus` and `AgentStatusCheckpoint` namespaces go to a Redis
  # cache and everything else goes to Postgres. S16 cut the Postgres half and
  # left this one standing; S18 cuts exactly what S16 left.
  #
  # It is sized differently from the other three, and the reason is in the
  # config rather than in the ambition. Those three are measured against a
  # platform retry budget — S16 and S14 stay inside one, S22 runs past one. This
  # client has no budget to run past: golem-dev sets the cache's
  # RETRIES__MAX_ATTEMPTS to 0, which the code turns into a fred reconnect
  # policy with unlimited attempts, and fred's defaults then give the client no
  # command timeout and an unbounded command buffer. A cache write during the
  # cut does not fail. It waits.
  #
  # So the only clock that can run out is the caller's, and the window is set
  # against that instead: past the 120s attempt timeout, so operations time out
  # and retry under the same idempotency key while the original write is still
  # queued inside fred. Two landings of one operation is what this run is for.
  # ---------------------------------------------------------------------------
  - code: S18
    name: redis-cache-outage
    enabled: true

    fault:
      kind: network-partition
      target: worker-executor
      # Every executor, as in the other three: a cache outage only some
      # executors could see would be a routing fault wearing a cache's clothes.
      mode: all
      # Must equal phases.faultSecs; see the note on S16.
      durationSecs: 180

    phases:
      # Same as the other three, so all four are comparable.
      baselineSecs: 300
      # Past the workload's 120s ATTEMPT_TIMEOUT plus its 5s retry delay, so an
      # operation that starts early in the window times out, retries, and has
      # that retry still in flight when the heal arrives. At 60s nothing would
      # time out and the run would only show slower operations completing, which
      # the config already tells us without spending a run.
      faultSecs: 180
      # As the others. The drain here is larger than S14's — three minutes of
      # coalesced status writes and queued commands come back at once — so this
      # needs to cover a burst rather than a trickle.
      recoverySecs: 420

    workload:
      # Identical to S16 and S14, deliberately, so the difference between the
      # four results is the fault and not the population.
      durableAgents: 200
      ephemeralAgents: 50
      # Zero for the same reason as the others: the scheduled stream comes from
      # the block below. Setting both is refused at load time.
      scheduledAgents: 0
      # Expected to be one of the two streams that actually stops. Completing a
      # promise suspends and wakes an agent, and a suspend is a lifecycle
      # boundary, which is one of the few things that still crosses this cache
      # synchronously.
      promiseAgents: 50
      quotaAgents: 0
      ratePerSec: 100

    scheduled:
      targets: 100
      intervalMillis: 2000
      leadSecs: 10
      # Raised from the 240 the other three use, because the window itself is
      # 180s. A fire at the start of the outage is delayed by roughly the whole
      # window before it can make progress, and then joins a drain queue behind
      # three minutes of backlog. 300 leaves headroom for that tail without
      # making a delay the platform should be ashamed of look acceptable.
      leaseBudgetSecs: 300

    storage:
      # The Redis primary endpoint, not either Aurora writer. Both Postgres
      # clusters stay reachable for the whole run.
      endpoint: master.golem-redis-dev.intsie.use1.cache.amazonaws.com
      # Same floor as the other three, and it means something slightly
      # different here. The degradation is expected to be partial: `ephemeral`
      # and `promise` should stop, `durable` may keep serving from memory
      # because the status blob was taken off the commit path on purpose. The
      # floor is checked against the quietest stream, so it still reports
      # whether the cut landed even when the run-wide share stays high.
      outageQuietFloorPercent: 50
      # Recorded, not asserted. Expected to be larger than S14's: nothing is
      # replaced, but three minutes of coalesced status writes and buffered
      # commands all arrive at once when the connection returns.
      recoveryBudgetSecs: 180

    retryPolicy:
      # Identical to the other three, and load-bearing here rather than
      # incidental. Retrying transport errors once under the same idempotency
      # key is the whole mechanism by which a stalled operation and its retry
      # can both land, which is the question the run exists to answer.
      transportOnly: true
      maxRetries: 1
      delaySecs: 5

    signalTimeoutSecs: 1800
