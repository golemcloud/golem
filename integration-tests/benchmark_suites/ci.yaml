# A benchmark suite periodically running on CI to detect performance regressions.
# Three iterations are provisional until the R3 noise study sets the final N.

name: CI
benchmarks:
  - name: cold-start-unknown-small
    version: 1
    partition: startup
    iterations: 3
    clusterSize: [1]
    size: [1, 5, 10]
    length: [2]
    disableCompilationCache: true

  - name: cold-start-unknown-medium
    version: 1
    partition: startup
    iterations: 3
    clusterSize: [1]
    size: [1, 5, 10]
    length: [5]
    disableCompilationCache: true

  - name: cold-start-unknown-small
    version: 1
    partition: startup
    iterations: 3
    clusterSize: [1]
    size: [1, 5, 10]
    length: [2]

  - name: cold-start-unknown-medium
