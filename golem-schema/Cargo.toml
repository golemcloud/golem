[package]
name = "golem-schema"
version = "0.0.0"
edition = "2024"

homepage = "https://golem.cloud"
repository = "https://github.com/golemcloud/golem"
description = "Golem schema and value model"

license-file = "../LICENSE"

[lib]
harness = false

[[test]]
name = "owned_typed_wit"
harness = false
required-features = ["guest"]

[[test]]
name = "feature_matrix"
harness = false

[features]
default = ["rich-validation"]
bigdecimal = ["dep:bigdecimal"]
bit_vec = ["dep:bit-vec"]
bytes = ["dep:bytes"]
chrono = []
derive = []
full = ["rich-validation", "dep:desert_rust", "dep:golem-api-grpc", "dep:poem", "dep:poem-openapi"]
guest = ["dep:wasip2", "dep:wit-bindgen"]
host = ["rich-validation", "native-stream", "dep:wasmtime", "dep:wasmtime-wasi"]
native-stream = []
mac_address = ["dep:mac_address"]
nonempty_collections = ["dep:nonempty-collections"]
num_bigint = ["dep:num-bigint"]
proptest = ["dep:proptest"]
regex = ["dep:regex"]
rich-validation = ["regex", "url"]
rust_decimal = ["dep:rust_decimal"]
serde_json_types = []
url = ["dep:url"]

[dependencies]
golem-schema-derive = { workspace = true }

base64 = { workspace = true }
bigdecimal = { workspace = true, optional = true }
bit-vec = { workspace = true, optional = true }
blake3 = { workspace = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true }
desert_rust = { workspace = true, optional = true }
golem-api-grpc = { workspace = true, optional = true }
mac_address = { workspace = true, optional = true }
nonempty-collections = { workspace = true, optional = true }
num-bigint = { workspace = true, optional = true }
poem = { workspace = true, optional = true }
poem-openapi = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true }
wasip2 = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true, features = ["async-spawn"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
test-r = { workspace = true }

[[bench]]
name = "schema_hotpath"
harness = false
