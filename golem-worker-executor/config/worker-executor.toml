minimum_available_filesystem_objects = 8192
reclamation_observation_attempts = 4
reclamation_observation_delay = "25ms"
target_available_bytes = 134217728
target_available_filesystem_objects = 16384

[advanced.worker_executor.grpc]
max_message_size = 33554432
port = 9093

[advanced.worker_executor.http_client]
type = "Enabled"

[advanced.worker_executor.http_client.config]
connect_timeout = "30s"
idle_timeout = "1m 30s"
max_connections_per_host = 20
max_host_entries = 1024
max_idle_per_host = 8
max_total_connections = 200

[advanced.worker_executor.indexed_storage_retry]
max_attempts = 3
max_delay = "1s"
max_jitter_factor = 0.15
min_delay = "100ms"
multiplier = 3.0

[advanced.worker_executor.invocation_results]
