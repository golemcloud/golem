## Generated from default config
blob_store = "data_disk"
data_dir = "/var/lib/golem"
retained_update_snapshots = 2
state_store = "sqlite"

[advanced.worker_executor]
bind_address = "0.0.0.0"
http_port = 8082
max_in_function_retry_delay = "20s"
max_websocket_connections = 100
runtime_metrics_sampling_interval = "5s"
standalone_tool_invocation_retention = "7days"
tracing_file_name_with_port = true

[advanced.worker_executor.active_agents]
drop_when_full = 0.25
ttl = "8h"

[advanced.worker_executor.agent_sockets]
dns_servers = []
refused_ports = []

[advanced.worker_executor.agent_status_checkpoint]
enabled = true
min_oplog_delta = 1000

[advanced.worker_executor.agent_status_flush]
enabled = true
interval = "1s"
max_concurrency = 128

[advanced.worker_executor.agent_types_service]
type = "Grpc"

[advanced.worker_executor.agent_types_service.config]
cache_time_to_idle = "1m"

[advanced.worker_executor.agent_webhooks_service]
hmac_key = "K34Co4pRMDl7dB3cYB+1/N0J3tMzJWI4FyPNOsmGHkE="
use_https_for_webhook_url = true

[advanced.worker_executor.compiled_component_service]
type = "Enabled"

[advanced.worker_executor.compiled_component_service.config]

[advanced.worker_executor.component_cache]
max_capacity = 32
max_concurrent_compilations = 16
max_metadata_capacity = 16384
max_resolved_component_capacity = 1024
time_to_idle = "12h"

[advanced.worker_executor.direct_invocation_auth_cache]
cache_capacity = 1024
cache_eviction_interval = "1m"
cache_ttl = "5m"

[advanced.worker_executor.durable_stream]
abandoned_prepare_after = "5m"
external_batch_max_size = "8388608 B"
lease_ttl = "1m"
reconciliation_batch_size = 256
reconciliation_interval = "30s"

[advanced.worker_executor.engine]
enable_fs_cache = false

[advanced.worker_executor.environment_state_service]
cache_capacity = 1000
cache_eviction_interval = "1m"

[advanced.worker_executor.environment_state_service.cache_ttl]
nanos = 0
secs = 300

[advanced.worker_executor.filesystem_storage.cleanup_retry]
max_attempts = 4
max_delay = "250ms"
min_delay = "25ms"
multiplier = 4.0

[advanced.worker_executor.filesystem_storage.filesystem_object_limit_policy]
maximum_objects = 131072
minimum_objects = 8192
objects_per_gib = 32768

[advanced.worker_executor.filesystem_storage.mode]
type = "Temporary"

[advanced.worker_executor.filesystem_storage.pressure]
