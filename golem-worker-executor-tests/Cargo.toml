[package]
name = "golem-worker-executor-tests"
version = "0.0.0"
 edition = "2024"

homepage = "https://golem.cloud/"
repository = "https://github.com/golemcloud/golem"
description = "Integration tests for the Golem worker executor"

license-file = "../LICENSE"
publish = false

autotests = false

[[test]]
name = "integration"
path = "tests/lib.rs"
harness = false

[dev-dependencies]
golem-worker-executor = { workspace = true, features = ["test-utils"] }
golem-api-grpc = { workspace = true }
golem-common = { workspace = true, default-features = true }
golem-human-approval = { workspace = true }
golem-mcp-import = { workspace = true }
golem-schema = { workspace = true, features = ["host", "protobuf"] }
golem-service-base = { workspace = true, features = ["worker-executor"] }
golem-test-framework = { workspace = true }
golem-worker-executor-test-utils = { workspace = true }

anyhow = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bigdecimal = { workspace = true }
bit-vec = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
desert_rust = { workspace = true }
futures = { workspace = true }
goldenfile = { workspace = true }
half = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
log = { workspace = true }
mac_address = { workspace = true, features = ["serde"] }
pgvector = { workspace = true }
pretty_assertions = { workspace = true, features = [ "unstable" ] }
proptest = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true, features = [ "ring" ] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
system-interface = { workspace = true }
tempfile = { workspace = true }
test-r = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wasmtime = { workspace = true, features = ["call-hook"] }
wasmtime-wasi = { workspace = true }
wat = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
golem-xfs-quotad = { workspace = true }
