[package]
name = "golem-shard-manager"
version = "0.0.0"
 edition = "2024"
autotests = false

license-file = "../LICENSE"

[lib]
path = "src/lib.rs"
harness = false

[[test]]
name = "integration"
path = "tests/lib.rs"
harness = false

[[bin]]
name = "golem-shard-manager"
path = "src/server.rs"
harness = false
test = false

[dependencies]
golem-api-grpc = { workspace = true }
golem-common = { workspace = true, default-features = true }
golem-schema = { workspace = true, features = ["protobuf"] }
golem-service-base = { workspace = true }

anyhow = { workspace = true }
async-rwlock = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
conditional-trait-gen = { workspace = true }
desert_rust = { workspace = true }
etcd-client = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
humantime-serde = { workspace = true }
include_dir = { workspace = true }
indoc = { workspace = true }
itertools = { workspace = true }
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
prometheus = { workspace = true }
prost-types = { workspace = true }
rustls = { workspace = true, features = [ "ring" ] }
scc = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tonic-tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
figment = { workspace = true }
golem-test-framework = { workspace = true }
h2 = { workspace = true }
rcgen = { workspace = true, features = ["pem"] }
rsa = { workspace = true }
test-r = { workspace = true }
tokio-rustls = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
kubernetes = ["dep:kube", "dep:k8s-openapi"]
