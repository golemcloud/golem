## Generated from default config
blob_store = "data_disk"
data_dir = "/var/lib/golem"
outbound_sockets = false
retained_update_snapshots = 2
state_store = "sqlite"

[advanced.shard_manager]
bind_address = "0.0.0.0"
http_port = 8081
initial_health_check_timeout = "3s"
number_of_shards = 1024
rebalance_threshold = 0.1
runtime_metrics_sampling_interval = "5s"
shard_lease_duration = "1m"
state_read_timeout = "30s"
state_write_timeout = "4s"

[advanced.shard_manager.grpc]
port = 9092

[advanced.shard_manager.health_check]
delay = "10s"
silent = false

[advanced.shard_manager.health_check.mode]
type = "Grpc"

[advanced.shard_manager.health_check.mode.config]

[advanced.shard_manager.quota]
definition_staleness_ttl = "5m"
lease_duration = "1m"
min_executors = 2

[advanced.shard_manager.registry_service]
connect_timeout = "10s"
connection_pool_size = 4
host = "localhost"
http2_keep_alive_interval = "10s"
http2_keep_alive_timeout = "10s"
http2_keep_alive_while_idle = true
max_connection_age = "1m"
max_message_size = 52428800
port = 8080

[advanced.shard_manager.registry_service.invalidation_event_subscriber]
initial_backoff = "100ms"
max_backoff = "30s"

[advanced.shard_manager.registry_service.retries_on_unavailable]
max_attempts = 5
max_delay = "2s"
max_jitter_factor = 0.15
min_delay = "100ms"
multiplier = 2.0

[advanced.shard_manager.resource_definition_fetcher]
cache_eviction_period = "1m"
cache_max_capacity = 1024
cache_ttl = "5m"

[advanced.shard_manager.worker_executors]
assign_shards_timeout = "5s"
connect_timeout = "10s"
connection_pool_size = 4
health_check_timeout = "2s"
http2_keep_alive_interval = "10s"
http2_keep_alive_timeout = "10s"
http2_keep_alive_while_idle = true
max_connection_age = "1m"
max_message_size = 33554432
revoke_shards_timeout = "5s"

[advanced.shard_manager.worker_executors.retries]
max_attempts = 5
max_delay = "2s"
max_jitter_factor = 0.15
min_delay = "100ms"
multiplier = 2.0

[advanced.shard_manager.worker_executors.retries_on_unavailable]
max_attempts = 5
max_delay = "2s"
max_jitter_factor = 0.15
min_delay = "100ms"
multiplier = 2.0

[cache]
type = "Disabled"

[cache.config]

[internal_grpc_tls]
enabled = false

[logging]
console = false
dtor_friendly = false
file_name = "shard-manager.log"
file_truncate = true

[logging.file]
ansi = false
compact = false
enabled = false
json = true
json_flatten = true
json_flatten_span = true
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[logging.stderr]
ansi = false
compact = false
enabled = false
json = false
json_flatten = false
json_flatten_span = false
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[logging.stdout]
ansi = true
compact = false
enabled = true
json = false
json_flatten = true
json_flatten_span = true
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[object_storage]
artifacts_bucket = "golem-artifacts"
components_bucket = "golem-components"
data_bucket = "golem-data"
object_prefix = ""
region = "us-east-1"

[otlp]
enabled = false
host = "localhost"
port = 4318
service_name = "golem"

[postgres]
database = "golem"
host = "localhost"
max_connections = 10
password = ""
port = 5432
username = "golem"

