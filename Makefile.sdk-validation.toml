# SDK validation uses the local toolchains and leaves build outputs in place for
# downstream tests. Tool installation and CI artifact transport are not workloads.

[tasks.validate-sdk-scala]
description = "Validate and locally publish the Scala SDK"
dependencies = ["wit"]
script_runner = "@duckscript"
script = '''
root = pwd
cd sdks/scala
exec --fail-on-error ./scripts/generate-agent-guest-wasm.sh
exec --fail-on-error git diff --exit-code wit/dts
exec --fail-on-error sbt -mem 4096 "++3.8.2; modelJVM/test; modelJS/test; core/test; macros/test; codegen/test"
cd ${root}
cm_run_task check-sdk-scala-capability-fixtures
cd ${root}/sdks/scala
exec --fail-on-error sbt "++2.12.21!; sbtPlugin/compile"
exec --fail-on-error ./scripts/test-build-plugins.sh
exec --fail-on-error sbt -batch "set ThisBuild / packageDoc / publishArtifact := false" golemPublishLocal
'''

[tasks.validate-sdk-ts]
description = "Validate the TypeScript SDK, template, and packed HTTP contract"
cwd = "sdks/ts"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error pnpm install
exec --fail-on-error pnpm run lint
exec --fail-on-error pnpm run format:check
exec --fail-on-error pnpm run build
exec --fail-on-error git diff --exit-code packages/golem-ts-sdk/types
exec --fail-on-error pnpm run build-agent-template
exec --fail-on-error pnpm --filter @golemcloud/golem-ts-sdk run check:package
exec --fail-on-error pnpm run test
'''

[tasks.validate-sdk-effect]
description = "Validate the Effect SDK, template, declarations, and package contracts"
cwd = "sdks/effect"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error npm ci
exec --fail-on-error npm run lint
exec --fail-on-error npm run format:check
exec --fail-on-error npm run typecheck
exec --fail-on-error npm test
exec --fail-on-error npm run build
exec --fail-on-error npm run build-agent-template
exec --fail-on-error npm run check:dts
exec --fail-on-error npm run check:contracts
exec --fail-on-error npm run check:artifacts
exec --fail-on-error npm run check:package
'''

[tasks.validate-sdk-moonbit]
description = "Validate MoonBit SDK bindings, packages, and tools"
cwd = "sdks/moonbit"
script_runner = "@duckscript"
script = '''
exec --fail-on-error moon update
cd golem_sdk
exec --fail-on-error ./scripts/install-wit-bindgen.sh
exec --fail-on-error ./scripts/check-generated-bindings.sh
packages = exec find . -name moon.pkg -exec dirname {} ";"
found = eq ${packages.code} 0
if not ${found}
    trigger_error "Could not enumerate MoonBit SDK packages"
end
exec --fail-on-error --input "${packages.stdout}" xargs moon check --target wasm
exec --fail-on-error ./scripts/run-sdk-tests.sh
cd ../golem_sdk_tools
exec --fail-on-error moon check cmd lib
exec --fail-on-error moon test cmd lib
'''

[tasks.validate-sdk-rust-check]
description = "Validate Rust SDK formatting, lint, test-target coverage, and ordinary tests"
cwd = "sdks/rust"
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo fmt -- --check
exec --fail-on-error cargo clippy -- -Dwarnings
metadata = exec cargo metadata --no-deps --format-version 1
metadata_ok = eq ${metadata.code} 0
if not ${metadata_ok}
    echo ${metadata.stderr}
    trigger_error "Could not read Rust SDK test targets"
end
targets = exec --input "${metadata.stdout}" jq -r "[.packages[].targets[] | select(.kind | index(\"test\")) | .name] | sort | join(\",\")"
targets_ok = eq ${targets.code} 0
if not ${targets_ok}
    echo ${targets.stderr}
    trigger_error "Could not parse Rust SDK test targets"
end
actual = trim ${targets.stdout}
expected = set "agent,http_router,reflection_recipe_compile,rich_tool_conformance,schema_reexport,tool,tool_canonical,ui"
covered = eq ${actual} ${expected}
if not ${covered}
    echo "Test targets of sdks/rust changed; update validate-sdk-rust-check:"
    echo "Expected: ${expected}"
    echo "Actual: ${actual}"
    trigger_error "Rust SDK test target coverage changed"
end
exec --fail-on-error cargo test --all-features --lib --bins --test agent --test http_router --test rich_tool_conformance --test tool_canonical --test schema_reexport --test reflection_recipe_compile
exec --fail-on-error cargo test --all-features --doc
'''

[tasks.validate-sdk-rust-tool]
description = "Run Rust SDK tool integration tests"
cwd = "sdks/rust"
command = "cargo"
args = ["test", "--all-features", "--test", "tool"]

[tasks.validate-sdk-rust-ui]
description = "Run Rust SDK compile-fail UI tests"
cwd = "sdks/rust"
command = "cargo"
args = ["test", "--all-features", "--test", "ui"]

[tasks.validate-sdk-go]
description = "Validate generated Go bindings and all three SDK modules (golangci-lint v2.13.2 required)"
dependencies = ["generate-sdk-go-bindings"]
cwd = "sdks/go/golem"
script_runner = "@duckscript"
script = '''
exec --fail-on-error git diff --exit-code internal/wit
exec --fail-on-error golangci-lint run
set_env GOOS wasip1
set_env GOARCH wasm
exec --fail-on-error go vet -unsafeptr=false -composites=false .
exec --fail-on-error go build ./...
unset_env GOOS
unset_env GOARCH
exec --fail-on-error go test ./...
cd ../core
exec --fail-on-error golangci-lint run
exec --fail-on-error go test ./...
cd ../bridge
exec --fail-on-error golangci-lint run
exec --fail-on-error go test ./...
'''

[tasks.validate-skill-harness]
description = "Build, format-check, and unit-test the skill harness without LLM scenarios"
cwd = "golem-skills/tests/harness"
env = { NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error npm install
exec --fail-on-error npm run build
exec --fail-on-error npm run format:check
exec --fail-on-error npm test
'''
