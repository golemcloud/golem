[tasks.prepare-sdk-moonbit]
description = "Prepare MoonBit dependencies and binding generation"
dependencies = ["wit"]
cwd = "sdks/moonbit"
script_runner = "@duckscript"
script = '''
exec --fail-on-error moon update
cd golem_sdk
exec --fail-on-error ./scripts/install-wit-bindgen.sh
exec --fail-on-error ./scripts/regen-bindings.sh
'''

[tasks.validate-sdk-moonbit]
description = "Validate prepared MoonBit bindings, packages, and tools"
dependencies = ["prepare-sdk-moonbit"]
cwd = "sdks/moonbit/golem_sdk"
script_runner = "@duckscript"
script = '''
failed = exec --get-exit-code ./scripts/check-generated-bindings.sh
if not eq ${CI} true
    assert_eq ${failed} 0 "MoonBit SDK validation failed"
end
packages = exec find . -name moon.pkg -exec dirname {} ";"
found = eq ${packages.code} 0
if not ${found}
    trigger_error "Could not enumerate MoonBit SDK packages"
end
targets = array wasm wasm-gc
for target in ${targets}
    code = exec --get-exit-code --input "${packages.stdout}" xargs moon check --target ${target}
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "MoonBit SDK validation failed"
    end
    set_env GOLEM_MOONBIT_TARGET ${target}
    code = exec --get-exit-code ./scripts/run-sdk-tests.sh
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "MoonBit SDK validation failed"
    end
    code = exec --get-exit-code python3 ./scripts/check-minimal-exports.py --output "${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/moonbit-minimal-exports-${target}"
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "MoonBit SDK component validation failed"
    end
end
unset_env GOLEM_MOONBIT_TARGET
cd ../golem_sdk_tools
code = exec --get-exit-code moon check cmd lib
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "MoonBit SDK validation failed"
end
code = exec --get-exit-code moon test cmd lib
failed = calc ${failed} + ${code}
assert_eq ${failed} 0 "MoonBit SDK validation failed"
'''

[tasks.validate-sdk-moonbit-replay]
description = "Run MoonBit coroutine and recovery tests with both guest backends"
dependencies = ["prepare-sdk-moonbit", "build-cli-test-bins"]
env = { RUST_MIN_STACK = "33554432" }
script_runner = "@duckscript"
script = '''
golem = set "${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/golem-cli"
manifest = set "${CARGO_MAKE_WORKING_DIRECTORY}/test-components/agent-sdk-moonbit/golem.yaml"
presets = array release release-gc
for preset in ${presets}
    exec --fail-on-error ${golem} --app-manifest-path ${manifest} build --yes -P ${preset}
    exec --fail-on-error ${golem} --app-manifest-path ${manifest} --yes -P ${preset} exec copy
end
result = exec %{TEST_R_COMMAND} run %{TEST_R_BUILD_OPTS} --package golem-worker-executor-tests --test integration -- --exact agent_sdk_moonbit::moonbit_custom_scopes_stay_with_their_coroutines::moonbit_custom_scopes_stay_with_their_coroutines_agent_sdk_moonbit agent_sdk_moonbit::moonbit_custom_scopes_stay_with_their_coroutines::moonbit_custom_scopes_stay_with_their_coroutines_agent_sdk_moonbit_gc agent_sdk_moonbit::moonbit_custom_scopes_recover_with_one_completed_and_one_suspended_sibling::moonbit_custom_scopes_recover_with_one_completed_and_one_suspended_sibling_agent_sdk_moonbit agent_sdk_moonbit::moonbit_custom_scopes_recover_with_one_completed_and_one_suspended_sibling::moonbit_custom_scopes_recover_with_one_completed_and_one_suspended_sibling_agent_sdk_moonbit_gc --test-threads 1 --report-time --color never
echo ${result.stdout}
echo ${result.stderr}
assert_eq ${result.code} 0 "MoonBit worker replay validation failed"
complete = contains ${result.stdout} "test result: ok; 4 passed; 0 failed; 0 ignored;"
assert ${complete} "MoonBit worker replay validation must pass all four backend cases"
'''

[tasks.validate-sdk-rust-check]
description = "Validate Rust SDK formatting, lint, test-target coverage, and ordinary tests"
cwd = "sdks/rust"
script_runner = "@duckscript"
script = '''
failed = exec --get-exit-code cargo fmt -- --check
if not eq ${CI} true
    assert_eq ${failed} 0 "Rust SDK validation failed"
end
code = exec --get-exit-code cargo clippy -- -Dwarnings
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Rust SDK validation failed"
end
metadata = exec cargo metadata --no-deps --format-version 1
metadata_ok = eq ${metadata.code} 0
if not ${metadata_ok}
    echo ${metadata.stderr}
    trigger_error "Could not read Rust SDK test targets"
end
targets = exec --input "${metadata.stdout}" jq -r "[.packages[].targets[] | select(.kind | index(\"test\")) | .name] | sort | join(\",\")"
targets_ok = eq ${targets.code} 0
if not ${targets_ok}
    echo ${targets.stderr}
    trigger_error "Could not parse Rust SDK test targets"
end
actual = trim ${targets.stdout}
expected = set "agent,caller,config_conformance,http_router,reflection_recipe_compile,rich_tool_conformance,schema_reexport,tool,tool_canonical,ui"
covered = eq ${actual} ${expected}
if not ${covered}
    echo "Test targets of sdks/rust changed; update validate-sdk-rust-check:"
    echo "Expected: ${expected}"
    echo "Actual: ${actual}"
    trigger_error "Rust SDK test target coverage changed"
end
code = exec --get-exit-code cargo test --all-features --lib --bins --test agent --test caller --test config_conformance --test http_router --test rich_tool_conformance --test tool_canonical --test schema_reexport --test reflection_recipe_compile
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Rust SDK validation failed"
end
code = exec --get-exit-code cargo test --all-features --doc
failed = calc ${failed} + ${code}
assert_eq ${failed} 0 "Rust SDK validation failed"
'''

[tasks.validate-sdk-rust-tool]
description = "Run Rust SDK tool integration tests"
cwd = "sdks/rust"
command = "cargo"
args = ["test", "--all-features", "--test", "tool"]

[tasks.validate-sdk-rust-ui]
description = "Run Rust SDK compile-fail UI tests"
cwd = "sdks/rust"
command = "cargo"
args = ["test", "--all-features", "--test", "ui"]

[tasks.validate-sdk-go]
description = "Validate generated Go bindings and all three SDK modules (golangci-lint v2.13.2 required)"
dependencies = ["generate-sdk-go-bindings"]
cwd = "sdks/go/golem"
script_runner = "@duckscript"
script = '''
failed = exec --get-exit-code git diff --exit-code internal/wit
if not eq ${CI} true
    assert_eq ${failed} 0 "Go SDK validation failed"
end
code = exec --get-exit-code golangci-lint run
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Go SDK validation failed"
end
set_env GOOS wasip1
set_env GOARCH wasm
code = exec --get-exit-code go vet -unsafeptr=false -composites=false .
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Go SDK validation failed"
end
code = exec --get-exit-code go build ./...
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Go SDK validation failed"
end
unset_env GOOS
unset_env GOARCH
modules = array . ../core ../bridge
root = pwd
for module in ${modules}
    cd ${root}/${module}
    if not eq ${module} .
        code = exec --get-exit-code golangci-lint run
        failed = calc ${failed} + ${code}
        if not eq ${CI} true
            assert_eq ${failed} 0 "Go SDK validation failed"
        end
    end
    code = exec --get-exit-code go test ./...
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "Go SDK validation failed"
    end
end
assert_eq ${failed} 0 "Go SDK validation failed"
'''

