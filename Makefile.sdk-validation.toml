# SDK validation uses the local toolchains and leaves build outputs in place for
# downstream tests. Tool installation and CI artifact transport are not workloads.

[tasks.prepare-sdk-scala]
description = "Build the Scala guest and publish the SDK for downstream tests"
dependencies = ["wit"]
cwd = "sdks/scala"
script_runner = "@duckscript"
script = '''
exec --fail-on-error ./scripts/generate-agent-guest-wasm.sh
exec --fail-on-error sbt -batch "set ThisBuild / packageDoc / publishArtifact := false" golemPublishLocal
'''

[tasks.validate-sdk-scala]
description = "Validate the prepared Scala SDK"
dependencies = ["prepare-sdk-scala"]
script_runner = "@duckscript"
script = '''
root = pwd
cd sdks/scala
failed = exec --get-exit-code git diff --exit-code wit/dts
if not eq ${CI} true
    assert_eq ${failed} 0 "Scala SDK validation failed"
end
code = exec --get-exit-code sbt -mem 4096 "++3.8.2; modelJVM/test; modelJS/test; core/test; macros/test; codegen/test"
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Scala SDK validation failed"
end
cd ${root}
code = exec --get-exit-code cargo make --disable-check-for-updates --allow-private check-sdk-scala-capability-fixtures
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Scala SDK validation failed"
end
cd ${root}/sdks/scala
code = exec --get-exit-code sbt "++2.12.21!; sbtPlugin/compile"
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Scala SDK validation failed"
end
code = exec --get-exit-code ./scripts/test-build-plugins.sh
failed = calc ${failed} + ${code}
assert_eq ${failed} 0 "Scala SDK validation failed"
'''

[tasks.prepare-sdk-ts]
description = "Build the TypeScript SDK and guest template"
dependencies = ["wit"]
cwd = "sdks/ts"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error pnpm install
exec --fail-on-error pnpm run build
exec --fail-on-error pnpm run build-agent-template
'''

[tasks.validate-sdk-ts]
description = "Check the prepared TypeScript SDK, collecting failures only on CI"
dependencies = ["prepare-sdk-ts"]
cwd = "sdks/ts"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
failed = set 0
checks = array lint format:check test
for check in ${checks}
    code = exec --get-exit-code pnpm run ${check}
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "TypeScript SDK validation failed"
    end
end
code = exec --get-exit-code git diff --exit-code packages/golem-ts-sdk/types
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "TypeScript SDK validation failed"
end
code = exec --get-exit-code pnpm --filter @golemcloud/golem-ts-sdk run check:package
failed = calc ${failed} + ${code}
assert_eq ${failed} 0 "TypeScript SDK validation failed"
'''

[tasks.prepare-sdk-effect]
description = "Build the Effect SDK and guest template"
dependencies = ["wit"]
cwd = "sdks/effect"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
script = '''
exec --fail-on-error npm ci
exec --fail-on-error npm run build
exec --fail-on-error npm run build-agent-template
'''

[tasks.validate-sdk-effect]
description = "Check the prepared Effect SDK, collecting failures only on CI"
dependencies = ["prepare-sdk-effect"]
cwd = "sdks/effect"
env = { NODE_OPTIONS = "--max-old-space-size=4096", NPM_CONFIG_AUDIT = "false" }
script_runner = "@duckscript"
