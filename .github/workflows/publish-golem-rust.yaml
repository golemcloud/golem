name: CI

on:
  push:
    tags:
      - "golem-rust-v*.*.*"
    branches:
      - main
      # Maintenance branches for shipped major.minor lines (e.g. `1.5.x`).
      - "[0-9]+.[0-9]+.x"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: "startsWith(github.ref, 'refs/tags/golem-rust-v')"
    runs-on: blacksmith
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: useblacksmith/rust-cache@v3
        with:
          prefix-key: v1-golem-rust
          shared-key: debug
          cache-all-crates: true
          save-if: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Verify shared crate release
        run: cargo make --profile ci verify-shared-crates
      - name: Set shared crate versions
        run: cargo make --profile ci set-shared-crates-version
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          export VERSION_FULL="${{ steps.get_version.outputs.version }}"
          export VERSION="${VERSION_FULL#golem-rust-v}"
          git ls-files -z '*Cargo.toml' | xargs -0 sed -i "s/0\.0\.0/$VERSION/g"
          cargo publish -p golem-rust-macro --all-features --allow-dirty
          cargo publish --manifest-path sdks/rust/golem-rust/Cargo.toml --all-features --allow-dirty
