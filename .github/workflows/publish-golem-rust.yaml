name: CI

on:
  push:
    tags:
      - "golem-rust-v*.*.*"
    branches:
      - main
      # Maintenance branches for shipped major.minor lines (e.g. `1.5.x`).
      - "[0-9]+.[0-9]+.x"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: "startsWith(github.ref, 'refs/tags/golem-rust-v')"
    runs-on: blacksmith
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: useblacksmith/rust-cache@v3
        with:
          prefix-key: v1-golem-rust
          shared-key: debug
          cache-all-crates: true
          save-if: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # The Golem release that published golem-schema and golem-schema-derive to crates.io.
          GOLEM_VERSION: 1.6.0-dev.2
        run: |
          export VERSION_FULL="${{ steps.get_version.outputs.version }}"
          export VERSION="${VERSION_FULL#golem-rust-v}"
          curl -sf -A golem-ci "https://crates.io/api/v1/crates/golem-schema/$GOLEM_VERSION" > /dev/null \
            || { echo "golem-schema $GOLEM_VERSION is not published on crates.io" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$GOLEM_VERSION" > /dev/null; then
            git diff --quiet "v$GOLEM_VERSION" HEAD -- golem-schema golem-schema-derive \
              || { echo "golem-schema changed since v$GOLEM_VERSION; publish a new Golem release first" >&2; exit 1; }
          else
            echo "::warning::No v$GOLEM_VERSION tag; cannot check that golem-schema is unchanged since it was published"
          fi
          sed -i "s/0\.0\.0/$GOLEM_VERSION/g" golem-schema/Cargo.toml golem-schema-derive/Cargo.toml
          sed -i -E "/^golem-schema(-derive)? *=/ s/0\.0\.0/$GOLEM_VERSION/" Cargo.toml sdks/rust/golem-rust/Cargo.toml
          git ls-files -z '*Cargo.toml' | xargs -0 sed -i "s/0\.0\.0/$VERSION/g"
          cargo publish -p golem-tool-metadata --all-features --allow-dirty
          cargo publish -p golem-rust-macro --all-features --allow-dirty
          cargo publish --manifest-path sdks/rust/golem-rust/Cargo.toml --all-features --allow-dirty
