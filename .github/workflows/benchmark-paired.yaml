name: Paired Benchmark Comparison
on:
  workflow_call:
    inputs:
      base_run_id:
        required: true
        type: string
      base_source:
        required: true
        type: string
      head_run_id:
        required: true
        type: string
      head_source:
        required: true
        type: string
      deadline:
        required: true
        type: string
      suite:
        required: true
        type: string
      pairs:
        default: '3'
        type: string
      isolated:
        required: true
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  compare:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 60
    env:
      BASE_RUN: ${{ inputs.base_run_id }}
      BASE_SOURCE: ${{ inputs.base_source }}
      HEAD_RUN: ${{ inputs.head_run_id }}
      HEAD_SOURCE: ${{ inputs.head_source }}
      DEADLINE: ${{ inputs.deadline }}
      PAIRS: ${{ inputs.pairs }}
      SUITE: ${{ inputs.suite }}
      ISOLATED: ${{ inputs.isolated }}
    steps:
      - name: Validate immutable comparison inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISOLATED" == true ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$BASE_RUN" =~ ^[0-9]+$ && "$HEAD_RUN" =~ ^[0-9]+$ ]]
          [[ "$BASE_SOURCE" =~ ^[0-9a-f]{40}$ && "$HEAD_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEADLINE" =~ ^[0-9]+$ && "$PAIRS" =~ ^([3-9]|10)$ ]]
          [[ "$SUITE" =~ ^integration-tests/benchmark_suites/[a-zA-Z0-9_-]+\.yaml$ ]]
          now=$(date +%s)
          (( DEADLINE > now + 120 && DEADLINE <= now + 3600 ))
          timeout 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/comparison-origin.json"
          created=$(date -d "$(jq -r .created_at "$RUNNER_TEMP/comparison-origin.json")" +%s)
          (( DEADLINE <= created + 3600 ))
          cat > "$RUNNER_TEMP/paired-deadline.py" <<'PY'
          import json, os, time, urllib.request
          deadline = int(os.environ['DEADLINE'])
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def request(suffix='', method='GET'):
              with urllib.request.urlopen(urllib.request.Request(api + suffix, headers=headers, method=method), timeout=20) as response:
                  return response.read()
          time.sleep(max(0, deadline - time.time() - 120))
          try:
              request('/cancel', 'POST')
          except Exception as error:
              print(f'Cancellation request failed: {type(error).__name__}', flush=True)
          time.sleep(max(0, deadline - time.time() - 60))
          if json.loads(request())['status'] != 'completed':
              request('/force-cancel', 'POST')
          PY
          python3 "$RUNNER_TEMP/paired-deadline.py" > "$RUNNER_TEMP/paired-deadline.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/paired-deadline.pid"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate bundle origins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for side in base head; do
            if [[ "$side" == base ]]; then run="$BASE_RUN"; source="$BASE_SOURCE"; else run="$HEAD_RUN"; source="$HEAD_SOURCE"; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$RUNNER_TEMP/$side-origin.json"
            jq -e --arg source "$source" '.head_sha == $source and .path == ".github/workflows/benchmark.yaml" and .event == "workflow_dispatch" and .run_attempt == 1 and .conclusion == "success"' "$RUNNER_TEMP/$side-origin.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" > "$RUNNER_TEMP/$side-artifacts.json"
            jq -e '[.artifacts[] | select(.name == "benchmark-bundle-attempt1" and .expired == false)] | length == 1' "$RUNNER_TEMP/$side-artifacts.json"
          done
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_source }}
          path: paired/base
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_source }}
          path: paired/head
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run_id }}
          name: benchmark-bundle-attempt1
          path: ${{ runner.temp }}/base-bundle
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.head_run_id }}
          name: benchmark-bundle-attempt1
          path: ${{ runner.temp }}/head-bundle
      - name: Install prepared artifacts without building
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          for side in ('base', 'head'):
              root = pathlib.Path('paired') / side
              builtins = {item['path'] for item in json.loads((root / 'builtin-artifacts.json').read_text()).values()}
              archive = pathlib.Path(os.environ['RUNNER_TEMP']) / f'{side}-bundle/benchmark-bundle.tar.gz'
              with tarfile.open(archive) as tar:
                  seen = set()
                  for member in tar.getmembers():
                      path = pathlib.PurePosixPath(member.name)
                      name = path.as_posix()
                      if path.is_absolute() or '..' in path.parts:
                          raise ValueError(f'Unsafe bundle path: {member.name}')
                      allowed = (path.parent == pathlib.PurePosixPath('target/release') and path.name in {
                                     'worker-executor', 'golem-worker-service', 'golem-registry-service',
                                     'golem-shard-manager', 'golem-component-compilation-service'}
                                 or name == 'target/benchmarks/benchmarks'
                                 or path.parent == pathlib.PurePosixPath('test-components') and name.endswith('.wasm')
                                 or name in builtins)
                      if not member.isdir() and (not member.isfile() or not allowed):
                          raise ValueError(f'Unexpected bundle member: {member.name}')
                      if member.isfile():
                          if name in seen:
                              raise ValueError(f'Duplicate bundle member: {member.name}')
                          seen.add(name)
                  tar.extractall(root, filter='data')
          PY
          sha256sum "$RUNNER_TEMP/base-bundle/benchmark-bundle.tar.gz" > "$RUNNER_TEMP/base-bundle.sha256"
          sha256sum "$RUNNER_TEMP/head-bundle/benchmark-bundle.tar.gz" > "$RUNNER_TEMP/head-bundle.sha256"
      - uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: '8.0.2'
          auto-start: false
      - name: Pin the measurement database
        run: |
          image=postgres@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
          docker pull "$image"
          docker tag "$image" postgres:17.7
          docker image inspect postgres:17.7 > "$RUNNER_TEMP/postgres-image.json"
      - name: Run interleaved base and head processes
        run: |
          python3 integration-tests/benchmark_suites/paired_benchmarks.py run \
            --base-root paired/base --base-source "$BASE_SOURCE" --base-origin "$RUNNER_TEMP/base-origin.json" \
            --head-root paired/head --head-source "$HEAD_SOURCE" --head-origin "$RUNNER_TEMP/head-origin.json" \
            --suite "$SUITE" --pairs "$PAIRS" --deadline "$DEADLINE" --output "$RUNNER_TEMP/paired-results"
      - name: Preserve comparison and incomplete evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paired-benchmarks-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/paired-results
            ${{ runner.temp }}/*-origin.json
            ${{ runner.temp }}/*-artifacts.json
            ${{ runner.temp }}/*-bundle.sha256
            ${{ runner.temp }}/postgres-image.json
            ${{ runner.temp }}/paired-deadline.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop the deadline guard after evidence upload
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/paired-deadline.pid" ]]; then
            pid=$(cat "$RUNNER_TEMP/paired-deadline.pid")
            if [[ -r "/proc/$pid/cmdline" ]] && tr '\0' '\n' < "/proc/$pid/cmdline" | grep -Fxq "$RUNNER_TEMP/paired-deadline.py"; then
              kill "$pid"
            fi
          fi
