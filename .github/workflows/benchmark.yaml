name: On Demand Benchmark
on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  WASM_RQUICKJS_VERSION: "0.5.4"
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk

jobs:
  run-benchmark:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Check benchmark publisher access
        timeout-minutes: 3
        env:
          BENCHMARK_RESULTS_TOKEN: ${{ secrets.BENCHMARK_RESULTS_TOKEN }}
        run: |
          if [[ -z "$BENCHMARK_RESULTS_TOKEN" ]]; then
            echo "::error::BENCHMARK_RESULTS_TOKEN is missing. Configure a token with contents write access to golemcloud/benchmark-results."
            exit 1
          fi
          authorization="$(printf 'x-access-token:%s' "$BENCHMARK_RESULTS_TOKEN" | base64 -w0)"
          if ! status="$(curl --silent --show-error \
            --retry 3 --retry-connrefused --retry-max-time 120 \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            -H "AUTHORIZATION: basic $authorization" \
            'https://github.com/golemcloud/benchmark-results.git/info/refs?service=git-receive-pack')"; then
            echo "::error::Could not reach the benchmark publisher Git endpoint after retries. Check the network and GitHub service status."
            exit 1
          fi
          if [[ "$status" == 401 || "$status" == 403 ]]; then
            echo "::error::Git rejected BENCHMARK_RESULTS_TOKEN (HTTP $status). Check its expiration, repository access, and contents write permission."
            exit 1
          fi
          if [[ "$status" != 200 ]]; then
            echo "::error::Benchmark publisher Git endpoint returned HTTP $status after retries. Publication is unavailable."
            exit 1
          fi
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix-key: 'v3-rust'
          cache-shared-key: 'release'
          cache-save-if: 'true'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-binstall: 'true'
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
          install-cargo-component: 'true'

      - name: Building release executables
        run: cargo make --profile ci build-release

      - name: Build benchmark test components
        run: cargo make build-benchmark-components

      # The suite exits non-zero when any benchmark recorded failed attempts,
      # after the results JSON has been written. The results are committed
      # either way; the last step turns the recorded failures into a red run.
      - name: Run benchmark suite
        id: benchmark
        continue-on-error: true
        run: |
          cargo run --profile benchmarks -p integration-tests --bin benchmarks '--' \
            --primary-only \
            --retain-details \
            --retain-selected-zero-counts \
            suite \
            --save-to-json "$RUNNER_TEMP/github-actions-benchmark-results.json" \
            --runner-id github-actions-blacksmith-32vcpu \
            --runner-label "GitHub Actions (Blacksmith 32 vCPU)" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            integration-tests/benchmark_suites/ci.yaml \
            spawned

      - name: Validate and publish results
        env:
          BENCHMARK_RESULTS_TOKEN: ${{ secrets.BENCHMARK_RESULTS_TOKEN }}
          GOLEM_BENCHMARK_RESULTS_INPUT: ${{ runner.temp }}/github-actions-benchmark-results.json
          GOLEM_BENCHMARK_RESULTS_ANALYSIS: ${{ runner.temp }}/github-actions-benchmark-analysis.json
          GOLEM_BENCHMARK_PUBLISH_DIR: ${{ runner.temp }}/benchmark-results-publish
          GOLEM_BENCHMARK_RUNNER_ID: github-actions-blacksmith-32vcpu
        run: cargo make publish-benchmark-results

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-actions-benchmark-results.json
            ${{ runner.temp }}/github-actions-benchmark-analysis.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on recorded benchmark failures
        if: steps.benchmark.outcome != 'success'
        run: |
          echo "The benchmark suite exited with status ${{ steps.benchmark.outcome }}; see its FAILURES output above."
          exit 1
