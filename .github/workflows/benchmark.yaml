name: On Demand Benchmark
on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the merged run (disable for validation)
        type: boolean
        default: true
      r3_controls:
        description: Run overlapping R3 controls on every partition host (requires publish=false)
        type: boolean
        default: false
      short_validation:
        description: Run the build-free unpublished diagnostic instead of normal benchmark jobs
        type: boolean
        default: false
      trace_diagnostic:
        description: Run only the bounded traced/untraced diagnostic (requires publish=false)
        type: boolean
        default: false
      prepare_executor:
        description: Build only an instrumented executor overlay, without measurement or publication
        type: boolean
        default: false
      prepare_bundle:
        description: Build and archive services and fixtures only (requires publish=false)
        type: boolean
        default: false
      paired:
        description: Compare two prepared CI bundles on one measurement runner (requires publish=false)
        type: boolean
        default: false
      paired_deadline_probe:
        description: Stall paired preparation without measuring to validate cancellation (requires publish=false)
        type: boolean
        default: false
      base_run_id:
        description: Successful attempt-1 run with the prepared base bundle
        type: string
      base_source:
        description: Exact base source SHA
        type: string
      head_run_id:
        description: Successful attempt-1 run with the prepared head bundle
        type: string
      head_source:
        description: Exact head source SHA
        type: string
      paired_suite:
        description: Fixed suite for both sides of the comparison
        type: string
        default: integration-tests/benchmark_suites/r3-trace.yaml
      pairs:
        description: Number of interleaved fresh-process base/head pairs (3 to 10)
        type: string
        default: '3'
      executor_run_id:
        description: Successful preparation run supplying the executor overlay for a trace diagnostic
        type: string
      executor_source:
        description: Exact source SHA of the prepared executor overlay
        type: string
      deadline:
        description: Immutable UTC epoch deadline for the short diagnostic
        type: string
      cohort:
        description: Unique short diagnostic cohort
        type: string

env:
  WASM_RQUICKJS_VERSION: "0.5.3"
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk

jobs:
  paired-comparison:
    if: github.event_name == 'workflow_dispatch' && (inputs.paired || inputs.paired_deadline_probe)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/benchmark-paired.yaml
    with:
      base_run_id: ${{ inputs.base_run_id }}
      base_source: ${{ inputs.base_source }}
      head_run_id: ${{ inputs.head_run_id }}
      head_source: ${{ inputs.head_source }}
      suite: ${{ inputs.paired_suite }}
      pairs: ${{ inputs.pairs }}
      deadline: ${{ inputs.deadline }}
      deadline_probe: ${{ inputs.paired_deadline_probe }}
      isolated: ${{ !inputs.publish && !inputs.prepare_bundle && !inputs.prepare_executor && !inputs.short_validation && !inputs.trace_diagnostic && !inputs.r3_controls }}

  short-validation:
    if: github.event_name == 'workflow_dispatch' && !inputs.paired && !inputs.paired_deadline_probe && !inputs.prepare_bundle && !inputs.prepare_executor && (inputs.short_validation || inputs.trace_diagnostic)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/benchmark-validation.yaml
    with:
      deadline: ${{ inputs.deadline }}
      cohort: ${{ inputs.cohort }}
      trace_diagnostic: ${{ inputs.trace_diagnostic }}
      publish: ${{ inputs.publish }}
      executor_run_id: ${{ inputs.executor_run_id }}
      executor_source: ${{ inputs.executor_source }}

  prepare-executor:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_executor && !inputs.paired && !inputs.paired_deadline_probe && !inputs.prepare_bundle
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require an isolated unpublished preparation
        env:
          PUBLISH: ${{ inputs.publish }}
          SHORT: ${{ inputs.short_validation }}
          TRACE: ${{ inputs.trace_diagnostic }}
        run: |
          [[ "$PUBLISH" == false && "$SHORT" == false && "$TRACE" == false ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix-key: 'v3-rust'
          cache-shared-key: 'release'
          cache-save-if: 'false'
          install-cargo-make: 'false'
      - name: Build only the instrumented executor
        run: cargo build --locked --release -p golem-worker-executor --bin worker-executor
      - name: Package the executor with its source identity
        run: |
          target="$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)"
          mkdir "$RUNNER_TEMP/executor-overlay"
          cp "$target/release/worker-executor" "$RUNNER_TEMP/executor-overlay/worker-executor"
          sha="$(sha256sum "$RUNNER_TEMP/executor-overlay/worker-executor" | cut -d' ' -f1)"
          jq -n --arg source "$GITHUB_SHA" --arg sha256 "$sha" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source: $source, sha256: $sha256, run_id: $run, attempt: $attempt}' \
            > "$RUNNER_TEMP/executor-overlay/executor-provenance.json"
          rustc --version --verbose > "$RUNNER_TEMP/executor-toolchain.txt"
          tar -czf "$RUNNER_TEMP/executor-overlay.tar.gz" -C "$RUNNER_TEMP/executor-overlay" worker-executor executor-provenance.json
          sha256sum "$RUNNER_TEMP/executor-overlay.tar.gz" > "$RUNNER_TEMP/executor-overlay.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: executor-overlay-attempt1
          path: |
            ${{ runner.temp }}/executor-overlay.tar.gz
            ${{ runner.temp }}/executor-overlay.sha256
            ${{ runner.temp }}/executor-toolchain.txt
          if-no-files-found: error
          retention-days: 30

  build-benchmarks:
    if: ${{ !inputs.paired && !inputs.paired_deadline_probe && !inputs.short_validation && !inputs.trace_diagnostic && !inputs.prepare_executor }}
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: ${{ inputs.prepare_bundle && 45 || 360 }}
    outputs:
      timestamp: ${{ steps.bundle.outputs.timestamp }}
      attempt: ${{ github.run_attempt }}
      bundle: benchmark-bundle-attempt${{ github.run_attempt }}
    steps:
      - name: Require unpublished research runs
        if: (inputs.r3_controls || inputs.prepare_bundle) && inputs.publish
        run: |
          echo 'Research and preparation runs require publish=false.' >&2
          exit 1
      - name: Require a fresh isolated bundle preparation
        if: inputs.prepare_bundle
        env:
          CONTROLS: ${{ inputs.r3_controls }}
        run: |
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$CONTROLS" == false ]]
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix-key: 'v3-rust'
          cache-shared-key: 'release'
          cache-save-if: 'true'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-binstall: 'true'
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24'
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
          install-cargo-component: 'true'

      - name: Building release executables
        run: cargo make --profile ci build-release

      - name: Build benchmark test components
        run: cargo make build-benchmark-components

      - name: Build benchmark runner
        run: cargo build --profile benchmarks -p integration-tests --bin benchmarks

      - name: Archive executables and fixtures
        id: bundle
        run: |
          set -euo pipefail
          target="$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)"
          bundle="$RUNNER_TEMP/benchmark-bundle"
          mkdir -p "$bundle/target/release" "$bundle/target/benchmarks" "$bundle/test-components"
          for binary in golem-component-compilation-service golem-worker-service worker-executor golem-shard-manager golem-registry-service; do
            cp "$target/release/$binary" "$bundle/target/release/"
          done
          cp "$target/benchmarks/benchmarks" "$bundle/target/benchmarks/"
          find test-components -maxdepth 1 -name '*.wasm' -exec cp -L '{}' "$bundle/test-components/" \;
          while IFS= read -r artifact; do
            mkdir -p "$bundle/$(dirname "$artifact")"
            cp "$artifact" "$bundle/$artifact"
          done < <(jq -r '.[].path' builtin-artifacts.json)
          tar -czf "$RUNNER_TEMP/benchmark-bundle.tar.gz" -C "$bundle" .
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-bundle-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  run-benchmark:
    needs: build-benchmarks
    if: ${{ !inputs.prepare_bundle }}
    runs-on: blacksmith-32vcpu-ubuntu-2204
    strategy:
      fail-fast: false
      matrix:
        partition: [startup, durability-echo, bulk, streaming]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-benchmarks.outputs.bundle }}
          path: ${{ runner.temp }}
      - name: Extract benchmark bundle
        run: |
          tar -xzf "$RUNNER_TEMP/benchmark-bundle.tar.gz" -C "$GITHUB_WORKSPACE"
          jq -r --arg root "$GITHUB_WORKSPACE" 'to_entries[] | "GOLEM__BUILTIN_ARTIFACTS__SOURCE_OVERRIDES__\(.key | ascii_upcase)__URL=file://\($root)/\(.value.path)"' builtin-artifacts.json >> "$GITHUB_ENV"
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - name: Run benchmark suite
        id: benchmark
        continue-on-error: true
        env:
          PARTITION: ${{ matrix.partition }}
          LOGICAL_TIMESTAMP: ${{ needs.build-benchmarks.outputs.timestamp }}
          BUILD_ATTEMPT: ${{ needs.build-benchmarks.outputs.attempt }}
        run: |
          # Measurement-only retries would mix logical attempts. Retry all jobs;
          # a merge/publication-only retry reuses the completed attempt instead.
          if [[ "$GITHUB_RUN_ATTEMPT" != "$BUILD_ATTEMPT" ]]; then
            echo 'Measurement retries require Re-run all jobs.' >&2
            exit 1
          fi
          target/benchmarks/benchmarks \
            --primary-only \
            --retain-details \
            --retain-selected-zero-counts \
            suite \
            --partition "$PARTITION" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --timestamp "$LOGICAL_TIMESTAMP" \
            --save-to-json "$RUNNER_TEMP/partial-$PARTITION.json" \
            --runner-id github-actions-blacksmith-32vcpu \
            --runner-label "GitHub Actions (Blacksmith 32 vCPU)" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            integration-tests/benchmark_suites/ci.yaml \
            spawned

      - name: Upload partial result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-partial-${{ matrix.partition }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/partial-${{ matrix.partition }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Run overlapping R3 controls after partition cleanup
        if: inputs.r3_controls && steps.benchmark.outcome == 'success'
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/r3-controls.yaml" <<'YAML'
          name: R3 controls
          benchmarks:
            - name: latency-small
              version: 1
              iterations: 3
              clusterSize: [1]
              size: [100]
              length: [2]
            - name: throughput-cpu-intensive
              version: 1
              iterations: 3
              clusterSize: [1]
              size: [1]
              length: [100]
          YAML
          target/benchmarks/benchmarks \
            --primary-only --retain-details --retain-selected-zero-counts \
            suite --run-id "r3-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PARTITION" \
            --save-to-json "$RUNNER_TEMP/r3-controls-$PARTITION.json" \
            --runner-id github-actions-blacksmith-32vcpu \
            --runner-label "GitHub Actions (Blacksmith 32 vCPU)" \
            --source-repository "$GITHUB_REPOSITORY" --source-commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" "$RUNNER_TEMP/r3-controls.yaml" spawned

      - name: Record R3 dependency and host evidence
        if: always() && inputs.r3_controls
        run: |
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            uname -a
            lscpu
            free -b
            redis-server --version
            docker version
            docker image inspect postgres:17.7 --format '{{json .RepoDigests}}'
            sha256sum "$RUNNER_TEMP/benchmark-bundle.tar.gz"
          } > "$RUNNER_TEMP/r3-host.txt" 2>&1

      - name: Upload R3 controls separately from canonical partials
        if: always() && inputs.r3_controls
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-r3-${{ matrix.partition }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r3-controls-${{ matrix.partition }}.json
            ${{ runner.temp }}/r3-controls.yaml
            ${{ runner.temp }}/r3-host.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail on recorded benchmark failures
        if: steps.benchmark.outcome != 'success'
        run: exit 1

  merge-and-publish:
    needs: [build-benchmarks, run-benchmark]
    if: ${{ always() && !cancelled() && !inputs.prepare_bundle && needs.build-benchmarks.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-benchmarks.outputs.bundle }}
          path: ${{ runner.temp }}
      - name: Extract benchmark runner
        run: tar -xzf "$RUNNER_TEMP/benchmark-bundle.tar.gz" -C "$GITHUB_WORKSPACE" ./target/benchmarks/benchmarks
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-partial-*-attempt${{ needs.build-benchmarks.outputs.attempt }}
          path: ${{ runner.temp }}/partials
          merge-multiple: true

      - name: Merge and validate every expected partition
        id: merge
        continue-on-error: true
        run: |
          target/benchmarks/benchmarks suite \
            --merge-partial "$RUNNER_TEMP/partials/partial-startup.json" \
            --merge-partial "$RUNNER_TEMP/partials/partial-durability-echo.json" \
            --merge-partial "$RUNNER_TEMP/partials/partial-bulk.json" \
            --merge-partial "$RUNNER_TEMP/partials/partial-streaming.json" \
            --source-commit-sha "$GITHUB_SHA" \
            --runner-id github-actions-blacksmith-32vcpu \
            --save-to-json "$RUNNER_TEMP/github-actions-benchmark-results.json" \
            integration-tests/benchmark_suites/ci.yaml spawned

      - name: Require a complete canonical result
        run: test -s "$RUNNER_TEMP/github-actions-benchmark-results.json"

      - name: Validate and publish results
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          BENCHMARK_RESULTS_TOKEN: ${{ secrets.BENCHMARK_RESULTS_TOKEN }}
          GOLEM_BENCHMARK_RESULTS_INPUT: ${{ runner.temp }}/github-actions-benchmark-results.json
          GOLEM_BENCHMARK_RESULTS_ANALYSIS: ${{ runner.temp }}/github-actions-benchmark-analysis.json
          GOLEM_BENCHMARK_PUBLISH_DIR: ${{ runner.temp }}/benchmark-results-publish
          GOLEM_BENCHMARK_RUNNER_ID: github-actions-blacksmith-32vcpu
        run: ./integration-tests/benchmark_suites/publish_results.sh

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-actions-benchmark-results.json
            ${{ runner.temp }}/github-actions-benchmark-analysis.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on recorded benchmark failures
        if: steps.merge.outcome != 'success'
        run: |
          echo "The merged suite has failed attempts or incomplete partitions."
          exit 1
