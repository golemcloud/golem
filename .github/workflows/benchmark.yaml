name: On Demand Benchmark
on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  WASM_RQUICKJS_VERSION: "0.4.6"
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk

jobs:
  run-benchmark:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix-key: 'v3-rust'
          cache-shared-key: 'release'
          cache-save-if: 'true'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-binstall: 'true'
          install-protoc: 'true'
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
          install-cargo-component: 'true'

      - name: Building release executables
        run: cargo make --profile ci build-release

      - name: Build benchmark test components
        run: cargo make build-benchmark-components

      - name: Checkout benchmark results repository
        uses: actions/checkout@v5
        with:
          repository: 'golemcloud/benchmark-results'
          token: ${{ secrets.BENCHMARK_RESULTS_TOKEN }}
          path: benchmark-results

      # The suite exits non-zero when any benchmark recorded failed attempts,
      # after the results JSON has been written. The results are committed
      # either way; the last step turns the recorded failures into a red run.
      - name: Run benchmark suite
        id: benchmark
        continue-on-error: true
        run: |
          cargo run --profile benchmarks -p integration-tests --bin benchmarks '--' \
            --primary-only \
            --retain-details \
            --retain-selected-zero-counts \
            suite \
            --save-to-json "$RUNNER_TEMP/github-actions-benchmark-results.json" \
            --runner-id github-actions-blacksmith-32vcpu \
            --runner-label "GitHub Actions (Blacksmith 32 vCPU)" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-commit-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            integration-tests/benchmark_suites/ci.yaml \
            spawned

      - name: Validate and publish results
        env:
          RESULTS_PATH: ${{ runner.temp }}/github-actions-benchmark-results.json
          ANALYSIS_PATH: ${{ runner.temp }}/github-actions-benchmark-analysis.json
        run: |
          set -euo pipefail
          cd benchmark-results
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          published=false
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            node scripts/append-results.mjs "$RESULTS_PATH"

            if git diff --quiet -- public/data/index.json; then
              echo "Benchmark run is already published at $(git rev-parse HEAD)"
              published=true
              break
            fi

            npm ci
            npm test
            npm run build
            git add public/data

            mapfile -t staged_files < <(git diff --cached --name-only)
            if ((${#staged_files[@]} != 2)) ||
              [[ ! " ${staged_files[*]} " =~ " public/data/index.json " ]]; then
              echo "Publisher attempted to commit unexpected files" >&2
              exit 1
            fi
            for staged_file in "${staged_files[@]}"; do
              if [[ "$staged_file" != "public/data/index.json" &&
                ! "$staged_file" =~ ^public/data/runs/[0-9a-f]{24}\.json$ ]]; then
                echo "Publisher attempted to commit unexpected file $staged_file" >&2
                exit 1
              fi
            done

            git commit -m "Append GitHub Actions benchmark results for ${GITHUB_SHA:0:12}"
            if git push origin HEAD:master; then
              published=true
              break
            fi
            echo "Publish attempt $attempt lost a race; retrying from current master" >&2
          done

          if [[ "$published" != true ]]; then
            echo "Failed to publish benchmark results after three attempts" >&2
            exit 1
          fi

          run_timestamp="$(jq -er '.runs | select(length == 1) | .[0].timestamp' "$RESULTS_PATH")"
          node scripts/analyze-regressions.mjs \
            public/data/index.json \
            --runner github-actions-blacksmith-32vcpu \
            --suite CI \
            --timestamp "$run_timestamp" \
            --output "$ANALYSIS_PATH"
          jq -e '.status != "run-not-found" and .status != "no-runs"' "$ANALYSIS_PATH" >/dev/null

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/github-actions-benchmark-results.json
            ${{ runner.temp }}/github-actions-benchmark-analysis.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on recorded benchmark failures
        if: steps.benchmark.outcome != 'success'
        run: |
          echo "The benchmark suite exited with status ${{ steps.benchmark.outcome }}; see its FAILURES output above."
          exit 1
