name: Known flaky tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Number of days of CI history to inspect
        required: false
        default: 30
        type: number

concurrency:
  group: known-flaky-tests
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    name: Update known flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DAYS: ${{ inputs.days || '30' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check and test aggregator
        run: |
          cargo clippy --locked --manifest-path .github/tools/flaky-tests/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path .github/tools/flaky-tests/Cargo.toml
      - name: Aggregate CI test reports
        run: >-
          cargo run --locked --release
          --manifest-path .github/tools/flaky-tests/Cargo.toml --
          --repo "${GITHUB_REPOSITORY}"
          --days "${DAYS}"
          --summary "${GITHUB_STEP_SUMMARY}"
          --output flaky-tests.md
          --update-issue
      - name: Save generated report
        if: ${{ !cancelled() && hashFiles('flaky-tests.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-report
          path: flaky-tests.md
      - name: Report collector failure
        if: failure()
        run: |
          echo "::error::Flaky-test collection or publication failed. The issue report may be stale; check this run's logs."
          {
            echo '## Flaky-test report update failed'
            echo
            echo 'Collection or publication failed. The issue report may be stale. Do not interpret it as a current clean run.'
            echo
            echo "[Collector logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
