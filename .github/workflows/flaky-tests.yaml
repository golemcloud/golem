name: Known flaky tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Number of days of CI history to inspect
        required: false
        default: 30
        type: number

concurrency:
  group: known-flaky-tests
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    name: Update known flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DAYS: ${{ inputs.days || '30' }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --no-self-update && rustup default 1.99.1
      - name: Check and test aggregator
        run: |
          cargo clippy --locked --manifest-path .github/tools/flaky-tests/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path .github/tools/flaky-tests/Cargo.toml
      - name: Aggregate CI test reports
        run: >-
          cargo run --locked --release
          --manifest-path .github/tools/flaky-tests/Cargo.toml --
          --repo "${GITHUB_REPOSITORY}"
          --days "${DAYS}"
          --summary "${GITHUB_STEP_SUMMARY}"
          --output flaky-tests.md
          --update-issue
