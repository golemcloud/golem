name: Built-in Bash Oracle Drift

# A separate workflow, not a job folded into builtin-bash.yaml: `stale` re-runs the ENTIRE oracle
# corpus (both tiers) against live Docker containers, which is too slow and too noisy (a
# non-deterministic case can flip on its own, per-commit-independent of anything this PR touched)
# to run on every push/PR the way the other builtin-bash.yaml jobs do. It needs to run only when
# something that could actually change the oracle's answers changes: the oracle Dockerfile itself,
# a recorded golden, or conformance.py's own comparison logic. GitHub's `on.push.paths` /
# `on.pull_request.paths` filters already do exactly that at the workflow level -- no need for
# dorny/paths-filter, which exists to gate individual JOBS sharing one workflow's trigger, not to
# scope an entire workflow's trigger by path (the native filter already does that). Folding this
# into builtin-bash.yaml instead would mean either giving that shared workflow a `schedule:`
# trigger (which fires ALL of its jobs, not just this one, since job-level schedule filtering
# isn't a thing) or bolting per-job `if:` conditions onto its four existing jobs to suppress them
# on a schedule/dispatch meant only for this one -- both riskier to those jobs than a workflow of
# its own. A weekly `schedule:` plus `workflow_dispatch:` cover the "oracle changed on its own,
# nothing in the repo did" case that a paths filter can never catch.

on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
    paths:
      - ".github/workflows/builtin-bash-oracle-drift.yaml"
      - "plugins/builtin-tools/bash/conformance/oracle.Dockerfile"
      - "plugins/builtin-tools/bash/conformance/goldens/**"
      - "plugins/builtin-tools/bash/conformance/conformance.py"
  pull_request:
    paths:
      - ".github/workflows/builtin-bash-oracle-drift.yaml"
      - "plugins/builtin-tools/bash/conformance/oracle.Dockerfile"
      - "plugins/builtin-tools/bash/conformance/goldens/**"
      - "plugins/builtin-tools/bash/conformance/conformance.py"
  schedule:
    # Mondays 06:00 UTC -- catches the oracle image's own upstream drifting (Alpine's index
    # publishing a newer package than the goldens were recorded with, say) with nothing in this repo
    # having changed at all, which no paths filter could ever trigger on.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle-drift:
    name: Oracle drift (stale goldens)
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # `stale` is pure Python + Docker (it re-runs the oracle and compares with the recorded
      # goldens; it never builds or runs the wasm shell), so no wasm target and no Rust cache --
      # just enough of a toolchain for `cargo make` itself to run.
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: "false"
          cache-shared-key: "oracle-drift"

      - name: Check for oracle drift (stale goldens, both tiers)
        run: cargo make --profile ci test-builtin-bash-oracle-drift
