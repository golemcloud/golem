name: Built-in Bash Oracle Drift

# Oracle regeneration runs the entire corpus against live Docker containers.
# Path filters cover changes to its inputs and comparison logic; the weekly
# schedule and manual dispatch also detect drift in the external oracle.

on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
    paths:
      - ".github/workflows/builtin-bash-oracle-drift.yaml"
      - "builtin-tools/bash/conformance/oracle.Dockerfile"
      - "builtin-tools/bash/conformance/goldens/**"
      - "builtin-tools/bash/conformance/*.ts"
      - "builtin-tools/bash/conformance/compat/*.ts"
      - "builtin-tools/bash/conformance/tsconfig.json"
      - "builtin-tools/bash/conformance/.oxlintrc.json"
      - "builtin-tools/bash/conformance/dprint.json"
      - "builtin-tools/bash/conformance/cases/**"
      - "builtin-tools/bash/conformance/features.json"
      - "builtin-tools/bash/conformance/package.json"
      - "builtin-tools/bash/conformance/bun.lock"
  pull_request:
    branches:
      - "[0-9]+.[0-9]+.x"
    paths:
      - ".github/workflows/builtin-bash-oracle-drift.yaml"
      - "builtin-tools/bash/conformance/oracle.Dockerfile"
      - "builtin-tools/bash/conformance/goldens/**"
      - "builtin-tools/bash/conformance/*.ts"
      - "builtin-tools/bash/conformance/compat/*.ts"
      - "builtin-tools/bash/conformance/tsconfig.json"
      - "builtin-tools/bash/conformance/.oxlintrc.json"
      - "builtin-tools/bash/conformance/dprint.json"
      - "builtin-tools/bash/conformance/cases/**"
      - "builtin-tools/bash/conformance/features.json"
      - "builtin-tools/bash/conformance/package.json"
      - "builtin-tools/bash/conformance/bun.lock"
  schedule:
    # Mondays 06:00 UTC -- catches the oracle image's own upstream drifting (Alpine's index
    # publishing a newer package than the goldens were recorded with, say) with nothing in this repo
    # having changed at all, which no paths filter could ever trigger on.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle-drift:
    name: Oracle drift (stale goldens)
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      # `stale` uses Bun + Docker (it re-runs the oracle and compares with the recorded
      # goldens; it never builds or runs the wasm shell), so no wasm target and no Rust cache --
      # just enough of a toolchain for `cargo make` itself to run.
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: "false"
          cache-shared-key: "oracle-drift"

      - name: Check for oracle drift (stale goldens, both tiers)
        run: cargo make --profile ci test-builtin-bash-oracle-drift
