name: Routing Coverage Pilot
on:
  workflow_call:
    inputs:
      deadline:
        required: true
        type: string
      isolated:
        required: true
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: ['1', '2', '3', '4']
    env:
      DEADLINE: ${{ inputs.deadline }}
      ISOLATED: ${{ inputs.isolated }}
      HOST: ${{ matrix.host }}
    steps:
      - name: Validate the immutable pilot budget and start the deadline guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISOLATED" == true && "$GITHUB_RUN_ATTEMPT" == 1 && "$DEADLINE" =~ ^[0-9]+$ ]]
          timeout 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/pilot-origin.json"
          created=$(date -d "$(jq -r .created_at "$RUNNER_TEMP/pilot-origin.json")" +%s)
          now=$(date +%s)
          (( DEADLINE > now + 120 && DEADLINE <= created + 1800 ))
          cat > "$RUNNER_TEMP/coverage-deadline.py" <<'PY'
          import json, os, time, urllib.request
          deadline = int(os.environ['DEADLINE'])
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def request(suffix='', method='GET'):
              with urllib.request.urlopen(urllib.request.Request(api + suffix, headers=headers, method=method), timeout=20) as response:
                  return response.read()
          time.sleep(max(0, deadline - time.time() - 120))
          print(f'Requesting cancellation at {time.time()}; deadline={deadline}', flush=True)
          try:
              request('/cancel', 'POST')
          except Exception as error:
              print(f'Cancellation request failed: {type(error).__name__}', flush=True)
          time.sleep(max(0, deadline - time.time() - 60))
          if json.loads(request())['status'] != 'completed':
              request('/force-cancel', 'POST')
          PY
          python3 "$RUNNER_TEMP/coverage-deadline.py" > "$RUNNER_TEMP/coverage-deadline.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/coverage-deadline.pid"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: eb46c797c329e1787fb9260cc57b132e0830489d
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retain original builder identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/44078542455" > "$RUNNER_TEMP/original-origin.json"
          jq -e '.head_sha == "eb46c797c329e1787fb9260cc57b132e0830489d" and .path == ".github/workflows/benchmark.yaml" and .event == "workflow_dispatch" and .run_attempt == 1 and .conclusion == "success"' "$RUNNER_TEMP/original-origin.json"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44078542455
          artifact-ids: 14329150891
          merge-multiple: true
          path: ${{ runner.temp }}/bundle
      - uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: '8.0.2'
          auto-start: false
      - name: Run one fresh N=5 process without rebuilding
        run: |
          python3 integration-tests/benchmark_suites/r3_coverage.py run \
            --root "$GITHUB_WORKSPACE/runtime" --archive "$RUNNER_TEMP/bundle/benchmark-bundle.tar.gz" \
            --origin "$RUNNER_TEMP/original-origin.json" --output "$RUNNER_TEMP/coverage-results" \
            --deadline "$DEADLINE" --host "$HOST"
      - name: Check the complete evidence size without truncation
        id: evidence
        if: always()
        run: |
          bytes=$(du -sb "$RUNNER_TEMP/coverage-results" | cut -f1)
          echo "$bytes" > "$RUNNER_TEMP/evidence-bytes.txt"
          (( bytes <= 250 * 1024 * 1024 ))
      - name: Preserve ordinary failure and missing-exposure evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.host }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coverage-results
            ${{ runner.temp }}/pilot-origin.json
            ${{ runner.temp }}/original-origin.json
            ${{ runner.temp }}/coverage-deadline.log
            ${{ runner.temp }}/evidence-bytes.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve size and lifecycle receipts even when full evidence exceeds its cap
        if: always() && steps.evidence.outcome != 'success'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-rejection-${{ matrix.host }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coverage-results/status.json
            ${{ runner.temp }}/pilot-origin.json
            ${{ runner.temp }}/original-origin.json
            ${{ runner.temp }}/coverage-deadline.log
            ${{ runner.temp }}/evidence-bytes.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the deadline guard after evidence upload
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/coverage-deadline.pid" ]]; then
            pid=$(cat "$RUNNER_TEMP/coverage-deadline.pid")
            if [[ -r "/proc/$pid/cmdline" ]] && tr '\0' '\n' < "/proc/$pid/cmdline" | grep -Fxq "$RUNNER_TEMP/coverage-deadline.py"; then
              kill "$pid"
            fi
          fi
