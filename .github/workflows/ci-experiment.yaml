name: Main-only CI experiment

on:
  push:
    branches: [ci/main-only-experiment]
    paths:
      - .github/workflows/ci-experiment.yaml
      - .github/scripts/ci-experiment.py
  workflow_dispatch:
    inputs:
      scope:
        description: CLI concurrency comparison or complete ordinary coverage
        type: choice
        options: [cli, full]
        default: cli

permissions:
  contents: read
  actions: read

concurrency:
  group: main-only-ci-experiment
  cancel-in-progress: true

jobs:
  linux:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.scope == 'full' && 720 || 480 }}
    env:
      EXPERIMENT_SCOPE: ${{ inputs.scope || 'cli' }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: 20
      WASI_SDK_VERSION: '25'
      WASI_SDK_PATH: /opt/wasi-sdk
      WASM_RQUICKJS_VERSION: '0.4.13'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record allocation start and source
        run: |
          mkdir -p tmp/experiment-results
          date +%s > tmp/experiment-results/allocation-start
          git rev-parse HEAD > tmp/experiment-results/source-sha
          lscpu > tmp/experiment-results/cpu.txt
          free -h > tmp/experiment-results/memory.txt
          df -h > tmp/experiment-results/disk.txt
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown
          install-cargo-binstall: 'true'
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24'
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.11+6ff76a5f9
          core-version: 0.10.11+6ff76a5f9
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/golem/go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Install remaining tools without workspace caches
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends redis-server build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev time
          sudo systemctl stop redis-server
          cargo binstall --force --locked cargo-test-r@2.2.5 wasm-tools@1.248.0 wit-bindgen-cli@0.40.0
          curl -fsSL https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/golangci-lint-2.13.2-linux-amd64/golangci-lint" /usr/local/bin/
          python3 -m pip install --user --break-system-packages PyYAML==6.0.3
      - name: Verify complete ordinary-CI inventory
        run: |
          python3 .github/scripts/ci-experiment.py --inventory > tmp/experiment-results/inventory.json
          { rustc -vV; cargo --version; node --version; go version; moon version; java -version; } > tmp/experiment-results/toolchains.txt 2>&1
      - name: Cold single-worker priming
        id: cold
        continue-on-error: true
        run: |
          phase=cli-prime
          if [ "$EXPERIMENT_SCOPE" = full ]; then phase=all; fi
          python3 -u .github/scripts/ci-experiment.py --cycle cold --phase "$phase" --test-retries 2
      - name: Checkpoint cold measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-experiment-linux-cold-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14
      - name: Warm single-worker baseline
        id: warm
        if: ${{ !cancelled() && steps.cold.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ "$EXPERIMENT_SCOPE" = full ]; then
            rm -rf tmp/experiment-products tmp/test-components-wasm
            python3 -u .github/scripts/ci-experiment.py --cycle warm --test-retries 2
          else
            python3 -u .github/scripts/ci-experiment.py --cycle warm --phase cli
          fi
      - name: Checkpoint warm measurements
        if: ${{ !cancelled() && steps.warm.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-experiment-linux-warm-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14
      - name: Check CLI baseline completed successfully
        id: cli-baseline
        if: ${{ !cancelled() && steps.cold.outcome == 'success' && (steps.warm.outcome == 'success' || steps.warm.outcome == 'failure') }}
        run: |
          phase=cli
          if [ "$EXPERIMENT_SCOPE" = full ]; then phase=all; fi
          python3 .github/scripts/ci-experiment.py --check-cli-baseline "tmp/experiment-results/warm/$phase-0.json"
      - name: Warm CLI comparison with six test threads
        id: cli6
        if: ${{ !cancelled() && steps.cli-baseline.outputs.eligible == 'true' }}
        continue-on-error: true
        run: python3 -u .github/scripts/ci-experiment.py --cycle warm-cli6 --phase cli --cli-test-threads 6
      - name: Check memory headroom for eight CLI test threads
        id: cli-headroom
        if: ${{ !cancelled() && steps.cli6.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('tmp/experiment-results/warm-cli6/cli-0.json').read_text())
          peak = max(r['memory_used_kib'] for s in report['stages'] for step in s['steps'] for r in step['resources'])
          total = int(Path('/proc/meminfo').read_text().splitlines()[0].split()[1])
          # Conservatively scale all used memory, reserving 15% of the host.
          eligible = peak * 8 / 6 <= total * 0.85
          print(f'Six-thread peak: {peak / 1024**2:.1f} GiB; host: {total / 1024**2:.1f} GiB; try eight: {eligible}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'eligible={str(eligible).lower()}', file=output)
          PY
      - name: Warm CLI comparison with eight test threads
        id: cli8
        if: ${{ !cancelled() && steps.cli-headroom.outputs.eligible == 'true' }}
        continue-on-error: true
        run: python3 -u .github/scripts/ci-experiment.py --cycle warm-cli8 --phase cli --cli-test-threads 8
      - name: Verify bounded promise-await test
        id: promise-timeout
        if: ${{ !cancelled() && steps.cold.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          CI: 'true'
          PROFILE: dev-ci
          CARGO_INCREMENTAL: 'false'
          CARGO_BUILD_JOBS: 10
          RUST_LOG: info
          RUST_BACKTRACE: '1'
          QUIET: 'true'
          GOLEM_BUILTIN_ARTIFACTS_PREBUILT: '1'
        run: |
          export PATH="$PWD/target/debug:$PATH"
          mkdir -p tmp/experiment-results/promise-timeout
          status=0
          for backend in postgres sqlite; do
            cargo-test-r run --package integration-tests --test integration "agent_promise_await_$backend" -- \
              --nocapture --test-threads=1 --report-time --format ctrf \
              --logfile "$PWD/tmp/experiment-results/promise-timeout/$backend.json" \
              > "tmp/experiment-results/promise-timeout/$backend.log" 2>&1 || status=1
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('tmp/experiment-results/promise-timeout').glob('*.json'))
          assert len(reports) == 2, 'expected one report per database backend'
          for path in reports:
              summary = json.loads(path.read_text())['results']['summary']
              assert summary['tests'] == summary['passed'] == 1, (path, summary)
          PY
          exit "$status"
      - name: Record allocation end
        if: always()
        run: |
          date +%s > tmp/experiment-results/allocation-end
          df -h > tmp/experiment-results/disk-final.txt
      - name: Upload measurements and complete logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-experiment-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure status
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('tmp/experiment-results')
          full = os.environ['EXPERIMENT_SCOPE'] == 'full'
          for cycle, phase, outcome in (
              ('cold', 'all' if full else 'cli-prime', '${{ steps.cold.outcome }}'),
              ('warm', 'all' if full else 'cli', '${{ steps.warm.outcome }}'),
              ('warm-cli6', 'cli', '${{ steps.cli6.outcome }}'),
              ('warm-cli8', 'cli', '${{ steps.cli8.outcome }}'),
          ):
              if cycle.startswith('warm-cli') and outcome == 'skipped':
                  continue
              assert outcome == 'success', f'{cycle}: {outcome}'
              report = json.loads((root / cycle / f'{phase}-0.json').read_text())
              assert report['fully_green'], f'{cycle}: initial failures retained; not fully green'
          assert '${{ steps.promise-timeout.outcome }}' == 'success', 'promise-await validation did not pass'
          PY

  macos:
    if: ${{ inputs.scope == 'full' }}
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
      RUST_MIN_STACK: '33554432'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-make: 'false'
      - name: Cold and warm native APFS validation
        run: |
          mkdir -p tmp/apfs-experiment
          status=0
          for cycle in cold warm; do
            start=$(date +%s)
            result=0
            cargo test --locked -j 4 --profile dev-ci -p golem-worker-executor \
              --features test-utils --lib --no-run --message-format=json-render-diagnostics \
              > "tmp/apfs-experiment/${cycle}-cargo.jsonl" 2> "tmp/apfs-experiment/${cycle}-build.log" || result=$?
            if [ "$result" -eq 0 ]; then
              integration-tests/scripts/managed-filesystem/test-select-cargo-test-executables.py
              python3 integration-tests/scripts/managed-filesystem/select-cargo-test-executables.py \
                "tmp/apfs-experiment/${cycle}-cargo.jsonl" "$PWD" lib > tmp/apfs-experiment/executable.tsv
              IFS=$'\t' read -r target executable < tmp/apfs-experiment/executable.tsv
              test "$target" = lib
              bash integration-tests/scripts/apfs/run-native-tests.sh "$executable" \
                :tag:native_apfs --include-ignored --test-threads 1 --report-time \
                > "tmp/apfs-experiment/${cycle}-tests.log" 2>&1 || result=$?
            fi
            end=$(date +%s)
            printf '{"cycle":"%s","seconds":%s,"exit_code":%s}\n' "$cycle" "$((end-start))" "$result" >> tmp/apfs-experiment/results.jsonl
            if [ "$result" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-experiment-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/apfs-experiment
          if-no-files-found: error
          retention-days: 14
