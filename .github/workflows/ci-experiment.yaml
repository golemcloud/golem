name: Temporary prime warm changed campaign

# Select the driver revision and both workload commits explicitly before launch.
# Confirm A contains the reviewed HTTP repair. B must contain another real,
# reviewed native Rust change, not only comments/touches. Review source.diff.
# No push trigger and no automatic extra allocation.
on:
  workflow_dispatch:
    inputs:
      source_a:
        description: Full 40-hex baseline commit SHA
        required: true
        type: string
      source_b:
        description: Full 40-hex descendant with a native Rust source change
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: main-only-ci-experiment
  cancel-in-progress: false

jobs:
  validate-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_A: ${{ inputs.source_a }}
      SOURCE_B: ${{ inputs.source_b }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate exact source pair before allocating expensive workers
        run: python3 .github/scripts/ci-campaign.py --preflight --source-a "$SOURCE_A" --source-b "$SOURCE_B"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-campaign-source-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: validate-sources
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 720
    env:
      SOURCE_A: ${{ inputs.source_a }}
      SOURCE_B: ${{ inputs.source_b }}
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: 20
      WASI_SDK_VERSION: '25'
      WASI_SDK_PATH: /opt/wasi-sdk
      WASM_RQUICKJS_VERSION: '0.4.13'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - name: Record allocation start before checkout and setup
        run: date +%s > "$RUNNER_TEMP/campaign-allocation-start"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record allocation resources
        run: |
          mkdir -p tmp/experiment-results
          cp "$RUNNER_TEMP/campaign-allocation-start" tmp/experiment-results/allocation-start
          lscpu > tmp/experiment-results/cpu.txt
          free -h > tmp/experiment-results/memory.txt
          df -h > tmp/experiment-results/disk.txt
          test -z "${CARGO_TARGET_DIR:-}"
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.1 --component clippy --component rustfmt --target wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown
          install-cargo-binstall: 'true'
      - name: Verify pinned and explicit stable Rust targets
        timeout-minutes: 5
        run: |
          rustup target add --toolchain stable wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown
          rustup run "$RUSTUP_TOOLCHAIN" rustc -vV > tmp/experiment-results/rust-pinned.txt
          rustup run stable rustc -vV > tmp/experiment-results/rust-stable.txt
          diff -u tmp/experiment-results/rust-pinned.txt tmp/experiment-results/rust-stable.txt
          printf '#![no_std]\npub fn target_probe() {}\n' > "$RUNNER_TEMP/target-probe.rs"
          for toolchain in "$RUSTUP_TOOLCHAIN" stable; do
            for target in wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown; do
              output="$RUNNER_TEMP/target-probe/$toolchain/$target"
              mkdir -p "$output"
              rustup run "$toolchain" rustc --crate-type lib --emit metadata \
                --target "$target" --out-dir "$output" "$RUNNER_TEMP/target-probe.rs"
              echo "Verified $toolchain / $target"
            done
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24.22.1'
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.11+6ff76a5f9
          core-version: 0.10.11+6ff76a5f9
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Install remaining tools without workspace caches
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends redis-server build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev time
          sudo systemctl stop redis-server
          cargo binstall --force --locked cargo-test-r@2.2.5 wasm-tools@1.248.0 wit-bindgen-cli@0.40.0
          curl -fsSL https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/golangci-lint-2.13.2-linux-amd64/golangci-lint" /usr/local/bin/
          python3 -m pip install --user --break-system-packages PyYAML==6.0.3
      - name: Prime A then warm A then changed B within one allocation
        run: |
          { rustc -vV; cargo --version; node --version; go version; moon version; java -version; } > tmp/experiment-results/toolchains.txt 2>&1
          python3 -u .github/scripts/ci-campaign.py --source-a "$SOURCE_A" --source-b "$SOURCE_B" \
            --allocation-start "$RUNNER_TEMP/campaign-allocation-start"
      - name: Record allocation end
        if: always()
        run: |
          mkdir -p tmp/experiment-results
          date +%s > tmp/experiment-results/allocation-end
          df -h > tmp/experiment-results/disk-final.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-campaign-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: validate-sources
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 120
    env:
      SOURCE_A: ${{ inputs.source_a }}
      SOURCE_B: ${{ inputs.source_b }}
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: 4
      RUST_MIN_STACK: '33554432'
    steps:
      - name: Record allocation start before checkout and setup
        run: date +%s > "$RUNNER_TEMP/campaign-allocation-start"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-make: 'false'
      - name: Install report parser
        run: |
          python3 -m venv "$RUNNER_TEMP/campaign-venv"
          "$RUNNER_TEMP/campaign-venv/bin/pip" install PyYAML==6.0.3
      - name: Native APFS prime A then warm A then changed B
        run: |
          "$RUNNER_TEMP/campaign-venv/bin/python" -u .github/scripts/ci-campaign.py \
            --platform macos --source-a "$SOURCE_A" --source-b "$SOURCE_B" \
            --allocation-start "$RUNNER_TEMP/campaign-allocation-start"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-campaign-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/experiment-results
          if-no-files-found: error
          retention-days: 14
