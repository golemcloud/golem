name: Build release Docker payloads

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      target:
        type: string
        required: true
      rustflags-env:
        type: string
        required: true
      rustflags:
        type: string
        required: true
      cross:
        type: boolean
        default: false
      manifest-artifact-id:
        type: string
        required: true
    outputs:
      artifact-id:
        description: Artifact containing the sealed Docker executable payloads
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 10
      GOLEM_BUILTIN_RELEASE: '1'
      GH_TOKEN: ${{ github.token }}
      PLATFORM_OVERRIDE: ${{ inputs.platform }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check manifest artifact metadata
        env:
          MANIFEST_ARTIFACT_ID: ${{ inputs.manifest-artifact-id }}
        run: python3 scripts/golem-release.py check-artifact --id "$MANIFEST_ARTIFACT_ID"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.manifest-artifact-id }}
          path: .
          merge-multiple: true
      - name: Check release manifest
        run: python3 scripts/golem-release.py check-manifest
      - uses: ./.github/actions/setup-rust
        with:
          fetch-tag: 'true'
          rust-targets: ${{ inputs.target }}
          install-protoc: 'true'
      - name: Prepare release build
        env:
          RUSTFLAGS_ENV: ${{ inputs.rustflags-env }}
          TARGET_RUSTFLAGS: ${{ inputs.rustflags }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # CARGO_-prefixed target flags also pass through to the cross container.
          echo "$RUSTFLAGS_ENV=$TARGET_RUSTFLAGS" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Install cross
        if: inputs.cross
        run: cargo install cross
      - name: Build service executables
        run: cargo make --profile ci build-release
      - name: Package service executables
        run: cargo make --profile ci package-release
      # Keep the Golem build separate so workspace features do not change its payload.
      - name: Build Golem executable
        if: ${{ !inputs.cross }}
        run: cargo build -p golem --release --target "$TARGET"
      - name: Cross-build Golem executable
        if: inputs.cross
        run: cross build -p golem --release --target "$TARGET"
      - name: Package and seal Docker payloads
        run: |
          tar -cvf "target/golem-$TARGET.tar" -C target "$TARGET/release/golem"
          mkdir -p release-docker
          cp "target/$TARGET.tar" "target/golem-$TARGET.tar" release-docker/
          python3 scripts/golem-release.py seal-output --directory release-docker --kind docker --target "$TARGET"
      - name: Upload Docker payloads
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: docker-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-docker/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
