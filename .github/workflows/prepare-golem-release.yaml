name: Prepare Golem release

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: prepare-golem-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: blacksmith
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
      - name: Validate the public release tag and source
        shell: bash
        run: BUILTIN_VERSION="${GITHUB_REF_NAME#v}" cargo make --profile ci validate-golem-release-source

  preflight:
    needs: validate
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  packages:
    needs: validate
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 180
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      manifest-id: ${{ steps.manifest.outputs.artifact-id }}
    env:
      CARGO_BUILD_JOBS: 20
      WASI_SDK_PATH: /opt/wasi-sdk
      WASM_RQUICKJS_VERSION: '0.4.13'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          rust-targets: wasm32-wasip2
          install-cargo-binstall: 'true'
          cache-shared-key: builtin-artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24'
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
      - name: Install wasm-tools
        run: cargo binstall --force --locked wasm-tools@1.248.0
      - name: Package every component before release writes
        shell: bash
        run: BUILTIN_VERSION="${GITHUB_REF_NAME#v}" cargo make --profile ci package-builtin-artifacts
      - id: bundle
        uses: actions/upload-artifact@v6
        with:
          name: builtins-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/builtin-artifact-release/bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - id: manifest
        uses: actions/upload-artifact@v6
        with:
          name: runtime-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/builtin-artifact-release/bundle/builtin-artifacts.release.json
          if-no-files-found: error
          retention-days: 30

  native-linux-amd64:
    needs: packages
    uses: ./.github/workflows/build-release-binaries.yaml
    with:
      runner: blacksmith-32vcpu-ubuntu-2204
      target: x86_64-unknown-linux-gnu
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  native-linux-arm64:
    needs: packages
    uses: ./.github/workflows/build-release-binaries.yaml
    with:
      runner: blacksmith-32vcpu-ubuntu-2204
      target: aarch64-unknown-linux-gnu
      cross: true
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  native-macos-amd64:
    needs: packages
    uses: ./.github/workflows/build-release-binaries.yaml
    secrets: inherit
    with:
      runner: macos-latest
      target: x86_64-apple-darwin
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  native-macos-arm64:
    needs: packages
    uses: ./.github/workflows/build-release-binaries.yaml
    secrets: inherit
    with:
      runner: macos-latest
      target: aarch64-apple-darwin
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  native-windows:
    needs: packages
    uses: ./.github/workflows/build-release-binaries.yaml
    with:
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  docker-linux-amd64:
    needs: packages
    uses: ./.github/workflows/build-release-docker.yaml
    with:
      platform: linux/amd64
      target: x86_64-unknown-linux-gnu
      rustflags-env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS
      rustflags: '-C target-cpu=x86-64-v3'
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  docker-linux-arm64:
    needs: packages
    uses: ./.github/workflows/build-release-docker.yaml
    with:
      platform: linux/arm64
      target: aarch64-unknown-linux-gnu
      rustflags-env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS
      rustflags: '-C target-feature=+neon,+crc,+lse,+aes,+sha2,+dotprod'
      cross: true
      manifest-artifact-id: ${{ needs.packages.outputs.manifest-id }}

  publish:
    needs: [validate, preflight, packages, native-linux-amd64, native-linux-arm64, native-macos-amd64, native-macos-arm64, native-windows, docker-linux-amd64, docker-linux-arm64]
    environment: golem-release
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: blacksmith
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
      - name: Validate the source and collect every exact producer artifact
        shell: bash
        env:
          RELEASE_INPUTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export BUILTIN_VERSION="${GITHUB_REF_NAME#v}"
          cargo make --profile ci validate-golem-release-source
          python3 scripts/golem-release.py collect --directory target/release-publication
      - name: Mint the protected publication token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: golemcloud
          repositories: |
            golem
            golem-builtins
          permission-contents: write
      - name: Publish missing assets and verify the complete draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: BUILTIN_VERSION="${GITHUB_REF_NAME#v}" python3 scripts/golem-release.py publish --directory target/release-publication
      - uses: actions/upload-artifact@v6
        with:
          name: release-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-publication/release-ready.json
          if-no-files-found: error
          retention-days: 30
      - name: Report the draft for human review
        shell: bash
        run: |
          printf 'Prepared [%s](https://github.com/golemcloud/golem/releases/tag/%s) with all ten native binaries. Review readiness and publish the draft to promote the saved Docker payloads.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
