name: Prepare Golem release

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: prepare-golem-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: blacksmith
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
      - name: Validate the public release tag and source
        shell: bash
        run: BUILTIN_VERSION="${GITHUB_REF_NAME#v}" cargo make --profile ci validate-golem-release-source

  preflight:
    needs: validate
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  publish-builtins:
    needs: [validate, preflight]
    environment: golem-release
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 20
      WASI_SDK_PATH: /opt/wasi-sdk
      WASM_RQUICKJS_VERSION: '61928b2bbf79450adc2c9668c43eba6277f33320'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          rust-targets: wasm32-wasip2
          install-cargo-binstall: 'true'
          cache-shared-key: builtin-artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24'
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
      - name: Install wasm-tools
        run: cargo binstall --force --locked wasm-tools@1.248.0
      - name: Validate and warm the component builds before minting a write token
        shell: bash
        run: |
          BUILTIN_VERSION="${GITHUB_REF_NAME#v}" cargo make --profile ci validate-golem-release-source
          cargo make --profile ci ensure-builtin-artifacts
      - name: Mint the protected publication token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: golemcloud
          repositories: |
            golem
            golem-builtins
          permission-contents: write
      - name: Create or resume the draft
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo golemcloud/golem; then
            prerelease=false
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease=true
            fi
            # Release PR heads are squash-merged, so earlier release tags need not be ancestors.
            previous_tag=$(
              gh api --paginate repos/golemcloud/golem/releases |
                jq -rs --arg current "${GITHUB_REF_NAME#v}" '
                  ($current | split("-")[0] | split(".") | map(tonumber)) as $current |
                  [ .[][] |
                    select(.draft == false and .prerelease == false) |
                    .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) |
                    {tag: ., version: (ltrimstr("v") | split(".") | map(tonumber))} |
                    select(.version < $current)
                  ] | max_by(.version) | .tag // empty
                '
            )
            notes_file=$(mktemp)
            trap 'rm -f "$notes_file"' EXIT
            node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" "$previous_tag" > "$notes_file"
            gh release create "$GITHUB_REF_NAME" --repo golemcloud/golem \
              --verify-tag --draft --latest=false --prerelease="$prerelease" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
      - name: Publish built-ins and attach the verified manifest
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: BUILTIN_VERSION="${GITHUB_REF_NAME#v}" cargo make --profile ci publish-builtin-artifacts

  publish-binaries:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'golemcloud/golem'
    needs: publish-builtins
    strategy:
      fail-fast: false
      matrix:
        project:
          - golem-cli
          - golem
        cfg:
          - rust-target: x86_64-unknown-linux-gnu
            os: blacksmith-32vcpu-ubuntu-2204
          - rust-target: aarch64-unknown-linux-gnu
            os: blacksmith-32vcpu-ubuntu-2204
            cross: true
          - rust-target: x86_64-apple-darwin
            os: blacksmith-12vcpu-macos-26
          - rust-target: aarch64-apple-darwin
            os: blacksmith-12vcpu-macos-26
          - rust-target: x86_64-pc-windows-msvc
            os: blacksmith-32vcpu-windows-2025
            cargo-build-jobs: 20
    name: Publish binaries of ${{ matrix.project }}
    runs-on: ${{ matrix.cfg.os }}
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cfg.cargo-build-jobs || 10 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-builtin-release
      - uses: ./.github/actions/setup-rust
        with:
          fetch-tag: 'true'
          rust-targets: ${{ matrix.cfg.rust-target }}
          cache-shared-key: 'release-${{ matrix.cfg.rust-target }}'
          cache-save-if: 'true'
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Set version for all packages
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
        run: cargo make --profile ci set-version

      - run: cargo install cross
        if: ${{ matrix.cfg.cross }}
      - uses: ilammy/setup-nasm@v1

      - run: cargo build -p ${{ matrix.project }} --release --target ${{ matrix.cfg.rust-target }}
        if: ${{ ! matrix.cfg.cross }}
      - run: cross build -p ${{ matrix.project }} --release --target ${{ matrix.cfg.rust-target }}
        if: ${{ matrix.cfg.cross }}

      - run: mv ./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}.exe ./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}.exe
        if: runner.os == 'Windows'
      - run: mv ./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }} ./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}
        if: runner.os != 'Windows'

      - name: Import Code Signing Certificate
        if: contains(matrix.cfg.rust-target, 'apple-darwin')
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create and unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate - use -T to allow codesign access
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Add keychain to search list (prepend to existing list)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          # Set partition list to allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate was imported
          echo "Imported certificates:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Save keychain path for cleanup
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Create entitlements
        if: contains(matrix.cfg.rust-target, 'apple-darwin')
        run: |
          ENTITLEMENTS_PATH=$RUNNER_TEMP/entitlements.plist

          cat > $ENTITLEMENTS_PATH << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN">
          <plist version="1.0">
            <dict>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
            </dict>
          </plist>
          EOF

          echo "ENTITLEMENTS_PATH=$ENTITLEMENTS_PATH" >> $GITHUB_ENV

      - name: Code Sign Binary
        if: contains(matrix.cfg.rust-target, 'apple-darwin')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BINARY_PATH=./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}

          # Sign with hardened runtime
          codesign --force \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$BINARY_PATH"

          # Verify signature
          codesign --verify --verbose "$BINARY_PATH"
          codesign --display --verbose=4 --entitlements - "$BINARY_PATH"

      - name: Create Notarization Archive
        if: contains(matrix.cfg.rust-target, 'apple-darwin')
        run: |
          BINARY_PATH=./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}
          ZIP_PATH=./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}.zip

          # Create zip for notarization
          zip -j "$ZIP_PATH" "$BINARY_PATH"

      - name: Submit for Notarization
        if: contains(matrix.cfg.rust-target, 'apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ZIP_PATH=./target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}.zip
          RESULT_PATH=$RUNNER_TEMP/notarization.plist
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m \
            --output-format plist > "$RESULT_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :status' "$RESULT_PATH")" = Accepted

      - name: Cleanup Keychain
        if: contains(matrix.cfg.rust-target, 'apple-darwin') && always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Require the draft before uploading binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh release view "$GITHUB_REF_NAME" --repo golemcloud/golem --json isDraft --jq .isDraft)" = true
      - run: gh release upload -R golemcloud/golem --clobber ${{ github.ref_name }} target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}.exe
        if: runner.os == 'Windows'
      - run: gh release upload -R golemcloud/golem --clobber ${{ github.ref_name }} target/${{ matrix.cfg.rust-target }}/release/${{ matrix.project }}-${{ matrix.cfg.rust-target }}
        if: runner.os != 'Windows'

  report-draft:
    needs: publish-binaries
    runs-on: blacksmith
    steps:
      - name: Report the draft for human review
        shell: bash
        run: |
          printf 'Prepared [%s](https://github.com/golemcloud/golem/releases/tag/%s) with all ten native binaries. Review the successful preparation and draft, then publish it to start the existing Docker release.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
