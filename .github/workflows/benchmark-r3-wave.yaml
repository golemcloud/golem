name: Bounded R3 Wave
on:
  workflow_call:
    inputs:
      wave:
        required: true
        type: number
      deadline:
        required: true
        type: string
      isolated:
        required: true
        type: boolean
permissions:
  contents: read
  actions: write
jobs:
  measure:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 107
    strategy:
      fail-fast: true
      matrix:
        partition: [startup, durability-echo, bulk, streaming]
    env:
      DEADLINE: ${{ inputs.deadline }}
      ISOLATED: ${{ inputs.isolated }}
      WAVE: ${{ inputs.wave }}
      CUTOFF_OFFSET: '6420'
      HOST: ${{ matrix.partition }}
      RESULT: r3-results
      EVIDENCE_LIMIT: '524288000'
    steps:
      - &deadline_guard
        name: Bind the fixed wave clock and start an owned cancellation guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ISOLATED" == true && "$GITHUB_RUN_ATTEMPT" == 1 && "$DEADLINE" =~ ^[0-9]+$ && "$WAVE" =~ ^[1-5]$ ]]
          timeout 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/campaign-origin.json"
          jq -e --arg id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '(.id | tostring) == $id and .head_sha == $sha and .run_attempt == 1 and
             .path == ".github/workflows/benchmark.yaml" and .repository.full_name == $repo' \
            "$RUNNER_TEMP/campaign-origin.json"
          created=$(date -d "$(jq -r .created_at "$RUNNER_TEMP/campaign-origin.json")" +%s)
          now=$(date +%s)
          (( DEADLINE > now + 120 && DEADLINE <= created + 36000 ))
          wave_start=$((created + 1200 + (WAVE - 1) * 6600))
          cutoff=$((wave_start + CUTOFF_OFFSET))
          (( cutoff <= DEADLINE )) || cutoff=$DEADLINE
          (( cutoff > now + 120 ))
          export CUTOFF=$cutoff
          cat > "$RUNNER_TEMP/r3-deadline.py" <<'PY'
          import json, os, time, urllib.request
          cutoff = int(os.environ['CUTOFF'])
          run = os.environ['GITHUB_RUN_ID']
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with open(os.environ['RUNNER_TEMP'] + '/guard-receipt.json', 'w') as out:
              json.dump({'run_id': run, 'pid': os.getpid(), 'cutoff': cutoff,
                         'cancel_at': cutoff - 120, 'force_at': cutoff - 60}, out)
          def cancel(suffix):
              try:
                  request = urllib.request.Request(api + suffix, headers=headers, method='POST')
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(suffix, response.status, time.time(), flush=True)
              except Exception as error:
                  print(suffix, type(error).__name__, time.time(), flush=True)
          time.sleep(max(0, cutoff - 120 - time.time()))
          cancel('/cancel')
          time.sleep(max(0, cutoff - 60 - time.time()))
          cancel('/force-cancel')
          PY
          RUNNER_TRACKING_ID='' python3 "$RUNNER_TEMP/r3-deadline.py" > "$RUNNER_TEMP/guard.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/guard.pid"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: eb46c797c329e1787fb9260cc57b132e0830489d
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: r3-input-attempt1
          path: ${{ runner.temp }}/prepared
      - uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: '8.0.2'
          auto-start: false
      - name: Run the three raw phases for exactly one partition on this host
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          python3 integration-tests/benchmark_suites/r3_campaign.py run \
            --prepared "$RUNNER_TEMP/prepared" --root "$GITHUB_WORKSPACE/runtime" \
            --output "$RUNNER_TEMP/r3-results" --wave "$WAVE" --partition "$PARTITION"
      - &evidence_check
        name: Check complete evidence size without truncating raw records
        id: evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          jq -n --arg status "$JOB_STATUS" --arg run "$GITHUB_RUN_ID" --arg host "$HOST" --arg wave "$WAVE" \
            '{status: $status, campaign_run_id: $run, host: $host, wave: $wave}' > "$RUNNER_TEMP/workflow-status.json"
          bytes=0
          if [[ -d "$RUNNER_TEMP/$RESULT" ]]; then
            bytes=$(du -sb "$RUNNER_TEMP/$RESULT" | cut -f1)
          fi
          printf '%s\n' "$bytes" > "$RUNNER_TEMP/evidence-bytes.txt"
          (( bytes <= EVIDENCE_LIMIT ))
      - name: Retain complete raw evidence including ordinary failure prefixes
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: r3-wave${{ inputs.wave }}-${{ matrix.partition }}-attempt1
          path: ${{ runner.temp }}/r3-results
          if-no-files-found: error
          retention-days: 7
      - &receipts_upload
        name: Always retain small status, size and guard receipts separately
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r3-receipts-wave${{ inputs.wave }}-${{ env.HOST }}-attempt${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.RESULT }}/status.json
            ${{ runner.temp }}/campaign-origin.json
            ${{ runner.temp }}/guard-receipt.json
            ${{ runner.temp }}/guard.log
            ${{ runner.temp }}/evidence-bytes.txt
            ${{ runner.temp }}/workflow-status.json
            ${{ runner.temp }}/jobs.json
            ${{ runner.temp }}/artifacts.json
          if-no-files-found: warn
          retention-days: 7
      - &stop_guard
        name: Stop only the successful job's owned guard after all uploads
        if: success()
        run: |
          if [[ -f "$RUNNER_TEMP/guard.pid" ]]; then
            pid=$(cat "$RUNNER_TEMP/guard.pid")
            if [[ -r "/proc/$pid/cmdline" ]] && tr '\0' '\n' < "/proc/$pid/cmdline" | grep -Fxq "$RUNNER_TEMP/r3-deadline.py"; then
              kill "$pid"
            fi
          fi
      - name: Keep the next gate's release wait inside its five-minute job budget
        if: success()
        run: |
          python3 - <<'PY'
          import json, os, time
          with open(os.environ['RUNNER_TEMP'] + '/prepared/campaign.json') as source:
              campaign = json.load(source)
          gate_start = int(campaign['created_epoch']) + 1200 + (int(os.environ['WAVE']) - 1) * 6600 + 6300
          time.sleep(max(0, gate_start - time.time()))
          PY

  gate:
    needs: measure
    if: always() && !cancelled()
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 5
    env:
      DEADLINE: ${{ inputs.deadline }}
      ISOLATED: ${{ inputs.isolated }}
      WAVE: ${{ inputs.wave }}
      CUTOFF_OFFSET: '6600'
      HOST: gate
      RESULT: r3-gate
      EVIDENCE_LIMIT: '1073741824'
    steps:
      - *deadline_guard
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: r3-input-attempt1
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v8
        with:
          pattern: r3-wave${{ inputs.wave }}-*-attempt1
          path: ${{ runner.temp }}/evidence
      - name: Retain paginated current-run jobs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 60s gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" \
            | jq '{jobs: [.[].jobs[]]}' > "$RUNNER_TEMP/jobs.json"
          timeout 60s gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            | jq '{artifacts: [.[].artifacts[]]}' > "$RUNNER_TEMP/artifacts.json"
      - name: Validate all four outputs, control agreement and the remaining allocation
        run: |
          python3 integration-tests/benchmark_suites/r3_campaign.py gate \
            --prepared "$RUNNER_TEMP/prepared" --evidence "$RUNNER_TEMP/evidence" \
            --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts.json" \
            --wave "$WAVE" --output "$RUNNER_TEMP/r3-gate"
      - name: Require every measurement job to have succeeded
        env:
          MEASUREMENT_RESULT: ${{ needs.measure.result }}
        run: test "$MEASUREMENT_RESULT" = success
      - *evidence_check
      - name: Retain complete gate evidence including failure prefixes
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: r3-gate${{ inputs.wave }}-attempt1
          path: ${{ runner.temp }}/r3-gate
          if-no-files-found: warn
          retention-days: 7
      - *receipts_upload
      - *stop_guard
      - name: Release the next fixed wave only at its original start
        if: success() && inputs.wave < 5
        run: |
          python3 - <<'PY'
          import json, os, time
          with open(os.environ['RUNNER_TEMP'] + '/prepared/campaign.json') as source:
              campaign = json.load(source)
          release = int(campaign['created_epoch']) + 1200 + int(os.environ['WAVE']) * 6600
          if time.time() > release + 5:
              raise SystemExit('Gate missed the fixed next-wave release by more than five seconds')
          time.sleep(max(0, release - time.time()))
          if time.time() > release + 5:
              raise SystemExit('Gate woke after the fixed next-wave release tolerance')
          PY
