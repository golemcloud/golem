name: Publish Golem Effect SDK

on:
  push:
    tags:
      - "golem-effect-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  WASM_RQUICKJS_VERSION: "0.4.3"
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk
  NPM_CONFIG_AUDIT: "false"

jobs:
  publish:
    runs-on: ubuntu-latest # npm trusted publishing provenance requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          use-cache: "false"
          rust-targets: wasm32-wasip2
          install-cargo-make: "false"
          install-cargo-binstall: "true"

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          registry-url: https://registry.npmjs.org
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Set package version from tag
        working-directory: sdks/effect
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${RELEASE_TAG#golem-effect-v}"
            if [ "golem-effect-v${VERSION}" != "${RELEASE_TAG}" ]; then
              echo "Invalid Effect SDK release tag: ${RELEASE_TAG}" >&2
              exit 1
            fi
          else
            VERSION="${DRY_RUN_VERSION}"
          fi
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Clean install
        working-directory: sdks/effect
        run: npm ci

      - name: Run quality gates
        working-directory: sdks/effect
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
          npm run build:bundle
          npm run build-agent-template
          npm run check:dts
          npm run check:contracts
          npm run check:artifacts
          npm run check:package

      - name: Publish with provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/golem-effect-v')
        working-directory: sdks/effect
        run: npm publish --access public --provenance
