name: CI
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      # Long-lived maintenance branches for shipped major.minor lines,
      # e.g. `1.5.x`. The wildcard means a new `1.6.x` branch starts running
      # CI on push automatically when it is created.
      - "[0-9]+.[0-9]+.x"
    # Skip the heavy Rust/Docker/etc. CI when only docs/ changes were pushed.
    # Documentation has its own workflow in .github/workflows/docs.yaml.
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

env:
  BUILD_TARGET: "x86_64-unknown-linux-gnu"
  WASM_RQUICKJS_VERSION: "031f8bbf6546a590280c010152e5e56040c76682"
  MOONBIT_INSTALL_VERSION: "0.10.11+6ff76a5f9"
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk
  NPM_CONFIG_AUDIT: 'false'

jobs:
  build-and-store:
    outputs:
      native-binaries-disk-key: ${{ steps.native-binaries-key.outputs.key }}
    env:
      CARGO_BUILD_JOBS: 20
    runs-on: blacksmith-32vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: 'true'
      # Test the build tooling (dev-tools/) first so a broken tool fails fast
      - name: Test build tools (dev-tools)
        run: cargo make --profile ci dev-tools-tests
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Building all executables
        env:
          QUIET: true
        run: cargo make --profile ci build-all-bins-including-tests
        timeout-minutes: 30
      - name: Identify native binary disk
        id: native-binaries-key
        run: echo "key=${GITHUB_REPOSITORY}-native-binaries-${GITHUB_RUN_ID}-producer-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # Preserve snapshots for partial consumer reruns; inactive disks expire after seven days.
      - name: Mount native binary producer disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ steps.native-binaries-key.outputs.key }}
          path: tmp/native-binaries
          commit: 'true'
      - name: Validate native binary producer mount
        run: |
          mountpoint -q tmp/native-binaries || { echo 'Native binary sticky disk is not mounted' >&2; exit 1; }
          rm -f tmp/native-binaries/PUBLICATION
      - name: Packaging all binaries with cargo-nextest
        run: |
          cargo nextest -v archive --archive-file tmp/native-binaries/golem-binaries.tar.zst --zstd-level 1 --cargo-profile dev-ci
        timeout-minutes: 5

      - name: Publish packaged binaries
        env:
          DISK_KEY: ${{ steps.native-binaries-key.outputs.key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mountpoint -q tmp/native-binaries || { echo 'Native binary sticky disk is not mounted' >&2; exit 1; }
          cd tmp/native-binaries
          test -s golem-binaries.tar.zst
          sha256sum golem-binaries.tar.zst > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          stat -c 'Native archive bytes=%s' golem-binaries.tar.zst
          printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" > PUBLICATION

  check-clippy-and-format:
    env:
      CARGO_BUILD_JOBS: 10
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust

      - name: Check formatting and clippy rules
        run: cargo make --profile ci check

  unit-tests-and-checks:
    env:
      CARGO_BUILD_JOBS: 10
    runs-on: blacksmith-8vcpu-ubuntu-2204
    needs: build-and-store
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-binstall: 'true'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup SBT
        uses: sbt/setup-sbt@v1
      - name: Setup Node.js (for the tool-process adapter tests)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'
      # Bun is needed by check-openapi (which depends on check-docs-openapi)
      # and by check-docs-skills to regenerate docs from the in-tree
      # sources and detect drift.
      - name: Setup Bun (for docs drift checks)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache Bun install (docs/)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Test release tooling
        run: cargo make --profile ci check-shared-crates-versioning
      # Share cargo-make's full workspace metadata discovery across all checks.
      - name: Unit tests and source drift checks
        run: cargo make --profile ci --time-summary --skip-tasks test-component-middleware-unit-tests unit-tests-and-checks
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          artifact-name: unit-tests-report
          github-token: ${{ secrets.GITHUB_TOKEN }}

  config-checks:
    env:
      CARGO_BUILD_JOBS: 10
    runs-on: blacksmith-8vcpu-ubuntu-2204
    needs: build-and-store
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-binstall: 'true'
      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'
      - name: Check configs are up to date
        run: cargo make --profile ci check-configs

  middleware-unit-tests:
    env:
      CARGO_BUILD_JOBS: 10
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/middleware-unit-target
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
      - name: Test middleware components
        run: cargo make --profile ci test-component-middleware-unit-tests

  builtin-artifacts:
    outputs:
      artifacts-disk-key: ${{ steps.publication-key.outputs.key }}
    runs-on: blacksmith-32vcpu-ubuntu-2204
    env:
      CARGO_BUILD_JOBS: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          rust-targets: 'wasm32-wasip2'
          cache-shared-key: 'builtin-artifacts'
          cache-save-if: 'true'
          install-cargo-binstall: 'true'
      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          node-version: '24'
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
      - name: Install wasm-tools
        run: cargo binstall --force --locked wasm-tools@1.248.0
      - name: Sync WIT dependencies
        run: cargo make wit
      - name: Compute built-in artifact cache key
        id: cache-key
        env:
          SOURCE_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'Makefile.toml', 'builtin-artifacts.json', 'builtin-tools/**', 'plugins/**', 'wit/**', 'sdks/rust/**', 'sdks/ts/**', 'cli/golem-cli/**', 'golem-common/**', 'golem-api-grpc/**', 'golem-client/**', 'golem-schema/**', 'golem-schema-derive/**', 'golem-tool-metadata/**', 'golem-rust-macro/**', 'golem-mcp-import/**', 'golem-openapi-client-generator/**', 'golem-skills/skills/**', '.github/actions/setup-*/**', '.github/workflows/ci.yaml') }}
        run: |
          tools=$({ rustc -vV; node --version; wasm-rquickjs --version; wasm-tools --version; } | sha256sum | cut -d' ' -f1)
          echo "value=golem-builtin-artifacts-v3-${SOURCE_HASH}-${tools}" >> "$GITHUB_OUTPUT"
      - name: Restore or prepare built-in artifact cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            builtin-tools/*.wasm
            plugins/*.wasm
          key: ${{ steps.cache-key.outputs.value }}
      - name: Build current built-in artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo make --profile ci ensure-builtin-artifacts
      - name: Validate built-in artifacts
        run: |
          while IFS= read -r path; do
            test -s "$path"
            wasm-tools validate --features all "$path"
          done < <(jq -r '.[].path' builtin-artifacts.json)
      - name: Test embedded local-install defaults and source overrides
        run: cargo test --profile dev-ci -p golem-registry-service --lib --features embed-builtin-artifacts -- builtin_artifact --report-time
      - name: Identify built-in publication
        id: publication-key
        run: echo "key=${GITHUB_REPOSITORY}-builtin-artifacts-${GITHUB_RUN_ID}-producer-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Mount built-in producer disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ steps.publication-key.outputs.key }}
          path: tmp/builtin-publication
          commit: 'true'
      - name: Publish built-in artifacts
        env:
          DISK_KEY: ${{ steps.publication-key.outputs.key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mountpoint -q tmp/builtin-publication || { echo 'Built-in producer disk is not mounted' >&2; exit 1; }
          rm -f tmp/builtin-publication/PUBLICATION
          jq -r '.[].path' builtin-artifacts.json > tmp/builtin-artifact-paths
          time tar --zstd -cf tmp/builtin-publication/builtin-artifacts.tar.zst -T tmp/builtin-artifact-paths
          cd tmp/builtin-publication
          sha256sum builtin-artifacts.tar.zst > SHA256SUMS
          time sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          stat -c 'Built-in archive bytes=%s' builtin-artifacts.tar.zst
          printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" > PUBLICATION

  worker-tests:
    env:
      CARGO_BUILD_JOBS: 10
    runs-on: blacksmith-8vcpu-ubuntu-2204
    needs:
      - build-and-store
      - builtin-artifacts
      - merge-test-components
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: misc
          - name: group1
          - name: group2
          - name: group3
          - name: group4
          - name: group5
          - name: tool-streaming
    name: worker-tests-${{ matrix.group.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-binstall: 'true'
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false
      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
      - uses: ./.github/actions/restore-test-components
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.merge-test-components.outputs.components-disk-key }}
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}

      - name: Worker Executor integration tests
        run: cargo make --profile ci worker-executor-tests-${{ matrix.group.name }}
        timeout-minutes: 20
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          artifact-name: worker-executor-tests-${{ matrix.group.name }}-report
          github-token: ${{ secrets.GITHUB_TOKEN }}

  managed-xfs-tests:
    name: managed-xfs-tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs:
      - build-and-store
      - builtin-artifacts
      - merge-test-components
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-binstall: 'true'
      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
      - uses: ./.github/actions/restore-test-components
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.merge-test-components.outputs.components-disk-key }}
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}
      - name: Set up Lima
        id: lima
        env:
          GH_TOKEN: ${{ github.token }}
          LIMA_VERSION: v2.2.0
        run: |
          sudo sed -i -E 's#http://(([a-z]{2}\.)?archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu#https://\1/ubuntu#g' \
            /etc/apt/sources.list.d/ubuntu.sources \
            /etc/apt/blacksmith-ubuntu-mirrors.txt
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends ovmf qemu-system-x86 qemu-utils
          test -c /dev/kvm
          sudo chown "$(whoami)" /dev/kvm
          archive="lima-${LIMA_VERSION#v}-Linux-x86_64.tar.gz"
          curl -fOSL "https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}/${archive}"
          gh attestation verify --owner lima-vm "${archive}"
          sudo tar -C /usr/local -xzf "${archive}"
          rm "${archive}"
          echo "version=${LIMA_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Cache Lima images
        uses: actions/cache@v5
        with:
          path: ~/.cache/lima
          key: lima-${{ runner.os }}-${{ steps.lima.outputs.version }}
      - name: Run managed XFS suite
        env:
          GOLEM_MANAGED_XFS_REUSE_TEST_BINARIES: 1
          GOLEM_MANAGED_XFS_TARGET_DIR: ${{ github.workspace }}/target
          GOLEM_MANAGED_XFS_CARGO_TEST_R: ${{ github.workspace }}/target/cargo-test-r
        run: |
          integration-tests/scripts/managed-filesystem/run-loopback-xfs.sh --self-test-initial-file-wasm
          cp "$(command -v cargo-test-r)" "${GOLEM_MANAGED_XFS_CARGO_TEST_R}"
          integration-tests/scripts/managed-filesystem/run-lima.sh

  build-apfs-test-bin:
    name: build-apfs-test-bin
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: 'apfs-dev-ci'
          cache-save-if: 'true'
          install-cargo-make: 'false'
      # A separate successful build saves the dependency cache even if a native test fails.
      - name: Build the native APFS test binary
        run: |
          mkdir -p tmp/apfs-test-bin
          cargo test --locked -j 4 --profile dev-ci -p golem-worker-executor \
            --features test-utils --lib --no-run --message-format=json \
            > tmp/apfs-cargo-messages.jsonl
          integration-tests/scripts/managed-filesystem/test-select-cargo-test-executables.py
          python3 integration-tests/scripts/managed-filesystem/select-cargo-test-executables.py \
            tmp/apfs-cargo-messages.jsonl "$PWD" lib > tmp/apfs-test-executable.tsv
          IFS=$'\t' read -r target executable < tmp/apfs-test-executable.tsv
          test "$target" = lib
          cp "$executable" tmp/apfs-test-bin/golem-worker-executor-apfs-tests
          tar -czf tmp/apfs-test-bin.tar.gz -C tmp/apfs-test-bin golem-worker-executor-apfs-tests
      - uses: actions/upload-artifact@v6
        with:
          name: apfs-test-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/apfs-test-bin.tar.gz
          if-no-files-found: error
          retention-days: 1

  apfs-tests:
    name: apfs-tests
    runs-on: blacksmith-6vcpu-macos-latest
    needs: build-apfs-test-bin
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: apfs-test-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/apfs-test-bin
      - name: Run native APFS tests
        run: |
          tar -xzf tmp/apfs-test-bin/apfs-test-bin.tar.gz -C tmp/apfs-test-bin
          bash integration-tests/scripts/apfs/run-native-tests.sh \
            tmp/apfs-test-bin/golem-worker-executor-apfs-tests \
            :tag:native_apfs --include-ignored --test-threads 1 --report-time

  build-cli-test-bins:
    outputs:
      cli-binary-disk-key: ${{ steps.cli-binary-key.outputs.key }}
    env:
      CARGO_BUILD_JOBS: 20
      GOLEM_CLI_TEST_BIN_PROFILE: dev-release-ci
    runs-on: blacksmith-32vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: 'cli-dev-release-ci'
          cache-save-if: 'true'
      - name: Build CLI test binaries
        env:
          QUIET: true
        run: cargo make --profile ci build-cli-test-bins
        timeout-minutes: 20
      - name: Identify CLI binary disk
        id: cli-binary-key
        run: echo "key=${GITHUB_REPOSITORY}-cli-binary-${GITHUB_RUN_ID}-producer-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # Keep the producer snapshot for consumer-only reruns, as for native binaries.
      - name: Mount CLI binary producer disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ steps.cli-binary-key.outputs.key }}
          path: tmp/cli-binary-publication
          commit: 'true'
      - name: Publish CLI executable
        env:
          DISK_KEY: ${{ steps.cli-binary-key.outputs.key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mountpoint -q tmp/cli-binary-publication || { echo 'CLI binary sticky disk is not mounted' >&2; exit 1; }
          cd tmp/cli-binary-publication
          rm -f PUBLICATION
          time tar --zstd -cf golem-cli-test-binaries.tar.zst -C ../../target/dev-release-ci golem golem-cli
          test -s golem-cli-test-binaries.tar.zst
          sha256sum golem-cli-test-binaries.tar.zst > SHA256SUMS
          time sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          stat -c 'CLI archive bytes=%s' golem-cli-test-binaries.tar.zst
          printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" > PUBLICATION

  it:
    env:
      CARGO_BUILD_JOBS: 10
    runs-on: ${{ matrix.group.runner || 'blacksmith-8vcpu-ubuntu-2204' }}
    needs:
      - build-and-store
      - build-golem-ts
      - builtin-artifacts
      - merge-test-components
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: integration-tests-group1
            description: "IT #1"
          - name: integration-tests-group2
            description: "IT #2"
          - name: integration-tests-group3
            description: "IT #3"
          - name: integration-tests-group4
            description: "IT #4"
          - name: integration-tests-group5
            description: "IT #5"
          - name: integration-tests-group6-coordinated
            description: "IT #6a"
          - name: integration-tests-group6-rest
            description: "IT #6b"
          - name: integration-tests-group7
            description: "IT #7"
          - name: integration-tests-group8
            description: "IT #8"
          - name: integration-tests-group9
            description: "IT #9"
          - name: integration-tests-group10
            description: "IT #10"
          - name: integration-tests-group11
            description: "IT #11"
          - name: integration-tests-group12
            description: "IT #12"
          - name: integration-tests-group13
            description: "IT #13"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        if: ${{ matrix.group.name == 'integration-tests-group10' || matrix.group.name == 'integration-tests-group11' }}
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-binstall: 'true'
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'
      - uses: ./.github/actions/restore-test-components
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.merge-test-components.outputs.components-disk-key }}
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}

      - name: ${{ matrix.group.description }}
        env:
          QUIET: true
        run: cargo make --profile ci ${{ matrix.group.name }}
        timeout-minutes: 45
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          artifact-name: '${{ matrix.group.name }}-report'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  it-cli:
    name: it-cli (${{ matrix.group.shard }})
    env: &cli-test-env
      CARGO_BUILD_JOBS: 10
      GOLEM_CLI_TEST_BIN_PROFILE: dev-release-ci
    runs-on: blacksmith-32vcpu-ubuntu-2204
    needs:
      - build-and-store
      - build-golem-effect
      - build-golem-ts
      - build-cli-test-bins
      - build-golem-scala
      - builtin-artifacts
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: cli-integration-tests-agents-guest-bridge, shard: agents_guest_bridge }
          - { name: cli-integration-tests-agents-guest-bridge-sources, shard: agents_guest_bridge_sources }
          - { name: cli-integration-tests-bridge, shard: bridge_gen }
          - { name: cli-integration-tests-bridge-rust, shard: bridge_gen_rust }
          - { name: cli-integration-tests-deploy, shard: deploy }
          - { name: cli-integration-tests-deploy-runtime, shard: deploy_runtime }
          - { name: cli-integration-tests-core, shard: core }
    steps: &cli-test-steps
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-binstall: 'true'
      - name: Install browser WASM target
        if: matrix.group.shard == 'bridge_gen_rust'
        run: rustup target add wasm32-unknown-unknown
      - name: Install native Git build dependencies
        if: matrix.group.shard == 'core'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev
      - name: Setup Redis
        uses: shogo82148/actions-setup-redis@v1.49.0
        with:
          redis-version: latest
          auto-start: false

      - name: Install wasm-tools
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming'
        run: cargo binstall --force --locked wasm-tools@1.248.0
      - name: Install wit-bindgen
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming'
        run: cargo binstall --force --locked wit-bindgen-cli@0.40.0

      - name: Setup Node
        if: matrix.group.shard != 'bridge_gen_rust'
        uses: ./.github/actions/setup-js-wasm-tools
        with:
          install-wasi-sdk: ${{ matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'core' && matrix.group.shard != 'agents_guest_bridge' }}
          install-wasm-rquickjs: ${{ matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'core' && matrix.group.shard != 'agents_guest_bridge' }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}

      # These shards do not compile Scala; core only generates its source.
      - name: Setup Java
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_guest_bridge'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup SBT
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_guest_bridge'
        uses: sbt/setup-sbt@v1

      # Warm the coursier cache for the bridge shard's Scala deps.
      - name: Cache scala dependencies
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_guest_bridge'
        uses: coursier/cache-action@v8

      - name: Setup MoonBit
        if: matrix.group.shard != 'bridge_gen_rust'
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_INSTALL_VERSION }}
          core-version: ${{ env.MOONBIT_INSTALL_VERSION }}

      - name: Install MoonBit SDK tools dependencies
        if: matrix.group.shard != 'bridge_gen_rust'
        working-directory: sdks/moonbit/golem_sdk_tools
        run: moon update

      # Neither core nor bridge_gen_rust invokes a Go compiler.
      - name: Setup Go
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'core'
        uses: actions/setup-go@v5
        with:
          # Host Go for `go test`/tooling. Components are built with the Go
          # toolchain the CLI installs (cached below), not with this one.
          go-version-file: sdks/go/golem/go.mod
          cache-dependency-path: |
            sdks/go/*/go.sum
            test-components/**/go.sum

      - name: Cache componentize-go toolchain
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'core'
        uses: actions/cache@v5
        with:
          # On first `golem build` of a Go component the CLI installs Golem's Go
          # toolchain into this dir — hundreds of MB — and componentize-go caches
          # its own binary next to it. Keyed on the pinned toolchain release
          # (versions.rs) and the pinned componentize-go version (go.sum).
          path: ~/.cache/componentize-go
          key: componentize-go-${{ runner.os }}-${{ hashFiles('cli/golem-cli/src/versions.rs', 'sdks/go/golem/go.sum') }}
          restore-keys: |
            componentize-go-${{ runner.os }}-

      - name: Install Golem MoonBit wit-bindgen
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming'
        run: ./scripts/install-wit-bindgen.sh
        working-directory: sdks/moonbit/golem_sdk

      - name: Generate MoonBit WIT bindings
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming'
        run: ./scripts/regen-bindings.sh
        working-directory: sdks/moonbit/golem_sdk

      - name: Sync WIT dependencies
        run: cargo make wit

      - name: Restore Scala guest runtime WASMs (built by build-golem-scala)
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'agents_guest_bridge'
        uses: actions/download-artifact@v8
        with:
          name: agent-guest-wasm
          path: tmp/sdk-artifacts
      - name: Extract Scala guest runtime WASMs
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'agents_guest_bridge'
        run: tar -xzf tmp/sdk-artifacts/agent-guest-wasm.tar.gz

      - name: Restore Scala SDK ivy local repo (published by build-golem-scala)
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_guest_bridge'
        uses: ./.github/actions/restore-binary-publication
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.build-golem-scala.outputs.ivy-disk-key }}
          path: tmp/scala-ivy-publication
          file: scala-sdk-ivy-local.tar.gz
      - name: Extract Scala SDK ivy local repo
        if: matrix.group.shard != 'core' && matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_guest_bridge'
        run: |
          mkdir -p ~/.ivy2
          tar -xzf tmp/scala-ivy-publication/scala-sdk-ivy-local.tar.gz -C ~/.ivy2

      - name: Restore built TS SDK
        if: matrix.group.shard != 'bridge_gen_rust'
        uses: actions/download-artifact@v8
        with:
          name: golem-ts-sdk
          path: tmp/sdk-artifacts
      - name: Extract built TS SDK
        if: matrix.group.shard != 'bridge_gen_rust'
        run: tar -xzf tmp/sdk-artifacts/golem-ts-sdk.tar.gz

      - name: Install TS SDK dependencies
        if: matrix.group.shard != 'bridge_gen_rust'
        working-directory: sdks/ts
        run: pnpm install --frozen-lockfile

      - name: Restore built Effect SDK
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'core' && matrix.group.shard != 'agents_guest_bridge'
        uses: actions/download-artifact@v8
        with:
          name: golem-effect-sdk
          path: tmp/sdk-artifacts
      - name: Extract built Effect SDK
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'core' && matrix.group.shard != 'agents_guest_bridge'
        run: tar -xzf tmp/sdk-artifacts/golem-effect-sdk.tar.gz

      - name: Install Effect SDK dependencies
        if: matrix.group.shard != 'bridge_gen_rust' && matrix.group.shard != 'agents_streaming' && matrix.group.shard != 'core' && matrix.group.shard != 'agents_guest_bridge'
        working-directory: sdks/effect
        run: npm ci

      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'

      - name: Restore CLI test binaries
        uses: ./.github/actions/restore-cli-test-binary
        with:
          disk-key: ${{ needs.build-cli-test-bins.outputs.cli-binary-disk-key }}
          run-id: ${{ github.run_id }}
          destination: target/dev-release-ci

      - name: Restore streaming test components
        if: matrix.group.shard == 'agents_streaming' || matrix.group.shard == 'agents'
        uses: ./.github/actions/restore-test-components
        with:
          run-id: ${{ github.run_id }}
          # Other jobs sharing these steps do not depend on the fixture producer.
          disk-key: ${{ join(needs.*.outputs.components-disk-key, '') }}
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}

      - name: it-cli ${{ matrix.group.shard }}
        env:
          QUIET: true
          GOLEM_CLI_TEST_SERVER_LOG_DIR: ${{ github.workspace }}/tmp/golem-cli-test-server-logs
        run: cargo make --profile ci ${{ matrix.group.name }}
        timeout-minutes: 30
      - name: Upload golem server logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: '${{ matrix.group.name }}-server-logs-attempt${{ github.run_attempt }}'
          path: tmp/golem-cli-test-server-logs
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          artifact-name: '${{ matrix.group.name }}-report'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Both shards use the restored streaming fixture. The long drivers start without
  # competing with the shorter streaming cases, which share the agents runner.
  it-cli-agents:
    name: it-cli (${{ matrix.group.shard }})
    env: *cli-test-env
    runs-on: blacksmith-32vcpu-ubuntu-2204
    needs:
      - build-and-store
      - build-golem-effect
      - build-golem-ts
      - build-cli-test-bins
      - build-golem-scala
      - builtin-artifacts
      - merge-test-components
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: cli-integration-tests-agents, shard: agents }
    steps: *cli-test-steps

  it-cli-streaming:
    name: it-cli (${{ matrix.group.shard }})
    env: *cli-test-env
    runs-on: blacksmith-32vcpu-ubuntu-2204
    needs:
      - build-and-store
      - build-golem-effect
      - build-golem-ts
      - build-cli-test-bins
      - build-golem-scala
      - builtin-artifacts
      - merge-test-components
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: cli-integration-tests-agents-streaming, shard: agents_streaming }
    steps: *cli-test-steps

  consolidate-test-reports:
    name: consolidate-test-reports
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - unit-tests-and-checks
      - worker-tests
      - it
      - it-cli
      - it-cli-agents
      - it-cli-streaming
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download test reports for this attempt
        uses: actions/download-artifact@v8
        with:
          pattern: '*-report-attempt${{ github.run_attempt }}'
          path: tmp/test-reports
          merge-multiple: false
      - name: Preserve the source artifact name for a single report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f tmp/test-reports/ctrf-report.json ]]; then
            mapfile -t artifact_names < <(
              gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq ".artifacts[].name | select(endswith(\"-report-attempt${GITHUB_RUN_ATTEMPT}\"))"
            )
            if [[ "${#artifact_names[@]}" -ne 1 ]]; then
              echo "Expected one report artifact for attempt ${GITHUB_RUN_ATTEMPT}, found ${#artifact_names[@]}" >&2
              exit 1
            fi
            mkdir -p "tmp/test-reports/${artifact_names[0]}"
            mv tmp/test-reports/ctrf-report.json "tmp/test-reports/${artifact_names[0]}/"
          fi
      - name: Upload consolidated test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-reports-attempt${{ github.run_attempt }}
          path: tmp/test-reports
          if-no-files-found: error
          retention-days: 35

  scala-sdk-integration-tests:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    needs:
      - build-and-store
      - build-golem-ts
      - build-golem-scala
      - builtin-artifacts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip2'
          install-cargo-binstall: 'true'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Sync WIT dependencies
        run: cargo make wit

      - name: Restore Scala guest runtime WASMs
        uses: actions/download-artifact@v8
        with:
          name: agent-guest-wasm
          path: tmp/sdk-artifacts
      - name: Extract Scala guest runtime WASMs
        run: tar -xzf tmp/sdk-artifacts/agent-guest-wasm.tar.gz

      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}

      - name: Restore built TS SDK
        uses: actions/download-artifact@v8
        with:
          name: golem-ts-sdk
          path: tmp/sdk-artifacts
      - name: Extract built TS SDK
        run: tar -xzf tmp/sdk-artifacts/golem-ts-sdk.tar.gz

      - name: Install TS SDK dependencies
        working-directory: sdks/ts
        run: pnpm install --frozen-lockfile

      - name: Add golem to PATH
        run: echo "${{ github.workspace }}/target/debug" >> $GITHUB_PATH

      - name: Restore Scala SDK ivy local repo
        uses: ./.github/actions/restore-binary-publication
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.build-golem-scala.outputs.ivy-disk-key }}
          path: tmp/scala-ivy-publication
          file: scala-sdk-ivy-local.tar.gz
      - name: Extract Scala SDK ivy local repo
        run: |
          mkdir -p ~/.ivy2
          tar -xzf tmp/scala-ivy-publication/scala-sdk-ivy-local.tar.gz -C ~/.ivy2

      - name: Run Scala SDK integration tests
        working-directory: sdks/scala
        env:
          GOLEM_TS_PACKAGES_PATH: ${{ github.workspace }}/sdks/ts/packages
          RUST_BACKTRACE: 1
        run: sbt -batch "++3.8.2; integrationTests/test"
        timeout-minutes: 20

      - name: Upload Scala integration server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scala-sdk-integration-server-log
          path: sdks/scala/target/scala-integration/golem-server.log
          if-no-files-found: warn
          retention-days: 7

  golem-schema-guest:
    runs-on: blacksmith
    env:
      CARGO_BUILD_JOBS: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          rust-targets: 'wasm32-wasip2'
      - name: Prepare WIT dependencies
        run: cargo make wit
      - name: Build golem-schema in guest mode
        run: cargo build --target wasm32-wasip2 -p golem-schema --no-default-features --features guest
      - name: Test owned typed values in guest mode
        run: cargo test -p golem-schema --no-default-features --features guest --test owned_typed_wit -- --nocapture --report-time

  golem-client:
    runs-on: blacksmith
    env:
      CARGO_BUILD_JOBS: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          install-cargo-binstall: 'true'
      - name: Prepare WIT dependencies
        run: cargo make wit
      - name: Build golem-client (dependencies in features=client mode)
        run: cargo build -p golem-client

  build-golem-scala:
    outputs:
      ivy-disk-key: ${{ steps.ivy-publication-key.outputs.key }}
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache scala dependencies
        uses: coursier/cache-action@v8

      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip2'
          install-cargo-binstall: 'true'

      - uses: ./.github/actions/setup-wasm-component-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Sync WIT dependencies
        run: cargo make wit

      - name: Build Scala guest runtime WASMs
        working-directory: sdks/scala
        run: ./scripts/generate-agent-guest-wasm.sh

      - name: Verify Scala WIT d.ts files are committed
        uses: ./.github/actions/check-scala-sdk-generated

      - name: Run Golem tests (Scala 3.8.2)
        working-directory: sdks/scala
        run: sbt -mem 4096 "++3.8.2; modelJVM/test; modelJS/test; core/test; macros/test; codegen/test"

      - name: Check linked Scala capability fixtures
        run: cargo make check-sdk-scala-capability-fixtures

      - name: Compile sbt plugin
        working-directory: sdks/scala
        run: sbt "++2.12.21!; sbtPlugin/compile"

      # Published for the it-cli shards to restore. Must run after the guest role runtimes are built,
      # since the sbt plugin jar embeds them.
      - name: Publish Scala SDK locally
        working-directory: sdks/scala
        run: |
          sbt -batch '++3.8.2; set ThisBuild / version := "0.0.0-SNAPSHOT"; set ThisBuild / packageDoc / publishArtifact := false; set every (publish / skip) := false; modelJVM/publishLocal; modelJS/publishLocal; macros/publishLocal; core/publishLocal; codegen/publishLocal; ++2.12.21; codegen/publishLocal; sbtPlugin/publishLocal'

      - name: Package Scala guest runtime WASMs for it-cli
        run: |
          tar -czf "$RUNNER_TEMP/agent-guest-wasm.tar.gz" \
            sdks/scala/sbt/src/main/resources/golem/wasm/*.wasm \
            sdks/scala/mill/resources/golem/wasm/*.wasm \
            sdks/scala/wit/dts
      - name: Upload Scala guest runtime WASMs for it-cli
        uses: actions/upload-artifact@v6
        with:
          name: agent-guest-wasm
          path: ${{ runner.temp }}/agent-guest-wasm.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Identify Scala ivy publication
        id: ivy-publication-key
        run: echo "key=${GITHUB_REPOSITORY}-scala-ivy-${GITHUB_RUN_ID}-producer-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Mount Scala ivy producer disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ steps.ivy-publication-key.outputs.key }}
          path: tmp/scala-ivy-publication
          commit: 'true'
      - name: Publish Scala SDK ivy local repo
        env:
          DISK_KEY: ${{ steps.ivy-publication-key.outputs.key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mountpoint -q tmp/scala-ivy-publication || { echo 'Scala ivy producer disk is not mounted' >&2; exit 1; }
          cd tmp/scala-ivy-publication
          rm -f PUBLICATION
          time tar -czf scala-sdk-ivy-local.tar.gz -C ~/.ivy2 local
          sha256sum scala-sdk-ivy-local.tar.gz > SHA256SUMS
          time sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          stat -c 'Scala ivy archive bytes=%s' scala-sdk-ivy-local.tar.gz
          printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" > PUBLICATION

  build-golem-moonbit:
    runs-on: blacksmith
    steps:
      - uses: actions/checkout@v5
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_INSTALL_VERSION }}
          core-version: ${{ env.MOONBIT_INSTALL_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update MoonBit workspace dependencies
        run: moon update
        working-directory: sdks/moonbit
      - name: Install Golem MoonBit wit-bindgen
        run: ./scripts/install-wit-bindgen.sh
        working-directory: sdks/moonbit/golem_sdk
      - name: Generate and verify MoonBit WIT bindings
        run: ./scripts/check-generated-bindings.sh
        working-directory: sdks/moonbit/golem_sdk
      - name: Check SDK
        run: find . -name moon.pkg -exec dirname {} \; | xargs moon check --target wasm
        working-directory: sdks/moonbit/golem_sdk
      - name: Test SDK
        run: ./scripts/run-sdk-tests.sh
        working-directory: sdks/moonbit/golem_sdk
      - name: Check tools
        run: moon check cmd lib
        working-directory: sdks/moonbit/golem_sdk_tools
      - name: Test tools
        run: moon test cmd lib
        working-directory: sdks/moonbit/golem_sdk_tools

  # The Rust SDK test suite is dominated by two integration test targets that each shell out to
  # cargo (tool: one `cargo check` per test, ui: trybuild). They run as separate matrix entries;
  # the `check` entry runs lint and every other test target, and fails if a test target is added
  # without being assigned to an entry.
  build-golem-rust:
    name: build-golem-rust (${{ matrix.part.name }})
    runs-on: blacksmith-16vcpu-ubuntu-2204
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: check
            test-args: --lib --bins --test agent --test http_router --test rich_tool_conformance --test tool_canonical --test schema_reexport --test reflection_recipe_compile
          - name: tool
            test-args: --test tool
          - name: ui
            test-args: --test ui
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          rust-targets: 'wasm32-wasip2'
          cache-prefix-key: 'v2-golem-rust'
          install-cargo-make: 'false'
          install-cargo-binstall: 'true'
      - name: Install wasm-tools
        run: cargo binstall --force --locked wasm-tools@1.248.0
      - name: Check formatting
        if: matrix.part.name == 'check'
        run: cargo fmt -- --check
        working-directory: sdks/rust
      - name: Clippy
        if: matrix.part.name == 'check'
        run: cargo clippy -- -Dwarnings
        working-directory: sdks/rust
      - name: Check that every test target is covered by the matrix
        if: matrix.part.name == 'check'
        working-directory: sdks/rust
        run: |
          expected='agent
          http_router
          reflection_recipe_compile
          rich_tool_conformance
          schema_reexport
          tool
          tool_canonical
          ui'
          actual=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("test")) | .name' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Test targets of sdks/rust changed; update the build-golem-rust matrix in ci.yaml:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Tests
        run: cargo test --all-features ${{ matrix.part.test-args }}
        working-directory: sdks/rust
      - name: Doc tests
        if: matrix.part.name == 'check'
        run: cargo test --all-features --doc
        working-directory: sdks/rust

  build-golem-go:
    runs-on: blacksmith
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Tracks the version pinned in the module (currently go 1.27.1); stock
          # Go only — the SDK deliberately does not use TinyGo.
          go-version-file: sdks/go/golem/go.mod
          cache-dependency-path: |
            sdks/go/*/go.sum
            test-components/**/go.sum

      # cargo-make drives the WIT dep sync and the go-bindgen-fixup step that the
      # bindings regeneration runs. componentize-go itself is a pinned `go tool`
      # (go.mod), so no wasm-tools / WASI SDK are needed here.
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-make: 'true'

      # Regenerate the committed WIT bindings (syncs wit/deps first via the task's
      # `wit` dependency) and fail if they drift from what's checked in — mirrors
      # the "types are committed" gate the TS and Scala SDKs use.
      - name: Regenerate Go WIT bindings
        run: cargo make generate-sdk-go-bindings

      - name: Verify Go WIT bindings are committed
        run: |
          if ! git diff --exit-code sdks/go/golem/internal/wit; then
            echo "❌ sdks/go/golem/internal/wit differs from the committed version."
            echo "Please run 'cargo make generate-sdk-go-bindings' and commit the result."
            exit 1
          fi

      # Lint the hand-written package with golangci-lint (the standard Go
      # meta-linter: govet, errcheck, ineffassign, staticcheck, unused + the
      # doc-comment-form checks). Config + generated-code exclusions live in
      # sdks/go/golem/.golangci.yml. The official action fetches a pinned binary
      # and caches analysis — this replaces the host `go vet` step too, since its
      # govet covers it (and the .golangci.yml exclusions handle the generated
      # internal/wit bindings that forced the old vet flag workaround).
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          # >= v2.13 is required: earlier releases are built with Go 1.26 and
          # cannot parse the SDK's generic methods (a Go 1.27 feature).
          version: v2.13.2
          working-directory: sdks/go/golem

      - name: Vet (wasip1)
        working-directory: sdks/go/golem
        run: GOOS=wasip1 GOARCH=wasm go vet -unsafeptr=false -composites=false .

      - name: Build for wasip1
        working-directory: sdks/go/golem
        run: GOOS=wasip1 GOARCH=wasm go build ./...

      - name: Run tests
        working-directory: sdks/go/golem
        run: go test ./...

      # core and bridge are separate modules with their own go.mod, so the steps
      # above do not reach them. core is the shared schema model and the one
      # canonical-JSON implementation in Go; bridge is the external runtime.
      # Neither builds for wasip1 — core is stdlib-only and bridge is an
      # ordinary REST and WebSocket client — so there is no wasm step for them.
      - name: Lint core (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: sdks/go/core

      - name: Run core tests
        working-directory: sdks/go/core
        run: go test ./...

      - name: Lint bridge (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: sdks/go/bridge

      - name: Run bridge tests
        working-directory: sdks/go/bridge
        run: go test ./...

  build-golem-ts:
    runs-on: blacksmith
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip2'
          install-cargo-make: 'false'
          install-cargo-binstall: 'true'

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Install dependencies
        working-directory: sdks/ts
        run: |
          pnpm install

      - name: Check code quality
        working-directory: sdks/ts
        run: |
          pnpm run lint || (
            echo "Linting issues found. Please fix them before proceeding. `npm run lint:fix` may help"
            exit 1
          )

      - name: Check code formatting
        working-directory: sdks/ts
        run: |
          pnpm run format:check || (
            echo "Code formatting issues found. Please run 'npm run format' to fix them."
            exit 1
          )

      - name: Build the package
        working-directory: sdks/ts
        run: |
          pnpm run build

      - name: Verify golem-ts-sdk types are committed
        working-directory: sdks/ts
        run: |
          if ! git diff --exit-code packages/golem-ts-sdk/types; then
            echo "❌ The files in packages/golem-ts-sdk/types differ from the committed version."
            echo "Please run 'pnpm run build' and commit the updated files."
            exit 1
          fi

      - name: Build the agent template WASM binary
        working-directory: sdks/ts
        run: pnpm run build-agent-template

      - name: Check packed SDK HTTP contract
        working-directory: sdks/ts
        run: pnpm --filter @golemcloud/golem-ts-sdk run check:package

      - name: Run tests
        working-directory: sdks/ts
        run: |
          pnpm run test

      - name: Package built TS SDK for dependent jobs
        run: |
          tar -czf "$RUNNER_TEMP/golem-ts-sdk.tar.gz" \
            sdks/ts/packages/golem-ts-sdk/dist \
            sdks/ts/packages/golem-ts-sdk/types \
            sdks/ts/packages/golem-ts-sdk/wasm \
            sdks/ts/packages/golem-ts-bridge/dist \
            sdks/ts/packages/golem-ts-repl/dist
      - name: Upload built TS SDK for dependent jobs
        uses: actions/upload-artifact@v6
        with:
          name: golem-ts-sdk
          path: ${{ runner.temp }}/golem-ts-sdk.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-golem-effect:
    runs-on: blacksmith
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip2'
          install-cargo-make: 'false'
          install-cargo-binstall: 'true'

      - uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Install dependencies
        working-directory: sdks/effect
        run: npm ci

      - name: Check code quality
        working-directory: sdks/effect
        run: npm run lint

      - name: Check code formatting
        working-directory: sdks/effect
        run: npm run format:check

      - name: Typecheck
        working-directory: sdks/effect
        run: npm run typecheck

      - name: Build the package and agent template
        working-directory: sdks/effect
        run: |
          npm test
          npm run build
          npm run build-agent-template
          npm run check:dts
          npm run check:contracts
          npm run check:artifacts
          npm run check:package

      - name: Package built Effect SDK for CLI integration tests
        run: |
          tar -czf "$RUNNER_TEMP/golem-effect-sdk.tar.gz" \
            sdks/effect/dist sdks/effect/wasm sdks/effect/golem-types
      - name: Upload built Effect SDK for CLI integration tests
        uses: actions/upload-artifact@v6
        with:
          name: golem-effect-sdk
          path: ${{ runner.temp }}/golem-effect-sdk.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  list-test-component-groups:
    runs-on: blacksmith
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Generate matrix from build-components.sh
        id: generate
        run: |
          matrix=$(cd test-components && bash build-components.sh list-groups)
          echo "matrix={\"chunk\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix"

  build-test-components:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # Test components only need a `golem` binary, so they are built from the optimized CLI
    # produced by build-cli-test-bins rather than waiting for the full build-and-store job. This
    # lets the component builds finish while build-and-store is still compiling test binaries.
    needs:
      - build-cli-test-bins
      - build-golem-ts
      - build-golem-effect
      - build-golem-scala
      - list-test-component-groups
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list-test-component-groups.outputs.matrix) }}
    name: build-test-components-${{ matrix.chunk.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          rust-targets: 'wasm32-wasip1 wasm32-wasip2'
          install-cargo-make: 'false'
          install-cargo-binstall: 'true'
      - name: Identify fixture compiler
        if: startsWith(matrix.chunk.name, 'rust-')
        id: fixture-compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust fixture compilation
        if: startsWith(matrix.chunk.name, 'rust-')
        uses: actions/cache@v5
        with:
          path: tmp/rust-fixture-target
          key: rust-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.fixture-compiler.outputs.hash }}-${{ matrix.chunk.name }}-${{ hashFiles('Cargo.toml', '.cargo/**', 'test-components/**/Cargo.toml', 'test-components/**/Cargo.lock', 'test-components/**/.cargo/**', 'sdks/rust/**/Cargo.toml', 'sdks/rust/Cargo.lock', 'sdks/rust/.cargo/**') }}-${{ github.sha }}
          restore-keys: |
            rust-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.fixture-compiler.outputs.hash }}-${{ matrix.chunk.name }}-${{ hashFiles('Cargo.toml', '.cargo/**', 'test-components/**/Cargo.toml', 'test-components/**/Cargo.lock', 'test-components/**/.cargo/**', 'sdks/rust/**/Cargo.toml', 'sdks/rust/Cargo.lock', 'sdks/rust/.cargo/**') }}-
      - name: Restore CLI test binaries
        uses: ./.github/actions/restore-cli-test-binary
        with:
          disk-key: ${{ needs.build-cli-test-bins.outputs.cli-binary-disk-key }}
          run-id: ${{ github.run_id }}
          destination: tmp/golem-cli-test-binaries

      - name: Setup MoonBit
        if: matrix.chunk.needs-moonbit
        uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_INSTALL_VERSION }}
          core-version: ${{ env.MOONBIT_INSTALL_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update MoonBit workspace dependencies
        if: matrix.chunk.needs-moonbit
        run: moon update
        working-directory: sdks/moonbit

      - name: Install Golem MoonBit wit-bindgen
        if: matrix.chunk.needs-moonbit
        run: ./scripts/install-wit-bindgen.sh
        working-directory: sdks/moonbit/golem_sdk

      - name: Generate MoonBit WIT bindings
        if: matrix.chunk.needs-moonbit
        run: ./scripts/regen-bindings.sh
        working-directory: sdks/moonbit/golem_sdk

      - name: Install wasm-tools
        if: matrix.chunk.needs-moonbit
        run: cargo binstall --force --locked wasm-tools@1.248.0

      - name: Restore built TS SDK
        if: matrix.chunk.needs-node
        uses: actions/download-artifact@v8
        with:
          name: golem-ts-sdk
          path: tmp/sdk-artifacts
      - name: Extract built TS SDK
        if: matrix.chunk.needs-node
        run: tar -xzf tmp/sdk-artifacts/golem-ts-sdk.tar.gz

      - name: Restore built Effect SDK
        if: matrix.chunk.needs-effect
        uses: actions/download-artifact@v8
        with:
          name: golem-effect-sdk
          path: tmp/effect-sdk-artifacts
      - name: Extract built Effect SDK
        if: matrix.chunk.needs-effect
        run: tar -xzf tmp/effect-sdk-artifacts/golem-effect-sdk.tar.gz

      - name: Install Effect SDK dependencies
        if: matrix.chunk.needs-effect
        working-directory: sdks/effect
        run: npm ci

      - name: Setup JS and WASM build tools
        if: matrix.chunk.needs-node
        uses: ./.github/actions/setup-js-wasm-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Setup WASM build tools for Scala components
        if: matrix.chunk.needs-scala
        uses: ./.github/actions/setup-wasm-component-tools
        with:
          wasi-sdk-version: ${{ env.WASI_SDK_VERSION }}
          wasi-sdk-path: ${{ env.WASI_SDK_PATH }}
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}

      - name: Setup Java for Scala components
        if: matrix.chunk.needs-scala
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup SBT for Scala components
        if: matrix.chunk.needs-scala
        uses: sbt/setup-sbt@v1

      - name: Cache Scala dependencies
        if: matrix.chunk.needs-scala
        uses: coursier/cache-action@v8

      - name: Restore Scala SDK ivy local repo
        if: matrix.chunk.needs-scala
        uses: ./.github/actions/restore-binary-publication
        with:
          run-id: ${{ github.run_id }}
          disk-key: ${{ needs.build-golem-scala.outputs.ivy-disk-key }}
          path: tmp/scala-ivy-publication
          file: scala-sdk-ivy-local.tar.gz
      - name: Extract Scala SDK ivy local repo
        if: matrix.chunk.needs-scala
        run: |
          mkdir -p ~/.ivy2
          tar -xzf tmp/scala-ivy-publication/scala-sdk-ivy-local.tar.gz -C ~/.ivy2

      - name: Update MoonBit fixture dependencies
        if: matrix.chunk.needs-moonbit
        working-directory: test-components/tool-streaming-moonbit
        run: moon update

      - name: Install TS SDK dependencies
        if: matrix.chunk.needs-node
        working-directory: sdks/ts
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        if: matrix.chunk.needs-go
        uses: actions/setup-go@v5
        with:
          # Host Go for tooling; components are built with the Go toolchain the
          # CLI installs (cached below).
          go-version-file: sdks/go/golem/go.mod
          cache-dependency-path: |
            sdks/go/*/go.sum
            test-components/**/go.sum

      - name: Cache componentize-go toolchain
        if: matrix.chunk.needs-go
        uses: actions/cache@v5
        with:
          # The CLI installs Golem's Go toolchain here on first build, next to
          # componentize-go's own cached binary.
          path: ~/.cache/componentize-go
          key: componentize-go-${{ runner.os }}-${{ hashFiles('cli/golem-cli/src/versions.rs', 'sdks/go/golem/go.sum') }}
          restore-keys: |
            componentize-go-${{ runner.os }}-

      - name: Install wasm-tools for Go components
        if: matrix.chunk.needs-go
        run: cargo binstall --force --locked wasm-tools@1.248.0

      - name: Remove any pre-existing WASMs
        run: find test-components -maxdepth 1 -name '*.wasm' -delete

      - name: Build test components
        working-directory: test-components
        env:
          GOLEM_TS_PRESET: quick
          GOLEM_CLI: ${{ github.workspace }}/tmp/golem-cli-test-binaries/golem
        run: |
          if [[ '${{ matrix.chunk.name }}' == rust-* ]]; then
            export CARGO_TARGET_DIR="${{ github.workspace }}/tmp/rust-fixture-target"
          fi
          if [[ '${{ matrix.chunk.name }}' == benchmarks ]]; then
            export GOLEM_RUST_PATH="${{ github.workspace }}/sdks/rust/golem-rust"
          fi
          ./build-components.sh ${{ matrix.chunk.name }}

      - name: Collect built WASMs
        env:
          EXPECTED_ARTIFACT: ${{ matrix.chunk.expected-artifact }}
        run: |
          mkdir -p tmp/test-components-wasm
          if [[ -n "$EXPECTED_ARTIFACT" ]]; then
            test -s "test-components/$EXPECTED_ARTIFACT"
            cp "test-components/$EXPECTED_ARTIFACT" tmp/test-components-wasm/
          else
            cp test-components/*.wasm tmp/test-components-wasm/ 2>/dev/null || true
          fi
          count=$(find tmp/test-components-wasm -maxdepth 1 -name '*.wasm' | wc -l)
          echo "Built $count WASM files in chunk ${{ matrix.chunk.name }}"
          test "$count" -gt 0

      - name: Upload chunk WASMs
        uses: actions/upload-artifact@v6
        with:
          name: test-components-${{ matrix.chunk.name }}
          path: tmp/test-components-wasm/*.wasm
          retention-days: 1

  merge-test-components:
    outputs:
      components-disk-key: ${{ steps.publication-key.outputs.key }}
    runs-on: blacksmith
    needs: build-test-components
    steps:
      - name: Download all chunk WASMs
        uses: actions/download-artifact@v8
        with:
          pattern: test-components-*
          path: tmp/test-components-wasm
          merge-multiple: true

      - name: Verify merged WASMs
        run: |
          echo "Merged WASM files:"
          ls -1 tmp/test-components-wasm/*.wasm | sort
          count=$(find tmp/test-components-wasm -maxdepth 1 -name '*.wasm' | wc -l)
          echo "Total: $count WASM files"
          unique_update_hashes=$(sha256sum tmp/test-components-wasm/it_agent_update_v{3,4}_release.wasm | cut -d' ' -f1 | sort -u | wc -l)
          echo "Distinct v3/v4 update fixture hashes: $unique_update_hashes"
          test "$unique_update_hashes" -eq 2

      - name: Identify fixture publication
        id: publication-key
        run: echo "key=${GITHUB_REPOSITORY}-test-components-${GITHUB_RUN_ID}-producer-attempt${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Mount fixture producer disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ steps.publication-key.outputs.key }}
          path: tmp/test-components-publication
          commit: 'true'
      - name: Publish test components
        env:
          DISK_KEY: ${{ steps.publication-key.outputs.key }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mountpoint -q tmp/test-components-publication || { echo 'Fixture producer disk is not mounted' >&2; exit 1; }
          cd tmp/test-components-publication
          rm -f PUBLICATION
          time tar --zstd -cf test-components.tar.zst -C ../test-components-wasm .
          sha256sum test-components.tar.zst > SHA256SUMS
          time sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          stat -c 'Fixture archive bytes=%s' test-components.tar.zst
          printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$GITHUB_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" > PUBLICATION

  detect-skill-changes:
    name: Detect golem-skills changes
    runs-on: ubuntu-latest
    outputs:
      skills_changed: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            skills:
              - 'golem-skills/**'

  skill-harness-unit-tests:
    name: Skill Harness Unit Tests
    runs-on: blacksmith-8vcpu-ubuntu-2204
    needs: detect-skill-changes
    if: needs.detect-skill-changes.outputs.skills_changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: golem-skills/tests/harness/package.json

      - name: Install and Build
        working-directory: golem-skills/tests/harness
        run: |
          npm install
          npm run build

      - name: Check Formatting
        working-directory: golem-skills/tests/harness
        run: npm run format:check

      - name: Run Unit Tests
        working-directory: golem-skills/tests/harness
        run: npm test

  docker-image-checks:
    # Builds the linux/amd64 images without pushing them, and checks their user, writable
    # directories, setuid and setgid files, the file capability and startup of xfs-quotad, and the
    # startup of the golem image with Litestream.
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-make: 'false'
      - name: Build xfs-quotad
        run: cargo build --release -p golem-xfs-quotad --target x86_64-unknown-linux-gnu
      - name: Check the images
        run: docker/check-images.sh

  builtin-artifacts-release-tests:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-32vcpu-ubuntu-2204
    env:
      CARGO_BUILD_JOBS: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: 'builtin-artifacts-release-tests'
          cache-save-if: 'true'
      - name: Test download-and-cache release defaults and reject release embedding
        run: cargo make --profile ci builtin-artifacts-release-tests

  release-prerequisites:
    needs:
      - build-and-store
      - build-cli-test-bins
      - builtin-artifacts
      - check-clippy-and-format
      - unit-tests-and-checks
      - config-checks
      - middleware-unit-tests
      - golem-schema-guest
      - worker-tests
      - managed-xfs-tests
      - apfs-tests
      - it
      - it-cli
      - it-cli-agents
      - it-cli-streaming
      - consolidate-test-reports
    if: github.event_name == 'workflow_dispatch'
    env:
      CARGO_BUILD_JOBS: 20
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          use-cache: 'false'
          install-cargo-binstall: 'true'
      - name: Verify shared crate release
        run: cargo make --profile ci verify-shared-crates
      - uses: ./.github/actions/restore-binaries
        with:
          disk-key: ${{ needs.build-and-store.outputs.native-binaries-disk-key }}
          run-id: ${{ github.run_id }}
          copy-to-target: 'true'
      - uses: ./.github/actions/restore-cli-test-binary
        with:
          disk-key: ${{ needs.build-cli-test-bins.outputs.cli-binary-disk-key }}
          run-id: ${{ github.run_id }}
          destination: target/dev-release-ci
      - uses: ./.github/actions/restore-builtin-artifacts
        with:
          disk-key: ${{ needs.builtin-artifacts.outputs.artifacts-disk-key }}
          run-id: ${{ github.run_id }}
      - uses: ./.github/actions/check-published-sdks
        with:
          wasm-rquickjs-version: ${{ env.WASM_RQUICKJS_VERSION }}
          moonbit-version: ${{ env.MOONBIT_INSTALL_VERSION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-prerequisite-logs
