name: CI cache transport experiment
on: pull_request
permissions:
  contents: read
  actions: read
jobs:
  seed:
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-provider: blacksmith
          install-cargo-make: 'false'
      - name: Record dependency payload
        run: |
          mkdir -p tmp/transport-evidence
          rustc -vV > tmp/transport-evidence/compiler.txt
          du -sb target ~/.cargo/registry ~/.cargo/git > tmp/transport-evidence/bytes.txt
          find target ~/.cargo/registry ~/.cargo/git -type f -print0 | sort -z | xargs -0 sha256sum > tmp/transport-evidence/files.sha256
          sha256sum tmp/transport-evidence/files.sha256
      - uses: actions/cache/save@v5
        with:
          key: ci-oct23-transport-${{ github.run_id }}
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
      - uses: useblacksmith/cache/save@v5
        with:
          key: ci-oct23-transport-${{ github.run_id }}
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
      - uses: actions/upload-artifact@v6
        with:
          name: transport-seed
          path: tmp/transport-evidence
  restore:
    needs: seed
    runs-on: blacksmith-32vcpu-ubuntu-2204
    timeout-minutes: 20
    strategy:
      matrix:
        provider: [github, blacksmith]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - name: Clear runner cache directories
        run: rm -rf target ~/.cargo/registry ~/.cargo/git
      - name: Restore GitHub payload
        if: matrix.provider == 'github'
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: 'true'
          key: ci-oct23-transport-${{ github.run_id }}
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
      - name: Restore Blacksmith payload
        if: matrix.provider == 'blacksmith'
        uses: useblacksmith/cache/restore@v5
        with:
          fail-on-cache-miss: 'true'
          key: ci-oct23-transport-${{ github.run_id }}
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
      - uses: actions/download-artifact@v8
        with:
          name: transport-seed
          path: tmp/transport-evidence
      - name: Verify restored dependency payload
        run: |
          find target ~/.cargo/registry ~/.cargo/git -type f -print0 | sort -z | xargs -0 sha256sum > tmp/restored.sha256
          cmp tmp/transport-evidence/files.sha256 tmp/restored.sha256
          sha256sum tmp/restored.sha256
          du -sb target ~/.cargo/registry ~/.cargo/git
