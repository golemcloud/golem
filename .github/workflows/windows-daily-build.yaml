name: Daily Windows Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  checks: write

jobs:
  build-windows:
    runs-on: windows-latest-large
    env:
      CARGO_BUILD_JOBS: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix-key: 'v3-rust'
          cache-shared-key: 'windows-daily'
          cache-save-if: 'true'
          install-protoc: 'true'

      - name: Building all executables
        env:
          QUIET: true
        run: cargo make --profile ci build-all-bins-including-tests
        timeout-minutes: 120

      - name: Test platform-independent blob storage paths
        run: cargo test -p golem-service-base --lib -- join_blob_path_ storage_keys_use_contract_separator --report-time
        timeout-minutes: 30

      - name: Test platform-independent guest blob object names
        run: cargo test -p golem-worker-executor --lib -- blob_object_name_uses_contract_separator --report-time
        timeout-minutes: 30
