name: Publish shared Rust crates

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shared-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'golemcloud/golem' && startsWith(github.event.release.tag_name, 'golem-shared-v')
    runs-on: blacksmith
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Test release tooling
        run: cargo make --profile ci check-shared-crates-versioning
      - name: Test shared libraries
        run: cargo test -p golem-schema-derive -p golem-schema -p golem-tool-metadata --lib -- --report-time
      - name: Publish shared crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo make --profile ci publish-shared-crates
