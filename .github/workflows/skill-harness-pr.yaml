name: Skill harness PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'golem-skills/**'
      - '.github/workflows/skill-harness-pr.yaml'

concurrency:
  group: skill-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Skill Harness Unit Tests
    runs-on: blacksmith-8vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: golem-skills/tests/harness/package.json
      - name: Install and build
        working-directory: golem-skills/tests/harness
        run: |
          npm install
          npm run build
      - name: Check formatting
        working-directory: golem-skills/tests/harness
        run: npm run format:check
      - name: Run unit tests
        working-directory: golem-skills/tests/harness
        run: npm test
