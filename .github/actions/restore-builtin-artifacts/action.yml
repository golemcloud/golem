name: 'Restore Built-in Artifacts'
description: 'Restore checksum-pinned built-in artifact WASMs from cache and install them'
inputs:
  cache-key:
    description: 'Built-in artifact cache key'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore built-in artifact WASMs
      uses: actions/cache/restore@v5
      with:
        path: tmp/builtin-artifacts
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Install built-in artifact WASMs
      shell: bash
      run: |
        cp -v tmp/builtin-artifacts/filesystem-tools.wasm builtin-tools/filesystem-tools.wasm
        cp -v tmp/builtin-artifacts/javascript-tools.wasm builtin-tools/javascript-tools.wasm
        cp -v tmp/builtin-artifacts/typescript-tools.wasm builtin-tools/typescript-tools.wasm
        cp -v tmp/builtin-artifacts/web-fetch.wasm builtin-tools/web-fetch.wasm
        cp -v tmp/builtin-artifacts/otlp-exporter.wasm plugins/otlp-exporter.wasm
