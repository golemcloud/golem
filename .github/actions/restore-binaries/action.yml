name: 'Restore Build Binaries'
description: 'Install cargo-test-r, download binaries, and apply archive'
inputs:
  run-id:
    description: 'GitHub run ID containing the binary artifact'
    required: true
  copy-to-target:
    description: 'Whether to copy binaries to target/debug'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install cargo-test-r
      shell: bash
      run: cargo binstall --force --locked cargo-test-r@2.2.5
    - name: Download packaged binaries
      uses: actions/download-artifact@v8
      with:
        name: golem-binaries
        path: tmp
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
    - name: Apply binary archive
      shell: bash
      run: cargo-test-r reuse-nextest-archive --archive-file tmp/golem-binaries.tar.zst
    - name: Copy binaries to target/debug
      if: inputs.copy-to-target == 'true'
      shell: bash
      run: |
        mkdir -pv target/debug
        find target/nextest-archive/target/dev-ci -maxdepth 1 -type f | xargs mv -t target/debug/
