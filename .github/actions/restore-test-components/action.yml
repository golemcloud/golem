name: 'Restore Test Components'
description: 'Download test component WASMs and install them'
inputs:
  run-id:
    description: 'GitHub run ID containing the test component artifact'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore built test component WASMs
      uses: actions/download-artifact@v8
      with:
        name: golem-test-components
        path: tmp/test-components-wasm
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
    - name: Install test component WASMs
      shell: bash
      run: cp -v tmp/test-components-wasm/*.wasm test-components/
