name: 'Restore Test Components'
description: 'Restore the validated test component publication and install it'
inputs:
  run-id:
    description: 'GitHub run ID that published the test components'
    required: true
  artifact-id:
    description: 'Exact GitHub artifact ID exported by the merge producer attempt'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore built test component WASMs
      uses: ./.github/actions/restore-binary-publication
      with:
        run-id: ${{ inputs.run-id }}
        artifact-id: ${{ inputs.artifact-id }}
        path: tmp/test-components-publication
        file: test-components.tar.zst
    - name: Install test component WASMs
      shell: bash
      run: |
        set -euo pipefail
        time tar --zstd -xf tmp/test-components-publication/test-components.tar.zst -C test-components
