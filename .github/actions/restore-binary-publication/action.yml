name: 'Restore Binary Publication'
description: 'Download an exact producer artifact and verify its content digest'
inputs:
  run-id:
    description: 'GitHub run ID that published the binary'
    required: true
  artifact-id:
    description: 'Exact GitHub artifact ID exported by the producer attempt'
    required: true
  path:
    description: 'Directory in which to install the archive'
    required: true
  file:
    description: 'Published binary or archive filename'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Validate binary producer inputs
      id: download
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        PUBLICATION_RUN_ID: ${{ inputs.run-id }}
      run: |
        set -euo pipefail
        [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PUBLICATION_RUN_ID" == "$GITHUB_RUN_ID" ]] || { echo 'Invalid binary producer inputs' >&2; exit 1; }
        echo "path=$(mktemp -d "$RUNNER_TEMP/binary-publication.XXXXXX")" >> "$GITHUB_OUTPUT"
    - name: Download binary publication
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ steps.download.outputs.path }}
        skip-decompress: true
        digest-mismatch: error
    - name: Install verified binary archive
      shell: bash
      env:
        DOWNLOAD_PATH: ${{ steps.download.outputs.path }}
        PUBLICATION_PATH: ${{ inputs.path }}
        PUBLICATION_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=("$DOWNLOAD_PATH"/"$GITHUB_RUN_ID"-producer-attempt*-"$PUBLICATION_FILE")
        [[ ${#files[@]} -eq 1 && -s "${files[0]}" && ! -L "${files[0]}" ]] || { echo "Missing or ambiguous binary publication: $PUBLICATION_FILE" >&2; exit 1; }
        mkdir -p "$PUBLICATION_PATH"
        mv -- "${files[0]}" "$PUBLICATION_PATH/$PUBLICATION_FILE"
        rmdir "$DOWNLOAD_PATH"
