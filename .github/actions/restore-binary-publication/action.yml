name: 'Restore Binary Publication'
description: 'Mount an immutable producer snapshot and validate its identity and checksum'
inputs:
  run-id:
    description: 'GitHub run ID that published the binary'
    required: true
  disk-key:
    description: 'Exact sticky disk key exported by the producer attempt'
    required: true
  path:
    description: 'Directory that exposes the validated publication'
    required: true
  file:
    description: 'Published binary or archive filename'
    required: true
runs:
  using: 'composite'
  steps:
    # The producer's snapshot is committed when its VM shuts down, which is shortly after the
    # producer job completes. A consumer that mounts before then gets an empty disk, so an empty
    # first mount is retried once on a second mount point after the commit window has passed.
    - name: Mount binary publication
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ inputs.disk-key }}
        path: ${{ inputs.path }}.mount
        commit: 'false'
    - name: Check binary publication snapshot
      id: first-mount
      shell: bash
      env:
        MOUNT_PATH: ${{ inputs.path }}.mount
        DISK_KEY: ${{ inputs.disk-key }}
      run: |
        set -euo pipefail
        if [[ -e "$MOUNT_PATH/PUBLICATION" ]]; then
          echo 'retry=false' >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Sticky disk $DISK_KEY has no publication yet; mounting it again after the producer snapshot commit window"
          echo 'retry=true' >> "$GITHUB_OUTPUT"
          sleep 60
        fi
    - name: Mount binary publication again
      if: steps.first-mount.outputs.retry == 'true'
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ inputs.disk-key }}
        path: ${{ inputs.path }}.retry
        commit: 'false'
    - name: Validate binary publication
      shell: bash
      env:
        DISK_KEY: ${{ inputs.disk-key }}
        PUBLICATION_RUN_ID: ${{ inputs.run-id }}
        SOURCE_SHA: ${{ github.sha }}
        PUBLICATION_PATH: ${{ inputs.path }}
        MOUNT_PATH: ${{ steps.first-mount.outputs.retry == 'true' && format('{0}.retry', inputs.path) || format('{0}.mount', inputs.path) }}
        PUBLICATION_FILE: ${{ inputs.file }}
      run: |
        set -euo pipefail
        mountpoint -q "$MOUNT_PATH" || { echo 'Binary publication sticky disk is not mounted' >&2; exit 1; }
        ln -sT "$(basename "$MOUNT_PATH")" "$PUBLICATION_PATH"
        cd "$PUBLICATION_PATH"
        [[ -n "$DISK_KEY" && "$PUBLICATION_RUN_ID" == "$GITHUB_RUN_ID" ]] || { echo 'Invalid binary producer inputs' >&2; exit 1; }
        for file in PUBLICATION SHA256SUMS "$PUBLICATION_FILE"; do
          [[ -s "$file" && ! -L "$file" ]] || { echo "Missing binary publication: $file (snapshot may be absent or publication denied)" >&2; exit 1; }
        done
        printf 'run-id=%s\nsource-sha=%s\ndisk-key=%s\n' "$PUBLICATION_RUN_ID" "$SOURCE_SHA" "$DISK_KEY" | cmp -s - PUBLICATION || { echo 'Binary publication identity mismatch' >&2; exit 1; }
        read -r digest filename < SHA256SUMS
        [[ $(wc -l < SHA256SUMS) -eq 1 && "$digest" =~ ^[0-9a-f]{64}$ && "$filename" == "$PUBLICATION_FILE" ]] || { echo 'Invalid binary checksum manifest' >&2; exit 1; }
        echo "Checking publication $DISK_KEY ($PUBLICATION_FILE)"
        time sha256sum --check --strict SHA256SUMS
        printf 'Validated binary sha256=%s file=%s\n' "$digest" "$filename"
