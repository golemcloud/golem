name: 'Restore CLI Test Binary'
description: 'Download the verified CLI artifact and install its Golem executable'
inputs:
  run-id:
    description: 'GitHub run ID that published the executable'
    required: true
  artifact-id:
    description: 'Exact GitHub artifact ID exported by the CLI producer attempt'
    required: true
  destination:
    description: 'Directory in which to install golem'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore CLI binary publication
      uses: ./.github/actions/restore-binary-publication
      with:
        run-id: ${{ inputs.run-id }}
        artifact-id: ${{ inputs.artifact-id }}
        path: tmp/cli-binary-publication
        file: golem-cli-test-binaries.tar.zst
    - name: Extract CLI executable from verified archive
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        mkdir -p "$DESTINATION"
        time tar --zstd -xf tmp/cli-binary-publication/golem-cli-test-binaries.tar.zst -C "$DESTINATION"
        chmod +x "$DESTINATION/golem"
