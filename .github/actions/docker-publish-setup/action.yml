name: 'Docker Publish Setup'
description: 'Common setup for Docker image publishing jobs'
inputs:
  dockerhub-username:
    description: 'Docker Hub username'
    required: true
  dockerhub-password:
    description: 'Docker Hub password'
    required: true
  artifact-pattern:
    description: 'Pattern of the artifacts that hold the executables to put in the images; empty for images without executables'
    required: false
    default: 'docker-targets-build-*'
runs:
  using: 'composite'
  steps:
    - name: Fetch tag
      shell: bash
      run: git fetch origin --deepen=1
    - name: Prepare platforms
      shell: bash
      run: echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
    - name: Download Targets
      if: inputs.artifact-pattern != ''
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: target
        merge-multiple: true
    - name: Extract Targets
      if: inputs.artifact-pattern != ''
      shell: bash
      run: |
        ls -R target
        cd target
        for f in *.tar; do tar xvf "$f"; done
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Determine whether to publish ':latest'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        channel=$(node .github/scripts/release-channel.mjs golem "${RELEASE_TAG#v}")
        publish_latest=$([[ "$channel" == latest ]] && echo true || echo false)
        echo "PUBLISH_LATEST_TAG=${publish_latest}" >> $GITHUB_ENV
    - uses: jpribyl/action-docker-layer-caching@v0.1.1
      continue-on-error: true
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
