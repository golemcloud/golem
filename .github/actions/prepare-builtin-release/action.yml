name: 'Prepare Built-in Release Manifest'
description: 'Fetch the immutable built-in manifest before compiling release binaries'
runs:
  using: 'composite'
  steps:
    - name: Download release manifest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        gh release download "$RELEASE_TAG" --repo golemcloud/golem --pattern builtin-artifacts.release.json
        echo 'GOLEM_BUILTIN_RELEASE=1' >> "$GITHUB_ENV"
