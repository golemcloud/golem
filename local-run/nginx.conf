daemon off;
error_log /dev/stdout info;
pid ./data/nginx.pid;

events {
}

http {
    access_log /dev/stdout;
    client_max_body_size 52428800; # Increase this especially if your component size is higher than this

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream registry-service {
        server 127.0.0.1:8080 fail_timeout=0 max_fails=0;
    }

    upstream worker-service {
        server 127.0.0.1:8084 fail_timeout=0 max_fails=0;
    }

    server {
        listen 9881;
        server_name localhost;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /v1/runtime/ {
            proxy_pass http://worker-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://registry-service;
        }
    }
}
