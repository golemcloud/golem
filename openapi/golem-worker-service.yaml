    ReplayDivergence:
      type: object
      title: ReplayDivergence
      description: |-
        Where a replay left the recorded history: the first entry at which the replay did not
        reproduce the recorded execution, what the oplog holds there and what the replay did instead.
      required:
      - oplogIndex
      - expected
      - actual
      - mismatched
      properties:
        oplogIndex:
          type: integer
          format: uint64
          description: The oplog index of the first divergence.
        expected:
          description: What the oplog holds at the index.
          allOf:
          - $ref: '#/components/schemas/ReplayStep'
          - description: What the oplog holds at the index.
        actual:
          description: What the replay did at the index.
          allOf:
          - $ref: '#/components/schemas/ReplayStep'
          - description: What the replay did at the index.
        mismatched:
          type: array
          description: |-
            The identity fields on which `expected` and `actual` differ; empty when the steps differ
            in kind.
          items:
            $ref: '#/components/schemas/StartIdentityField'
        replayStart:
          description: |-
            Where the replay that diverged started; `None` for a divergence outside a recovery replay,
            such as the replay of an update.
          allOf:
          - $ref: '#/components/schemas/ReplayStart'
          - description: |-
              Where the replay that diverged started; `None` for a divergence outside a recovery replay,
              such as the replay of an update.
    ReplayFullStart:
      type: object
      title: ReplayFullStart
      description: |-
        A replay without a snapshot. `rejected_snapshots` holds the oplog indexes of the automatic
        snapshots that the recovery rejected before it, in ascending order; it is empty when no
        snapshot was involved.
      required:
      - rejectedSnapshots
      properties:
        rejectedSnapshots:
          type: array
          items:
            type: integer
            format: uint64
