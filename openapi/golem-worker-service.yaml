  /v1/runtime/envs/{environment_id}/agent-types/{agent_type_name}/agents:
    post:
      tags:
      - Agent
      summary: Create an agent
      description: |-
        Creates an agent of the agent type from its constructor parameters. A keyed create makes
        the keyed agent of the parameters and fails with 409 when that key is current. A create
        without a key makes a new agent each time; with an `Idempotency-Key` from a caller with a
        caller scope, a retry returns the agent of the first attempt, and the same key with a
        changed request fails with 422.
      parameters:
      - name: environment_id
        schema:
          type: string
          format: uuid
        in: path
        required: true
        deprecated: false
        explode: true
      - name: agent_type_name
        schema:
          type: string
        in: path
        required: true
        deprecated: false
        explode: true
      - name: Idempotency-Key
        schema:
          type: string
        in: header
        required: false
        deprecated: false
        explode: true
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/AgentReference'
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsBody'
        '401':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: A limit was exceeded, or the idempotency key was already used for a different request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorBodyWithOptionalWorkerError'
      security:
      - Cookie: []
      - Token: []
      operationId: create_agent
    get:
      tags:
      - Agent
      summary: List the agents of an agent type
      description: |-
        ### Filters

        | Property    | Comparator             | Description                   | Example                            |
        |-------------|------------------------|-------------------------------|------------------------------------|
        | key         | StringFilterComparator | Canonical key of the agent    | `key == Counter("a")`              |
        | id          | FilterComparator       | Full UUID of the agent        | `id == 00000007-0000-8000-8000-000000000001` |
        | version     | FilterComparator       | Component revision            | `version >= 0`                     |
        | status      | FilterComparator       | Status of the agent           | `status = Running`                 |
        | env.\[key\] | StringFilterComparator | Environment variable          | `env.var1 = value`                 |
        | createdAt   | FilterComparator       | Creation time of the agent    | `createdAt > 2024-04-01T12:10:00Z` |

        ### Comparators

        - StringFilterComparator: `eq|equal|=|==`, `ne|notequal|!=`, `like`, `notlike`
