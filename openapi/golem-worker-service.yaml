    OmittedOplogEntry:
      type: object
      title: OmittedOplogEntry
      description: |-
        An oplog entry that an oplog page leaves out because its encoded form is larger than the
        limit of the server. The oplog entry endpoint returns the full entry for the oplog index.
      required:
      - oplogIndex
      - attribution
      - timestamp
      - entryType
      - size
      - componentRevision
      properties:
        oplogIndex:
          type: integer
          format: uint64
        attribution:
          $ref: '#/components/schemas/PublicOplogEntryAttribution'
        timestamp:
          type: string
          format: date-time
        entryType:
          type: string
          description: The type of the entry, the `type` field of its `PublicOplogEntry` form.
        size:
          type: integer
          format: uint64
          description: The size of the encoded entry in bytes.
        componentRevision:
          type: integer
          format: uint64
          description: |-
            The component revision the server decodes the entry with. Passing it to the oplog
            entry endpoint saves the server from scanning the oplog for it.
    OplogCursor:
      type: object
      title: OplogCursor
      required:
      - nextOplogIndex
      - currentComponentRevision
      - queryHash
      properties:
        nextOplogIndex:
          type: integer
          format: uint64
        currentComponentRevision:
          type: integer
          format: uint64
        queryHash:
          type: string
          description: |-
            The hash of the search query of the pages that gave the cursor, or empty for the pages of
            an oplog read without a query. A read refuses a cursor of another query.
        scanTo:
          type: integer
          format: uint64
          description: |-
            The start of the range of a search that did not find the component revision at that start
            yet. The search scans on for the revision from `next_oplog_index`, and then searches from
            `scan_to`. A page read refuses a cursor with `scan_to`.
    OplogErrorKind:
      type: string
      enum:
      - invocation
      - recovery
    OplogInclude:
      type: string
      description: What a reader of an oplog asks to include beyond the default public form.
      enum:
      - claims
    OplogRegion:
      type: object
      title: OplogRegion
      required:
      - start
      - end
      properties:
        start:
          type: integer
          format: uint64
        end:
          type: integer
          format: uint64
    OplogScan:
      type: object
      title: OplogScan
      description: The scan accounting of an oplog range read.
      required:
      - limit
      - chargedEntries
      - chargedMillis
      - exhausted
      properties:
        limit:
          $ref: '#/components/schemas/OplogScanAllowance'
        chargedEntries:
          type: integer
          format: uint64
          description: |-
            The oplog entries that the read charged: the entries that it read to find the component
            revision at the start of the range, and the entries that it read for the page, also those
            that the byte limit of the page left out.
        chargedMillis:
          type: integer
          format: uint64
          description: The time that the read charged, rounded up to a millisecond.
        exhausted:
          type: boolean
          description: The read stopped before the end of the range because it spent the allowance.
    OplogScanAllowance:
      type: object
      title: OplogScanAllowance
      description: |-
        The scan allowance of an oplog range read: the number of oplog entries that it may read, and
        how long it may read.
      required:
      - entries
      - millis
      properties:
        entries:
          type: integer
          format: uint64
        millis:
          type: integer
          format: uint64
