  /v1/runtime/envs/{environment_id}/invocations/lookup:
    get:
      tags:
      - Invocation
      summary: Find the invocations that the caller started with an idempotency key
      description: |-
        The key is matched in the caller's own idempotency scope, against every method and tool
        command the agent ran, including those a later revision removed. A removed method is
        found only while one of its invocations has the method name outside an external payload;
        otherwise pass `operation`. A caller without a scope, and a key used through an HTTP
        route, find nothing. No match is `404`.
        With `tool`, match each currently deployed command, or only `command` when given.
        With both `agent` and `tool`, match hosted tool invocations on that agent.
      parameters:
      - name: environment_id
        schema:
          type: string
          format: uuid
        in: path
        required: true
        deprecated: false
        explode: true
      - name: agent
        schema:
          type: string
          format: uuid
        in: query
        description: The agent ID
        required: false
        deprecated: false
        explode: true
      - name: tool
        schema:
          type: string
        in: query
        description: The tool name; with an agent, finds invocations hosted on that agent
        required: false
        deprecated: false
        explode: true
      - name: command
        schema:
          type: string
        in: query
        description: Only this command path; without it, finds every command of the tool
        required: false
        deprecated: false
        explode: true
      - name: operation
        schema:
          type: string
        in: query
        description: Only the invocation of this method name or `tool:<tool>/<command path>`
        required: false
        deprecated: false
        explode: true
      - name: Idempotency-Key
        schema:
          type: string
        in: header
        required: true
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvocationLookupResult'
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
