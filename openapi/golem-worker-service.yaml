      type: object
      title: ReplayHostCall
      description: |-
        A host call of a replay: the identity of a recorded `Start`, or of the call that the replay
        made in its place.
      required:
      - functionName
      - durableFunctionType
      - carriesRequest
      properties:
        functionName:
          type: string
        durableFunctionType:
          $ref: '#/components/schemas/PublicDurableFunctionType'
        parentStartIndex:
          type: integer
          format: uint64
        invocationId:
          $ref: '#/components/schemas/DurableInvocationId'
        observationalOwner:
          type: integer
          format: uint64
        driver:
          type: integer
          format: uint64
          description: The invocation that drives the call when it is not the invocation the call belongs to.
        carriesRequest:
          type: boolean
          description: |-
            Whether the call carries a request: `true` for a durable call, `false` for a durable
            scope.
        request:
          description: The request of the call, when it is known.
          allOf:
          - $ref: '#/components/schemas/TypedSchemaValue'
          - description: The request of the call, when it is known.
    ReplaySnapshotStart:
      type: object
      title: ReplaySnapshotStart
      description: |-
        A replay that started from the snapshot at `snapshot_index`. `rejected_snapshots` holds the
        oplog indexes of the automatic snapshots that the recovery rejected before it, in ascending
        order.
      required:
      - snapshotIndex
      - rejectedSnapshots
      properties:
        snapshotIndex:
          type: integer
          format: uint64
        rejectedSnapshots:
          type: array
          items:
            type: integer
            format: uint64
    ReplayStart:
