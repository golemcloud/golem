  /v1/runtime/envs/{environment_id}/agents/{agent_id}/oplog:
    get:
      tags:
      - Worker
      summary: Get the oplog of an agent
      description: |-
        Each recorded invocation shows its caller: the principal that started the chain, the
        principal that made the call, and the tokens presented at the entry point. With
        `include=claims`, the users among the callers also show their verified claims.

        Reads the oplog entries from `from` to `to`, both included. Without `from`, the read starts
        at the first entry; without `to`, it goes to the end of the oplog. A `to` after the end of
        the oplog ends the read at the end of the oplog. The endpoint refuses a `to` before
        `from`. With `query`, the page holds only the entries in the range that match the query.
        Without `query`, a read with `to` is a range read: the response accounts its scan.
        `scanEntries` and `scanMillis` limit the scan of a range read. Without them, the scan has no
        limit, and `count` still limits each page. Without `query`, `lastIndex` is the last index of
        the oplog. With `query`, it is the last index of the range in the oplog.

        A search with `from` first reads the entries before `from`, for the component revision at
        `from`. The scan budget of the server covers this read. When the budget ends the read
        before `from`, the page is empty, and its cursor has `scanTo`. Pass the cursor back
        unchanged, with or without `from`.
      parameters:
      - name: environment_id
        schema:
          type: string
          format: uuid
        in: path
        required: true
        deprecated: false
        explode: true
      - name: agent_id
        schema:
          type: string
          format: uuid
        in: path
        required: true
        deprecated: false
        explode: true
      - name: from
        schema:
          type: integer
          format: uint64
        in: query
        required: false
        deprecated: false
        explode: true
      - name: count
        schema:
          type: integer
          format: uint64
        in: query
        required: true
        deprecated: false
        explode: true
      - name: cursor
        schema:
          $ref: '#/components/schemas/OplogCursor'
        in: query
        required: false
        deprecated: false
        explode: true
      - name: query
        schema:
          type: string
        in: query
        required: false
        deprecated: false
        explode: true
      - name: include
        schema:
          $ref: '#/components/schemas/OplogInclude'
        in: query
        required: false
        deprecated: false
        explode: true
      - name: expectedFingerprint
        schema:
          type: string
          format: uuid
        in: query
        required: false
        deprecated: false
        explode: true
      - name: to
        schema:
          type: integer
          format: uint64
        in: query
        description: The inclusive last index of the read. Without `query`, the read is a range read.
        required: false
        deprecated: false
        explode: true
      - name: scanEntries
        schema:
          type: integer
          format: uint64
        in: query
        description: The remaining entry allowance of a range read. Goes with `scanMillis`.
        required: false
        deprecated: false
        explode: true
      - name: scanMillis
        schema:
          type: integer
          format: uint64
        in: query
        description: The remaining time allowance of a range read, in milliseconds.
        required: false
        deprecated: false
        explode: true
      responses:
        '200':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/GetOplogResponse'
        '400':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ErrorsBody'
        '401':
          description: ''
          content:
            application/json; charset=utf-8:
              schema:
