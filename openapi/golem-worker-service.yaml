  /v1/runtime/envs/{environment_id}/invocations:
    get:
      tags:
      - Invocation
      summary: List the invocations of one agent
      description: |-
        Newest change first, with the invocation ID as tie-breaker. Pass `nextCursor` of a page as
        `cursor` to get the next one; an invocation that changes while paging appears at most once.
        `since` and `until` are inclusive bounds on the last change.
      parameters:
      - name: environment_id
        schema:
          type: string
          format: uuid
        in: path
        required: true
        deprecated: false
        explode: true
      - name: agent
        schema:
          type: string
          format: uuid
        in: query
        description: The agent ID
        required: true
        deprecated: false
        explode: true
      - name: operation
        schema:
          type: string
        in: query
        description: Only invocations of this method name or `tool:<tool>/<command path>`
        required: false
        deprecated: false
        explode: true
      - name: state
        schema:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/InvocationState'
        in: query
        description: Only invocations in one of these states
        required: false
        deprecated: false
        explode: true
      - name: kind
        schema:
          $ref: '#/components/schemas/InvocationKind'
        in: query
        required: false
        deprecated: false
        explode: true
      - name: since
        schema:
          type: string
          format: date-time
        in: query
        required: false
        deprecated: false
        explode: true
      - name: until
        schema:
          type: string
          format: date-time
        in: query
        required: false
