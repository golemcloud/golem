          format: uint64
        in: query
        required: false
        deprecated: false
        explode: true
      - name: include
        schema:
          $ref: '#/components/schemas/OplogInclude'
        in: query
        required: false
        deprecated: false
        explode: true
      - name: expectedFingerprint
        schema:
          type: string
          format: uuid
        in: query
        required: false
        deprecated: false
        explode: true
