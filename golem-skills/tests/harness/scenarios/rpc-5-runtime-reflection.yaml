name: "rpc-5-runtime-reflection"
steps:
  - id: "create-project"
    only_if:
      language: "ts"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "create-effect-project"
    only_if:
      language: "effect"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-reflected-rpc"
    only_if:
      language: "ts"
    prompt: >
      In the TypeScript test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`. Give it an `echo` method that accepts a string
      `message` and returns that message.

      Add a second durable `ReflectionCaller` agent with a `run` method. In `run`, use
      the Golem TypeScript SDK runtime reflection APIs to list the registered agent
      types, look up `ReflectionTarget` by name, inspect its `echo` method, and invoke
      `ReflectionTarget("target")` through the reflected client with `"hello"`.

      Also define a full caller-owned `ReflectionTarget` client whose
      string ID uses a Standard Schema library. Get the target's AgentId in two
      ways: first from the full client's `upsert` for the same name and its
      `agentId()`, and then from the invocation metadata of the first reflected
      call. Connect the full client definition to that AgentId with `getById` and
      invoke `echo` with `"schema library"`. Invoke the reflected `echo` method
      through its value API with a Golem `SchemaValue` built with the SDK's `v`
      helpers to send `"schema value"`.

      Also create a standalone method-only `defineAgentClient({ methods: { echo: ... } })`
      client (no name, ID, config, or mode). Connect it to the same AgentId with
      `getById` and invoke `echo` with `"method only"`; do not reuse the
      full client for this call.

      Use `DynamicAgentClient.getById` with the same AgentId and a packed
      `SchemaValue` to invoke `echo` with `"dynamic"`.

      Resolve the target's current type with `getAgentTypeByAgentId` after the
      first invocation, connect that reflected type's client to the AgentId with
      `getById`, and invoke `echo` again with `"again"`.

      Return exactly an object with fields `listed`, `typeName`, `methodName`, `first`,
      `second`, `schemaIdsMatch`, `schemaLibrary`, `schemaValue`, `methodOnly`, and
      `dynamic`. They must
      respectively contain whether `ReflectionTarget` appeared in the discovered
      list, the discovered type name, the reflected method name, the two reflected
      echoed values, whether both ways gave the same AgentId, the full-client and
      reflected value-API results, the standalone method-only result,
      and the dynamic result. Make sure the project builds
      successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-ts"
    verify:
      build: true
      deploy: true

  - id: "verify-reflected-rpc"
    only_if:
      language: "ts"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.first"
          equals: "hello"
        - path: "$.second"
          equals: "again"
        - path: "$.schemaIdsMatch"
          equals: true
        - path: "$.schemaLibrary"
          equals: "schema library"
        - path: "$.schemaValue"
          equals: "schema value"
        - path: "$.methodOnly"
          equals: "method only"
        - path: "$.dynamic"
          equals: "dynamic"

  - id: "add-effect-reflected-rpc"
    only_if:
      language: "effect"
    prompt: >
      In the Effect-based test-app, add a durable `ReflectionTarget` agent identified by a string
      `name`, with an Effect handler `echo` that accepts `{ message: string }` and returns the
      message. Add a durable `ReflectionCaller` whose Effect-based `run` handler uses the current
      `Reflection` API from `@golemcloud/effect-golem`: list visible types, find
      `ReflectionTarget`, inspect `echo`, and connect its reflected durable client with
      `upsert({ name: "target" })` to invoke `echo` with `{ message: "hello" }`. Take the
      `AgentId` of the returned metadata, resolve its type with
      `Reflection.getAgentTypeByAgentId`, and connect it through `Client.bind(id, reflectedType)`
      to invoke `"again"`.

      Define a full caller-owned `defineAgentClient` spec named `ReflectionTarget`
      with the same string ID and `echo` method, then get the agent ID of its
      `upsert` client for the same name through `agentId`, connect to it with
      `Client.bind(id, spec)`, and call `"full"`. Independently define a method-only
      `defineAgentClient({ methods: { echo: ... } })`, connect it to the same AgentId
      with `Client.bind`, and call `"method only"`. Finally connect through the fully
      dynamic `DynamicClient.bind(id)` and invoke with packed `SchemaValue`
      input to return `"dynamic"`. These calls must not import or implement
      the target's implementation in the caller module.

      Return `{ listed, typeName, methodName, value, resolvedName, reflected,
      full, methodOnly, dynamic, identityMatches }`, comparing both agent IDs
      with `AgentId.format` for `identityMatches`. Keep all operations Effect-native and
      inside `Effect.scoped`; preserve typed error channels. Guard the reflected
      type's discriminated `mode` before using its durable-only factory. Build
      and deploy successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-effect"
    verify:
      build: true
      deploy: true

  - id: "verify-effect-reflected-rpc"
    only_if:
      language: "effect"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.ok.listed"
          equals: true
        - path: "$.ok.typeName"
          equals: "ReflectionTarget"
        - path: "$.ok.methodName"
          equals: "echo"
        - path: "$.ok.value"
          equals: "hello"
        - path: "$.ok.resolvedName"
          equals: "ReflectionTarget"
        - path: "$.ok.reflected"
          equals: "again"
        - path: "$.ok.full"
          equals: "full"
        - path: "$.ok.methodOnly"
          equals: "method only"
        - path: "$.ok.dynamic"
          equals: "dynamic"
        - path: "$.ok.identityMatches"
          equals: true
  - id: "create-rust-project"
    only_if:
      language: "rust"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-rust-reflected-rpc"
    only_if:
      language: "rust"
    prompt: >
      In the Rust test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`. Give it an `echo` method that accepts a
      string `message` and returns that message.

      Add a second durable `ReflectionCaller` agent with an async `run` method.
      In `run`, use the Golem Rust SDK runtime reflection APIs to list the
      registered agent types, look up `ReflectionTarget` by name, inspect its
      `echo` method, and invoke `ReflectionTarget("target")` through the JSON
      convenience API with `"hello"`.

      Define a method-only caller-defined static client for `ReflectionTarget` with
      `#[agent_client]`, connect it with `get_by_id` to the agent ID of the reflected
      target client without performing discovery in that client, and invoke `echo` with `"caller codec"`.
      Then explicitly pack `{ "message": "reflected value" }` with the
      reflected method's `SchemaRef`, invoke through `invoke_value`, and await
      `unpack_json`. Finally connect a dynamic client to the same agent ID, manually
      construct the positional input `SchemaValue::Record`, and invoke `echo`
      with `"direct value"` without using a schema for that call.

      Return a schema-derived record with fields `listed`, `type_name`,
      `method_name`, `json_value`, `caller_codec`, `reflected_value`, and
      `direct_value`. Make sure the project builds successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-rust"
    verify:
      build: true
      deploy: true

  - id: "verify-rust-reflected-rpc"
    only_if:
      language: "rust"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.type_name"
          equals: "ReflectionTarget"
        - path: "$.method_name"
          equals: "echo"
        - path: "$.json_value"
          equals: "hello"
        - path: "$.caller_codec"
          equals: "caller codec"
        - path: "$.reflected_value"
          equals: "reflected value"
        - path: "$.direct_value"
          equals: "direct value"

  - id: "create-scala-project"
    only_if:
      language: "scala"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-scala-reflected-rpc"
    only_if:
      language: "scala"
    prompt: >
      In the Scala test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`, with an `echo` method accepting and
      returning a string. Add a durable `ReflectionCaller` whose async `run`
      method discovers `ReflectionTarget`, inspects `echo`, and invokes it
      through the JSON convenience path with `hello`.

      Also define a discovery-free caller-owned method-only client using
      `InputRecordCodec` and `OutputCodec`, and invoke `echo` with
      `caller codec`. Explicitly pack JSON through the reflected method
      `SchemaRef`, invoke its value API, await the result, and unpack it as
      `reflected value`. Finally bind a dynamic client to the same AgentId,
      manually construct the positional `SchemaValue.RecordValue`, and invoke
      `echo` with `direct value` without schemas.

      Return a schema-derived record containing `listed`, `typeName`,
      `methodName`, `jsonValue`, `callerCodec`, `reflectedValue`, and
      `directValue`. Make sure the project builds successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-scala"
    verify:
      build: true
      deploy: true

  - id: "verify-scala-reflected-rpc"
    only_if:
      language: "scala"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.jsonValue"
          equals: "hello"
        - path: "$.callerCodec"
          equals: "caller codec"
        - path: "$.reflectedValue"
          equals: "reflected value"
        - path: "$.directValue"
          equals: "direct value"

  - id: "create-moonbit-project"
    only_if:
      language: "moonbit"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-moonbit-reflected-rpc"
    only_if:
      language: "moonbit"
    prompt: >
      In the MoonBit test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`, with an `echo` method accepting and
      returning a string. Add a durable `ReflectionCaller` whose async `run`
      method discovers `ReflectionTarget`, inspects `echo`, and invokes it
      through the JSON convenience path with `hello`.

      Also invoke the same target through a discovery-free
      `CallerCodecClient` with caller-authored record codecs and the message
      `caller codec`. Explicitly pack JSON through the reflected method
      `SchemaRef`, invoke its value API, await the result, and unpack it as
      `reflected value`. Finally bind a `DynamicAgentClient` to the same
      `AgentId`, manually construct a positional `SchemaValue::Record`, and
      invoke `echo` with `direct value` without schemas.

      Return a schema-derived record containing `listed`, `type_name`,
      `method_name`, `json_value`, `caller_codec`, `reflected_value`, and
      `direct_value`. Make sure the project builds successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-moonbit"
    verify:
      build: true
      deploy: true

  - id: "verify-moonbit-reflected-rpc"
    only_if:
      language: "moonbit"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.type_name"
          equals: "ReflectionTarget"
        - path: "$.method_name"
          equals: "echo"
        - path: "$.json_value"
          equals: "hello"
        - path: "$.caller_codec"
          equals: "caller codec"
        - path: "$.reflected_value"
          equals: "reflected value"
        - path: "$.direct_value"
          equals: "direct value"

  - id: "create-go-project"
    only_if:
      language: "go"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-go-reflected-rpc"
    only_if:
      language: "go"
    prompt: >
      In the Go test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`, with an `echo` method accepting a string
      `message` and returning it. Add a durable `ReflectionCaller` agent with a
      `run` method. In `run`, use the Go SDK's `reflection` package to list the
      registered agent types, look up `ReflectionTarget` by name, inspect its
      `echo` method, and invoke `ReflectionTarget("target")` through the
      discovered type's client with `"hello"`.

      Also define a caller-owned method-only client for `echo` with
      `golem.DefineAgentClient`, bind it to the target's agent ID without
      discovery, and invoke `echo` with `"caller codec"`. Explicitly pack
      `{ "message": "reflected value" }` as JSON through the reflected method's
      input schema, invoke it through a dynamic client bound to the same agent
      ID, and unpack the result through the reflected output schema. Finally
      invoke `echo` through that dynamic client again with a manually
      constructed positional record value holding `"direct value"`, without
      using a schema for that call.

      Return a struct with fields `Listed`, `TypeName`, `MethodName`,
      `JSONValue`, `CallerCodec`, `ReflectedValue`, and `DirectValue`. Make
      sure the project builds successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-go"
    verify:
      build: true
      deploy: true

  - id: "verify-go-reflected-rpc"
    only_if:
      language: "go"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.jsonValue"
          equals: "hello"
        - path: "$.callerCodec"
          equals: "caller codec"
        - path: "$.reflectedValue"
          equals: "reflected value"
        - path: "$.directValue"
          equals: "direct value"
