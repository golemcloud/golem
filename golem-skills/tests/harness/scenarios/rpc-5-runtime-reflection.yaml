name: "rpc-5-runtime-reflection"
steps:
  - id: "create-project"
    only_if:
      language: "ts"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "create-effect-project"
    only_if:
      language: "effect"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-reflected-rpc"
    only_if:
      language: "ts"
    prompt: >
      In the TypeScript test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`. Give it an `echo` method that accepts a string
      `message` and returns that message.

      Add a second durable `ReflectionCaller` agent with a `run` method. In `run`, use
      the Golem TypeScript SDK runtime reflection APIs to list the registered agent
      types, look up `ReflectionTarget` by name, inspect its `echo` method, and invoke
      `ReflectionTarget("target")` through the reflected client with `"hello"`.

      Also define a full caller-owned `ReflectionTarget` client whose
      string ID uses a Standard Schema library. Construct the same target AgentId in
      two ways: first through the client's `agentId` helper, and then explicitly
      with `ParsedAgentId.create` and a Golem `SchemaValue` built with the SDK's `v` helpers.
      Bind the client definition to each ID and invoke `echo` with `"schema library"` and
      `"schema value"` respectively.

      Also create a standalone method-only `defineAgentClient({ methods: { echo: ... } })`
      client (no name, ID, config, or mode). Bind it to the already constructed
      `ParsedAgentId` and invoke `echo` with `"method only"`; do not reuse the
      full client for this call.

      Use the parsed identity's fully dynamic `dynamicClient()` with a packed
      `SchemaValue` to invoke `echo` with `"dynamic"`.

      Construct the target's concrete AgentId from the reflected type, resolve its
      current type with `getAgentTypeByAgentId` after the first invocation, bind that
      reflected type to the AgentId, and invoke `echo` again with `"again"`.

      Return exactly an object with fields `listed`, `typeName`, `methodName`, `first`,
      `second`, `schemaIdsMatch`, `schemaLibrary`, `schemaValue`, `methodOnly`, and
      `dynamic`. They must
      respectively contain whether `ReflectionTarget` appeared in the discovered
      list, the discovered type name, the reflected method name, the two reflected
      echoed values, whether both caller-constructed identities have the same agent ID
      string, the two full-client results, the standalone method-only result,
      and the dynamic result. Make sure the project builds
      successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-ts"
    verify:
      build: true
      deploy: true

  - id: "verify-reflected-rpc"
    only_if:
      language: "ts"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.first"
          equals: "hello"
        - path: "$.second"
          equals: "again"
        - path: "$.schemaIdsMatch"
          equals: true
        - path: "$.schemaLibrary"
          equals: "schema library"
        - path: "$.schemaValue"
          equals: "schema value"
        - path: "$.methodOnly"
          equals: "method only"
        - path: "$.dynamic"
          equals: "dynamic"

  - id: "add-effect-reflected-rpc"
    only_if:
      language: "effect"
    prompt: >
      In the Effect-based test-app, add a durable `ReflectionTarget` agent identified by a string
      `name`, with an Effect handler `echo` that accepts `{ message: string }` and returns the
      message. Add a durable `ReflectionCaller` whose Effect-based `run` handler uses the current
      `Reflection` API from `@golemcloud/effect-golem`: list visible types, find
      `ReflectionTarget`, inspect `echo`, and bind its reflected durable client to
      `{ name: "target" }` to invoke `echo` with `{ message: "hello" }`. Parse the returned
      metadata agent ID with `AgentIdentity.parse`, resolve its type by the parsed identity,
      and bind it through `identity.client(reflectedType)` to invoke `"again"`.

      Define a full caller-owned `defineAgentClient` spec named `ReflectionTarget`
      with the same string ID and `echo` method, then use its `agentId` and
      `identity.client` to call `"full"`. Independently define a method-only
      `defineAgentClient({ methods: { echo: ... } })`, bind that parsed identity
      with `identity.client`, and call `"method only"`. Finally bind it through
      the fully dynamic `identity.dynamicClient()` and invoke with packed `SchemaValue`
      input to return `"dynamic"`. These calls must not import or implement
      the target's implementation in the caller module.

      Return `{ listed, typeName, methodName, value, resolvedName, reflected,
      full, methodOnly, dynamic, identityMatches }`, comparing both encoded
      identities for `identityMatches`. Keep all operations Effect-native and
      inside `Effect.scoped`; preserve typed error channels. Guard the reflected
      type's discriminated `mode` before using its durable-only factory. Build
      and deploy successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-effect"
    verify:
      build: true
      deploy: true

  - id: "verify-effect-reflected-rpc"
    only_if:
      language: "effect"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.ok.listed"
          equals: true
        - path: "$.ok.typeName"
          equals: "ReflectionTarget"
        - path: "$.ok.methodName"
          equals: "echo"
        - path: "$.ok.value"
          equals: "hello"
        - path: "$.ok.resolvedName"
          equals: "ReflectionTarget"
        - path: "$.ok.reflected"
          equals: "again"
        - path: "$.ok.full"
          equals: "full"
        - path: "$.ok.methodOnly"
          equals: "method only"
        - path: "$.ok.dynamic"
          equals: "dynamic"
        - path: "$.ok.identityMatches"
          equals: true
