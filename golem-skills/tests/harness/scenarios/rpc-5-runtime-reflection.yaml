name: "rpc-5-runtime-reflection"
steps:
  - id: "create-project"
    only_if:
      language: "ts"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "create-effect-project"
    only_if:
      language: "effect"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-reflected-rpc"
    only_if:
      language: "ts"
    prompt: >
      In the TypeScript test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`. Give it an `echo` method that accepts a string
      `message` and returns that message.

      Add a second durable `ReflectionCaller` agent with a `run` method. In `run`, use
      the Golem TypeScript SDK runtime reflection APIs to list the registered agent
      types, look up `ReflectionTarget` by name, inspect its `echo` method, and invoke
      `ReflectionTarget("target")` through the reflected client with `"hello"`.

      Also define a complete caller-owned `ReflectionTarget` client contract whose
      string ID uses a Standard Schema library. Construct the same target AgentId in
      two ways: first through the contract's `agentId` helper, and then explicitly
      with `ParsedAgentId.create` and a Golem `SchemaValue` built with the SDK's `v` helpers.
      Bind the contract to each ID and invoke `echo` with `"schema library"` and
      `"schema value"` respectively.

      Construct the target's concrete AgentId from the reflected type, resolve its
      current type with `getAgentTypeByAgentId` after the first invocation, bind that
      reflected type to the AgentId, and invoke `echo` again with `"again"`.

      Return exactly an object with fields `listed`, `typeName`, `methodName`, `first`,
      `second`, `schemaIdsMatch`, `schemaLibrary`, and `schemaValue`. They must
      respectively contain whether `ReflectionTarget` appeared in the discovered
      list, the discovered type name, the reflected method name, the two reflected
      echoed values, whether both caller-constructed identities have the same agent ID
      string, and the two contract-call results. Make sure the project builds
      successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-ts"
    verify:
      build: true
      deploy: true

  - id: "verify-reflected-rpc"
    only_if:
      language: "ts"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.first"
          equals: "hello"
        - path: "$.second"
          equals: "again"
        - path: "$.schemaIdsMatch"
          equals: true
        - path: "$.schemaLibrary"
          equals: "schema library"
        - path: "$.schemaValue"
          equals: "schema value"

  - id: "add-effect-reflected-rpc"
    only_if:
      language: "effect"
    prompt: >
      In the Effect-based test-app, add a durable `ReflectionTarget` agent identified by a string
      `name`, with an Effect handler `echo` that accepts `{ message: string }` and returns the
      message. Add a durable `ReflectionCaller` whose Effect-based `run` handler uses the current
      `Reflection` API from `@golemcloud/effect-golem`: list visible types, find
      `ReflectionTarget`, inspect `echo`, bind its reflected durable client to `{ name: "target" }`,
      invoke `echo` with `{ message: "hello" }`, resolve the type again from the returned metadata
      agent ID, and return `{ listed, typeName, methodName, value, resolvedName }`. Keep all
      reflection and RPC operations Effect-native and scoped. Guard the reflected type's
      discriminated `mode` before using its durable-only `client.get` factory. Build and deploy
      successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-effect"
    verify:
      build: true
      deploy: true

  - id: "verify-effect-reflected-rpc"
    only_if:
      language: "effect"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.typeName"
          equals: "ReflectionTarget"
        - path: "$.methodName"
          equals: "echo"
        - path: "$.value"
          equals: "hello"
        - path: "$.resolvedName"
          equals: "ReflectionTarget"

  - id: "create-rust-project"
    only_if:
      language: "rust"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-rust-reflected-rpc"
    only_if:
      language: "rust"
    prompt: >
      In the Rust test-app project, add a durable `ReflectionTarget` agent
      identified by a string `name`. Give it an `echo` method that accepts a
      string `message` and returns that message.

      Add a second durable `ReflectionCaller` agent with an async `run` method.
      In `run`, use the Golem Rust SDK runtime reflection APIs to list the
      registered agent types, look up `ReflectionTarget` by name, inspect its
      `echo` method, and invoke `ReflectionTarget("target")` through the JSON
      convenience API with `"hello"`.

      Define a partial caller-owned contract for `ReflectionTarget` with
      `#[agent_client]`, bind it to the reflected target ID without performing
      discovery in the contract, and invoke `echo` with `"caller codec"`.
      Then explicitly pack `{ "message": "reflected value" }` with the
      reflected method's `SchemaRef`, invoke through `invoke_value`, and await
      `unpack_json`. Finally bind a dynamic client to the same ID, manually
      construct the positional input `SchemaValue::Record`, and invoke `echo`
      with `"direct value"` without using a schema for that call.

      Return a schema-derived record with fields `listed`, `type_name`,
      `method_name`, `json_value`, `caller_codec`, `reflected_value`, and
      `direct_value`. Make sure the project builds successfully.
    expectedSkills:
      - "golem-agent-reflection"
      - "golem-agent-reflection-rust"
    verify:
      build: true
      deploy: true

  - id: "verify-rust-reflected-rpc"
    only_if:
      language: "rust"
    invoke_json:
      agent: 'ReflectionCaller("main")'
      method: "run"
    expect:
      result_json:
        - path: "$.listed"
          equals: true
        - path: "$.type_name"
          equals: "ReflectionTarget"
        - path: "$.method_name"
          equals: "echo"
        - path: "$.json_value"
          equals: "hello"
        - path: "$.caller_codec"
          equals: "caller codec"
        - path: "$.reflected_value"
          equals: "reflected value"
        - path: "$.direct_value"
          equals: "direct value"
