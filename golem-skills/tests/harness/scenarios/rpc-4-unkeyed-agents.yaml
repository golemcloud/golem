name: "rpc-4-unkeyed-agents"
steps:
  - id: "create-project"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-collector-and-unkeyed-rpc"
    prompt:
      rust: >
        In the test-app project, add a second agent type called `Collector` with a single
        constructor parameter for its name. It must expose three externally invokable
        methods: `add_value(value: u64)`, `get_values() -> list<u64>`, and
        `get_total() -> u64`. `add_value` appends the value to the agent's durable state.
        `get_values` returns all stored values in insertion order. `get_total` returns the
        sum of all stored values.

        Then modify the existing `CounterAgent` so it has three new externally invokable
        methods:

        1. `spawn_and_fill_unkeyed` — creates a **new agent without a key** of the `Collector`
           agent type using the counter's own name as the constructor parameter (use the
           generated client's `create` API without `keyed`), calls `add_value(10)` and then
           `add_value(20)` on it, and returns that collector's total (should be 30).

        2. `spawn_two_unkeyed` — creates **two** new `Collector` agents without a key (both
           using the counter's own name as the constructor parameter). Calls `add_value(1)`
           on the first one and `add_value(2)` on the second one. Then returns the
           total from each as a two-element list: `[total_of_first, total_of_second]`.

        3. `read_keyed_collector` — gets the **keyed** `Collector` agent with
           the counter's own name (using the regular `upsert` call, not `create`)
           and returns its total.

        Make sure the project builds successfully.
      ts: >
        In the test-app project, add a second agent type called `Collector` with a single
        constructor parameter for its name. It must expose three externally invokable
        methods: `addValue(value: number)`, `getValues(): number[]`, and
        `getTotal(): number`. `addValue` appends the value to the agent's durable state.
        `getValues` returns all stored values in insertion order. `getTotal` returns the
        sum of all stored values.

        Then modify the existing `CounterAgent` so it has three new externally invokable
        methods:

        1. `spawnAndFillUnkeyed` — creates a **new agent without a key** of the `Collector`
           agent type using the counter's own name as the constructor parameter (use the
           generated client's `create` API without `keyed`), calls `addValue(10)` and then
           `addValue(20)` on it, and returns that collector's total (should be 30).

        2. `spawnTwoUnkeyed` — creates **two** new `Collector` agents without a key (both
           using the counter's own name as the constructor parameter). Calls `addValue(1)`
           on the first one and `addValue(2)` on the second one. Then returns the
           total from each as a two-element list: `[total_of_first, total_of_second]`.

        3. `readKeyedCollector` — gets the **keyed** `Collector` agent with
           the counter's own name (using the regular `upsert` call, not `create`)
           and returns its total.

        Make sure the project builds successfully.
      effect: >
        In the Effect-based test-app project, add a second durable agent type called `Collector`
        with one `{ name: Schema.String }` constructor parameter. Define it with `defineAgent`,
        `method`, and Effect Schema from the real `@golemcloud/effect-golem` API. Give it
        snapshot-backed durable state containing an ordered array of numbers, initialized exactly
        once with `snapshot.init(...)`. It must expose three externally invokable Effect methods:
        `addValue(value: number)`, `getValues(): number[]`, and `getTotal(): number`. `addValue`
        appends to the state, `getValues` returns insertion order, and `getTotal` returns the sum.

        Modify the existing Effect `Counter` agent rather than creating a duplicate. Rename its
        exported TypeScript binding and its `defineAgent` runtime name to exactly `CounterAgent`,
        and update the matching `httpApi` agent key in `golem.yaml`. Preserve its constructor
        parameter, snapshot-backed count, and original `increment` behavior. Add three externally
        invokable methods:

        1. `spawnAndFillUnkeyed` — yield `Collector.client.create({ name })` without `keyed`, using
           the counter's own name, so it creates a new agent without a key. Await
           `addValue({ value: 10 })` and `addValue({ value: 20 })`, then return the result of
           `getTotal({})`, which should be 30.

        2. `spawnTwoUnkeyed` — yield two separate `Collector.client.create({ name })` Effects
           with the same name. Add 1 only to the first and 2 only to the second, then return their
           totals as `[totalOfFirst, totalOfSecond]`.

        3. `readKeyedCollector` — yield the keyed durable handle from
           `Collector.client.upsert({ name })`, not `create` or `getById`, and return its total.
           Do not declare this method read-only: obtaining an RPC handle is a host side effect.

        Yield every typed client and remote method Effect, use named input records including `{}`
        for no-parameter methods, and handle or convert typed RPC errors so the method contracts
        type-check. Do not use Promise-based TypeScript SDK APIs. Import every implementation module
        from `src/main.ts`. Make sure the project builds successfully.
      scala: >
        In the test-app project, add a second agent type called `Collector` with a single
        constructor parameter for its name. It must expose three externally invokable
        methods: `addValue(value: Long)`, `getValues(): List[Long]`, and
        `getTotal(): Long`. `addValue` appends the value to the agent's durable state.
        `getValues` returns all stored values in insertion order. `getTotal` returns the
        sum of all stored values.

        Then modify the existing `CounterAgent` so it has three new externally invokable
        methods:

        1. `spawnAndFillUnkeyed` — creates a **new agent without a key** of the `Collector`
           agent type using the counter's own name as the constructor parameter (use the
           generated client's `create` API without `keyed`), calls `addValue(10)` and then
           `addValue(20)` on it, and returns that collector's total (should be 30).

        2. `spawnTwoUnkeyed` — creates **two** new `Collector` agents without a key (both
           using the counter's own name as the constructor parameter). Calls `addValue(1)`
           on the first one and `addValue(2)` on the second one. Then returns the
           total from each as a two-element list: `[total_of_first, total_of_second]`.

        3. `readKeyedCollector` — gets the **keyed** `Collector` agent with
           the counter's own name (using the regular `upsert` call, not `create`)
           and returns its total.

        Make sure the project builds successfully.
      moonbit: >
        In the test-app project, add a second agent type called `Collector` with a single
        constructor parameter for its name. It must expose three externally invokable
        methods: `add_value(value: UInt64)`, `get_values() -> Array[UInt64]`, and
        `get_total() -> UInt64`. `add_value` appends the value to the agent's durable state.
        `get_values` returns all stored values in insertion order. `get_total` returns the
        sum of all stored values.

        Then modify the existing `CounterAgent` so it has three new externally invokable
        methods:

        1. `spawn_and_fill_unkeyed` — creates a **new agent without a key** of the `Collector`
           agent type using the counter's own name as the constructor parameter (use the
           generated client's `create` API without `keyed`), calls `add_value(10)` and then
           `add_value(20)` on it, and returns that collector's total (should be 30).

        2. `spawn_two_unkeyed` — creates **two** new `Collector` agents without a key (both
           using the counter's own name as the constructor parameter). Calls `add_value(1)`
           on the first one and `add_value(2)` on the second one. Then returns the
           total from each as a two-element list: `[total_of_first, total_of_second]`.

        3. `read_keyed_collector` — gets the **keyed** `Collector` agent with
           the counter's own name (using the regular `upsert` call, not `create`)
           and returns its total.

        Make sure the project builds successfully.
      go: >
        In the test-app project, add a second agent type called `Collector` with a single
        constructor parameter for its name. It must expose three externally invokable methods:
        `addValue(value int64)`, `getValues() []int64`, and `getTotal() int64`. `addValue`
        appends the value to the agent's durable state. `getValues` returns all stored values in
        insertion order. `getTotal` returns the sum of all stored values.

        Then modify the existing `CounterAgent` so it has three new externally invokable methods:

        1. `spawnAndFillUnkeyed` — creates a **new agent without a key** of the `Collector`
           agent type using the counter's own name as the constructor parameter (use the
           generated client's `Create` API without the keyed option), calls `addValue(10)` and
           then `addValue(20)` on it, and returns that collector's total (should be 30).

        2. `spawnTwoUnkeyed` — creates **two** new `Collector` agents without a key (both
           using the counter's own name as the constructor parameter). Calls `addValue(1)`
           on the first one and `addValue(2)` on the second one. Then returns the
           total from each as a two-element list: `[total_of_first, total_of_second]`.

        3. `readKeyedCollector` — gets the **keyed** `Collector` agent with
           the counter's own name (using the regular `Upsert` call, not `Create`
           or an agent ID) and returns its total.

        Make sure the project builds successfully.
    expectedSkills:
      rust:
        - "golem-multi-instance-agent-rust"
      ts:
        - "golem-multi-instance-agent-ts"
      effect:
        - "golem-multi-instance-agent-effect"
      scala:
        - "golem-multi-instance-agent-scala"
      moonbit:
        - "golem-multi-instance-agent-moonbit"
      go:
        - "golem-multi-instance-agent-go"
    verify:
      build: true
      deploy: true

  # Creating an agent without a key, adding two values, and reading back the total
  - id: "spawn-and-fill-unkeyed"
    invoke_json:
      agent: 'CounterAgent("c1")'
      method:
        rust: "spawn_and_fill_unkeyed"
        ts: "spawnAndFillUnkeyed"
        effect: "spawnAndFillUnkeyed"
        scala: "spawnAndFillUnkeyed"
        moonbit: "spawn_and_fill_unkeyed"
        go: "spawnAndFillUnkeyed"
    expect:
      result_json:
        - path: "$"
          equals: 30

  # Creating two independent agents without a key with the same constructor params
  - id: "spawn-two-unkeyed"
    invoke_json:
      agent: 'CounterAgent("c1")'
      method:
        rust: "spawn_two_unkeyed"
        ts: "spawnTwoUnkeyed"
        effect: "spawnTwoUnkeyed"
        scala: "spawnTwoUnkeyed"
        moonbit: "spawn_two_unkeyed"
        go: "spawnTwoUnkeyed"
    expect:
      result_json:
        - path: "$[0]"
          equals: 1
        - path: "$[1]"
          equals: 2

  # The keyed Collector("c1") must be untouched by the agents without a key
  - id: "keyed-collector-untouched"
    invoke_json:
      agent: 'Collector("c1")'
      method:
        rust: "get_total"
        ts: "getTotal"
        effect: "getTotal"
        scala: "getTotal"
        moonbit: "get_total"
        go: "getTotal"
    expect:
      result_json:
        - path: "$"
          equals: 0

  # Double-check via the counter's own helper method
  - id: "read-keyed-via-counter"
    invoke_json:
      agent: 'CounterAgent("c1")'
      method:
        rust: "read_keyed_collector"
        ts: "readKeyedCollector"
        effect: "readKeyedCollector"
        scala: "readKeyedCollector"
        moonbit: "read_keyed_collector"
        go: "readKeyedCollector"
    expect:
      result_json:
        - path: "$"
          equals: 0
