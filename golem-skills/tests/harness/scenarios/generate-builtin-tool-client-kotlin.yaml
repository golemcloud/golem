name: generate-builtin-tool-client-kotlin
steps:
  - id: create-project
    only_if: { language: kotlin }
    create_project:
      name: test-app

  - id: generate-bash-client
    only_if: { language: kotlin }
    prompt: >
      In test-app, add CounterAgent.runScript with one string input named script and a
      string return value. Invoke the built-in bash tool through a generated Kotlin
      BashClient using run(script, "", 600). Return the result's stdout without trimming
      it; bash returns stdout as a string in its result, not a stream. Reject a nonzero
      exit code and propagate tool or RPC failures instead of returning a fabricated
      result.
      Declare tools.bash.release with account builtin-tool-owner@golem.cloud, name bash,
      version "0.2.1". Add bash to the CounterAgent component's dependencies.tools and
      bind bash at the component or agent level with filesystemAccess: allowed.
      Use the dependency's automatic client generation with golem build, without an
      explicit bridge selection. Add the generated Kotlin source directory to the
      component's wasmWasiMain source set so the client compiles into the agent.
      Do not hand-write or copy a consumer tool schema, edit generated code, use a raw
      tool invocation API, or execute the script directly in the agent. Preserve the
      template CounterAgent identity. Make sure the app builds and deploys locally.
    expectedSkills:
      - golem-generating-tool-clients
    allowedExtraSkills:
      - golem-call-tool-kotlin
      - golem-edit-manifest
      - golem-build
      - golem-deploy
      - golem-add-agent-kotlin
      - golem-add-kotlin-dependency
    verify:
      build: true
      deploy: true
      expectedFiles:
        # The generator writes a whole Gradle project; the client class lands in the package
        # `golem.bridge.client.bash_tool` (bridge_gen/kotlin/mod.rs derives it from the tool name).
        - test-app/golem-temp/bridge-sdk/kotlin/internal/bash-tool-guest-client/build.gradle.kts
        - test-app/golem-temp/bridge-sdk/kotlin/internal/bash-tool-guest-client/src/wasmWasiMain/kotlin/golem/bridge/client/bash_tool/BashClient.kt
  - id: invoke-asymmetric-script
    only_if: { language: kotlin }
    invoke_json:
      agent: 'CounterAgent("bash-client")'
      method: runScript
      args: '"left=7; right=19; printf ''typed-bash:%s:%s'' \"$((left * 3 + right))\" \"$((right - left))\""'
    expect:
      result_json:
        - path: "$"
          equals: "typed-bash:40:12"
