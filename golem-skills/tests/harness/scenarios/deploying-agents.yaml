name: "deploying-agents"
steps:
  - id: "create-project"
    create_project:
      name: test-app

  - id: "deploy-project"
    prompt: "Build and deploy the test-app project."
    expectedSkills:
      - "golem-deploy"

  - id: "invoke-increment"
    invoke_json:
      agent:
        effect: 'Counter("test")'
        rust: &default-counter-agent 'CounterAgent("test")'
        ts: *default-counter-agent
        scala: *default-counter-agent
        moonbit: *default-counter-agent
      method: 'increment'
    expect:
      result_json:
        - path: "$"
          equals: 1
