name: "view-agent-logs"
steps:
  - id: "create-project"
    create_project:
      name: test-app
    verify:
      build: true
      deploy: true

  - id: "add-logging"
    prompt:
      rust: >
        In the test-app project, modify the CounterAgent's increment method to print the
        current counter value to stdout each time it is called, using println!. For example,
        print "counter value: {value}" where {value} is the counter value after incrementing.
      ts: >
        In the test-app project, modify the CounterAgent's increment method to print the
        current counter value to stdout each time it is called, using console.log. For example,
        print "counter value: {value}" where {value} is the counter value after incrementing.
      effect: >
        In the Effect-based test-app project, modify the existing `Counter` agent's Effect-based
        `increment` handler to log `counter value: {value}` to stdout after incrementing. Use
        Effect logging primitives, preserve the `Counter` runtime name, and import the
        implementation from `src/main.ts`.
      scala: >
        In the test-app project, modify the CounterAgent's increment method to print the
        current counter value to stdout each time it is called, using println. For example,
        print "counter value: {value}" where {value} is the counter value after incrementing.
      kotlin: >
        In the test-app project, modify the CounterAgent's increment method to print the
        current counter value to stdout each time it is called, using println. For example,
        print "counter value: {value}" where {value} is the counter value after incrementing.
        Do not invoke any CounterAgent instance yourself; the harness counts the increments of
        the instance named "c1".
      moonbit: >
        In the test-app project, modify the CounterAgent's increment method to print the
        current counter value to stdout each time it is called, using println. For example,
        print "counter value: {value}" where {value} is the counter value after incrementing.
      go: "In the test-app project, modify the CounterAgent's increment method to print the current counter value to stdout each time it is called, using fmt.Println. For example, print \"counter value: {value}\" where {value} is the counter value after incrementing."
    verify:
      build: true
      deploy: true

  - id: "invoke-no-stream"
    prompt:
      rust: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with log streaming disabled (using --no-stream) to see what the
        output looks like without streaming. Redirect the full CLI output (both stdout and stderr)
        to a file called no-stream-output.txt in the test-app directory.
      ts: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with log streaming disabled (using --no-stream) to see what the
        output looks like without streaming. Redirect the full CLI output (both stdout and stderr)
        to a file called no-stream-output.txt in the test-app directory.
      effect: >
        Invoke the Counter agent named "c1" method `increment` through the CLI with log streaming
        disabled (`--no-stream`). Redirect all stdout and stderr to `no-stream-output.txt` in the
        test-app directory.
      scala: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with log streaming disabled (using --no-stream) to see what the
        output looks like without streaming. Redirect the full CLI output (both stdout and stderr)
        to a file called no-stream-output.txt in the test-app directory.
      kotlin: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with live log streaming turned off, so the CLI prints the
        invocation result and nothing the agent logged, to see what the output looks like without
        streaming. Redirect the full CLI output (both stdout and stderr) to a file called
        no-stream-output.txt in the test-app directory. Invoke "c1" exactly once.
      moonbit: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with log streaming disabled (using --no-stream) to see what the
        output looks like without streaming. Redirect the full CLI output (both stdout and stderr)
        to a file called no-stream-output.txt in the test-app directory.
      go: >
        I want to view the agent's stdout logs. First, invoke the CounterAgent's increment method
        for a counter named "c1" with log streaming disabled (using --no-stream) to see what the
        output looks like without streaming. Redirect the full CLI output (both stdout and stderr)
        to a file called no-stream-output.txt in the test-app directory.
    # `golem-invoke-agent-kotlin` documents `--no-stream` itself (its flag table), and
    # `golem-logging-kotlin` points at it, so a Kotlin agent asked to turn streaming off never
    # needs the log-viewing skill — two runs activated those two and not it. Only the
    # `--logs-only`, `--stream-no-timestamp` and `--stream-no-log-level` flags of the later step
    # are exclusive to `golem-view-agent-logs`. The other six expectations are untouched.
    expectedSkills:
      rust:
        - "golem-view-agent-logs"
      ts:
        - "golem-view-agent-logs"
      effect:
        - "golem-view-agent-logs"
      scala:
        - "golem-view-agent-logs"
      moonbit:
        - "golem-view-agent-logs"
      go:
        - "golem-view-agent-logs"
      kotlin:
        - "golem-invoke-agent-kotlin"

  - id: "check-no-stream"
    check_file:
      path: "no-stream-output.txt"
    expect:
      stdout_not_contains: "counter value:"

  - id: "invoke-with-stream"
    prompt:
      rust: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        default streaming enabled (no --no-stream flag). Redirect the full CLI output (both
        stdout and stderr) to a file called stream-output.txt in the test-app directory.
      ts: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        default streaming enabled (no --no-stream flag). Redirect the full CLI output (both
        stdout and stderr) to a file called stream-output.txt in the test-app directory.
      effect: >
        Invoke the Counter agent named "c1" method `increment` again through the CLI with default
        streaming enabled. Redirect all stdout and stderr to `stream-output.txt` in the test-app
        directory.
      scala: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        default streaming enabled (no --no-stream flag). Redirect the full CLI output (both
        stdout and stderr) to a file called stream-output.txt in the test-app directory.
      kotlin: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with the
        CLI's default live log streaming, so what the agent printed appears in the output.
        Redirect the full CLI output (both stdout and stderr) to a file called stream-output.txt
        in the test-app directory. Invoke it exactly once.
      moonbit: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        default streaming enabled (no --no-stream flag). Redirect the full CLI output (both
        stdout and stderr) to a file called stream-output.txt in the test-app directory.
      go: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        default streaming enabled (no --no-stream flag). Redirect the full CLI output (both
        stdout and stderr) to a file called stream-output.txt in the test-app directory.
    continueSession: true
    # Kotlin has no expectation here: the step repeats the previous invocation with the CLI's
    # default streaming, which `golem-invoke-agent-kotlin` already covers, and it continues the
    # same session, so no skill needs opening again.
    expectedSkills:
      rust:
        - "golem-view-agent-logs"
      ts:
        - "golem-view-agent-logs"
      effect:
        - "golem-view-agent-logs"
      scala:
        - "golem-view-agent-logs"
      moonbit:
        - "golem-view-agent-logs"
      go:
        - "golem-view-agent-logs"

  - id: "check-with-stream"
    check_file:
      path: "stream-output.txt"
    expect:
      stdout_contains: "counter value:"

  - id: "invoke-logs-only"
    prompt:
      rust: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        --logs-only, --stream-no-timestamp, and --stream-no-log-level flags. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory.
      ts: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        --logs-only, --stream-no-timestamp, and --stream-no-log-level flags. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory.
      effect: >
        Invoke the Counter agent named "c1" method `increment` again through the CLI with
        `--logs-only`, `--stream-no-timestamp`, and `--stream-no-log-level`. Redirect all stdout
        and stderr to `logs-only-output.txt` in the test-app directory.
      scala: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        --logs-only, --stream-no-timestamp, and --stream-no-log-level flags. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory.
      kotlin: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time showing
        only the entries the agent itself logged — no invocation markers and no stream status
        messages — and with timestamps and log levels hidden from that output. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory. Invoke it exactly once.
      moonbit: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        --logs-only, --stream-no-timestamp, and --stream-no-log-level flags. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory.
      go: >
        Now invoke the CounterAgent's increment method for counter "c1" again, this time with
        --logs-only, --stream-no-timestamp, and --stream-no-log-level flags. Redirect the full
        CLI output (both stdout and stderr) to a file called logs-only-output.txt in the
        test-app directory.
    continueSession: true
    expectedSkills:
      - "golem-view-agent-logs"

  - id: "check-logs-only"
    check_file:
      path: "logs-only-output.txt"
    expect:
      stdout_not_contains: "Invocation started"

  - id: "verify-counter"
    invoke_json:
      agent:
        effect: 'Counter("c1")'
        rust: 'CounterAgent("c1")'
        ts: 'CounterAgent("c1")'
        scala: 'CounterAgent("c1")'
        kotlin: 'CounterAgent("c1")'
        moonbit: 'CounterAgent("c1")'
        go: 'CounterAgent("c1")'
      method: "increment"
    expect:
      result_json:
        - path: "$"
          equals: 4
