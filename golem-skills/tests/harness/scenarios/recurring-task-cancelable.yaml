name: "recurring-task-cancelable"
semanticRequirements:
  effect:
    - Cancellation rebuilds the invocation handle from the stored invocation ID with InvocationId.get; the live handle is not kept across invocations.
steps:
  - id: "create-project"
    create_project:
      name: test-app
    verify:
      build: true

  - id: "add-cancelable-ticker"
    prompt:
      rust: >
        In the test-app project, add a second durable agent type called `Ticker`
        identified by a single name constructor parameter.

        `Ticker` must have mutable state:
        - `tick_count` (u64, initially 0): how many times `tick` has executed
        - `running` (bool, initially false): whether the recurring loop is active

        It must expose these externally invokable methods:

        - `start` — sets `running` to true and immediately calls `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tick_count` by 1. If `tick_count` is less than 5, it schedules
          itself (the same agent's `tick` method) to run again 5 seconds in the future.
          Scheduling returns the handle of the scheduled invocation. Store the
          invocation ID of that handle in agent state so a later invocation can
          cancel it. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored from a
          previous `tick`, rebuild the invocation handle from that ID and cancel it,
          so the pending scheduled invocation is withdrawn without waiting for it to
          fire. Returns nothing.

        - `get_tick_count` — returns `tick_count` as a u64.

        The self-scheduling must use the generated RPC client to schedule a future
        invocation on the same agent instance. In Rust, the async `schedule_tick`
        returns a `golem_rust::Invocation`; store its `id()` (an `OwnedInvocationId`)
        and cancel with `golem_rust::Invocation::<()>::get(&id).cancel().await`.

        Make sure the project builds successfully.
      ts: >
        In the test-app project, add a second durable agent type called `Ticker`
        identified by a single name constructor parameter.

        `Ticker` must have mutable state:
        - `tickCount` (number, initially 0): how many times `tick` has executed
        - `running` (boolean, initially false): whether the recurring loop is active

        It must expose these externally invokable methods:

        - `start` — sets `running` to true and immediately calls `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tickCount` by 1. If `tickCount` is less than 5, it schedules
          itself (the same agent's `tick` method) to run again 5 seconds in the future.
          Scheduling returns the handle of the scheduled invocation. Store the
          invocation ID of that handle in agent state so a later invocation can
          cancel it. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored from a
          previous `tick`, rebuild the invocation handle from that ID and cancel it,
          so the pending scheduled invocation is withdrawn without waiting for it to
          fire. Returns nothing.

        - `getTickCount` — returns `tickCount` as a number.

        The self-scheduling must use the generated RPC client to schedule a future
        invocation on the same agent instance. In TypeScript, `await .schedule()`
        resolves to an `Invocation`; store `invocation.id.toString()` and cancel with
        `await Invocation.get(InvocationId.parse(text), Ticker.methods.tick).cancel()`.

        Make sure the project builds successfully.
      effect: >
        In the Effect-based test-app project, add a second durable agent type called
        `Ticker`, defined with `defineAgent` and identified by one string constructor
        parameter named `name`.

        Keep mutable logical state in an Effect `Ref`:
        - `tickCount` (number, initially 0): how many times `tick` has executed
        - `running` (boolean, initially false): whether the recurring loop is active

        It must expose these externally invokable camelCase methods as Effect handlers:

        - `start` — sets `running` to true and immediately runs `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tickCount` by 1. If `tickCount` is less than 5, it obtains a typed
          client for the same `Ticker` identity and schedules that client's `tick` method
          to run again 5 seconds in the future. Store the text of the returned handle's
          invocation ID in agent state. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored, rebuild the
          handle from it and run its `cancel` Effect so the pending invocation is
          withdrawn immediately. Returns nothing.

        - `getTickCount` — returns `tickCount` as a number.

        Use the real `@golemcloud/effect-golem` API: `TickerDefinition.client.upsert({ name })`
        returns the self client, and `self.tick.schedule(scheduledAt, {})` returns an
        `InvocationId.Invocation` handle owned by the current Scope. Store
        `InvocationId.format(handle.id)` in a separate `Ref<string | null>`, and in `cancel`
        rebuild the handle with `InvocationId.parse` and
        `InvocationId.get(id, TickerDefinition.methods.tick)`, then `yield* handle.cancel`.
        Do not keep the live handle across invocations. Construct `scheduledAt` as
        `{ seconds: bigint, nanoseconds: number }` by yielding `DateTime.now` and converting
        it with `DateTime.toEpochMillis(...)`.

        Implement all methods with Effect, import the implementation module from `src/main.ts`,
        and make sure the project builds successfully.
      scala: >
        In the test-app project, add a second durable agent type called `Ticker`
        identified by a single name constructor parameter.

        `Ticker` must have mutable state:
        - `tickCount` (Long, initially 0): how many times `tick` has executed
        - `running` (Boolean, initially false): whether the recurring loop is active

        It must expose these externally invokable methods:

        - `start` — sets `running` to true and immediately calls `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tickCount` by 1. If `tickCount` is less than 5, it schedules
          itself (the same agent's `tick` method) to run again 5 seconds in the future.
          Scheduling returns the handle of the scheduled invocation. Store the
          invocation ID of that handle in agent state so a later invocation can
          cancel it. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored from a
          previous `tick`, rebuild the invocation handle from that ID and cancel it,
          so the pending scheduled invocation is withdrawn without waiting for it to
          fire. Returns nothing.

        - `getTickCount` — returns `tickCount` as a Long.

        The self-scheduling must use the generated RPC client to schedule a future
        invocation on the same agent instance. In Scala, `.tick.scheduleAt(when)`
        returns a `Future[golem.runtime.rpc.Invocation[Unit]]`; store its `id`
        (a `golem.InvocationId`) and cancel with
        `golem.runtime.rpc.Invocation.get[Unit](id).cancel()`.

        Make sure the project builds successfully.
      moonbit: >
        In the test-app project, add a second durable agent type called `Ticker`
        identified by a single name constructor parameter.

        `Ticker` must have mutable state:
        - `tick_count` (UInt64, initially 0): how many times `tick` has executed
        - `running` (Bool, initially false): whether the recurring loop is active

        It must expose these externally invokable methods:

        - `start` — sets `running` to true and immediately calls `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tick_count` by 1. If `tick_count` is less than 5, it schedules
          itself (the same agent's `tick` method) to run again 5 seconds in the future.
          Scheduling returns the handle of the scheduled invocation. Store the
          invocation ID of that handle in agent state so a later invocation can
          cancel it. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored from a
          previous `tick`, rebuild the invocation handle from that ID and cancel it,
          so the pending scheduled invocation is withdrawn without waiting for it to
          fire. Returns nothing.

        - `get_tick_count` — returns `tick_count` as a UInt64.

        The self-scheduling must use the generated RPC client to schedule a future
        invocation on the same agent instance. In MoonBit, the async `schedule_tick`
        returns an `@rpc.Invocation`; store `id().to_string()`, drop the handle, and
        cancel with `TickerClient::get_tick_invocation(@rpc.InvocationId::parse(text))`,
        calling `cancel()` and then `drop()` on the rebuilt handle.

        Make sure the project builds successfully.
      go: >
        In the test-app project, add a second durable agent type called `Ticker` identified by a
        single name constructor parameter.

        `Ticker` must have mutable state: - `tickCount` (int64, initially 0): how many times
        `tick` has executed - `running` (bool, initially false): whether the recurring loop is
        active

        It must expose these externally invokable methods:

        - `start` — sets `running` to true and immediately calls `tick`. Returns nothing.

        - `tick` — if `running` is false, returns without doing anything. Otherwise,
          increments `tickCount` by 1. If `tickCount` is less than 5, it schedules
          itself (the same agent's `tick` method) to run again 5 seconds in the future.
          Scheduling returns the handle of the scheduled invocation. Store the
          invocation ID of that handle in agent state so a later invocation can
          cancel it. Returns nothing.

        - `cancel` — sets `running` to false. If an invocation ID is stored from a
          previous `tick`, rebuild the invocation handle from that ID and cancel it,
          so the pending scheduled invocation is withdrawn without waiting for it to
          fire. Returns nothing.

        - `getTickCount` — returns `tickCount` as an int64.

        The self-scheduling must use the agent's own client to schedule a future invocation on the
        same agent instance. In Go, `Method.Schedule` returns a `*golem.Invocation`; store its
        `ID()` in state and cancel with `Tick.Invocation(id).Cancel()`.

        Make sure the project builds successfully.
    expectedSkills:
      rust:
        - "golem-recurring-task-rust"
      ts:
        - "golem-recurring-task-ts"
      effect:
        - "golem-recurring-task-effect"
      scala:
        - "golem-recurring-task-scala"
      moonbit:
        - "golem-recurring-task-moonbit"
      go:
        - "golem-recurring-task-go"
    verify:
      build: true
      deploy: true

  - id: "start-ticker"
    invoke:
      agent: 'Ticker("t1")'
      method:
        rust: "start"
        ts: "start"
        effect: "start"
        scala: "start"
        moonbit: "start"
        go: "start"

  - id: "verify-first-tick"
    invoke_json:
      agent: 'Ticker("t1")'
      method:
        rust: "get_tick_count"
        ts: "getTickCount"
        effect: "getTickCount"
        scala: "getTickCount"
        moonbit: "get_tick_count"
        go: "getTickCount"
    expect:
      result_json:
        - path: "$"
          equals: 1

  - id: "wait-for-second-tick"
    sleep: 6

  - id: "wait-for-effect-scheduler-poll"
    sleep: 2
    only_if:
      language: "effect"

  - id: "verify-second-tick"
    invoke_json:
      agent: 'Ticker("t1")'
      method:
        rust: "get_tick_count"
        ts: "getTickCount"
        effect: "getTickCount"
        scala: "getTickCount"
        moonbit: "get_tick_count"
        go: "getTickCount"
    expect:
      result_json:
        - path: "$"
          equals: 2

  - id: "cancel-ticker"
    invoke:
      agent: 'Ticker("t1")'
      method:
        rust: "cancel"
        ts: "cancel"
        effect: "cancel"
        scala: "cancel"
        moonbit: "cancel"
        go: "cancel"

  - id: "wait-past-would-be-third-tick"
    sleep: 8

  - id: "verify-no-more-ticks-after-cancel"
    invoke_json:
      agent: 'Ticker("t1")'
      method:
        rust: "get_tick_count"
        ts: "getTickCount"
        effect: "getTickCount"
        scala: "getTickCount"
        moonbit: "get_tick_count"
        go: "getTickCount"
    expect:
      result_json:
        - path: "$"
          equals: 2
