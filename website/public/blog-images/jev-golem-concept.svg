<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">Conceptual log classification and summarization flow</title>
  <desc id="description">Logs arrive over HTTP into a rolling context window. Jev classifies each line into zero or more configured categories. Matching lines and their context are sent to a separate registry for each category, where incidents are summarized and stored.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182522" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#435853"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#d9654c"/>
    </marker>
    <style>
      .section { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.7px; }
      .heading { font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #172421; }
      .body { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #43534f; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5c6d68; }
      .category { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #24332f; }
      .label { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #435853; }
      .flow { fill: none; stroke: #435853; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #d9654c; stroke-width: 3; marker-end: url(#arrow-coral); }
    </style>
  </defs>

  <rect width="1600" height="600" fill="#fbfaf7"/>

  <!-- HTTP ingress -->
  <g filter="url(#shadow)">
    <rect x="65" y="165" width="350" height="270" rx="22" fill="#ffffff" stroke="#d6dfdb" stroke-width="2"/>
    <rect x="90" y="190" width="80" height="28" rx="14" fill="#e7ebe9"/>
    <text x="130" y="210" text-anchor="middle" class="section" fill="#5b6965">HTTP</text>
    <text x="90" y="260" class="heading">Log ingress</text>
    <text x="90" y="295" class="body">Accept a stream of log lines</text>
    <rect x="90" y="330" width="300" height="75" rx="13" fill="#f1f7f4"/>
    <text x="110" y="360" class="category">Rolling context window</text>
    <text x="110" y="386" class="small">recent lines before and after a match</text>
  </g>

  <!-- Classification -->
  <g filter="url(#shadow)">
    <rect x="570" y="190" width="330" height="220" rx="22" fill="#ffffff" stroke="#efc1b4" stroke-width="2"/>
    <rect x="595" y="215" width="55" height="28" rx="14" fill="#ffe2d8"/>
    <text x="622" y="235" text-anchor="middle" class="section" fill="#b75440">JEV</text>
    <text x="595" y="285" class="heading">Classification</text>
    <text x="595" y="320" class="body">Evaluate configured categories</text>
    <rect x="595" y="350" width="280" height="36" rx="18" fill="#fff2ed"/>
    <text x="735" y="374" text-anchor="middle" class="label">0..N matching categories</text>
  </g>

  <!-- Per-category registries -->
  <rect x="1060" y="65" width="475" height="470" rx="24" fill="#edf7f3" stroke="#bad8cc" stroke-width="2"/>
  <text x="1090" y="105" class="section" fill="#28725e">ONE REGISTRY PER MATCHED CATEGORY</text>

  <g filter="url(#shadow)">
    <rect x="1130" y="140" width="365" height="100" rx="17" fill="#ffffff" stroke="#d4e5df"/>
    <text x="1155" y="179" class="category">Security incidents</text>
    <text x="1155" y="211" class="body">LLM summary · incident history</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="250" width="365" height="100" rx="17" fill="#ffffff" stroke="#d4e5df"/>
    <text x="1155" y="289" class="category">Service outages</text>
    <text x="1155" y="321" class="body">LLM summary · incident history</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="360" width="365" height="100" rx="17" fill="#ffffff" stroke="#d4e5df"/>
    <text x="1155" y="399" class="category">Any other watched category</text>
    <text x="1155" y="431" class="body">LLM summary · incident history</text>
  </g>

  <!-- Flow -->
  <path class="flow" d="M415 300 H570"/>
  <text x="492" y="283" text-anchor="middle" class="label">each log line</text>

  <path d="M900 300 H1085" fill="none" stroke="#d9654c" stroke-width="3"/>
  <text x="992" y="282" text-anchor="middle" class="label">match + context</text>
  <path d="M1085 190 V410" fill="none" stroke="#d9654c" stroke-width="3"/>
  <path class="branch" d="M1085 190 H1130"/>
  <path class="branch" d="M1085 300 H1130"/>
  <path class="branch" d="M1085 410 H1130"/>

  <text x="735" y="475" text-anchor="middle" class="small">No match: keep receiving logs · Match: include surrounding context and route by category</text>
</svg>
