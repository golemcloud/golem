# A fixed Golem cluster on one host: the per-service images with several worker executors,
# a Postgres database and an S3 bucket outside the host, and Caddy for TLS.
# Guide: https://learn.golem.cloud/next/deploy/vm#fixed-cluster-with-docker-compose

x-blob-storage: &blob-storage
  # All services share one bucket. namespace_prefixes cannot change after the first start.
  GOLEM__BLOB_STORE: s3
  GOLEM__OBJECT_STORAGE__REGION: ${S3_REGION}
  # For an S3-compatible service other than AWS S3, uncomment these two lines:
  # GOLEM__OBJECT_STORAGE__ENDPOINT_URL: ${S3_ENDPOINT_URL}
  # GOLEM__OBJECT_STORAGE__PATH_STYLE: "true"
  GOLEM__OBJECT_STORAGE__OBJECT_PREFIX: ""
  GOLEM__OBJECT_STORAGE__DATA_BUCKET: ${S3_BUCKET}
  GOLEM__OBJECT_STORAGE__COMPONENTS_BUCKET: ${S3_BUCKET}
  GOLEM__OBJECT_STORAGE__ARTIFACTS_BUCKET: ${S3_BUCKET}
  GOLEM_ADVANCED__REGISTRY_SERVICE__BLOB_STORAGE__CONFIG__RETRIES__MULTIPLIER: 3.0
  GOLEM_ADVANCED__WORKER_SERVICE__BLOB_STORAGE__CONFIG__RETRIES__MULTIPLIER: 3.0
  GOLEM_ADVANCED__WORKER_EXECUTOR__BLOB_STORAGE__CONFIG__RETRIES__MULTIPLIER: 3.0
  GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__BLOB_STORAGE__CONFIG__RETRIES__MULTIPLIER: 3.0
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

x-service: &service
  pull_policy: always
  restart: unless-stopped
  networks: [golem]

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GOLEM_MANAGEMENT_HOST: ${GOLEM_MANAGEMENT_HOST}
      GOLEM_APP_DOMAINS: ${GOLEM_APP_DOMAINS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      golem:
        # The worker service trusts the forwarded headers of this address only.
        ipv4_address: 172.30.0.10
    depends_on:
      - golem-registry-service
      - golem-worker-service

  golem-registry-service:
    <<: *service
    image: golemservices/registry-service:${GOLEM_IMAGES_VERSION}
    environment:
      <<: *blob-storage
      RUST_LOG: info,h2=warn,hyper=warn,tower=warn
      GOLEM_ADVANCED__REGISTRY_SERVICE__HTTP_PORT: 8083
      GOLEM_ADVANCED__REGISTRY_SERVICE__GRPC__PORT: 9008
      # GOLEM_ISSUER is optional: the installation's https issuer. The registry keeps the issuer in
      # its database, and the worker service and every executor ask the registry for it. Empty
      # means the registry generates one at its first start and reuses it afterwards. A value that
      # differs from the stored one stops the registry.
      GOLEM_ADVANCED__REGISTRY_SERVICE__GOLEM_ISSUER: ${GOLEM_ISSUER:-}

      GOLEM_ADVANCED__REGISTRY_SERVICE__CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX}
      GOLEM_ADVANCED__REGISTRY_SERVICE__LOGIN__TYPE: Disabled
      GOLEM_ADVANCED__REGISTRY_SERVICE__INITIAL_ACCOUNTS__ROOT__TOKEN: ${ADMIN_TOKEN}
      GOLEM_ADVANCED__REGISTRY_SERVICE__INITIAL_ACCOUNTS__MARKETING__TOKEN: ${MARKETING_TOKEN}
      GOLEM_ADVANCED__REGISTRY_SERVICE__DOMAIN_REGISTRATION__RESERVED_DOMAINS: '["${GOLEM_MANAGEMENT_HOST}"]'
      # An agent on the default Temporary filesystem storage does not start with a finite
      # per-agent disk limit. Set a limit only with ManagedXfs storage on the executors.
      GOLEM_ADVANCED__REGISTRY_SERVICE__INITIAL_PLANS__DEFAULT__MAX_DISK_SPACE_PER_WORKER: 1000000000000000000

      GOLEM__STATE_STORE: postgres
      GOLEM__POSTGRES__HOST: ${POSTGRES_HOST}
      GOLEM__POSTGRES__PORT: ${POSTGRES_PORT}
      GOLEM__POSTGRES__DATABASE: ${POSTGRES_DB}
      GOLEM__POSTGRES__USERNAME: ${POSTGRES_USER}
      GOLEM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM__POSTGRES__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__REGISTRY_SERVICE__DB__CONFIG__SCHEMA: golem_registry_service

      GOLEM_ADVANCED__REGISTRY_SERVICE__COMPONENT_COMPILATION__CONFIG__HOST: golem-component-compilation-service
      GOLEM_ADVANCED__REGISTRY_SERVICE__COMPONENT_COMPILATION__CONFIG__PORT: 9010
    volumes:
      - builtin_artifacts:/app/builtin-artifacts

  # Exactly one replica: two shard managers on one database can run the same agent twice.
  # `docker compose up` stops the old container before it starts the new one.
  golem-shard-manager:
    <<: *service
    image: golemservices/golem-shard-manager:${GOLEM_IMAGES_VERSION}
    environment:
      RUST_LOG: info,h2=warn,hyper=warn,tower=warn
      GOLEM_ADVANCED__SHARD_MANAGER__HTTP_PORT: 8081
      GOLEM_ADVANCED__SHARD_MANAGER__GRPC__PORT: 9002

      GOLEM_ADVANCED__SHARD_MANAGER__REGISTRY_SERVICE__HOST: golem-registry-service
      GOLEM_ADVANCED__SHARD_MANAGER__REGISTRY_SERVICE__PORT: 9008

      GOLEM__STATE_STORE: postgres
      GOLEM__POSTGRES__HOST: ${POSTGRES_HOST}
      GOLEM__POSTGRES__PORT: ${POSTGRES_PORT}
      GOLEM__POSTGRES__DATABASE: ${POSTGRES_DB}
      GOLEM__POSTGRES__USERNAME: ${POSTGRES_USER}
      GOLEM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM__POSTGRES__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__SHARD_MANAGER__PERSISTENCE__CONFIG__SCHEMA: golem_shard_manager
    depends_on:
      - golem-registry-service

  golem-worker-service:
    <<: *service
    image: golemservices/golem-worker-service:${GOLEM_IMAGES_VERSION}
    environment:
      <<: *blob-storage
      RUST_LOG: info,h2=warn,hyper=warn,tower=warn
      GOLEM_ADVANCED__WORKER_SERVICE__PORT: 9005
      GOLEM_ADVANCED__WORKER_SERVICE__CUSTOM_REQUEST_PORT: 9006
      GOLEM_ADVANCED__WORKER_SERVICE__MCP_PORT: 9007
      GOLEM_ADVANCED__WORKER_SERVICE__GRPC__PORT: 9094

      GOLEM_ADVANCED__WORKER_SERVICE__WEBHOOK_CALLBACK_HANDLER__HMAC_KEY: ${WEBHOOK_HMAC_KEY}
      GOLEM_ADVANCED__WORKER_SERVICE__INVOCATION_SESSION_TOKENS__ACTIVE_KEY__ID: ${SESSION_TOKEN_KEY_ID}
      GOLEM_ADVANCED__WORKER_SERVICE__INVOCATION_SESSION_TOKENS__ACTIVE_KEY__KEY: ${SESSION_TOKEN_KEY}
      GOLEM_ADVANCED__WORKER_SERVICE__ROUTE_RESOLVER__TRUSTED_INGRESS_ADDRESSES: '["172.30.0.10/32"]'

      GOLEM__STATE_STORE: postgres
      GOLEM__POSTGRES__HOST: ${POSTGRES_HOST}
      GOLEM__POSTGRES__PORT: ${POSTGRES_PORT}
      GOLEM__POSTGRES__DATABASE: ${POSTGRES_DB}
      GOLEM__POSTGRES__USERNAME: ${POSTGRES_USER}
      GOLEM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM__POSTGRES__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__WORKER_SERVICE__GATEWAY_SESSION_STORAGE__CONFIG__SCHEMA: golem_worker_service_session_store
      GOLEM_ADVANCED__WORKER_SERVICE__GATEWAY_SESSION_STORAGE__CONFIG__PENDING_LOGIN_EXPIRATION: "1h"
      GOLEM_ADVANCED__WORKER_SERVICE__GATEWAY_SESSION_STORAGE__CONFIG__CLEANUP_INTERVAL: "5m"

      GOLEM_ADVANCED__WORKER_SERVICE__REGISTRY_SERVICE__HOST: golem-registry-service
      GOLEM_ADVANCED__WORKER_SERVICE__REGISTRY_SERVICE__PORT: 9008
      GOLEM_ADVANCED__WORKER_SERVICE__SHARD_MANAGER__HOST: golem-shard-manager
      GOLEM_ADVANCED__WORKER_SERVICE__SHARD_MANAGER__PORT: 9002
    depends_on:
      - golem-registry-service
      - golem-shard-manager

  golem-component-compilation-service:
    <<: *service
    image: golemservices/golem-component-compilation-service:${GOLEM_IMAGES_VERSION}
    environment:
      <<: *blob-storage
      RUST_LOG: info,h2=warn,hyper=warn,tower=warn
      GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__HTTP_PORT: 8084
      GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__GRPC__PORT: 9010

      GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__REGISTRY_SERVICE__TYPE: Static
      GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__REGISTRY_SERVICE__CONFIG__HOST: golem-registry-service
      GOLEM_ADVANCED__COMPONENT_COMPILATION_SERVICE__REGISTRY_SERVICE__CONFIG__PORT: 9008
    depends_on:
      - golem-registry-service

  golem-worker-executor:
    <<: *service
    image: golemservices/golem-worker-executor:${GOLEM_IMAGES_VERSION}
    deploy:
      replicas: ${WORKER_EXECUTOR_REPLICAS}
    environment:
      <<: *blob-storage
      RUST_LOG: info
      GOLEM_ADVANCED__WORKER_EXECUTOR__HTTP_PORT: 8082
      GOLEM_ADVANCED__WORKER_EXECUTOR__GRPC__PORT: 9000

      GOLEM_ADVANCED__WORKER_EXECUTOR__AGENT_WEBHOOKS_SERVICE__HMAC_KEY: ${WEBHOOK_HMAC_KEY}

      GOLEM__STATE_STORE: postgres
      GOLEM__POSTGRES__HOST: ${POSTGRES_HOST}
      GOLEM__POSTGRES__PORT: ${POSTGRES_PORT}
      GOLEM__POSTGRES__DATABASE: ${POSTGRES_DB}
      GOLEM__POSTGRES__USERNAME: ${POSTGRES_USER}
      GOLEM__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM__POSTGRES__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__WORKER_EXECUTOR__KEY_VALUE_STORAGE__CONFIG__SCHEMA: golem_worker_executor

      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__TYPE: Postgres
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__HOST: ${POSTGRES_HOST}
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__PORT: ${POSTGRES_PORT}
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__DATABASE: ${POSTGRES_DB}
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__USERNAME: ${POSTGRES_USER}
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__WORKER_EXECUTOR__INDEXED_STORAGE__CONFIG__SCHEMA: golem_worker_executor_indexed

      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__TYPE: Postgres
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__HOST: ${POSTGRES_HOST}
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__PORT: ${POSTGRES_PORT}
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__DATABASE: ${POSTGRES_DB}
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__USERNAME: ${POSTGRES_USER}
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__PASSWORD: ${POSTGRES_PASSWORD}
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__MAX_CONNECTIONS: 10
      GOLEM_ADVANCED__WORKER_EXECUTOR__SCHEDULER_STORAGE__CONFIG__SCHEMA: golem_worker_executor_scheduler

      GOLEM_ADVANCED__WORKER_EXECUTOR__REGISTRY_SERVICE__HOST: golem-registry-service
      GOLEM_ADVANCED__WORKER_EXECUTOR__REGISTRY_SERVICE__PORT: 9008
      GOLEM_ADVANCED__WORKER_EXECUTOR__SHARD_MANAGER__HOST: golem-shard-manager
      GOLEM_ADVANCED__WORKER_EXECUTOR__SHARD_MANAGER__PORT: 9002
      GOLEM_ADVANCED__WORKER_EXECUTOR__SHARD_MANAGER__RETRIES__MAX_ATTEMPTS: 10
      GOLEM_ADVANCED__WORKER_EXECUTOR__PUBLIC_WORKER_API__HOST: golem-worker-service
      GOLEM_ADVANCED__WORKER_EXECUTOR__PUBLIC_WORKER_API__PORT: 9094
      GOLEM_ADVANCED__WORKER_EXECUTOR__COMPILED_COMPONENT_SERVICE__TYPE: Enabled
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - golem-registry-service
      - golem-shard-manager

networks:
  golem:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  builtin_artifacts:
