[package]
name = "golem-js-tool-process-bridge"
version = "0.0.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false

[workspace]

[dependencies]
futures = "0.3"
golem-rust = { path = "../../rust/golem-rust", default-features = false, features = ["macro"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "futures", "bindgen", "loader", "macro"] }
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "6f161c1bce440d7b0506950ee38338ce36742957", version = "=0.63.0", features = ["async", "async-spawn", "inter-task-wakeup"] }

# The same rquickjs as the wasm-rquickjs component this bridge is built into; components
# take it from their own manifest, this applies to standalone builds of the bridge.
[patch.crates-io]
rquickjs = { git = "https://github.com/golemcloud/rquickjs", branch = "v0.14.0-patched" }
rquickjs-core = { git = "https://github.com/golemcloud/rquickjs", branch = "v0.14.0-patched" }
rquickjs-macro = { git = "https://github.com/golemcloud/rquickjs", branch = "v0.14.0-patched" }
rquickjs-sys = { git = "https://github.com/golemcloud/rquickjs", branch = "v0.14.0-patched" }
