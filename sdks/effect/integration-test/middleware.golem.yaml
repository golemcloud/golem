# Build with `golem -A middleware.golem.yaml -Y build --step build`.
# The CLI metadata extractor currently requires agent or ordinary tool exports,
# so middleware-only components cannot yet use its add-metadata/deploy steps.
manifestVersion: 1.6.0
app: effect-golem-middleware-integration-test
environments:
  local:
    server: local
componentTemplates:
  effect-middleware:
    build:
      - command: npx tsc --project "{{ componentDir }}" --noEmit
      - command: npx --no rollup -- -c "{{ appRootDir }}/rollup.config.component.mjs"
        dir: "{{ componentDir }}"
        env:
          GOLEM_APP_ROOT: "{{ appRootDir }}"
          GOLEM_TEMP: "{{ golemTempDir }}"
          GOLEM_COMPONENT_NAME: "{{ component_name | to_kebab_case }}"
      - injectToPrebuiltQuickjs: "{{ appRootDir }}/node_modules/@golemcloud/effect-golem/wasm/tool_middleware_guest.wasm"
        module: "{{ golemTempDir }}/ts-dist/{{ component_name | to_kebab_case }}/main.js"
        into: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
    componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
    outputWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.wasm"
components:
  effect-golem:tool-middleware:
    dir: components/tool-middleware
    templates: effect-middleware
