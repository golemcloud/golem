manifestVersion: 1.6.0
app: scala-examples

environments:
  local:
    server: local

includes:
- ../scala-js-template.yaml

components:
  scala:examples:
    templates: scala.js
    buildMergeMode: replace
    build:
    - command: bash -c 'COMP_DIR="$PWD" && cd .. && sbt -batch -no-colors -Dsbt.supershell=false "++3.8.2!" "project testAgents" "golemBuildComponent scala:examples $COMP_DIR/.golem/scala.js"'
      sources:
      - src
      targets:
      - .golem/scala.js
    - injectToPrebuiltQuickjs: .generated/agent_guest.wasm
      module: .golem/scala.js
      into: .golem/agents/scala_examples.dynamic.wasm
    - preinitializeJs: .golem/agents/scala_examples.dynamic.wasm
      into: .golem/agents/scala_examples.preinitialized.wasm
    componentWasm: .golem/agents/scala_examples.preinitialized.wasm
    outputWasm: .golem/agents/scala_examples.wasm

agents:
  ScalaWebsite:
    config:
      greeting: Hello from Scala
    files:
    - sourcePath: ./http-assets/index.html
      targetPath: /site/index.html
      permissions: read-only
  ConfigAgent:
    config:
      appName: "ManifestApp"
      db:
        host: "manifest-db.example.com"
        port: 5432
  ScalaToolStreamingCaller:
    tools:
      scala-streaming: { }
  ScalaToolReflectionCaller:
    tools:
      scala-reflection-test: { }

tools:
  git: { }
  grep: { }
  scala-streaming: { }
  scala-reflection-test: { }
  tool-demo: { }
  middleware:
    middleware-fixture-transparent: { }
    middleware-fixture-adapter: { }
    middleware-fixture-universal: { }
    middleware-fixture-typed-universal: { }
    middleware-fixture-typed-monomorphic: { }

httpApi:
  deployments:
    local:
    - domain: localhost:9006
      agents:
        ScalaWebsite: { }
        HttpDocuments: { }
        WeatherAgent: { }
        InventoryAgent: { }
        CatalogAgent: { }
        WebhookDemo: { }
        FetchAgent: { }
