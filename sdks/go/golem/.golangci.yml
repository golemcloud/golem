version: "2"

# Lints the hand-written SDK package. The generated bindings under internal/wit
# and internal/exports are excluded (wit-bindgen's "// Generated by ... DO NOT
# EDIT!" header is not the standard "// Code generated ... DO NOT EDIT." marker,
# so they must be excluded explicitly).
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  settings:
    staticcheck:
      # golangci-lint disables the doc-comment-form checks (ST1020-1022) by
      # default; keep them on so a declaration comment that doesn't start with
      # the identifier fails lint. The remaining opt-outs are style checks we do
      # not want to enforce here (package comments, initialism naming like
      # Id->ID, receiver-name consistency, gopls quick-fix hints).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -QF1008
  exclusions:
    generated: strict
    paths:
      - internal/wit
      - internal/exports
