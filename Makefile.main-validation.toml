[tasks.main-validation-bash]
private = true
script_runner = "@duckscript"
script = '''
failed = exec --get-exit-code cargo test --manifest-path builtin-tools/bash/Cargo.toml --workspace --lib --all-features --locked
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
code = exec --get-exit-code cargo test --manifest-path builtin-tools/bash/Cargo.toml -p bash-shell --test execution --all-features --locked
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
code = exec --get-exit-code cargo check --manifest-path builtin-tools/bash/Cargo.toml --workspace --all-targets --all-features --locked --target wasm32-wasip2
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
code = exec --get-exit-code cargo clippy --manifest-path builtin-tools/bash/Cargo.toml --workspace --all-targets --all-features --locked --target wasm32-wasip2 -- -D warnings
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
code = exec --get-exit-code cargo deny --manifest-path builtin-tools/bash/Cargo.toml check sources
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
set_env CARGO_TARGET_WASM32_WASIP2_RUNNER "wasmtime run -Sp3 -Shttp -Wcomponent-model-async=y -Wmax-wasm-stack=1048576 -Wasync-stack-size=2621440 --dir /tmp::/tmp"
code = exec --get-exit-code cargo test --manifest-path builtin-tools/bash/Cargo.toml --locked --target wasm32-wasip2 -p bash-shell -p whttp --lib
failed = calc ${failed} + ${code}
if not eq ${CI} true
    assert_eq ${failed} 0 "Bash validation failed"
end
checks = array test-builtin-bash-pipelines test-builtin-bash-sweep
for check in ${checks}
    code = exec --get-exit-code cargo make --disable-check-for-updates --allow-private --profile ci ${check}
    failed = calc ${failed} + ${code}
    if not eq ${CI} true
        assert_eq ${failed} 0 "Bash validation failed"
    end
end
code = exec --get-exit-code cargo fmt --manifest-path builtin-tools/bash/Cargo.toml --all -- --check
failed = calc ${failed} + ${code}
assert_eq ${failed} 0 "Bash validation failed"
'''

