[tasks.main-validation-exclusive]
private = true
env = { MAIN_VALIDATION_TASKS = "dev-tools-tests check-shared-crates-versioning check-configs check test-component-middleware-unit-tests validate-sdk-rust-check validate-sdk-rust-tool validate-sdk-rust-ui validate-sdk-go validate-skill-harness main-validation-schema main-validation-bash main-validation-embedded main-validation-scala main-validation-xfs main-validation-docker" }
script_runner = "@duckscript"
script = '''
failed = set 0
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
set_env TMPDIR ${temporary}/exclusive
tasks = split ${MAIN_VALIDATION_TASKS} " "
for task in ${tasks}
    bounded = contains " check main-validation-bash " " ${task} "
    if ${bounded}
        target = set ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}
        if eq ${task} main-validation-bash
            target = set ${target}/main-validation-bash-target
        end
        code = exec --get-exit-code python3 .github/main-validation/progress.py run exclusive ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci --skip-tasks "^wit$" --env CARGO_TARGET_DIR=${target} --env CARGO_MAKE_CRATE_TARGET_DIRECTORY=${target} --env CARGO_BUILD_JOBS=4 --env RUST_TEST_THREADS=4 --env BASH_CONFORMANCE_JOBS=4 ${task}
    else
        code = exec --get-exit-code python3 .github/main-validation/progress.py run exclusive ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci ${task}
    end
    writefile ${MAIN_VALIDATION_REPORT_DIR}/${task}.status ${code}
    if not eq ${code} 0
        failed = set 1
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/exclusive.status ${failed}
'''

[tasks.main-validation-result]
private = true
script_runner = "@duckscript"
script = '''
failed = set false
branches = array worker service recovery cli exclusive checks
for branch in ${branches}
    file = set ${MAIN_VALIDATION_REPORT_DIR}/${branch}.status
    if is_path_exists ${file}
        code = readfile ${file}
        if not eq ${code} 0
            echo "Failed or blocked: ${branch} (${code})"
            failed = set true
        end
    else
        echo "Missing completion: ${branch}"
        failed = set true
    end
end
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
rm -r ${temporary}
if is_path_exists ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
    snapshot = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
    rm -r ${snapshot}
end
if ${failed}
    trigger_error "Main validation failed; retain every original report and log"
end
'''

