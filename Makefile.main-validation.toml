[tasks.main-validation-apfs]
description = "Build and run the same-source native APFS coverage on macOS"
env = { RUST_MIN_STACK = "33554432" }
script_runner = "@duckscript"
script = '''
mkdir ${MAIN_VALIDATION_REPORT_DIR}
build = exec cargo test --locked -j 4 --profile dev-ci -p golem-worker-executor --features test-utils --lib --no-run --message-format=json-render-diagnostics
assert_eq ${build.code} 0 "Native APFS compilation failed: ${build.stderr}"
writefile ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-messages.jsonl ${build.stdout}
metadata = exec cargo metadata --locked --no-deps --format-version 1
assert_eq ${metadata.code} 0 "Native APFS metadata production failed: ${metadata.stderr}"
writefile ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-metadata.json ${metadata.stdout}
selection = exec cargo-test-r list --cargo-messages ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-messages.jsonl --cargo-metadata ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-metadata.json --package golem-worker-executor --binary-id golem-worker-executor --expect-count 1 --output executable-path --deadline 10m --kill-grace 10s
assert_eq ${selection.code} 0 "Native APFS selection failed: ${selection.stderr}"
executable = trim ${selection.stdout}
exec --fail-on-error bash integration-tests/scripts/apfs/run-native-tests.sh ${executable} :tag:native_apfs --include-ignored --test-threads 1 --report-time --format ctrf --logfile ${MAIN_VALIDATION_REPORT_DIR}/ctrf-apfs.json
'''
