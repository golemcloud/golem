]

[tasks.main-validation-workers-complete]
private = true
script_runner = "@duckscript"
script = '''
# Service compilation has joined before this branch starts. Wait for worker
# completion too, including ordinary failures, before admitting more CPU work.
attempt = set 0
while not is_path_exists ${MAIN_VALIDATION_REPORT_DIR}/worker.status
    if eq ${attempt} 18000
        trigger_error "Worker completion was not recorded within the validation timeout"
    end
    sleep 1000
    attempt = calc ${attempt} + 1
end
'''

