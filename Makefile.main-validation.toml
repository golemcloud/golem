# One selected source per invocation. GitHub Actions prevents overlapping cycles.
# Worker executables are frozen before the service build can replace Cargo outputs.

[env.MAIN_VALIDATION_REPORT_DIR]
value = "${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation-reports"
condition = { env_not_set = ["MAIN_VALIDATION_REPORT_DIR"] }

[env.MAIN_VALIDATION_PARALLEL]
value = "true"
condition = { env_not_set = ["MAIN_VALIDATION_PARALLEL"] }

[tasks.main-validation]
description = "Validate the selected main source on a dedicated Linux executor"
env = { GOLEM_CLI_TEST_BIN_PROFILE = "dev-release-ci", TEST_R_REPORT_OPTS = "--format ctrf --logfile ${MAIN_VALIDATION_REPORT_DIR}/ctrf.json --retry-failed 2", TEST_R_FLAKY_OPTS = "", MAIN_VALIDATION_RECOVERY_GROUP = "4" }
run_task = { name = ["main-validation-prepare", "main-validation-parallel", "main-validation-exclusive", "main-validation-result"] }

[tasks.main-validation-parallel]
private = true
run_task = [
    { name = ["main-validation-workers", "main-validation-services"], fork = true, parallel = true, condition = { env_true = ["MAIN_VALIDATION_PARALLEL"] } },
    { name = ["main-validation-workers", "main-validation-services"], condition = { env_false = ["MAIN_VALIDATION_PARALLEL"] } },
]

[tasks.main-validation-prepare]
private = true
env = { MAIN_VALIDATION_TASKS = "wit main-validation-builtins main-validation-general-native unit-tests-and-checks build-cli-test-bins validate-sdk-scala validate-sdk-ts validate-sdk-effect validate-sdk-moonbit main-validation-fixtures main-validation-executor-native" }
script_runner = "@duckscript"
script = '''
mkdir ${MAIN_VALIDATION_REPORT_DIR}
# Absolute endpoint overrides bypass the disjoint listener blocks.
endpoints = array REDIS_PORT REGISTRY_HTTP_PORT
for endpoint in ${endpoints}
    value = get_env ${endpoint}
    if not is_empty ${value}
        trigger_error "Unset ${endpoint}: Main validation owns isolated dependency ports"
    end
end
rm ${MAIN_VALIDATION_REPORT_DIR}/service-build.status
temporary = exec --fail-on-error python3 -c "import tempfile; print(tempfile.mkdtemp(prefix='golem-main-validation-'))"
temporary = trim ${temporary.stdout}
writefile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt ${temporary}
branches = array worker service recovery cli exclusive checks
for branch in ${branches}
    rm ${MAIN_VALIDATION_REPORT_DIR}/${branch}.status
    mkdir ${temporary}/${branch}
end
# A runner without local metadata and bounded test retries must not fall back to Cargo.
help = exec cargo-test-r run --help
supports_metadata = contains ${help.stdout} --binaries-metadata
if not ${supports_metadata}
    trigger_error "Install cargo-test-r with local binaries metadata support before main validation"
end
tasks = split ${MAIN_VALIDATION_TASKS} " "
for task in ${tasks}
    if eq ${task} unit-tests-and-checks
        set_env TEST_R_BUILD_OPTS "--binaries-metadata ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/general.json"
        checks = exec --get-exit-code python3 .github/main-validation/progress.py run prepare ${task} -- cargo make --disable-check-for-updates --profile ci --skip-tasks test-component-middleware-unit-tests ${task}
        writefile ${MAIN_VALIDATION_REPORT_DIR}/checks.status ${checks}
    else
        exec --fail-on-error python3 .github/main-validation/progress.py run prepare ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci ${task}
    end
end
'''

[tasks.main-validation-builtins]
private = true
dependencies = ["ensure-builtin-artifacts"]
script_runner = "@duckscript"
script = '''
manifest = exec --fail-on-error jq -r ".[].path" builtin-artifacts.json
paths = split ${manifest.stdout} "\n"
for path in ${paths}
    if not is_empty ${path}
        exec --fail-on-error wasm-tools validate --features all ${path}
    end
end
'''

[tasks.main-validation-general-native]
private = true
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo build --profile dev-ci --workspace --bins --tests
mkdir ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation
# nextest invokes cargo test: --bins would force test builds of test=false servers.
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --workspace --tests --list-type binaries-only --message-format json
echo ${metadata.stderr}
writefile ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/general.json ${metadata.stdout}
# Existing source generators consume debug paths.
mkdir ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug
binaries = array golem golem-cli golem-registry-service golem-worker-service golem-shard-manager golem-component-compilation-service worker-executor golem-openapi-client-generator
for binary in ${binaries}
    cp ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-ci/${binary} ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/${binary}
end
'''

[tasks.main-validation-executor-native]
private = true
script_runner = "@duckscript"
script = '''
rm ${MAIN_VALIDATION_REPORT_DIR}/executor-binaries.json
rm ${MAIN_VALIDATION_REPORT_DIR}/executor-binaries.json.manifest.json
exec --fail-on-error cargo build --profile dev-ci --tests -p golem-worker-executor -p golem-worker-executor-tests -p golem-common
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --tests -p golem-worker-executor -p golem-worker-executor-tests -p golem-common --list-type binaries-only --message-format json
echo ${metadata.stderr}
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-binaries.json ${metadata.stdout}
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
cycle = basename ${temporary}
snapshot = set ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/frozen-${cycle}
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt ${snapshot}
exec --fail-on-error python3 .github/main-validation/freeze-binaries.py --metadata ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-binaries.json --destination ${snapshot} --output ${MAIN_VALIDATION_REPORT_DIR}/executor-binaries.json
'''

[tasks.main-validation-service-native]
private = true
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo build --profile dev-ci --bins --tests -p integration-tests -p golem-cli -p golem-service-base -p golem-registry-service -p golem-worker-service -p golem-shard-manager -p golem-test-framework -p golem-component-compilation-service -p golem-worker-executor
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --tests -p integration-tests -p golem-cli -p golem-service-base -p golem-registry-service -p golem-worker-service -p golem-shard-manager -p golem-test-framework -p golem-component-compilation-service -p golem-worker-executor --list-type binaries-only --message-format json
echo ${metadata.stderr}
writefile ${MAIN_VALIDATION_REPORT_DIR}/service-binaries.json ${metadata.stdout}
# CLI service-config tests use debug paths, but require this producer's selection.
binaries = array golem-registry-service golem-worker-service golem-shard-manager golem-component-compilation-service worker-executor
for binary in ${binaries}
    cp ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-ci/${binary} ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/${binary}
end
'''

[tasks.main-validation-fixtures]
private = true
script_runner = "@duckscript"
script = '''
set_env GOLEM_CLI ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-release-ci/golem
set_env GOLEM_TS_PRESET quick
set_env CARGO_TARGET_DIR ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation-fixture-target
root = pwd
set_env GOLEM_FIXTURE_CACHE ${root}/.validation-cache/fixtures-v1/completed
exec --fail-on-error python3 .github/main-validation/fixture-cache.py begin
cd sdks/moonbit/golem_sdk_tools
exec --fail-on-error moon update
cd ${root}/test-components/tool-streaming-moonbit
exec --fail-on-error moon update
cd ${root}
exec --fail-on-error ./test-components/build-components.sh rebuild
exec --fail-on-error ./test-components/build-components.sh benchmarks rebuild
exec --fail-on-error ./test-components/build-components.sh check
exec --fail-on-error ./test-components/build-components.sh benchmarks check
fixtures = array golem_it_tool_streaming_rust_provider_release.wasm golem_it_tool_streaming_rust_caller_release.wasm golem_it_agent_rpc_rust_release.wasm
for fixture in ${fixtures}
    exec --fail-on-error test -s test-components/${fixture}
end
different = exec --get-exit-code cmp --silent test-components/it_agent_update_v3_release.wasm test-components/it_agent_update_v4_release.wasm
if not eq ${different} 1
    trigger_error "Update v3/v4 fixtures must exist and have different contents"
end
exec --fail-on-error python3 .github/main-validation/fixture-cache.py publish
'''

# These wrappers collect ordinary failures and return normally so cargo-make joins
# every fork. The final task rejects failures and missing completion records.
[tasks.main-validation-workers]
private = true
env = { MAIN_VALIDATION_TASKS = "misc group1 group2 group3 group4 group5 tool-streaming", GOLEM_TEST_PORT_OFFSET = "0" }
script_runner = "@duckscript"
script = '''
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
set_env TMPDIR ${temporary}/worker
set_env TEST_R_BUILD_OPTS "--binaries-metadata ${MAIN_VALIDATION_REPORT_DIR}/executor-binaries.json"
failed = set 0
groups = split ${MAIN_VALIDATION_TASKS} " "
for group in ${groups}
    code = exec --get-exit-code python3 .github/main-validation/progress.py run worker ${group} -- cargo make --disable-check-for-updates --profile ci --skip-tasks "^(wit|ensure-builtin-artifacts)$" worker-executor-tests-${group}
    writefile ${MAIN_VALIDATION_REPORT_DIR}/worker-${group}.status ${code}
    if not eq ${code} 0
        failed = set 1
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/worker.status ${failed}
'''

[tasks.main-validation-services]
private = true
env = { MAIN_VALIDATION_TASKS = "main-validation-service-native" }
script_runner = "@duckscript"
script = '''
code = exec --get-exit-code python3 .github/main-validation/progress.py run service-build main-validation-service-native -- cargo make --disable-check-for-updates --allow-private --profile ci main-validation-service-native
writefile ${MAIN_VALIDATION_REPORT_DIR}/service-build.status ${code}
if eq ${code} 0
    cm_run_task main-validation-service-and-cli
else
    writefile ${MAIN_VALIDATION_REPORT_DIR}/service.status ${code}
    writefile ${MAIN_VALIDATION_REPORT_DIR}/recovery.status blocked
    writefile ${MAIN_VALIDATION_REPORT_DIR}/cli.status blocked
end
'''

[tasks.main-validation-service-and-cli]
private = true
run_task = [
    { name = ["main-validation-service-tests", "main-validation-cli-tests", "main-validation-recovery-tests"], fork = true, parallel = true, condition = { env_true = ["MAIN_VALIDATION_PARALLEL"] } },
    { name = ["main-validation-service-tests", "main-validation-cli-tests", "main-validation-recovery-tests"], condition = { env_false = ["MAIN_VALIDATION_PARALLEL"] } },
]

[tasks.main-validation-workers-complete]
private = true
script_runner = "@duckscript"
script = '''
# Service compilation has joined before this branch starts. Wait for worker
# completion too, including ordinary failures, before admitting more CPU work.
attempt = set 0
while not is_path_exists ${MAIN_VALIDATION_REPORT_DIR}/worker.status
    if eq ${attempt} 18000
        trigger_error "Worker completion was not recorded within the validation timeout"
    end
    sleep 1000
    attempt = calc ${attempt} + 1
end
'''

[tasks.main-validation-service-tests]
private = true
env = { MAIN_VALIDATION_TASKS = "1 2 3 4 5 6-coordinated 6-rest 7 8 9 10 11 12 13", GOLEM_TEST_PORT_OFFSET = "10000", GOLEM_TEST_BIN_PROFILE = "dev-ci" }
script_runner = "@duckscript"
script = '''
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
set_env TMPDIR ${temporary}/service
set_env TEST_R_BUILD_OPTS "--binaries-metadata ${MAIN_VALIDATION_REPORT_DIR}/service-binaries.json"
failed = set 0
groups = split ${MAIN_VALIDATION_TASKS} " "
for group in ${groups}
    if not eq ${group} ${MAIN_VALIDATION_RECOVERY_GROUP}
        code = exec --get-exit-code python3 .github/main-validation/progress.py run service ${group} -- cargo make --disable-check-for-updates --profile ci --skip-tasks "^(wit|build-sdk-ts|ensure-builtin-artifacts)$" integration-tests-group${group}
        writefile ${MAIN_VALIDATION_REPORT_DIR}/service-${group}.status ${code}
        if not eq ${code} 0
            failed = set 1
        end
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/service.status ${failed}
'''

[tasks.main-validation-recovery-tests]
