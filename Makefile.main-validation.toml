script = '''
failed = set 0
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
set_env TMPDIR ${temporary}/${MAIN_VALIDATION_CHECK_LANE}
lane_requirements = get_env MAIN_VALIDATION_REQUIRES
tasks = split ${MAIN_VALIDATION_TASKS} " "
for task in ${tasks}
    set_env MAIN_VALIDATION_REQUIRES ${lane_requirements}
    if starts_with ${task} validate-sdk-
        if contains " validate-sdk-ts validate-sdk-effect validate-sdk-scala validate-sdk-moonbit " " ${task} "
            producer = replace ${task} validate-sdk- prepare-sdk-
            set_env MAIN_VALIDATION_REQUIRES ${producer}
        end
    elif eq ${task} main-validation-scala
        set_env MAIN_VALIDATION_REQUIRES "prepare-sdk-scala prepare-sdk-ts build-cli-test-bins main-validation-service-native"
    elif eq ${task} main-validation-latency
        set_env MAIN_VALIDATION_REQUIRES "main-validation-executor-native main-validation-fixtures"
    elif eq ${task} main-validation-xfs
        set_env MAIN_VALIDATION_REQUIRES "main-validation-executor-native main-validation-fixtures"
    elif eq ${task} main-validation-docker
        set_env MAIN_VALIDATION_REQUIRES "main-validation-builtins"
    end
    cm_run_task main-validation-admit
    admitted = get_env MAIN_VALIDATION_ADMITTED
    code = set blocked
    if ${admitted}
        if eq ${task} main-validation-bash
            target = set ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation-bash-target
            code = exec --get-exit-code bun .github/main-validation/progress.ts run exclusive ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci --skip-tasks "^(wit|prepare-sdk-.*)$" --env CARGO_TARGET_DIR=${target} --env CARGO_MAKE_CRATE_TARGET_DIRECTORY=${target} ${task}
        else
            code = exec --get-exit-code bun .github/main-validation/progress.ts run exclusive ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci --skip-tasks "^(wit|prepare-sdk-.*)$" ${task}
        end
    end
    writefile ${MAIN_VALIDATION_REPORT_DIR}/${task}.status ${code}
    if not eq ${code} 0
        failed = set 1
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/${MAIN_VALIDATION_CHECK_LANE}.status ${failed}
'''

[tasks.main-validation-result]
private = true
script_runner = "@duckscript"
script = '''
failed = set false
branches = array prepare worker service recovery cli root-checks source-checks rust-checks bash-checks language-checks privileged
for branch in ${branches}
    file = set ${MAIN_VALIDATION_REPORT_DIR}/${branch}.status
    if is_path_exists ${file}
        code = readfile ${file}
        if not eq ${code} 0
            echo "Failed or blocked: ${branch} (${code})"
            failed = set true
        end
    else
        echo "Missing completion: ${branch}"
        failed = set true
    end
end
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
rm -r ${temporary}
if is_path_exists ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
    snapshot = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
    rm -r ${snapshot}
end
if ${failed}
    trigger_error "Main validation failed; retain every original report and log"
end
'''

