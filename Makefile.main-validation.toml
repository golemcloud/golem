[tasks.main-validation-apfs]
description = "Build and run the same-source native APFS coverage on macOS"
env = { RUST_MIN_STACK = "33554432" }
script_runner = "@duckscript"
script = '''
mkdir ${MAIN_VALIDATION_REPORT_DIR}
build = exec --fail-on-error cargo test --locked -j 4 --profile dev-ci -p golem-worker-executor --features test-utils --lib --no-run --message-format=json-render-diagnostics
writefile ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-messages.jsonl ${build.stdout}
exec --fail-on-error integration-tests/scripts/managed-filesystem/test-select-cargo-test-executables.py
selection = exec --fail-on-error python3 integration-tests/scripts/managed-filesystem/select-cargo-test-executables.py ${MAIN_VALIDATION_REPORT_DIR}/apfs-cargo-messages.jsonl ${CARGO_MAKE_WORKING_DIRECTORY} lib
line = trim ${selection.stdout}
fields = split ${line} "\t"
kind = array_get ${fields} 0
if not eq ${kind} lib
    trigger_error "Expected exactly one native APFS library executable"
end
executable = array_get ${fields} 1
exec --fail-on-error bash integration-tests/scripts/apfs/run-native-tests.sh ${executable} :tag:native_apfs --include-ignored --test-threads 1 --report-time --format ctrf --logfile ${MAIN_VALIDATION_REPORT_DIR}/ctrf-apfs.json
'''
