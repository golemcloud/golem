[tasks.main-validation-xfs]
private = true
script_runner = "@duckscript"
script = '''
snapshot = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
digest = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.digest
exec --fail-on-error cargo-test-r verify --selection ${snapshot}/selection.json --expect-digest ${digest} --deadline 10m --kill-grace 10s
exec --fail-on-error integration-tests/scripts/managed-filesystem/run-loopback-xfs.sh --self-test-initial-file-wasm
runner = set ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/cargo-test-r
installed_runner = exec --fail-on-error which cargo-test-r
assert_eq ${installed_runner.code} 0 "cargo-test-r is required for XFS reuse"
installed_runner = trim ${installed_runner.stdout}
cp ${installed_runner} ${runner}
set_env GOLEM_MANAGED_XFS_REUSE_TEST_BINARIES 1
set_env GOLEM_MANAGED_XFS_TARGET_DIR ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}
set_env GOLEM_MANAGED_XFS_CARGO_TEST_R ${runner}
set_env GOLEM_MANAGED_XFS_SELECTION ${snapshot}/selection.json
set_env GOLEM_MANAGED_XFS_SELECTION_DIGEST ${digest}
set_env GOLEM_MANAGED_XFS_EXECUTABLE_CHECKSUMS ${MAIN_VALIDATION_REPORT_DIR}/executor-executables.sha256
code = exec --get-exit-code integration-tests/scripts/managed-filesystem/run-lima.sh
cleanup = exec --get-exit-code limactl delete --force golem-managed-xfs-v1
if not eq ${code} 0
    trigger_error "Managed XFS validation failed"
end
if not eq ${cleanup} 0
    trigger_error "Managed XFS VM cleanup failed"
end
'''

