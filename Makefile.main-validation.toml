code = exec --get-exit-code python3 .github/main-validation/progress.py run service ${MAIN_VALIDATION_RECOVERY_GROUP} -- cargo make --disable-check-for-updates --profile ci --skip-tasks "^(wit|build-sdk-ts|ensure-builtin-artifacts)$" integration-tests-group${MAIN_VALIDATION_RECOVERY_GROUP}
writefile ${MAIN_VALIDATION_REPORT_DIR}/service-${MAIN_VALIDATION_RECOVERY_GROUP}.status ${code}
writefile ${MAIN_VALIDATION_REPORT_DIR}/recovery.status ${code}
'''

[tasks.main-validation-cli-tests]
