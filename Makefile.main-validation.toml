# One selected source per invocation. GitHub Actions prevents overlapping cycles.
# Worker executables are frozen before the service build can replace Cargo outputs.

[env.MAIN_VALIDATION_REPORT_DIR]
value = "${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation-reports"
condition = { env_not_set = ["MAIN_VALIDATION_REPORT_DIR"] }

[env.MAIN_VALIDATION_PARALLEL]
value = "true"
condition = { env_not_set = ["MAIN_VALIDATION_PARALLEL"] }

[env.MAIN_VALIDATION_BUILD_JOBS]
value = "32"
condition = { env_not_set = ["MAIN_VALIDATION_BUILD_JOBS"] }

[tasks.main-validation]
description = "Validate the selected main source on a dedicated Linux executor"
env = { GOLEM_CLI_TEST_BIN_PROFILE = "dev-release-ci", TEST_R_COMMAND = "bun .github/main-validation/progress.ts test-r", TEST_R_REPORT_OPTS = "--format ctrf --logfile ${MAIN_VALIDATION_REPORT_DIR}/ctrf.json --retry-failed 2", TEST_R_FLAKY_OPTS = "", MAIN_VALIDATION_RECOVERY_GROUP = "4" }
run_task = { name = ["main-validation-prepare", "main-validation-parallel", "main-validation-exclusive", "main-validation-result"] }

[tasks.main-validation-parallel]
private = true
run_task = [
    { name = ["main-validation-workers", "main-validation-services"], fork = true, parallel = true, condition = { env_true = ["MAIN_VALIDATION_PARALLEL"] } },
    { name = ["main-validation-workers", "main-validation-services"], condition = { env_false = ["MAIN_VALIDATION_PARALLEL"] } },
]

[tasks.main-validation-prepare]
private = true
env = { MAIN_VALIDATION_TASKS = "wit main-validation-builtins main-validation-general-native main-validation-unit-tests build-cli-test-bins prepare-sdk-scala prepare-sdk-ts prepare-sdk-effect main-validation-js-guests prepare-sdk-moonbit main-validation-fixtures main-validation-executor-native", CARGO_BUILD_JOBS = "${MAIN_VALIDATION_BUILD_JOBS}" }
script_runner = "@duckscript"
script = '''
mkdir ${MAIN_VALIDATION_REPORT_DIR}
# Absolute endpoint overrides bypass the disjoint listener blocks.
endpoints = array REDIS_PORT REGISTRY_HTTP_PORT
for endpoint in ${endpoints}
    value = get_env ${endpoint}
    if not is_empty ${value}
        trigger_error "Unset ${endpoint}: Main validation owns isolated dependency ports"
    end
end
rm ${MAIN_VALIDATION_REPORT_DIR}/service-build.status
temporary = exec --fail-on-error mktemp -d
temporary = trim ${temporary.stdout}
writefile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt ${temporary}
branches = array prepare worker service recovery cli root-checks source-checks rust-checks bash-checks language-checks privileged
for branch in ${branches}
    rm ${MAIN_VALIDATION_REPORT_DIR}/${branch}.status
    mkdir ${temporary}/${branch}
end
# Refuse an older runner rather than silently falling back to Cargo.
help = exec --fail-on-error cargo-test-r run --help
features = array --selection --events --deadline --no-fail-fast --expect-digest --binary-id
for feature in ${features}
    supported = contains ${help.stdout} ${feature}
    if not ${supported}
        trigger_error "Install cargo-test-r with the required Main validation features"
    end
end
commands = array list snapshot verify exec inspect-events
for command in ${commands}
    help = exec --fail-on-error cargo-test-r ${command} --help
    features = array --deadline --kill-grace
    if eq ${command} list
        features = array --deadline --kill-grace --cargo-metadata --expect-count --output
    elif eq ${command} inspect-events
        features = array --events --invocation-id --report-format
    end
    for feature in ${features}
        supported = contains ${help.stdout} ${feature}
        if not ${supported}
            trigger_error "Install cargo-test-r with the required Main validation features"
        end
    end
end
tasks = split ${MAIN_VALIDATION_TASKS} " "
failed = set 0
for task in ${tasks}
    requirements = array wit
    if eq ${task} wit
        requirements = array
    elif eq ${task} main-validation-general-native
        requirements = array wit main-validation-builtins
    elif eq ${task} main-validation-unit-tests
        requirements = array main-validation-general-native
    elif eq ${task} build-cli-test-bins
        requirements = array wit main-validation-builtins
    elif eq ${task} main-validation-js-guests
        requirements = array main-validation-general-native prepare-sdk-ts prepare-sdk-effect
    elif eq ${task} main-validation-fixtures
        requirements = array build-cli-test-bins prepare-sdk-scala prepare-sdk-ts prepare-sdk-effect prepare-sdk-moonbit main-validation-builtins
    elif eq ${task} main-validation-executor-native
        requirements = array wit main-validation-builtins
    end
    admitted = set true
    for requirement in ${requirements}
        status = readfile ${MAIN_VALIDATION_REPORT_DIR}/prepare-${requirement}.status
        if not eq ${status} 0
            admitted = set false
        end
    end
    code = set blocked
    if ${admitted}
        skip = set "^(wit|test-component-middleware-unit-tests)$"
        if eq ${task} wit
            skip = set "^test-component-middleware-unit-tests$"
        end
        code = exec --get-exit-code bun .github/main-validation/progress.ts run prepare ${task} -- cargo make --disable-check-for-updates --allow-private --profile ci --skip-tasks ${skip} ${task}
    end
    writefile ${MAIN_VALIDATION_REPORT_DIR}/prepare-${task}.status ${code}
    if not eq ${code} 0
        failed = set 1
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/prepare.status ${failed}
'''

[tasks.main-validation-unit-tests]
private = true
env = { TEST_R_BUILD_OPTS = "--binaries-metadata ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/general.json" }
run_task = "unit-tests"

# Admission reads only current-cycle producer results, never cached outputs.
[tasks.main-validation-admit]
private = true
script_runner = "@duckscript"
script = '''
set_env MAIN_VALIDATION_ADMITTED true
requirements = split ${MAIN_VALIDATION_REQUIRES} " "
for requirement in ${requirements}
    if not is_empty ${requirement}
        path = set ${MAIN_VALIDATION_REPORT_DIR}/prepare-${requirement}.status
        if is_path_exists ${path}
            code = readfile ${path}
            if not eq ${code} 0
                set_env MAIN_VALIDATION_ADMITTED false
            end
        else
            set_env MAIN_VALIDATION_ADMITTED false
        end
    end
end
'''

[tasks.main-validation-builtins]
private = true
dependencies = ["ensure-builtin-artifacts"]
script_runner = "@duckscript"
script = '''
manifest = exec --fail-on-error jq -r ".[].path" builtin-artifacts.json
paths = split ${manifest.stdout} "\n"
for path in ${paths}
    if not is_empty ${path}
        exec --fail-on-error wasm-tools validate --features all ${path}
    end
end
'''

[tasks.main-validation-general-native]
private = true
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo build --profile dev-ci --workspace --bins --tests
mkdir ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation
# nextest invokes cargo test: --bins would force test builds of test=false servers.
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --workspace --tests --list-type binaries-only --message-format json
echo ${metadata.stderr}
writefile ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/general.json ${metadata.stdout}
# Existing source generators consume debug paths.
mkdir ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug
binaries = array golem golem-cli golem-registry-service golem-worker-service golem-shard-manager golem-component-compilation-service worker-executor golem-openapi-client-generator
for binary in ${binaries}
    cp ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-ci/${binary} ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/${binary}
end
'''

[tasks.main-validation-js-guests]
private = true
description = "Validate real JS guests using freshly built SDK templates and local native binaries"
env = { TEST_R_BUILD_OPTS = "--binaries-metadata ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/general.json" }
run_task = "js-guest-tests"

[tasks.main-validation-executor-native]
private = true
script_runner = "@duckscript"
script = '''
rm ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.digest
rm ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.json
rm ${MAIN_VALIDATION_REPORT_DIR}/executor-executables.sha256
exec --fail-on-error cargo build --profile dev-ci --tests -p golem-worker-executor -p golem-worker-executor-tests -p golem-common -p golem-size-analysis
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --tests -p golem-worker-executor -p golem-worker-executor-tests -p golem-common -p golem-size-analysis --list-type binaries-only --message-format json
assert_eq ${metadata.code} 0 "Executor metadata production failed: ${metadata.stderr}"
echo ${metadata.stderr}
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-binaries.json ${metadata.stdout}
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
cycle = basename ${temporary}
snapshot = set ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation/frozen-${cycle}
mkdir ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt ${snapshot}
selection = exec cargo-test-r list --binaries-metadata ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-binaries.json --deadline 10m --kill-grace 10s
assert_eq ${selection.code} 0 "Executor selection failed: ${selection.stderr}"
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-selection.json ${selection.stdout}
exec --fail-on-error cargo-test-r snapshot --selection ${MAIN_VALIDATION_REPORT_DIR}/executor-produced-selection.json --out ${snapshot} --deadline 10m --kill-grace 10s
exec --fail-on-error chmod 0755 ${snapshot} ${snapshot}/bin
digest = sha256sum ${snapshot}/selection.json
exec --fail-on-error cargo-test-r verify --selection ${snapshot}/selection.json --expect-digest sha256:${digest} --deadline 10m --kill-grace 10s
# Retain native evidence after the final join removes the copied executables.
cp ${snapshot}/selection.json ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.json
# Lima re-attests libraries in the guest, but must reuse these exact host bytes.
binaries = glob_array ${snapshot}/bin/*
checksums = set ""
for binary in ${binaries}
    checksum = exec --fail-on-error timeout --kill-after=10s 10m sha256sum -- ${binary}
    assert_eq ${checksum.code} 0 "Executor transfer checksum failed: ${checksum.stderr}"
    checksums = concat ${checksums} ${checksum.stdout}
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-executables.sha256 ${checksums}
writefile ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.digest sha256:${digest}
'''

[tasks.main-validation-service-native]
private = true
script_runner = "@duckscript"
script = '''
exec --fail-on-error cargo build --profile dev-ci --bins --tests -p integration-tests -p golem-cli -p golem-service-base -p golem-registry-service -p golem-worker-service -p golem-shard-manager -p golem-test-framework -p golem-component-compilation-service -p golem-worker-executor
metadata = exec --fail-on-error cargo nextest list --cargo-profile dev-ci --tests -p integration-tests -p golem-cli -p golem-service-base -p golem-registry-service -p golem-worker-service -p golem-shard-manager -p golem-test-framework -p golem-component-compilation-service -p golem-worker-executor --list-type binaries-only --message-format json
echo ${metadata.stderr}
writefile ${MAIN_VALIDATION_REPORT_DIR}/service-binaries.json ${metadata.stdout}
# CLI service-config tests use debug paths, but require this producer's selection.
binaries = array golem-registry-service golem-worker-service golem-shard-manager golem-component-compilation-service worker-executor
for binary in ${binaries}
    cp ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-ci/${binary} ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/debug/${binary}
end
'''

[tasks.main-validation-fixtures]
private = true
script_runner = "@duckscript"
script = '''
set_env GOLEM_CLI ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/dev-release-ci/golem
set_env GOLEM_TS_PRESET quick
set_env CARGO_TARGET_DIR ${CARGO_MAKE_CRATE_TARGET_DIRECTORY}/main-validation-fixture-target
root = pwd
set_env GOLEM_FIXTURE_CACHE ${root}/.validation-cache/fixtures-v1/completed
exec --fail-on-error bun .github/main-validation/fixture-cache.ts begin
cd sdks/moonbit/golem_sdk_tools
exec --fail-on-error moon update
cd ${root}/test-components/tool-streaming-moonbit
exec --fail-on-error moon update
cd ${root}
exec --fail-on-error ./test-components/build-components.sh rebuild
exec --fail-on-error ./test-components/build-components.sh benchmarks rebuild
exec --fail-on-error ./test-components/build-components.sh check
exec --fail-on-error ./test-components/build-components.sh benchmarks check
fixtures = array golem_it_tool_streaming_rust_provider_release.wasm golem_it_tool_streaming_rust_caller_release.wasm golem_it_agent_rpc_rust_release.wasm
for fixture in ${fixtures}
    exec --fail-on-error test -s test-components/${fixture}
end
different = exec --get-exit-code cmp --silent test-components/it_agent_update_v3_release.wasm test-components/it_agent_update_v4_release.wasm
if not eq ${different} 1
    trigger_error "Update v3/v4 fixtures must exist and have different contents"
end
exec --fail-on-error bun .github/main-validation/fixture-cache.ts publish
'''

# These wrappers collect ordinary failures and return normally so cargo-make joins
# every fork. The final task rejects failures and missing completion records.
[tasks.main-validation-workers]
private = true
env = { MAIN_VALIDATION_TASKS = "misc group1 group2 group3 group4 group5 tool-streaming", MAIN_VALIDATION_REQUIRES = "main-validation-executor-native main-validation-fixtures", GOLEM_TEST_PORT_OFFSET = "0" }
script_runner = "@duckscript"
script = '''
cm_run_task main-validation-admit
admitted = get_env MAIN_VALIDATION_ADMITTED
if not ${admitted}
    writefile ${MAIN_VALIDATION_REPORT_DIR}/worker.status blocked
    exit
end
temporary = readfile ${MAIN_VALIDATION_REPORT_DIR}/temporary-root.txt
set_env TMPDIR ${temporary}/worker
snapshot = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-snapshot-root.txt
digest = readfile ${MAIN_VALIDATION_REPORT_DIR}/executor-selection.digest
set_env TEST_R_BUILD_OPTS "--selection ${snapshot}/selection.json --expect-digest ${digest}"
failed = set 0
groups = split ${MAIN_VALIDATION_TASKS} " "
for group in ${groups}
    code = exec --get-exit-code bun .github/main-validation/progress.ts run worker ${group} -- cargo make --disable-check-for-updates --profile ci --skip-tasks "^(wit|ensure-builtin-artifacts)$" worker-executor-tests-${group}
    writefile ${MAIN_VALIDATION_REPORT_DIR}/worker-${group}.status ${code}
    if not eq ${code} 0
        failed = set 1
    end
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/worker.status ${failed}
'''

[tasks.main-validation-services]
private = true
env = { MAIN_VALIDATION_TASKS = "main-validation-service-native", MAIN_VALIDATION_REQUIRES = "wit main-validation-builtins", CARGO_BUILD_JOBS = "20" }
script_runner = "@duckscript"
script = '''
cm_run_task main-validation-admit
admitted = get_env MAIN_VALIDATION_ADMITTED
code = set blocked
if ${admitted}
    code = exec --get-exit-code bun .github/main-validation/progress.ts run service-build main-validation-service-native -- cargo make --disable-check-for-updates --allow-private --profile ci main-validation-service-native
end
writefile ${MAIN_VALIDATION_REPORT_DIR}/service-build.status ${code}
writefile ${MAIN_VALIDATION_REPORT_DIR}/prepare-main-validation-service-native.status ${code}
if eq ${code} 0
    cm_run_task main-validation-service-and-cli
else
    writefile ${MAIN_VALIDATION_REPORT_DIR}/service.status ${code}
    writefile ${MAIN_VALIDATION_REPORT_DIR}/recovery.status blocked
    writefile ${MAIN_VALIDATION_REPORT_DIR}/cli.status blocked
end
'''

[tasks.main-validation-service-and-cli]
