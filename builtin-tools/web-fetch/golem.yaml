# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/2.0.0-dev.1/golem.schema.json
manifestVersion: 2.0.0
app: web-fetch

componentTemplates:
  web-fetch-rust:
    templates: rust
    customCommands:
      copy:
        - command: cp "{{ cargoTarget }}/wasm32-wasip2/release/golem_web_fetch.wasm" "{{ appRootDir }}/../web-fetch.wasm"

components:
  golem:web-fetch:
    dir: "."
    templates: web-fetch-rust

environments:
  local:
    server: local
    componentPresets: release
