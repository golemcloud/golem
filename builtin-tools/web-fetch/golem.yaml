# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
manifestVersion: 1.6.0
app: web-fetch

components:
  golem:web-fetch:
    dir: "."
    templates: rust
    customCommands:
      copy:
        - command: cp "{{ cargoTarget }}/wasm32-wasip2/release/golem_web_fetch.wasm" "{{ appRootDir }}/../web-fetch.wasm"

environments:
  local:
    server: local
    componentPresets: release
