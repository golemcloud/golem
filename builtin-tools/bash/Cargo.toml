[workspace]
resolver = "2"
members = ["shell", "component", "utilities/wcurl", "utilities/waget", "utilities/whttp"]
default-members = ["shell", "component"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/golemcloud/golem"
publish = false

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
golem-rust = { path = "../../sdks/rust/golem-rust" }
golem-schema = { path = "../../golem-schema", default-features = false }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi-fetch = "=0.2.0"
wasip3 = "0.7"
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", branch = "wit-bindgen-golem-1.6", version = "=0.59.0", default-features = false, features = ["async", "macros"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

# bash.wasm is built with this profile (build-bash-wasm.sh). Every setting that changes its bytes
# is written out, defaults included, so the artifact does not depend on cargo's defaults.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 16
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "debuginfo"

