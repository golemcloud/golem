manifestVersion: 2.0.0
app: golem-builtin-bash

componentTemplates:
  bash-rust:
    presets:
      release:
        default: true
        build:
          - command: cargo build --locked --release --target wasm32-wasip2 --package golem-bash-tool --lib
            dir: "{{ appRootDir }}"
        componentWasm: "{{ cargoTarget }}/wasm32-wasip2/release/golem_bash.wasm"
        customCommands:
          copy:
            - command: cp "{{ cargoTarget }}/wasm32-wasip2/release/golem_bash.wasm" "{{ appRootDir }}/../bash.wasm"

components:
  golem:bash:
    dir: component
    templates: bash-rust

tools:
  bash: {}

environments:
  local:
    server: local
    componentPresets: release
