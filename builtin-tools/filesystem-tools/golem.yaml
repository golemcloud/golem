# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
manifestVersion: 1.6.0
app: filesystem-tools

componentTemplates:
  filesystem-tools-rust:
    templates: rust
    customCommands:
      copy:
        - command: cp "{{ cargoTarget }}/wasm32-wasip2/release/golem_filesystem_tools.wasm" ../filesystem-tools.wasm

components:
  golem:filesystem-tools:
    dir: "."
    templates: filesystem-tools-rust

environments:
  local:
    server: local
    componentPresets: release
