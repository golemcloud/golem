manifestVersion: 1.6.0

app: filesystem-tools-moonbit

componentTemplates:
  moonbit-tool-component:
    presets:
      release:
        default: true
        build:
        - command: moon run cmd -- reexports "{{ appRootDir }}/../../sdks/moonbit/golem_sdk" "{{ componentDir }}"
          dir: "{{ appRootDir }}/../../sdks/moonbit/golem_sdk_tools"
        - command: moon run cmd -- agents "{{ appRootDir }}" --component-dir "{{ componentDir }}"
          dir: "{{ appRootDir }}/../../sdks/moonbit/golem_sdk_tools"
        - command: moon -C "{{ appRootDir }}" build --target wasm --release
        - command: wasm-tools component embed "{{ appRootDir }}/../../sdks/moonbit/golem_sdk/wit" "{{ appRootDir }}/_build/wasm/release/build/golemcloud/filesystem_tools_moonbit/{{ moonbitBuildPackagePath }}" --world agent-guest --encoding utf16 --output "{{ appRootDir }}/_build/wasm/release/{{ componentName | to_snake_case }}.embed.wasm"
          mkdirs:
          - "{{ appRootDir }}/_build/wasm/release"
        - command: wasm-tools component new "{{ appRootDir }}/_build/wasm/release/{{ componentName | to_snake_case }}.embed.wasm" --output "{{ appRootDir }}/_build/wasm/release/{{ componentName | to_snake_case }}.agent.wasm"
        componentWasm: "{{ appRootDir }}/_build/wasm/release/{{ componentName | to_snake_case }}.agent.wasm"
        customCommands:
          copy:
          - command: cp "{{ golemTempDir }}/final-wasm/golem:filesystem-tools-moonbit.wasm" "{{ appRootDir }}/../filesystem-tools-moonbit.wasm"

components:
  golem:filesystem-tools-moonbit:
    dir: component
    templates: moonbit-tool-component

tools:
  read-file-moonbit: {}
  write-file-moonbit: {}
  edit-file-moonbit: {}

environments:
  local:
    server: local
    componentPresets: release
