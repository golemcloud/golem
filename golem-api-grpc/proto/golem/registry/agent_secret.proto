syntax = "proto3";

package golem.registry;

import "golem/common/uuid.proto";
import "golem/component/agent.proto";
import "golem/component/component_id.proto";
import "golem/common/environment.proto";
import "golem/schema/schema.proto";
import "golem/worker/worker_id.proto";
import "google/protobuf/empty.proto";

message AgentSecretOwner {
  oneof owner {
    google.protobuf.Empty environment = 1;
    AgentSecretAgentOwner agent = 2;
    string tool_name = 3;
  }
}

message AgentSecretAgentOwner {
  golem.worker.AgentId agent_id = 1;
  golem.common.UUID fingerprint = 2;
}

enum AgentSecretReadMode {
  AGENT_SECRET_READ_MODE_UNSPECIFIED = 0;
  AGENT_SECRET_READ_MODE_LIVE = 1;
  AGENT_SECRET_READ_MODE_HISTORICAL = 2;
}

message AgentSecretId {
  golem.common.UUID value = 1;
}

message AgentSecret {
  AgentSecretId agent_secret_id = 1;
  uint64 revision = 2;
  golem.common.EnvironmentId environment_id = 3;
  // agent secret path in canonical form
  repeated string path = 4;
  golem.schema.SchemaGraph secret_type = 5;
  optional golem.schema.SchemaValue secret_value = 6;
  AgentSecretOwner owner = 7;
  repeated string destinations = 8;
}
