syntax = "proto3";

package golem.registry;

import "golem/common/account_id.proto";

message ResourceUsageUpdate {
  golem.common.AccountId account_id = 1;
  int64 fuel_delta = 2;
  uint64 http_call_count_delta = 3;
  uint64 rpc_call_count_delta = 4;
  int64 durable_storage_byte_seconds_delta = 5;
  int64 ephemeral_storage_byte_seconds_delta = 6;
  int64 memory_gb_seconds_delta = 7;
  bool compute_metering_enabled = 8;
  bool memory_metering_enabled = 9;
  bool filesystem_metering_enabled = 10;
  uint64 monthly_usage_mode_revision = 11;
  uint64 memory_byte_nanoseconds_remainder = 12;
  uint64 durable_storage_byte_nanoseconds_remainder = 13;
  uint64 ephemeral_storage_byte_nanoseconds_remainder = 14;
}
