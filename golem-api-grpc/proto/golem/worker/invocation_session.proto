syntax = "proto3";

package golem.worker;

import "golem/auth/auth_ctx.proto";
import "golem/common/account_id.proto";
import "golem/common/empty.proto";
import "golem/common/environment.proto";
import "golem/common/uuid.proto";
import "golem/component/agent.proto";
import "golem/schema/schema.proto";
import "golem/worker/agent_config.proto";
import "golem/worker/idempotency_key.proto";
import "golem/worker/invocation.proto";
import "golem/worker/invocation_context.proto";
import "golem/worker/v1/worker_execution_error.proto";
import "golem/worker/worker_id.proto";
import "google/protobuf/timestamp.proto";

message InvocationStart {
  golem.worker.AgentId agent_id = 1;
  optional string method_name = 2;
  golem.schema.SchemaValue input = 3;
  golem.worker.IdempotencyKey idempotency_key = 4;
  golem.worker.InvocationContext context = 5;
  golem.auth.AuthCtx auth_ctx = 6;
  golem.component.Principal principal = 7;
  golem.common.EnvironmentId environment_id = 8;
  repeated golem.worker.AgentConfigEntryDto config = 9;
  golem.common.AccountId component_owner_account_id = 10;
  golem.worker.AgentInvocationMode mode = 11;
  optional google.protobuf.Timestamp schedule_at = 12;
  InvocationFreshnessDisposition freshness_disposition = 13;
}

enum InvocationFreshnessDisposition {
  INVOCATION_FRESHNESS_DISPOSITION_MAY_EXIST = 0;
  INVOCATION_FRESHNESS_DISPOSITION_KNOWN_FRESH = 1;
}

message InvocationResult {
  oneof result {
    golem.schema.SchemaValue method_result = 1;
    golem.common.Empty no_result = 2;
  }
  optional uint64 fuel_consumed = 3;
  optional uint64 component_revision = 4;
  optional golem.worker.InvocationStatus status = 5;
  optional uint64 oplog_index = 6;
  optional golem.common.UUID agent_fingerprint = 7;
  optional golem.worker.AgentId agent_id = 8;
  optional golem.worker.IdempotencyKey idempotency_key = 9;
}

message StreamDemand {
  uint64 stream_id = 1;
}

message StreamItem {
  uint64 stream_id = 1;
  golem.schema.SchemaValue value = 2;
}

message StreamEnd {
  uint64 stream_id = 1;
}

message StreamError {
  uint64 stream_id = 1;
  string details = 2;
}

message StreamDetach {
  uint64 stream_id = 1;
}

message InvocationProtocolFailure {
  enum Kind {
    PROTOCOL = 0;
    DENIED = 1;
    NOT_FOUND = 2;
    REMOTE_INTERNAL = 3;
    TRANSPORT = 4;
  }

  Kind kind = 1;
  string details = 2;
}

message InvocationCancel {
  enum Kind {
    SEMANTIC = 0;
    TRANSPORT = 1;
    PROTOCOL = 2;
  }

  Kind kind = 1;
  optional string details = 2;
}

message InvocationSessionFinished {
  oneof outcome {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
    InvocationProtocolFailure protocol_failure = 3;
  }
}

message InvocationFrame {
  reserved 2 to 4;

  oneof frame {
    InvocationStart start = 1;
    InvocationResult result = 5;
    StreamDemand demand = 6;
    StreamItem item = 7;
    StreamEnd end = 8;
    StreamError stream_error = 9;
    StreamDetach detach = 10;
    InvocationCancel cancel = 11;
    InvocationSessionFinished finished = 12;
  }
}
