syntax = "proto3";

package golem.worker;

import "golem/common/environment.proto";
import "golem/common/uuid.proto";
import "golem/component/agent.proto";

// Trusted backend context. The receipt is not an authorization secret: the target cancels
// only when the canceller is the immediate caller that it recorded for the scheduled call.
message ScheduledInvocationCancellation {
  reserved 1;
  reserved "owner_agent_id";
  golem.common.UUID schedule_id = 2;
  golem.common.EnvironmentId target_environment_id = 3;
  // The agent or tool that cancels: the immediate caller that a call made by the cancelling
  // code would get.
  golem.component.Principal canceller = 4;
}
