message DurableStreamAttachmentControlRequest {
  golem.worker.AgentId producer_agent_id = 1;
  golem.common.EnvironmentId producer_environment_id = 2;
  bytes payload = 3;
  golem.worker.AgentId consumer_agent_id = 4;
  golem.common.EnvironmentId consumer_environment_id = 5;
  golem.common.UUID expected_consumer_fingerprint = 6;
  golem.auth.AuthCtx auth_ctx = 7;
  // System-only control after the HTTP route has authorized the method.
  // Mutually exclusive with attachment payload and consumer identity fields.
  ExportStreamControl export_control = 8;
}

message ExportStreamControl {
  string session = 1;
  // Absent cancels session streams; present soft-deletes one canonical slot.
  optional string slot = 2;
  string expected_method = 3;
}

enum ExportStreamControlResult {
  EXPORT_STREAM_CONTROL_RESULT_UNSPECIFIED = 0;
  EXPORT_STREAM_CONTROL_RESULT_APPLIED = 1;
  EXPORT_STREAM_CONTROL_RESULT_NOT_FOUND = 2;
  EXPORT_STREAM_CONTROL_RESULT_GONE = 3;
}

message DurableStreamAttachmentControlResponse {
  oneof result {
    bool replayed = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
    ExportStreamControlResult export_result = 3;
  }
}

message DurableStreamSegmentReadRequest {
  golem.worker.AgentId producer_agent_id = 1;
  golem.common.EnvironmentId producer_environment_id = 2;
  bytes payload = 3;
  golem.worker.AgentId consumer_agent_id = 4;
  golem.common.EnvironmentId consumer_environment_id = 5;
  golem.common.UUID expected_consumer_fingerprint = 6;
  golem.auth.AuthCtx auth_ctx = 7;
}

message DurableStreamSegmentReadResponse {
  oneof result {
    bytes payload = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

message StreamSessionExpiryPolicy {
  oneof kind {
    golem.common.Empty none = 1;
    uint64 ttl_seconds = 2;
    uint64 expires_at_millis = 3;
  }
}

enum StreamSessionCreationIntent {
  STREAM_SESSION_CREATION_INTENT_UNSPECIFIED = 0;
  STREAM_SESSION_CREATION_INTENT_EXPLICIT_PUT = 1;
  STREAM_SESSION_CREATION_INTENT_LAZY_POST = 2;
}

message CreateStreamSessionRequest {
  string public_session_id = 1;
  StreamSessionExpiryPolicy expiry_policy = 2;
  StreamSessionCreationIntent creation_intent = 3;
  golem.worker.InvocationStart invocation = 4;
}

message CreateStreamSessionSuccess {
  string session = 1;
  bool replayed = 2;
  uint64 component_revision = 3;
  golem.worker.IdempotencyKey invocation_key = 4;
  StreamSessionExpiryPolicy expiry_policy = 5;
  optional uint64 expiry_deadline_millis = 6;
}

message CreateStreamSessionResponse {
  oneof result {
    CreateStreamSessionSuccess success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

// A read-only, unattached view of one root stream in a durable invocation session.
// `from_offset` is empty at the start of the stream and otherwise contains the
// canonical 24-byte StreamOffset representation. A zero max_items performs a
// metadata-only HEAD operation. Implementations cap both limits independently.
message ReadStreamSlotRequest {
  golem.worker.AgentId agent_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  golem.auth.AuthCtx auth_ctx = 3;
  string session = 4;
  string slot = 5;
  bytes from_offset = 6;
  uint32 max_items = 7;
  uint64 max_bytes = 8;
  uint64 wait_millis = 9;
  // Restricts the session to the method authorized by the HTTP route.
  string expected_method = 10;
  StreamSlotReadAdmission admission = 11;
  optional golem.worker.IdempotencyKey invocation_key = 12;
}

enum StreamSlotReadAdmission {
  STREAM_SLOT_READ_ADMISSION_UNSPECIFIED = 0;
  STREAM_SLOT_READ_ADMISSION_TOUCHING_ORIGIN_GET = 1;
  STREAM_SLOT_READ_ADMISSION_HEAD = 2;
  STREAM_SLOT_READ_ADMISSION_CONTINUATION = 3;
}

message StreamSlotItem {
  bytes offset = 1;
  // Canonical SchemaValue protobuf bytes for ordinary typed values. A packed
  // byte stream sets packed_u8 instead, with one logical item per byte.
  oneof content {
    bytes value = 2;
    bytes packed_u8 = 3;
  }
}

message ReadStreamSlotSuccess {
  repeated StreamSlotItem items = 1;
  bytes next_offset = 2;
  bool closed = 3;
  bool cancelled = 4;
  // Executor-resolved schema; callers must not supply or override it.
  golem.schema.SchemaGraph element_schema = 5;
  string content_type = 6;
  bool up_to_date = 7;
  bytes head_offset = 8;
  // Opaque identity scoped to the durable session and underlying stream incarnation.
  string stream_identity = 9;
  // Names from the invocation's pinned schema, including input and output slots.
  repeated string slots = 10;
  // The canonical slot URL is soft-deleted; no stream content is returned.
  bool tombstoned = 11;
  // Direction from the invocation's pinned schema, not the current deployment.
  bool writable = 12;
  // Creation provenance for an exported fork, independent of subsequent progress.
  ForkStreamSlotSuccess fork = 13;
  golem.worker.IdempotencyKey invocation_key = 14;
  StreamSessionExpiryPolicy expiry_policy = 15;
  optional uint64 expiry_deadline_millis = 16;
}

message ReadStreamSlotResponse {
  oneof result {
    ReadStreamSlotSuccess success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
    golem.common.Empty not_found = 3;
  }
}

// Only the authenticated custom-API gateway may submit an export fork. Source and target
// belong to the same component/environment, and session/slot must belong to expected_method.
message ForkStreamSlotRequest {
  golem.worker.AgentId source_agent_id = 1;
  golem.worker.AgentId target_agent_id = 2;
  golem.common.EnvironmentId environment_id = 3;
  golem.auth.AuthCtx auth_ctx = 4;
  string session = 5;
  string slot = 6;
  string expected_method = 7;
  string source_path = 8;
  // Absent means the source tail at first admission. Present contains a canonical 24-byte cursor.
  optional bytes fork_offset = 9;
  uint64 sub_offset = 10;
  optional string content_type = 11;
  uint32 max_forks_per_session = 12;
  uint32 max_forks_per_second = 13;
  uint64 max_copied_bytes = 14;
  bytes initial_content = 15;
  bool closed = 16;
  StreamSessionExpiryPolicy expiry_policy = 17;
}

message ForkStreamSlotSuccess {
  bool replayed = 1;
  string source_path = 2;
  bytes fork_offset = 3;
  uint64 sub_offset = 4;
  uint64 oplog_index = 5;
  golem.worker.IdempotencyKey invocation_key = 6;
}

message ForkStreamSlotRejection {
  enum Reason {
    UNSPECIFIED = 0;
    NOT_FOUND = 1;
    CONFLICT = 2;
    INVALID_OFFSET = 3;
    TOO_LARGE = 4;
    RATE_LIMITED = 5;
    READ_ONLY = 6;
  }
  Reason reason = 1;
  uint64 copied_bytes = 2;
  uint64 retry_after_seconds = 3;
}

message ForkStreamSlotResponse {
  oneof result {
    ForkStreamSlotSuccess success = 1;
    ForkStreamSlotRejection rejected = 2;
    golem.worker.v1.WorkerExecutionError failure = 3;
  }
}

message ExternalStreamProducer {
  string id = 1;
  uint64 epoch = 2;
  uint64 sequence = 3;
}

message AppendToStreamSlotRequest {
  golem.worker.AgentId agent_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  golem.auth.AuthCtx auth_ctx = 3;
  string session = 4;
  string slot = 5;
  oneof payload {
    // Each entry is a canonically encoded SchemaValue protobuf message.
    TypedStreamSlotItems values = 6;
    bytes packed_u8 = 7;
  }
  bool close = 8;
  optional ExternalStreamProducer producer = 9;
  string expected_method = 10;
}

message TypedStreamSlotItems {
  repeated bytes values = 1;
}

message AppendAccepted { bytes offset = 1; }
message AppendDuplicate {
  bytes offset = 1;
  // Highest sequence accepted in the producer's current epoch. Absent for a close without producer headers.
  optional uint64 highest_sequence = 2;
}
message AppendEpochFenced { uint64 current_epoch = 1; }
message AppendSequenceGap { uint64 expected = 1; uint64 received = 2; }

message AppendToStreamSlotResponse {
  oneof result {
    AppendAccepted accepted = 1;
    AppendDuplicate duplicate = 2;
    AppendEpochFenced epoch_fenced = 3;
    AppendSequenceGap sequence_gap = 4;
    golem.common.Empty closed = 5;
    golem.common.Empty not_found = 6;
    golem.worker.v1.WorkerExecutionError failure = 7;
    golem.common.Empty gone = 8;
    golem.common.Empty read_only = 9;
  }
  golem.worker.IdempotencyKey invocation_key = 10;
  StreamSessionExpiryPolicy expiry_policy = 11;
  optional uint64 expiry_deadline_millis = 12;
  bytes stream_head_offset = 13;
  optional bool stream_closed = 14;
}

message ProcessOplogEntriesRequest {
  golem.worker.AgentId agent_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  uint64 component_revision = 3;
  golem.worker.IdempotencyKey idempotency_key = 4;
  golem.common.AccountId account_id = 5;
  map<string, string> config = 6;
  golem.worker.AgentMetadata metadata = 7;
  uint64 first_entry_index = 8;
  repeated golem.worker.RawOplogEntry entries = 9;
  golem.auth.AuthCtx auth_ctx = 10;
}

message ProcessOplogEntriesResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

message DeliverCardTransferRequest {
  golem.worker.AgentId target_agent_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  golem.common.UUID transfer_id = 3;
  // desert_rust BinaryCodec encoding of golem_common::model::card::StoredCard.
  bytes card = 4;
  golem.auth.AuthCtx auth_ctx = 5;
  golem.common.UUID source_card_id = 6;
}

message DeliverCardTransferResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}
