  golem.common.EnvironmentId environment_id = 3;
  golem.auth.AuthCtx auth_ctx = 4;
  optional golem.component.Principal principal = 5;
}

message InterruptWorkerRequest {
  golem.worker.AgentId agent_id = 1;
  bool recover_immediately = 2;
  golem.common.EnvironmentId environment_id = 3;
  golem.auth.AuthCtx auth_ctx = 4;
  optional golem.component.Principal principal = 5;
}

message RevokeShardsRequest {
  repeated golem.shardmanager.ShardId shard_ids = 1;
  // The revision of the shard manager's persisted state the shards were moved
  // away in; see golem.shardmanager.v1.RegisterSuccess.revision.
  uint64 revision = 2;
}

message RevokeShardsResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

message AssignShardsRequest {
  reserved 1;
  reserved "shard_ids";
  // The executor's complete shard set with epochs: hold exactly these, drop
  // everything else. A push carries no lease: only the answer to a request the
  // executor made can extend one, because only the executor knows when it
  // asked - see golem.shardmanager.v1.RegisterSuccess.lease_ttl.
  repeated golem.shardmanager.ShardEpochEntry shard_epochs = 2;
  // Total number of shards in the cluster; never 0 — the executor divides by
  // it in check_worker.
  uint32 number_of_shards = 3;
  // The revision of the shard manager's persisted state this set was read
  // from; see golem.shardmanager.v1.RegisterSuccess.revision.
  uint64 revision = 4;
}

message AssignShardsResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

