import "golem/worker/worker_status.proto";
import "golem/schema/schema.proto";
import "google/protobuf/duration.proto";

service WorkerExecutor {
  rpc CreateWorker(CreateWorkerRequest) returns (CreateWorkerResponse);
  // Internal RPC target preparation. Resolves the target without starting its instance.
  // This does not acknowledge a method invocation.
  rpc PrepareWorker(CreateWorkerRequest) returns (CreateWorkerResponse);

  rpc ConnectWorker(ConnectWorkerRequest) returns (stream golem.worker.LogEvent);
  rpc DeleteWorker(DeleteWorkerRequest) returns (DeleteWorkerResponse);
  rpc CompletePromise(CompletePromiseRequest) returns (CompletePromiseResponse);
  rpc InterruptWorker(InterruptWorkerRequest) returns (InterruptWorkerResponse);
  rpc RevokeShards(RevokeShardsRequest) returns (RevokeShardsResponse);
  rpc AssignShards(AssignShardsRequest) returns (AssignShardsResponse);
  rpc GetAgentMetadata(GetAgentMetadataRequest) returns (GetAgentMetadataResponse);
  rpc ResumeWorker(ResumeWorkerRequest) returns (ResumeWorkerResponse);
  rpc GetRunningWorkersMetadata(GetRunningWorkersMetadataRequest) returns (GetRunningWorkersMetadataResponse);
  rpc GetWorkersMetadata(GetWorkersMetadataRequest) returns (GetWorkersMetadataResponse);
  rpc UpdateWorker(UpdateWorkerRequest) returns (UpdateWorkerResponse);
  rpc GetOplog(GetOplogRequest) returns (GetOplogResponse);
  rpc SearchOplog(SearchOplogRequest) returns (SearchOplogResponse);
  rpc ForkWorker(ForkWorkerRequest) returns (ForkWorkerResponse);
  rpc ResolveRevertLastInvocations(ResolveRevertLastInvocationsRequest) returns (ResolveRevertLastInvocationsResponse);
  rpc RevertWorker(RevertWorkerRequest) returns (RevertWorkerResponse);
  rpc CancelInvocation(CancelInvocationRequest) returns (CancelInvocationResponse);

  rpc GetFileSystemNode(GetFileSystemNodeRequest) returns (GetFileSystemNodeResponse);
  rpc GetAgentWallet(GetAgentWalletRequest) returns (GetAgentWalletResponse);
  rpc GetFileContents(GetFileContentsRequest) returns (stream GetFileContentsResponse);

  rpc ActivatePlugin(ActivatePluginRequest) returns (ActivatePluginResponse);
  rpc DeactivatePlugin(DeactivatePluginRequest) returns (DeactivatePluginResponse);

  rpc InvokeAgentSession(stream golem.worker.InvocationRequest) returns (stream golem.worker.InvocationResponse);

  rpc ControlDurableStreamAttachment(DurableStreamAttachmentControlRequest) returns (DurableStreamAttachmentControlResponse);
  rpc ReadDurableStreamSegment(DurableStreamSegmentReadRequest) returns (DurableStreamSegmentReadResponse);
  rpc CreateStreamSession(CreateStreamSessionRequest) returns (CreateStreamSessionResponse);
  rpc ReadStreamSlot(ReadStreamSlotRequest) returns (stream ReadStreamSlotResponse);
  rpc AppendToStreamSlot(AppendToStreamSlotRequest) returns (AppendToStreamSlotResponse);
  rpc ForkStreamSlot(ForkStreamSlotRequest) returns (ForkStreamSlotResponse);
  rpc ProcessOplogEntries(ProcessOplogEntriesRequest) returns (ProcessOplogEntriesResponse);
  rpc DeliverCardTransfer(DeliverCardTransferRequest) returns (DeliverCardTransferResponse);
}

message ForkWorkerRequest {
  golem.common.AccountId component_owner_account_id = 1;
  golem.worker.AgentId source_agent_id = 2;
  golem.worker.AgentId target_agent_id = 3;
  uint64 oplog_index_cutoff = 4;
  golem.common.EnvironmentId environment_id = 5;
  golem.auth.AuthCtx auth_ctx = 6;
  optional golem.component.Principal principal = 7;
  string component_owner_account_email = 8;
}

message ForkWorkerResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.worker.v1.WorkerExecutionError failure = 2;
  }
}

message DeleteWorkerRequest {
  golem.worker.AgentId agent_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  golem.auth.AuthCtx auth_ctx = 3;
