syntax = "proto3";

package golem.component;

import "golem/common/account_id.proto";
import "golem/common/empty.proto";
import "golem/common/environment.proto";
import "golem/common/uuid.proto";
import "golem/component/agent_files.proto";
import "golem/component/plugin.proto";
import "golem/http/http.proto";
import "golem/worker/agent_config.proto";
import "golem/worker/worker_id.proto";
import "google/protobuf/timestamp.proto";

enum AgentMode {
  DURABLE = 0;
  EPHEMERAL = 1;
}

message ReadOnlyConfig {
  CachePolicy cache_policy = 1;
  reserved 2;
  reserved "uses_principal";
}

message CachePolicy {
  oneof value {
    golem.common.Empty no_cache = 1;
    golem.common.Empty until_write = 2;
    uint64 ttl_nanos = 3;
  }
}

message AgentTypeProvisionConfig {
  map<string, string> env = 1;
  repeated golem.worker.TypedAgentConfigEntry config = 2;
  repeated golem.component.PluginInstallation plugins = 3;
  repeated golem.component.InitialAgentFile files = 4;
  bytes initial_permissions = 5;
}

message HttpMountDetails {
  repeated PathSegment path_prefix = 1;
  optional AgentHttpAuthDetails auth_details = 2;
  bool phantom_agent = 3;
  CorsOptions cors_options = 4;
  repeated PathSegment webhook_suffix = 5;
  repeated golem.http.FileMapping static_bindings = 6;
  repeated golem.http.FileMapping filesystem_bindings = 7;
  // The name of a parameterless router method that returns the OpenAPI document as a string.
  optional string openapi_provider_method = 8;
  repeated golem.http.FileResponseHeader file_response_headers = 9;
  optional PhantomIdBinding phantom_id_binding = 10;
}

message PhantomIdBinding {
  oneof source {
    PhantomIdBindingDetails path = 1;
    PhantomIdBindingDetails query = 2;
  }
}

message PhantomIdBindingDetails {
  string name = 1;
  bool optional = 2;
}

message HttpEndpointDetails {
  HttpMethod http_method = 1;
  repeated PathSegment path_suffix = 2;
  repeated golem.http.HeaderVariable header_vars = 3;
  repeated golem.http.QueryVariable query_vars = 4;
  optional AgentHttpAuthDetails auth_details = 5;
  CorsOptions cors_options = 6;
  optional golem.http.DurableStreamRouteOptions durable_streams = 7;
  optional golem.http.HttpRouteMode mode = 8;
}

message HttpMethod {
  oneof value {
    golem.http.HttpMethod method = 1;
    golem.common.Empty any = 2;
  }
}

message CorsOptions {
  repeated string allowed_patterns = 1;
}

message PathSegment {
  oneof value {
    golem.http.PathSegment segment = 1;
    SystemVariableSegment system_variable = 2;
  }
}

message SystemVariableSegment {
  SystemVariable value = 1;
}

enum SystemVariable {
  SYSTEM_VARIABLE_UNSPECIFIED = 0;
  SYSTEM_VARIABLE_AGENT_TYPE = 1;
  SYSTEM_VARIABLE_AGENT_VERSION = 2;
}

message Snapshotting {
  oneof value {
    golem.common.Empty disabled = 1;
    SnapshottingConfig enabled = 2;
  }
}

message SnapshottingConfig {
  oneof value {
    golem.common.Empty default = 1;
    uint64 periodic_nanos = 2;
    uint32 every_n_invocation = 3;
  }
}

message AgentHttpAuthDetails {
  bool required = 1;
}

message Pair {
  string issuer = 1;
  string subject = 2;
}

message Principal {
  reserved 1 to 4;
  reserved "oidc", "golem_user";
  oneof value {
    UserPrincipal user = 5;
    AccountPrincipal account = 6;
    AgentPrincipal agent = 7;
    ToolPrincipal tool = 8;
    golem.common.Empty anonymous = 9;
  }
}

message UserPrincipal {
  Pair pair = 1;
  string claims = 2;
  google.protobuf.Timestamp authenticated_at = 3;
}

enum AccountAuthentication {
  ACCOUNT_AUTHENTICATION_UNSPECIFIED = 0;
  ACCOUNT_AUTHENTICATION_API_TOKEN = 1;
  ACCOUNT_AUTHENTICATION_BOOTSTRAP_TOKEN = 2;
  ACCOUNT_AUTHENTICATION_SIGN_IN = 3;
}

message AccountPrincipal {
  string issuer = 1;
  golem.common.AccountId account_id = 2;
  AccountAuthentication authentication = 3;
}

message AgentPrincipal {
  string issuer = 1;
  golem.worker.AgentId agent_id = 2;
  golem.common.UUID fingerprint = 3;
  string agent_type = 4;
  golem.common.EnvironmentId environment_id = 5;
}

message ToolPrincipal {
  string issuer = 1;
  golem.common.EnvironmentId environment_id = 2;
  string tool_name = 3;
}

message TokenProvenance {
  golem.common.UUID id = 1;
  optional Pair maker = 2;
}

message Caller {
  Principal original = 1;
  // Absent when the immediate principal is the same as the original one.
  Principal immediate = 2;
  repeated TokenProvenance tokens = 3;
}

// The public form of a caller, as a reader of an oplog sees it.
message PublicCaller {
  PublicPrincipal original = 1;
  // Absent when the immediate principal is the same as the original one. The decoder rebuilds
  // both roles.
  PublicPrincipal immediate = 2;
  repeated PublicTokenProvenance tokens = 3;
}

message PublicPrincipal {
  oneof value {
    PublicUserPrincipal user = 1;
    PublicAccountPrincipal account = 2;
    PublicAgentPrincipal agent = 3;
    PublicToolPrincipal tool = 4;
    golem.common.Empty anonymous = 5;
  }
}

message PublicUserPrincipal {
  Pair pair = 1;
  google.protobuf.Timestamp authenticated_at = 2;
  // The claim set as a JSON object, or as a JSON string of its text when it holds a number that
  // no f64 holds. Absent unless the reader asked for the claims.
  optional string claims = 3;
}

message PublicAccountPrincipal {
  Pair pair = 1;
  golem.common.AccountId account_id = 2;
  AccountAuthentication authentication = 3;
}

message PublicAgentPrincipal {
  Pair pair = 1;
  golem.worker.AgentId agent_id = 2;
  string agent_type = 3;
  golem.common.EnvironmentId environment_id = 4;
}

message PublicToolPrincipal {
  Pair pair = 1;
  golem.common.EnvironmentId environment_id = 2;
  string tool_name = 3;
}

message PublicTokenProvenance {
  golem.common.UUID id = 1;
  optional Pair maker = 2;
}

enum AgentConfigSource {
  AGENT_CONFIG_SOURCE_UNSPECIFIED = 0;
  AGENT_CONFIG_SOURCE_LOCAL = 1;
  AGENT_CONFIG_SOURCE_SECRET = 2;
}
