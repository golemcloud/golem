syntax = "proto3";

package golem.shardmanager.v1;

import public "golem/common/empty.proto";
import public "golem/common/environment.proto";
import public "golem/common/quota.proto";
import public "golem/shardmanager/pod.proto";
import public "golem/shardmanager/routing_table.proto";
import public "golem/shardmanager/shard_epoch.proto";
import public "golem/shardmanager/shard_id.proto";
import public "golem/shardmanager/v1/shard_manager_error.proto";
import "google/protobuf/duration.proto";

service ShardManagerService {
  rpc GetRoutingTable(GetRoutingTableRequest) returns (GetRoutingTableResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Shard lease management.
  // Executors renew their shard lease on a timer and release it on a graceful
  // shutdown. Both RPCs identify the executor by the UUID it sent in Register;
  // neither carries a port — the address comes from the stored lease.
  rpc RenewShardLease(RenewShardLeaseRequest) returns (RenewShardLeaseResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);

  // Quota lease management.
  // Executors call these RPCs to acquire, renew, and release quota leases.
  rpc AcquireQuotaLease(AcquireQuotaLeaseRequest) returns (AcquireQuotaLeaseResponse);
  rpc RenewQuotaLease(RenewQuotaLeaseRequest) returns (RenewQuotaLeaseResponse);
  // Renew multiple leases in one round-trip. Results are in the same order
  // as the request entries.
  rpc BatchRenewQuotaLeases(BatchRenewQuotaLeasesRequest) returns (BatchRenewQuotaLeasesResponse);
  rpc ReleaseQuotaLease(ReleaseQuotaLeaseRequest) returns (ReleaseQuotaLeaseResponse);
}

message GetRoutingTableRequest {}

message GetRoutingTableResponse {
  oneof result {
    golem.shardmanager.RoutingTable success = 1;
    golem.shardmanager.v1.ShardManagerError failure = 2;
  }
}

message RegisterRequest {
  int32 port = 1;
  optional string pod_name = 2;
  // UUID generated once by the executor at startup, and the identity of its
  // shard lease. Stable across retries of the same registration: the same id at
  // the same address refreshes the existing lease rather than creating a second
  // one. An empty or non-UUID value is rejected before any state is touched.
  string executor_id = 3;
}

message RegisterResponse {
  oneof result {
    RegisterSuccess success = 1;
    golem.shardmanager.v1.ShardManagerError failure = 2;
  }
}

message RegisterSuccess {
  uint32 number_of_shards = 1;
  // The shards this executor holds, with their epochs. Empty on a first
  // registration: nothing is assigned yet and AssignShards delivers the
  // initial set.
  repeated golem.shardmanager.ShardEpochEntry shard_epochs = 2;
  // How long this executor's shard lease lasts, measured from the moment the
  // executor sent the request this answers. A duration rather than an absolute
  // time so that the two machines' clocks are never compared; anchored where
  // the request was sent so that the time this answer spent in flight comes
  // off the executor's copy of the lease rather than being added to it. The
  // shard manager's own copy therefore never lapses before the executor's.
  google.protobuf.Duration lease_ttl = 3;
  // The revision of the shard manager's persisted state this set was read
  // from. Every delivery of a shard set carries one - this, AssignShards and
  // ShardLease - and the executor applies a delivery only if its revision is at
  // least the last one it applied, so two deliveries that cross on the network
  // cannot leave the older set in place.
  uint64 revision = 4;
}

// An executor's shard lease: the complete set of shards it owns with the epoch
// of each, and how long the lease lasts, measured from the renewal request
// this answers, if it is not renewed again.
message ShardLease {
  repeated golem.shardmanager.ShardEpochEntry shard_epochs = 1;
  // See RegisterSuccess.lease_ttl.
  google.protobuf.Duration lease_ttl = 2;
  // See RegisterSuccess.revision.
  uint64 revision = 3;
}

// Extends the executor's shard lease before it expires. shard_epochs is the
// set the executor believes it holds. It is what the executor is proving it is
// alive for, not a condition of the renewal: a claim that does not match the
// manager's view is renewed all the same, and the response carries the set the
// manager holds for this executor, which the executor adopts. That makes the
// renewal a guaranteed second delivery path for a push that was lost, and it
// means a renewal never advances an epoch.
message RenewShardLeaseRequest {
  string executor_id = 1;
  repeated golem.shardmanager.ShardEpochEntry shard_epochs = 2;
}

message RenewShardLeaseResponse {
  oneof result {
    ShardLease success = 1;
    golem.shardmanager.v1.ShardLeaseError failure = 2;
  }
}

// Releases the shard lease on a graceful shutdown so the manager can re-home
// the shards without waiting for the lease to expire. shard_epochs is the set
// the executor believes it is handing back; the manager treats it leniently, so
// a stale entry never fails a shutdown. Deregistering an executor the manager
// does not know about succeeds.
message DeregisterRequest {
  string executor_id = 1;
  repeated golem.shardmanager.ShardEpochEntry shard_epochs = 2;
}

message DeregisterResponse {
  oneof result {
    golem.common.Empty success = 1;
    golem.shardmanager.v1.ShardLeaseError failure = 2;
  }
}

// Declares interest in a quota and requests an initial lease.
// The resource is identified by (environment_id, name) since the
// executor does not know the resource_definition_id yet.
message AcquireQuotaLeaseRequest {
  golem.common.EnvironmentId environment_id = 1;
  string resource_name = 2;
  int32 port = 3;
}

message AcquireQuotaLeaseResponse {
  oneof result {
    AcquireQuotaLeaseSuccessResponse success = 1;
    golem.shardmanager.v1.QuotaError error = 2;
  }
}

message AcquireQuotaLeaseSuccessResponse {
  golem.common.QuotaLease lease = 1;
}

// A pending reservation request from an agent on this executor.
// Included in RenewQuotaLeaseRequest so the shard manager can
// weight allocations across executors based on demand.
message PendingReservation {
  uint64 amount = 1;
  // Priority score: credit / amount_requested.  Higher values
  // indicate more deserving requests.
  double priority = 2;
}

// Renews an existing lease before it expires.
// The executor reports how much of its previous allocation was unused
// so the shard manager can reclaim and reallocate.
message RenewQuotaLeaseRequest {
  golem.common.ResourceDefinitionId resource_definition_id = 1;
  int32 port = 2;
  // Epoch of the lease being renewed. Used for fencing — the shard
  // manager rejects renewals for stale epochs.
  uint64 epoch = 3;
  // Units from the previous allocation that were not consumed.
  uint64 unused = 4;
  // Outstanding reservation requests on this executor, ordered by
  // priority (highest first).  The shard manager may use this to
  // weight allocations between executors.
  repeated PendingReservation pending_reservations = 5;
}

message RenewQuotaLeaseResponse {
  oneof result {
    RenewQuotaLeaseSuccessResponse success = 1;
    golem.shardmanager.v1.QuotaError error = 2;
  }
}

message RenewQuotaLeaseSuccessResponse {
  golem.common.QuotaLease lease = 1;
}

// Releases a lease, returning any unused allocation.
// Called when the executor loses interest in a quota (no more
// agents using this resource on this executor).
message ReleaseQuotaLeaseRequest {
  golem.common.ResourceDefinitionId resource_definition_id = 1;
  int32 port = 2;
  uint64 epoch = 3;
  uint64 unused = 4;
}

message ReleaseQuotaLeaseResponse {
  oneof result {
    ReleaseQuotaLeaseSuccessResponse success = 1;
    golem.shardmanager.v1.QuotaError error = 2;
  }
}

message ReleaseQuotaLeaseSuccessResponse { }

message BatchRenewQuotaLeasesRequest {
  repeated RenewQuotaLeaseRequest renewals = 1;
}

// One result per entry in the request, in the same order.
message BatchRenewQuotaLeasesResponse {
  repeated RenewQuotaLeaseResult results = 1;
}

message RenewQuotaLeaseResult {
  oneof result {
    RenewQuotaLeaseSuccessResponse success = 1;
    golem.shardmanager.v1.QuotaError error = 2;
  }
}
