syntax = "proto3";

package golem.mcp;

import "golem/common/environment.proto";
import "golem/common/account_id.proto";
import "golem/registry/agent.proto";
import "golem/customapi/core.proto";
import "golem/tool/tool.proto";
import "golem/schema/schema.proto";

message CompiledMcpToolExport {
  string mcp_name = 1;
  string description = 2;
  string owner_component_id = 3;
  string owner_component_name = 4;
  string tool_name = 5;
  repeated string command_path = 6;
  golem.tool.Tool definition = 7;
  golem.schema.SchemaGraph input_schema = 8;
}

message CompiledMcp {
  reserved 5;
  reserved "agent_type_implementers";

  golem.common.AccountId account_id = 1;
  golem.common.EnvironmentId environment_id = 2;
  uint64 deployment_revision = 3;
  string domain = 4;
  golem.customapi.SecuritySchemeDetails security_scheme = 6;
  repeated golem.registry.RegisteredAgentTypeSchema registered_agent_types = 7;
  string account_email = 8;
  string application_name = 9;
  string environment_name = 10;
  repeated CompiledMcpToolExport tools = 11;
  optional string security_scheme_name = 12;
}
