[workspace]
members = [
    "agent",
    "canonical-floor",
    "empty",
    "mixed",
    "non-reflective",
    "raw-floor",
    "reflection",
    "tool",
    "tool-client",
    "typed-floor",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
golem-rust = { path = "../../../sdks/rust/golem-rust", features = ["export_golem_agentic"] }
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "67b83d42c135db8c5c42bf26c53ec162bbdca5ea", version = "=0.63.0", features = ["async", "async-spawn", "inter-task-wakeup"] }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
