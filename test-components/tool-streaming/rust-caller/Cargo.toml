[package]
name = "golem_it_tool_streaming_rust_caller"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
capable-streaming-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/capable-streaming-tool-guest-client" }
clock-race-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/clock-race-tool-guest-client" }
environment-probe-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/environment-probe-tool-guest-client" }
futures-concurrency = "7.6.3"
golem-rust = { path = "../../../sdks/rust/golem-rust", features = ["export_golem_agentic"] }
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "67b83d42c135db8c5c42bf26c53ec162bbdca5ea", version = "=0.63.0", features = ["async", "async-spawn"] }
matrix-core-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/matrix-core-tool-guest-client" }
matrix-permission-issuer-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/matrix-permission-issuer-tool-guest-client" }
matrix-resource-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/matrix-resource-tool-guest-client" }
secret-policy-probe-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/secret-policy-probe-tool-guest-client" }
streaming-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/streaming-tool-guest-client" }
typed-output-stream-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/typed-output-stream-tool-guest-client" }
wallet-mutation-tool-guest-client = { path = "../golem-temp/bridge-sdk/rust/internal/wallet-mutation-tool-guest-client" }
