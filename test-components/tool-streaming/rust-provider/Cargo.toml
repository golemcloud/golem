[package]
name = "golem_it_tool_streaming_rust_provider"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
futures-concurrency = "7.6.3"
golem-rust = { path = "../../../sdks/rust/golem-rust", features = ["export_golem_agentic"] }
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "d3b26c17256b958ef02094ef2a2e90f9fcec46e2", version = "=0.63.0", features = ["async", "async-spawn"] }
wasi = { version = "=0.14.7+wasi-0.2.4" }
