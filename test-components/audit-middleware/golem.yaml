# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
manifestVersion: 1.6.0
app: audit-middleware

componentTemplates:
  audit-middleware-rust:
    templates: rust
    customCommands:
      copy:
        - command: cp "{{ cargoTarget }}/wasm32-wasip2/release/golem_audit_middleware.wasm" ../golem_audit_middleware_release.wasm

components:
  golem:audit-middleware:
    dir: "."
    templates: audit-middleware-rust

tools:
  middleware:
    audit:
      component: golem:audit-middleware

environments:
  local:
    server: local
    componentPresets: release
