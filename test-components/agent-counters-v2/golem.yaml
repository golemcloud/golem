# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.5.0-dev.1/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.5.0-dev.1/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.5.0

app: agent-counters-v2

includes:
- ../golem-test-components-common.yaml

components:
  it:agent-counters:
    dir: "."
    templates: rust, rust-test-component
    # Same component name as agent-counters on purpose: the agent types have to
    # match so an update can swap one build for the other underneath running
    # agents. Only the emitted file name differs, following the convention
    # agent-updates-v1/v2 already use.
    presets:
      debug:
        customCommands:
          copy:
          - command: cp golem-temp/agents/it_agent_counters_debug.wasm ../it_agent_counters_v2_debug.wasm
      release:
        customCommands:
          copy:
          - command: cp golem-temp/agents/it_agent_counters_release.wasm ../it_agent_counters_v2_release.wasm

environments:
  local:
    server: local
    componentPresets: debug
  cloud:
    server: cloud
    componentPresets: release
