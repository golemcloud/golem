[package]
name = "it_agent_update"
version = "0.0.1"
 edition = "2024"

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# To use common shared agent definitions, place them in common_lib and uncomment the line below
# common-lib = { path = "../../common-rust/common-lib" }

log = { version = "0.4.29", features = ["kv"] }
golem-rust = { path = "../../sdks/rust/golem-rust", features = ["export_golem_agentic"] }
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "d3b26c17256b958ef02094ef2a2e90f9fcec46e2", version = "=0.63.0", features = ["async", "async-spawn"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
