[package]
name = "it_agent_initializer"
version = "0.0.1"
edition = "2024"

# Standalone workspace root, so cargo does not attach this component to an enclosing workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
ctor = "0.4.3"
golem-rust = { path = "../../sdks/rust/golem-rust", features = ["export_golem_agentic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
