# Use this same file for each service. Supply PostgreSQL and AWS credentials separately.
# Set service addresses through GOLEM_ADVANCED__<SERVICE>__<PATH>.
state_store = "postgres"
blob_store = "s3"
data_dir = "/var/lib/golem"
recovery_location = "s3://golem-recovery/installation"
recovery_horizon = "30days"
retained_update_snapshots = 2
outbound_sockets = false

[postgres]
host = "postgres.internal"
port = 5432
database = "golem"
username = "golem"

[object_storage]
region = "us-east-1"
components_bucket = "golem-components"
artifacts_bucket = "golem-artifacts"
data_bucket = "golem-data"
public_endpoint_url = "https://downloads.example.com"

[cache]
type = "Disabled"

[internal_grpc_tls]
enabled = false

[filesystem_snapshots]
type = "Disabled"
