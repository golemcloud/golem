# Litestream configuration of the golem image, used when GOLEM_LITESTREAM=true. The entrypoint
# selects the single-file SQLite storage of the worker executor, so these are all the databases of
# the server, and no database file is ever deleted: deleting an agent deletes rows, and Litestream
# replicates that like any other write.
#
# The entrypoint sets GOLEM_LITESTREAM_REPLICA_BASE and GOLEM_LITESTREAM_REPLICA_QUERY from
# GOLEM_LITESTREAM_REPLICA_URL. The replica of <data_dir>/<name>.db is <replica_url>/<name>.db.
dbs:
  - path: ${GOLEM__DATA_DIR}/registry.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/registry.db${GOLEM_LITESTREAM_REPLICA_QUERY}
  - path: ${GOLEM__DATA_DIR}/shard_manager.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/shard_manager.db${GOLEM_LITESTREAM_REPLICA_QUERY}
  - path: ${GOLEM__DATA_DIR}/gateway-sessions.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/gateway-sessions.db${GOLEM_LITESTREAM_REPLICA_QUERY}
  - path: ${GOLEM__DATA_DIR}/scheduler.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/scheduler.db${GOLEM_LITESTREAM_REPLICA_QUERY}
  - path: ${GOLEM__DATA_DIR}/key-value-storage.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/key-value-storage.db${GOLEM_LITESTREAM_REPLICA_QUERY}
  - path: ${GOLEM__DATA_DIR}/indexed-storage.db
    replica:
      url: ${GOLEM_LITESTREAM_REPLICA_BASE}/indexed-storage.db${GOLEM_LITESTREAM_REPLICA_QUERY}
