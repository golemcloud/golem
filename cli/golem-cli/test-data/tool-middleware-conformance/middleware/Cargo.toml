[package]
name = "conformance_middleware"
version = "0.0.1"
edition = "2024"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
golem-rust = { path = "__GOLEM_RUST_PATH__", features = ["export_golem_agentic"] }

[workspace]
