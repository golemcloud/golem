<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golem oplog · __OPLOG_TITLE__</title>
<style>
:root {
  --bg: #0f1117; --bg2: #161a23; --bg3: #1d2230; --bg4: #262c3b;
  --fg: #e6e8ef; --fg2: #aab1c2; --fg3: #6f7891;
  --line: #2a3142; --accent: #7aa2f7; --accent2: #bb9af7;
  --sel: rgba(122,162,247,.14); --flash: rgba(255,214,102,.35);
  --c-lifecycle: #8b97b3; --c-invocation: #bb9af7; --c-host: #2ac3de; --c-error: #f7768e;
  --c-log: #9ece6a; --c-region: #ff9e64; --c-update: #7aa2f7; --c-plugin: #f5a0d6;
  --c-resource: #c0e07a; --c-snapshot: #d4a373; --c-retry: #e0af68; --c-card: #ff79c6; --c-stream: #73daca;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="light"] {
  --bg: #f7f8fb; --bg2: #ffffff; --bg3: #eef1f6; --bg4: #e2e6ee;
  --fg: #1b2130; --fg2: #4b5466; --fg3: #7d869a;
  --line: #d6dbe6; --accent: #2f5fd0; --accent2: #7c4dff;
  --sel: rgba(47,95,208,.10); --flash: rgba(255,196,0,.35);
  --c-lifecycle: #5f6b85; --c-invocation: #7c4dff; --c-host: #0e8fa5; --c-error: #d12f4e;
  --c-log: #4f8a10; --c-region: #d9711a; --c-update: #2f5fd0; --c-plugin: #c2399d;
  --c-resource: #6f9a1a; --c-snapshot: #9c6b3b; --c-retry: #b58210; --c-card: #d6338f; --c-stream: #1a9b8a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { background: var(--bg4); }
button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
input[type=text], input[type=number], select { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--fg3); }
.hidden { display: none !important; }

#app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header { background: var(--bg2); border-bottom: 1px solid var(--line); padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
header h1 .agent { font-family: var(--mono); font-weight: 500; color: var(--accent2); }
header .meta { color: var(--fg2); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
header .spacer { flex: 1; }
header .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

#toolbar { background: var(--bg2); border-bottom: 1px solid var(--line); padding: 6px 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
#toolbar .chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; cursor: pointer; background: var(--bg3); user-select: none; display: inline-flex; gap: 5px; align-items: center; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.chip.off { opacity: .4; }
.chip .n { color: var(--fg3); }
#search { width: 260px; }
#toolbar label { display: inline-flex; gap: 5px; align-items: center; color: var(--fg2); font-size: 12px; }
#matchinfo { color: var(--fg2); font-size: 12px; }

#main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#main.nosidebar { grid-template-columns: 1fr; }
#list { overflow: auto; min-height: 0; position: relative; padding-bottom: 60px; }
#minimap { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); height: 34px; cursor: crosshair; }
#minimap canvas { display: block; width: 100%; height: 34px; }
#mmtip { position: absolute; pointer-events: none; font-size: 11px; background: var(--bg4); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; display: none; z-index: 6; }
#sidebar { border-left: 1px solid var(--line); background: var(--bg2); overflow: auto; min-height: 0; font-size: 12px; }
#sidebar .tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg2); z-index: 2; }
#sidebar .tabs button { border: 0; border-radius: 0; background: none; padding: 7px 10px; color: var(--fg2); border-bottom: 2px solid transparent; }
#sidebar .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); background: none; }
#sidebar .pane { padding: 10px 12px; }
#sidebar h3 { margin: 10px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); }
#sidebar table { border-collapse: collapse; width: 100%; }
#sidebar td { padding: 2px 4px; vertical-align: top; }
#sidebar td:first-child { color: var(--fg2); white-space: nowrap; }
#sidebar td.num { text-align: right; font-family: var(--mono); }
.statrow { cursor: pointer; }
.statrow:hover { background: var(--bg3); }
.gantt .bar { position: relative; height: 16px; background: var(--bg3); border-radius: 3px; margin: 2px 0; cursor: pointer; overflow: hidden; }
.gantt .bar i { position: absolute; top: 0; bottom: 0; background: var(--c-invocation); opacity: .6; border-radius: 3px; min-width: 3px; }
.gantt .bar i.err { background: var(--c-error); }
.gantt .bar span { position: relative; z-index: 1; padding: 0 5px; font-size: 11px; line-height: 16px; white-space: nowrap; }
.console { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 70vh; overflow: auto; }
.console span { cursor: pointer; }
.console span:hover { background: var(--sel); }
.console .stderr { color: var(--c-error); }

/* rows */
.node { position: relative; }
.row { display: grid; grid-template-columns: 64px 132px minmax(150px, max-content) 1fr auto; gap: 8px; align-items: baseline; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 24px; }
.row:hover { background: var(--sel); }
.node.selected > .row { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.node.flash > .row { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }
.row .idx { font-family: var(--mono); color: var(--fg3); text-align: right; font-size: 11.5px; }
.row .time { font-family: var(--mono); font-size: 11.5px; color: var(--fg2); white-space: nowrap; }
.row .time .d { color: var(--fg3); font-size: 10.5px; margin-left: 4px; }
.row .kind { display: flex; align-items: center; gap: 6px; overflow: hidden; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); white-space: nowrap; text-transform: uppercase; }
.row .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.row .sum .fn { color: var(--accent); }
.row .sum .arrow { color: var(--fg3); margin: 0 5px; }
.row .sum .val { color: var(--fg2); }
.row .sum .err { color: var(--c-error); }
.row .sum .ok { color: var(--c-log); }
.row .right { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.tag { font-size: 10.5px; padding: 0 6px; border-radius: 999px; background: var(--bg3); color: var(--fg2); border: 1px solid var(--line); font-family: var(--mono); }
.tag.dur { color: var(--c-stream); }
.tag.fuel { color: var(--c-retry); }
.tag.attr { color: var(--c-plugin); }
.tag.rev { color: var(--c-update); }
.tag.warn { color: var(--c-error); border-color: color-mix(in srgb, var(--c-error) 50%, transparent); }
.tag.hint { color: var(--fg3); }
.caret { display: inline-block; width: 14px; text-align: center; color: var(--fg3); transition: transform .12s; font-size: 10px; }
.node.open > .row .caret { transform: rotate(90deg); }
.children { border-left: 1px dashed var(--line); margin-left: 20px; }
.node.group > .row { background: color-mix(in srgb, var(--c) 6%, transparent); }
.node.dropped > .row { opacity: .5; text-decoration: line-through; text-decoration-color: var(--c-error); }
.node.hint > .row .badge { opacity: .75; }
.node.err-level > .row .sum { color: var(--c-error); }
.node.warn-level > .row .sum { color: var(--c-retry); }
.divider { padding: 2px 14px 2px 70px; font-size: 11px; color: var(--c-update); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--c-update) 8%, transparent); }

/* details */
.details { padding: 8px 14px 12px 76px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.details .fields { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; align-items: baseline; margin-bottom: 8px; }
.details .fields .k { color: var(--fg2); white-space: nowrap; font-size: 12px; }
.details .fields .v { font-family: var(--mono); font-size: 12px; word-break: break-word; }
.details .fields .v .idxlink { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
.section { margin-top: 8px; }
.section > .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.section > .sh .t { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); }
.section > .sh .tabs button { padding: 1px 7px; font-size: 11px; }
.section .body { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow: auto; max-height: 480px; }
.section pre { margin: 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
.tree { font-family: var(--mono); font-size: 11.5px; }
.tree details { margin-left: 0; }
.tree details > summary { cursor: pointer; list-style: none; }
.tree details > summary::before { content: "▸"; display: inline-block; width: 12px; color: var(--fg3); font-size: 10px; }
.tree details[open] > summary::before { content: "▾"; }
.tree .leaf { padding-left: 12px; }
.tree .kids { padding-left: 16px; border-left: 1px dotted var(--line); margin-left: 4px; }
.tree .key { color: var(--fg2); }
.tree .ty { color: var(--fg3); font-size: 10.5px; margin-left: 6px; }
.tree .s { color: var(--c-log); }
.tree .n { color: var(--c-retry); }
.tree .b { color: var(--c-host); }
.tree .nul { color: var(--fg3); font-style: italic; }
.tree .cap { color: var(--c-card); }
.tree .more { color: var(--accent); cursor: pointer; padding-left: 12px; }
.tree pre.strblock { margin: 2px 0 6px 12px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; color: var(--c-log); background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; }
.hex { font-family: var(--mono); font-size: 11px; white-space: pre; color: var(--fg2); }
.hex b { color: var(--fg3); font-weight: normal; }
.copy { font-size: 10.5px; padding: 1px 6px; }
.secret { color: var(--c-card); border: 1px dashed var(--c-card); border-radius: 4px; padding: 0 5px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bg4); border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; display: none; z-index: 20; font-size: 12px; }
#drop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; font-size: 18px; z-index: 30; }
#drop.on { display: flex; }
.kbd { font-family: var(--mono); background: var(--bg3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
#help { position: fixed; right: 16px; bottom: 16px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: none; z-index: 20; font-size: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
#help.on { display: block; }
#help td { padding: 1px 8px 1px 0; }
.empty { padding: 40px; text-align: center; color: var(--fg3); }
#livebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--fg2); width: 100%; }
#livebar .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: var(--bg3); font-family: var(--mono); font-size: 11px; }
#livebar .pill.live { color: var(--c-log); border-color: color-mix(in srgb, var(--c-log) 50%, transparent); }
#livebar .pill.status-Failed, #livebar .pill.status-Exited { color: var(--c-error); }
#livebar .pill.status-Running { color: var(--c-host); }
#livebar button { padding: 1px 8px; font-size: 11.5px; }
#livebar button:disabled { opacity: .4; cursor: default; }
#livebar .busy { color: var(--accent); }
#sq-wrap { display: inline-flex; gap: 4px; align-items: center; }
#squery { width: 260px; }
.tag.ctx { color: var(--accent); cursor: pointer; }
#minimap canvas { height: 34px; }
</style>
</head>
<body>
<script id="oplog-data" type="application/json">__OPLOG_DATA__</script>
<div id="app">
  <header>
    <h1>Oplog <span class="agent" id="h-agent"></span></h1>
    <div class="meta" id="h-meta"></div>
    <div class="spacer"></div>
    <div id="livebar" class="hidden"></div>
    <div class="tools">
      <button id="btn-expand" title="Expand all groups (e)">Expand all</button>
      <button id="btn-collapse" title="Collapse all groups (c)">Collapse all</button>
      <button id="btn-sidebar" class="active" title="Toggle sidebar (s)">Sidebar</button>
      <button id="btn-theme" title="Toggle theme (t)">Theme</button>
      <button id="btn-load" title="Load a JSON dump produced by `golem agent oplog --format json`">Load JSON…</button>
      <input type="file" id="file" accept=".json,.jsonl,.ndjson,application/json" class="hidden">
      <button id="btn-help" title="Keyboard shortcuts (?)">?</button>
    </div>
  </header>
  <div id="toolbar">
    <input type="text" id="search" placeholder="Filter loaded entries (text, function, payload…)  /">
    <span id="sq-wrap" class="hidden" title="Lucene query evaluated by the server over the whole oplog"><input type="text" id="squery" placeholder="Server query (Lucene), Enter to run"><button id="btn-sq-clear" title="Clear the server query and load the oplog from the start">✕</button></span>
    <div class="chips" id="chips"></div>
    <label><input type="checkbox" id="cb-hints" checked> hints</label>
    <label>min log <select id="loglevel"><option>Stdout</option><option>Stderr</option><option>Trace</option><option>Debug</option><option>Info</option><option>Warn</option><option>Error</option><option>Critical</option></select></label>
    <label>from <input type="number" id="idx-from" style="width:80px" min="1"></label>
    <label>to <input type="number" id="idx-to" style="width:80px" min="1"></label>
    <label><input type="checkbox" id="cb-rel"> relative time</label>
    <span id="matchinfo"></span>
  </div>
  <div id="main">
    <div id="list">
      <div id="minimap"><canvas></canvas><div id="mmtip"></div></div>
      <div id="rows"></div>
      <div id="sentinel"></div>
    </div>
    <aside id="sidebar">
      <div class="tabs">
        <button data-pane="stats" class="active">Stats</button>
        <button data-pane="timeline">Invocations</button>
        <button data-pane="console">Console</button>
        <button data-pane="about">About</button>
      </div>
      <div class="pane" id="pane-stats"></div>
      <div class="pane hidden" id="pane-timeline"></div>
      <div class="pane hidden" id="pane-console"></div>
      <div class="pane hidden" id="pane-about"></div>
    </aside>
  </div>
</div>
<div id="toast"></div>
<div id="drop">Drop an oplog JSON dump to load it</div>
<div id="help">
  <b>Keyboard</b>
  <table>
    <tr><td><span class="kbd">j</span> / <span class="kbd">k</span></td><td>next / previous entry</td></tr>
    <tr><td><span class="kbd">Enter</span> / <span class="kbd">Space</span></td><td>toggle details</td></tr>
    <tr><td><span class="kbd">←</span> / <span class="kbd">→</span></td><td>collapse / expand group</td></tr>
    <tr><td><span class="kbd">e</span> / <span class="kbd">c</span></td><td>expand / collapse all groups</td></tr>
    <tr><td><span class="kbd">/</span></td><td>focus search</td></tr>
    <tr><td><span class="kbd">h</span></td><td>toggle hint entries</td></tr>
    <tr><td><span class="kbd">s</span> / <span class="kbd">t</span></td><td>toggle sidebar / theme</td></tr>
    <tr><td><span class="kbd">g</span></td><td>go to index</td></tr>
  </table>
</div>
<script>
'use strict';
(function () {
// ---------------------------------------------------------------------------
// Entry kind table: label, category, and whether the entry is a replay hint.
// ---------------------------------------------------------------------------
const KINDS = {
  Create: ['CREATE', 'lifecycle'],
  Start: ['START', 'host'], End: ['END', 'host'], Cancelled: ['CANCELLED', 'host'],
  CompletionDelivered: ['COMPLETION DELIVERED', 'host', 1], CompletionDiscarded: ['COMPLETION DISCARDED', 'host', 1],
  HostStreamFrame: ['HOST STREAM FRAME', 'host', 1],
  AgentInvocationStarted: ['INVOKE', 'invocation'], AgentInvocationFinished: ['INVOKE COMPLETED', 'invocation'],
  PendingAgentInvocation: ['ENQUEUED', 'invocation', 1], CancelPendingInvocation: ['CANCEL INVOCATION', 'invocation', 1],
  Suspend: ['SUSPEND', 'lifecycle', 1], Error: ['ERROR', 'error', 1], RecoverySucceeded: ['RECOVERY SUCCEEDED', 'lifecycle', 1],
  Jump: ['JUMP', 'lifecycle', 1], Interrupted: ['INTERRUPTED', 'lifecycle', 1],
  Exited: ['EXITED', 'lifecycle', 1], Restart: ['RESTART', 'lifecycle', 1], Resumed: ['RESUMED', 'lifecycle', 1],
  Revert: ['REVERT', 'lifecycle', 1], GrowMemory: ['GROW MEMORY', 'lifecycle', 1],
  BeginRemoteTransaction: ['BEGIN REMOTE TRANSACTION', 'region', 1], PreCommitRemoteTransaction: ['PRE COMMIT', 'region', 1],
  PreRollbackRemoteTransaction: ['PRE ROLLBACK', 'region', 1], CommittedRemoteTransaction: ['COMMITTED', 'region', 1],
  RolledBackRemoteTransaction: ['ROLLED BACK', 'region', 1],
  PendingUpdate: ['ENQUEUED UPDATE', 'update', 1], SuccessfulUpdate: ['SUCCESSFUL UPDATE', 'update', 1], FailedUpdate: ['FAILED UPDATE', 'update', 1],
  CreateResource: ['CREATE RESOURCE', 'resource', 1], DropResource: ['DROP RESOURCE', 'resource', 1],
  Log: ['LOG', 'log', 1],
  ActivatePlugin: ['ACTIVATE PLUGIN', 'plugin', 1], DeactivatePlugin: ['DEACTIVATE PLUGIN', 'plugin', 1],
  OplogProcessorCheckpoint: ['OPLOG PROCESSOR CHECKPOINT', 'plugin', 1],
  Snapshot: ['SNAPSHOT', 'snapshot', 1], SnapshotConfirmed: ['SNAPSHOT CONFIRMED', 'snapshot', 1],
  SetRetryPolicy: ['SET RETRY POLICY', 'retry'], RemoveRetryPolicy: ['REMOVE RETRY POLICY', 'retry'],
  CardEventQueued: ['CARD EVENT QUEUED', 'card', 1], CardInstalled: ['CARD INSTALLED', 'card', 1],
  CardInstallFailed: ['CARD INSTALL FAILED', 'card', 1], CardRevoked: ['CARD REVOKED', 'card', 1],
  CardExpired: ['CARD EXPIRED', 'card', 1], CardDerived: ['CARD DERIVED', 'card', 1],
  CardTransferStarted: ['CARD TRANSFER STARTED', 'card', 1], CardTransferred: ['CARD TRANSFER ADMITTED', 'card', 1],
  CardRevokedCascade: ['CARD REVOKED CASCADE', 'card', 1], CardTransferConfirmed: ['CARD TRANSFER CONFIRMED', 'card', 1],
  StreamRegistered: ['STREAM REGISTERED', 'stream', 1], StreamItems: ['STREAM ITEMS', 'stream', 1],
  StreamEnd: ['STREAM END', 'stream', 1], StreamCancel: ['STREAM CANCEL', 'stream', 1], StreamSession: ['STREAM SESSION', 'stream', 1],
  Omitted: ['OMITTED ENTRY', 'lifecycle'],
};
const CATEGORIES = ['invocation', 'host', 'error', 'log', 'region', 'lifecycle', 'update', 'snapshot', 'resource', 'plugin', 'retry', 'card', 'stream'];
const LOG_LEVELS = ['Stdout', 'Stderr', 'Trace', 'Debug', 'Info', 'Warn', 'Error', 'Critical'];

const $ = (s, el) => (el || document).querySelector(s);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
};
const kindInfo = t => KINDS[t] || [t.replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase(), 'lifecycle'];
const isHint = t => !!(KINDS[t] || [])[2];
// An omitted entry keeps the category and replay role of the entry kind it stands for.
const classOf = e => e.type === 'Omitted' && e.entry.entryType ? e.entry.entryType : e.type;
const catColor = c => `var(--c-${c})`;
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

function loadFile(file) { file.text().then(t => { const doc = parseDump(t); const n = normalize(doc).length; if (!n) { toast('No oplog entries found in ' + file.name); return; } state.meta = { agentId: file.name }; load(doc); toast(`Loaded ${n} entries from ${file.name}`); }); }

// ---------------------------------------------------------------------------
// Wiring.
// ---------------------------------------------------------------------------
function init() {
  const raw = $('#oplog-data').textContent;
  let doc = {}; try { doc = JSON.parse(raw); } catch (e) { doc = {}; }
  setupMinimap();
  const theme = localStorage.getItem('golem-oplog-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  if (doc.mode === 'live') initLive(doc); else load(doc);
  let deb;
  $('#search').addEventListener('input', ev => { clearTimeout(deb); deb = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); renderList(); }, 180); });
  $('#cb-hints').addEventListener('change', ev => { state.hints = ev.target.checked; renderList(); });
  $('#loglevel').addEventListener('change', ev => { state.minLog = ev.target.selectedIndex; renderList(); });
  $('#idx-from').addEventListener('change', ev => { state.from = ev.target.value ? Number(ev.target.value) : null; renderList(); });
  $('#idx-to').addEventListener('change', ev => { state.to = ev.target.value ? Number(ev.target.value) : null; renderList(); });
  $('#cb-rel').addEventListener('change', ev => { state.rel = ev.target.checked; renderList(); });
  $('#btn-expand').addEventListener('click', () => setAllOpen(true));
  $('#btn-collapse').addEventListener('click', () => setAllOpen(false));
  $('#btn-sidebar').addEventListener('click', () => { $('#main').classList.toggle('nosidebar'); $('#sidebar').classList.toggle('hidden'); $('#btn-sidebar').classList.toggle('active'); drawMinimap(); });
  $('#btn-theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; localStorage.setItem('golem-oplog-theme', t); drawMinimap(); });
  $('#btn-help').addEventListener('click', () => $('#help').classList.toggle('on'));
  $('#btn-load').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', ev => { if (ev.target.files[0]) loadFile(ev.target.files[0]); ev.target.value = ''; });
  for (const b of document.querySelectorAll('#sidebar .tabs button')) b.addEventListener('click', () => { for (const x of document.querySelectorAll('#sidebar .tabs button')) x.classList.toggle('active', x === b); for (const p of document.querySelectorAll('#sidebar .pane')) p.classList.toggle('hidden', p.id !== 'pane-' + b.dataset.pane); });
  document.addEventListener('dragover', ev => { ev.preventDefault(); $('#drop').classList.add('on'); });
  document.addEventListener('dragleave', ev => { if (!ev.relatedTarget) $('#drop').classList.remove('on'); });
  document.addEventListener('drop', ev => { ev.preventDefault(); $('#drop').classList.remove('on'); if (ev.dataTransfer.files[0]) loadFile(ev.dataTransfer.files[0]); });
  document.addEventListener('keydown', ev => {
    if (ev.target.matches('input, select, textarea')) { if (ev.key === 'Escape') ev.target.blur(); return; }
    const sel = state.selected;
    const rowsEls = () => [...document.querySelectorAll('#rows .node')];
    const move = dir => { const all = rowsEls(); if (!all.length) return; let i = sel ? all.indexOf(sel.el) : -1; i = Math.max(0, Math.min(all.length - 1, i + dir)); const el = all[i]; const n = findNode(el); if (n) { select(el, n); el.scrollIntoView({ block: 'nearest' }); } };
    switch (ev.key) {
      case 'j': case 'ArrowDown': move(1); ev.preventDefault(); break;
      case 'k': case 'ArrowUp': move(-1); ev.preventDefault(); break;
      case 'Enter': case ' ': if (sel) { toggleDetails(sel.el, sel.n); ev.preventDefault(); } break;
      case 'ArrowRight': if (sel && sel.n.kind !== 'entry') toggleGroup(sel.el, sel.n, true); break;
      case 'ArrowLeft': if (sel && sel.n.kind !== 'entry' && sel.el.classList.contains('open')) toggleGroup(sel.el, sel.n, false); else if (sel && sel.n.parent && sel.n.parent.kind !== 'root') { const pel = elCache.get(nodeKey(sel.n.parent)); if (pel) { select(pel, sel.n.parent); pel.scrollIntoView({ block: 'nearest' }); } } break;
      case '/': $('#search').focus(); ev.preventDefault(); break;
      case 'e': setAllOpen(true); break;
      case 'c': setAllOpen(false); break;
      case 'h': $('#cb-hints').checked = !$('#cb-hints').checked; state.hints = $('#cb-hints').checked; renderList(); break;
      case 's': $('#btn-sidebar').click(); break;
      case 't': $('#btn-theme').click(); break;
      case 'g': { const v = prompt('Go to oplog index'); if (v) goTo(Number(v)); break; }
      case '?': $('#help').classList.toggle('on'); break;
      case 'Escape': $('#help').classList.remove('on'); break;
    }
  });
  const followHash = () => { if (location.hash.startsWith('#e')) { const i = Number(location.hash.slice(2)); if (i && !(state.selected && state.selected.n.e && state.selected.n.e.index === i)) goTo(i); } };
  window.addEventListener('hashchange', followHash);
  setTimeout(followHash, 50);
}
function findNode(el) { const key = el.dataset.key; if (key && key.startsWith('ent')) { let found = null; const walk = n => { if (found) return; if (n.kind === 'entity' && nodeKey(n) === key) found = n; n.children.forEach(walk); }; walk(state.root); return found; } const idx = Number(el.dataset.index); const n = state.nodeOf.get(idx); return n || null; }
init();
})();
</script>
</body>
