# golem-app-manifest-header

manifestVersion: golem-manifest-version

app: app-name

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

localServer:
  dataDir: .golem/local-server-data
  # Enable bounded local metrics collection for the TUI.
  # observability: true

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true
