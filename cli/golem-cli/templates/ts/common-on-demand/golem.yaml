# golem-app-manifest-header

componentTemplates:
  ts:
    guestLanguage: ts
    presets:
      optimized:
        default: true
        build:
        - command: npx --no rollup -- -c "{{ componentBuildRootDir }}/golem-temp/common/ts/rollup.config.component.mjs"
          dir: "{{ componentDir }}"
          env:
            GOLEM_APP_ROOT: "{{ componentBuildRootDir }}"
            GOLEM_TEMP: "{{ golemTempDir }}"
            GOLEM_COMPONENT_NAME: "{{ component_name | to_kebab_case }}"
          sources:
          - "{{ componentDir }}/src"
          - "{{ componentBuildRootDir }}/golem-temp/common/ts/rollup.config.component.mjs"
          - "{{ componentDir }}/tsconfig.json"
          - "{{ componentBuildRootDir }}/package.json"
          targets:
          - "{{ golemTempDir }}/ts-dist/{{ component_name | to_kebab_case }}/main.js"
        - preinitializeJs: "{{ componentBuildRootDir }}/node_modules/@golemcloud/golem-ts-sdk/wasm/agent_guest.wasm"
          module: "{{ golemTempDir }}/ts-dist/{{ component_name | to_kebab_case }}/main.js"
          into: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.preinitialized.wasm"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.preinitialized.wasm"
      quick:
        build:
        - command: npx --no rollup -- -c "{{ componentBuildRootDir }}/golem-temp/common/ts/rollup.config.component.mjs"
          dir: "{{ componentDir }}"
          env:
            GOLEM_APP_ROOT: "{{ componentBuildRootDir }}"
            GOLEM_TEMP: "{{ golemTempDir }}"
            GOLEM_COMPONENT_NAME: "{{ component_name | to_kebab_case }}"
          sources:
          - "{{ componentDir }}/src"
          - "{{ componentBuildRootDir }}/golem-temp/common/ts/rollup.config.component.mjs"
          - "{{ componentDir }}/tsconfig.json"
          - "{{ componentBuildRootDir }}/package.json"
          targets:
          - "{{ golemTempDir }}/ts-dist/{{ component_name | to_kebab_case }}/main.js"
        - injectToPrebuiltQuickjs: "{{ componentBuildRootDir }}/node_modules/@golemcloud/golem-ts-sdk/wasm/agent_guest.wasm"
          module: "{{ golemTempDir }}/ts-dist/{{ component_name | to_kebab_case }}/main.js"
          into: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
customCommands:
  ts-npm-install:
  - command: npm install
