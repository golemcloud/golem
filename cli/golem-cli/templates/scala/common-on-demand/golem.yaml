# golem-app-manifest-header

componentTemplates:
  scala:
    guestLanguage: scala
    presets:
      optimized:
        default: true
        build:
        - command: sbt -batch -no-colors -Dsbt.supershell=false "{{ component_name | to_snake_case }}/golemBuildComponent {{ component_name }} .golem/{{ component_name | to_snake_case }}.js .generated/agent_guest.wasm"
          dir: "{{ componentBuildRootDir }}"
          sources:
          - "{{ componentDir }}/src"
          - "{{ componentBuildRootDir }}/*.sbt"
          - "{{ componentBuildRootDir }}/project"
          targets:
          - "{{ componentBuildRootDir }}/.golem/{{ component_name | to_snake_case }}.js"
        - preinitializeJs: "{{ componentBuildRootDir }}/.generated/agent_guest.wasm"
          module: "{{ componentBuildRootDir }}/.golem/{{ component_name | to_snake_case }}.js"
          into: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.preinitialized.wasm"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.preinitialized.wasm"
      quick:
        build:
        - command: sbt -batch -no-colors -Dsbt.supershell=false "{{ component_name | to_snake_case }}/golemBuildComponent {{ component_name }} .golem/{{ component_name | to_snake_case }}.js .generated/agent_guest.wasm"
          dir: "{{ componentBuildRootDir }}"
          sources:
          - "{{ componentDir }}/src"
          - "{{ componentBuildRootDir }}/*.sbt"
          - "{{ componentBuildRootDir }}/project"
          targets:
          - "{{ componentBuildRootDir }}/.golem/{{ component_name | to_snake_case }}.js"
        - injectToPrebuiltQuickjs: "{{ componentBuildRootDir }}/.generated/agent_guest.wasm"
          module: "{{ componentBuildRootDir }}/.golem/{{ component_name | to_snake_case }}.js"
          into: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.dynamic.wasm"
