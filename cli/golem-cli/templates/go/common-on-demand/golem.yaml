# golem-app-manifest-header

componentTemplates:
  go:
    presets:
      debug:
        default: true
        build:
        - command: go mod tidy
          dir: "{{ componentDir }}"
        - command: go tool componentize-go build -o "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.wasm"
          dir: "{{ componentDir }}"
          mkdirs:
          - "{{ golemTempDir }}/agents"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.wasm"
      release:
        build:
        - command: go mod tidy
          dir: "{{ componentDir }}"
        - command: go tool componentize-go build -o "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.wasm"
          dir: "{{ componentDir }}"
          mkdirs:
          - "{{ golemTempDir }}/agents"
        componentWasm: "{{ golemTempDir }}/agents/{{ component_name | to_snake_case }}.wasm"
