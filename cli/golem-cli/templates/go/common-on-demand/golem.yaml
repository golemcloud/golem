# golem-app-manifest-header

componentTemplates:
  go:
    presets:
      debug:
        default: true
        build:
        - command: go tool componentize-go build -o "{{ componentDir }}/golem-temp/{{ componentName | to_snake_case }}.wasm"
          dir: "{{ componentDir }}"
          mkdirs:
          - "{{ componentDir }}/golem-temp"
        componentWasm: "{{ componentDir }}/golem-temp/{{ componentName | to_snake_case }}.wasm"
      release:
        build:
        - command: go tool componentize-go build -o "{{ componentDir }}/golem-temp/{{ componentName | to_snake_case }}.wasm"
          dir: "{{ componentDir }}"
          mkdirs:
          - "{{ componentDir }}/golem-temp"
        componentWasm: "{{ componentDir }}/golem-temp/{{ componentName | to_snake_case }}.wasm"
