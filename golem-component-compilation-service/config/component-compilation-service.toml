## Generated from default config
blob_store = "data_disk"
data_dir = "/var/lib/golem"
retained_update_snapshots = 2
state_store = "sqlite"

[advanced.component_compilation_service]
bind_address = "0.0.0.0"
http_port = 8084
runtime_metrics_sampling_interval = "5s"

[advanced.component_compilation_service.compile_worker]
connect_timeout = "10s"
connection_pool_size = 4
http2_keep_alive_interval = "10s"
http2_keep_alive_timeout = "10s"
http2_keep_alive_while_idle = true
max_connection_age = "1m"
max_message_size = 33554432
queue_capacity = 100
upload_queue_capacity = 100

[advanced.component_compilation_service.compile_worker.retries_on_unavailable]
max_attempts = 3
max_delay = "1s"
max_jitter_factor = 0.15
min_delay = "100ms"
multiplier = 3.0

[advanced.component_compilation_service.compiled_component_service]
type = "Enabled"

[advanced.component_compilation_service.compiled_component_service.config]

[advanced.component_compilation_service.engine]
enable_fs_cache = false

[advanced.component_compilation_service.grpc]
port = 9091

[advanced.component_compilation_service.registry_service]
type = "Static"

[advanced.component_compilation_service.registry_service.config]
host = "localhost"
port = 9090

[cache]
enabled = false

[internal_grpc_tls]
enabled = false

[logging]
console = false
dtor_friendly = false
file_name = "component-compilation-service.log"
file_truncate = true

[logging.file]
ansi = false
compact = false
enabled = false
json = true
json_flatten = true
json_flatten_span = true
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[logging.stderr]
ansi = false
compact = false
enabled = false
json = false
json_flatten = false
json_flatten_span = false
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[logging.stdout]
ansi = true
compact = false
enabled = true
json = false
json_flatten = true
json_flatten_span = true
json_source_location = false
pretty = false
span_events_active = false
span_events_full = false
without_time = false

[object_storage]
components_bucket = "golem-components"
data_bucket = "golem-data"
object_prefix = ""
region = "us-east-1"

[otlp]
enabled = false
host = "localhost"
port = 4318
service_name = "golem"

[outbound_sockets]
enabled = false

[postgres]
database = "golem"
host = "localhost"
max_connections = 10
password = ""
port = 5432
username = "golem"

