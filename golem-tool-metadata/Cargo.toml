[package]
name = "golem-tool-metadata"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[lib]
harness = false

[features]
default = ["rich-validation"]
guest = ["golem-schema/guest"]
rich-validation = ["golem-schema/rich-validation"]

[dependencies]
golem-schema = { workspace = true, features = ["derive"] }

[dev-dependencies]
test-r = { workspace = true }
